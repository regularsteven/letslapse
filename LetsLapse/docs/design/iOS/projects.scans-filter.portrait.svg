<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Projects · Scans filter + counts · portrait</title>
  <desc>Mirrors App/ProjectsView.swift + App/CaptureFilterBar.swift in the two states Settings ▸ Advanced ▸ Layout can put them in — projects.portrait.svg is the same screen with both switched the other way, and every other detail (search field, tag chips, card anatomy, 14pt card rhythm) is unchanged from it.

ENABLE SCANS MENU = OFF. The Scans tab leaves the tab bar (five tabs, 66pt each — see the bar at the foot of this file) and scanner runs come back into this list, which otherwise excludes them outright. They arrive with a filter of their own, Scans, sitting between Photos and Interval because that is where a scan sits: stills, but not a timelapse. The filter is offered whenever the tab is off, even at zero scans — an empty Scans filter is how the screen says where scans would be. A scan's card is an ordinary ProjectCard (its subtitle reads "Scan · N frames"), and tapping it opens ProjectDetailView, which already has a Scanner body: frames and Export first, the blend path one secondary button.

DISPLAY COUNT IN PROJECTS = ON. Each segment carries how many projects it holds, counted AFTER the search field and tag chips have had their say, so the number always matches what tapping it produces. Written as a bare number ("All 6"), not in brackets: a segmented control truncates rather than shrinks and ignores any font SwiftUI hands it, and five segments on a 393pt iPhone leave about 64pt each — which "Interval (0)" overruns and "Interval 0" does not.

Both switches are independent; this file draws them together because they share one bar. Their defaults are the other way round: Scans menu ON (so the tab exists once a scan does), counts OFF.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- header row: title + search + shared filter bar + tag chips in ONE
           list row, so no row inset can open a gap between them (the title and
           filter rhythm still matches gallery.portrait.svg) -->
      <text x="20" y="106" font-size="34" class="b" fill="#000">Projects</text>

      <!-- scene search — SceneSearchField. Hand-built rather than .searchable:
           Projects hides its navigation bar on iOS, the only place the system
           field can live. Clears with a trailing xmark.circle.fill once typed. -->
      <g id="search">
        <rect x="16" y="122" width="361" height="34" rx="17" fill="#000" fill-opacity="0.06"/>
        <g transform="translate(29,132)" stroke="#8A8A90" stroke-width="1.6" fill="none" data-symbol="magnifyingglass">
          <circle cx="6" cy="6" r="5"/><path d="M9.8 9.8 L14 14" stroke-linecap="round"/>
        </g>
        <text x="54" y="145" font-size="15" fill="#8A8A90">Search projects</text>
      </g>

      <!-- segmented filter — shared CaptureFilterBar, carrying the Scans
           segment (Layout ▸ Enable Scans menu OFF) and per-segment counts
           (Layout ▸ Display count in Projects ON). Five equal segments of
           71.4pt inside the same 361pt track; the selection capsule keeps
           its 2pt inset. -->
      <g id="filter">
        <rect x="16" y="164" width="361" height="32" rx="9" fill="#E3E3E8"/>
        <rect x="18" y="166" width="69.4" height="28" rx="7" fill="#FFF" filter="url(#soft)"/>
        <text x="53.7" y="184" font-size="13" class="sb" fill="#000" text-anchor="middle">All 6</text>
        <text x="125.1" y="184" font-size="13" fill="#000" text-anchor="middle">Photos 1</text>
        <text x="196.5" y="184" font-size="13" fill="#000" text-anchor="middle">Scans 3</text>
        <text x="267.9" y="184" font-size="13" fill="#000" text-anchor="middle">Interval 0</text>
        <text x="339.3" y="184" font-size="13" fill="#000" text-anchor="middle">Video 2</text>
      </g>

      <!-- subject-tag chips — SceneTagChips. Drawn only from tags present in
           the library, in taxonomy order so the row never reshuffles as
           projects are analysed; scrolls horizontally and bleeds past the
           trailing inset. Selected chip is filled accent, white semibold.
           Multiple selections AND together (each tap narrows). -->
      <g id="tag-chips">
        <rect x="16" y="204" width="66" height="26" rx="13" fill="#000" fill-opacity="0.07"/>
        <text x="49" y="221" font-size="13" fill="#000" fill-opacity="0.75" text-anchor="middle">Water</text>
        <rect x="89" y="204" width="110" height="26" rx="13" fill="#000" fill-opacity="0.07"/>
        <text x="144" y="221" font-size="13" fill="#000" fill-opacity="0.75" text-anchor="middle">Sky &amp; weather</text>
        <rect x="206" y="204" width="62" height="26" rx="13" fill="#C36A00"/>
        <text x="237" y="221" font-size="13" class="sb" fill="#FFF" text-anchor="middle">Urban</text>
        <rect x="275" y="204" width="68" height="26" rx="13" fill="#000" fill-opacity="0.07"/>
        <text x="309" y="221" font-size="13" fill="#000" fill-opacity="0.75" text-anchor="middle">Nature</text>
        <rect x="350" y="204" width="68" height="26" rx="13" fill="#000" fill-opacity="0.07"/>
        <text x="384" y="221" font-size="13" fill="#000" fill-opacity="0.75" text-anchor="middle">Landmark</text>
      </g>

      <!-- card 1: video project with 2 blended clips — first card at 238, 8pt
           below the chip row. An analysed project: the tag line under the size
           line adds 14pt, and the video-only source line under the format line
           adds another 16pt — so this card stands at 194pt where the original
           unanalysed geometry was 164. The source line reads count + bursts:
           "4 source clips · 2 bursts at 120 fps"; a burstless shoot shows just
           "N source clips", an import "1 source clip". -->
      <g id="card-video-project">
        <rect x="16" y="238" width="361" height="194" rx="18" fill="#FFF" filter="url(#soft)"/>
        <rect x="30" y="250" width="86" height="64" rx="8" fill="#3D4A5C"/>
        <circle cx="56" cy="270" r="9" fill="#FFB340" opacity="0.85"/>
        <polygon points="30,298 60,282 92,296 116,286 116,314 30,314" fill="#232B36"/>
        <rect x="62" y="296" width="50" height="15" rx="7.5" fill="#000" opacity="0.5"/>
        <text x="87" y="307" font-size="9.5" class="sb" fill="#FFF" text-anchor="middle">0:36</text>
        <text x="128" y="267" font-size="16" class="b" fill="#000">Sunset over harbour</text>
        <text x="128" y="284" font-size="12" fill="#6D6D72">Video · 1080p · 30 fps · 2 days ago</text>
        <text x="128" y="300" font-size="12" fill="#6D6D72" id="source-line-1" data-note="video-kind only">4 source clips · 2 bursts at 120 fps</text>
        <text x="128" y="318" font-size="12" class="sb" fill="#C36A00">2 blended clips · 1.4 GB</text>
        <g id="tag-line-1" data-component="SceneTagLine">
          <rect x="128" y="324" width="44" height="18" rx="9" fill="#C36A00" fill-opacity="0.13"/>
          <text x="150" y="336" font-size="10.5" class="sb" fill="#8A4A00" text-anchor="middle">Water</text>
          <rect x="177" y="324" width="87" height="18" rx="9" fill="#C36A00" fill-opacity="0.13"/>
          <text x="220" y="336" font-size="10.5" class="sb" fill="#8A4A00" text-anchor="middle">Sky &amp; weather</text>
          <rect x="269" y="324" width="60" height="18" rx="9" fill="#C36A00" fill-opacity="0.13"/>
          <text x="299" y="336" font-size="10.5" class="sb" fill="#8A4A00" text-anchor="middle">Landmark</text>
          <text x="336" y="336" font-size="10.5" class="sb" fill="#8A8A90">+1</text>
        </g>
        <g id="version-strip">
          <rect x="30" y="356" width="96" height="54" rx="9" fill="#31404E"/>
          <rect x="34" y="392" width="34" height="14" rx="7" fill="#000" opacity="0.5"/>
          <text x="51" y="402" font-size="9" class="sb" fill="#FFB340" text-anchor="middle">50×</text>
          <rect x="134" y="356" width="96" height="54" rx="9" fill="#3B4653"/>
          <rect x="138" y="392" width="40" height="14" rx="7" fill="#000" opacity="0.5"/>
          <text x="158" y="402" font-size="9" class="sb" fill="#FFB340" text-anchor="middle">100×</text>
          <rect x="238" y="356" width="54" height="54" rx="9" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="5 4"/>
          <path d="M265 375 v16 M257 383 h16" stroke="#C36A00" stroke-width="2" stroke-linecap="round" data-symbol="plus"/>
        </g>
      </g>

      <!-- card 2: a scanner run, listed here only because the Scans tab is
           off. Ordinary ProjectCard anatomy — "Scan · N frames" in the format
           line, no tag line (scans are not analysed), 146pt tall: 64pt thumb,
           then the blended-clip strip holding just its dashed "+" tile. -->
      <g id="card-scan-project">
        <rect x="16" y="446" width="361" height="146" rx="18" fill="#FFF" filter="url(#soft)"/>
        <rect x="30" y="458" width="86" height="64" rx="8" fill="#2B2B2E"/>
        <rect x="44" y="462" width="58" height="56" rx="3" fill="#F4F1EA"/>
        <g stroke="#8A8A90" stroke-width="1.4" stroke-linecap="round" opacity="0.75">
          <path d="M50 472 h46 M50 478 h46 M50 484 h46 M50 490 h46 M50 496 h30"/>
        </g>
        <rect x="44" y="504" width="52" height="15" rx="7.5" fill="#000" opacity="0.5"/>
        <text x="70" y="515" font-size="9.5" class="sb" fill="#FFF" text-anchor="middle">8 photos</text>
        <text x="128" y="475" font-size="16" class="b" fill="#000">Scan 22 Aug at 14:25</text>
        <text x="128" y="492" font-size="12" fill="#6D6D72">Scan · 8 frames · 3 days ago</text>
        <text x="128" y="510" font-size="12" class="sb" fill="#6D6D72">549 KB</text>
        <!-- no blended clips yet, so the strip is the dashed "+" tile alone —
             a scan is still a project, and the blend path stays open. -->
        <g id="version-strip-scan">
          <rect x="30" y="530" width="54" height="54" rx="9" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="5 4"/>
          <path d="M57 549 v16 M49 557 h16" stroke="#C36A00" stroke-width="2" stroke-linecap="round" data-symbol="plus"/>
        </g>
      </g>

      <!-- card 3: photo project (single asset — no strip), never analysed, so
           no tag line and the original 88pt height — 14pt below card 2. Stays
           ONE asset: no source count, no burst-frame count (that material is
           owned by project detail's "Frames behind this photo"). -->
      <g id="card-photo-project">
        <rect x="16" y="606" width="361" height="88" rx="18" fill="#FFF" filter="url(#soft)"/>
        <rect x="30" y="618" width="86" height="64" rx="8" fill="#26303C"/>
        <ellipse cx="73" cy="644" rx="26" ry="9" fill="#9FC2E8" opacity="0.4"/>
        <rect x="60" y="664" width="52" height="15" rx="7.5" fill="#000" opacity="0.5"/>
        <text x="86" y="675" font-size="9.5" class="sb" fill="#FFF" text-anchor="middle">Photo</text>
        <text x="128" y="635" font-size="16" class="b" fill="#000">Long exposure — falls</text>
        <text x="128" y="652" font-size="12" fill="#6D6D72">Photo · 12MP · 3 hours ago</text>
        <text x="128" y="670" font-size="12" class="sb" fill="#6D6D72">48 MB</text>
      </g>

      <!-- floating tab bar (Projects selected) -->
      <g id="tab-bar">
        <rect x="17.5" y="755" width="358" height="57" rx="28.5" fill="#FBFBFD" opacity="0.96" filter="url(#soft)"/>
        <rect x="17.5" y="755" width="358" height="57" rx="28.5" fill="none" stroke="#000" stroke-opacity="0.08"/>
        <g id="tab-create" fill="none" stroke="#8E8E93">
          <g transform="translate(56.5 776) scale(0.7727) translate(-11 -11)"><circle cx="11" cy="11" r="8" stroke-width="2.2" data-symbol="record.circle"/><circle cx="11" cy="11" r="3.4" fill="#8E8E93" stroke="none"/></g>
          <text x="56.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Create</text>
        </g>
        <g id="tab-gallery" fill="none" stroke="#8E8E93">
          <g transform="translate(126.5 776) scale(0.7727) translate(-11 -11)"><rect x="3" y="5.5" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(-6 10 10.5)" data-symbol="photo.on.rectangle.angled"/><rect x="6" y="8" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(4 13 13)"/></g>
          <text x="126.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Gallery</text>
        </g>
        <rect x="163.5" y="761" width="66" height="45" rx="22.5" fill="#C36A00" opacity="0.12"/>
        <g id="tab-projects" fill="none" stroke="#C36A00">
          <g transform="translate(196.5 776) scale(0.7727) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="square.stack"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="196.5" y="800" font-size="10.5" class="sb" fill="#C36A00" stroke="none" text-anchor="middle">Projects</text>
        </g>
        <g id="tab-collections" fill="none" stroke="#8E8E93">
          <g transform="translate(266.5 776) scale(0.7727) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="film.stack"/><path d="M7 4.5 v8 M15 4.5 v8" stroke-width="1.38" opacity="0.7"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="266.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Collections</text>
        </g>
        <g id="tab-settings" fill="none" stroke="#8E8E93">
          <g transform="translate(336.5 776) scale(0.7727) translate(-11 -11)"><path d="M3.5 6.5 h15 M3.5 11 h15 M3.5 15.5 h15" stroke-width="2.48" stroke-linecap="round" data-symbol="line.3.horizontal"/></g>
          <text x="336.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Settings</text>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Projects · Scans filter + counts · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">Layout ▸ Scans menu OFF, counts ON — five counted segments, scans listed as ordinary cards</text>
</svg>
