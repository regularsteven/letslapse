<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Scan page viewer · original · portrait</title>
  <desc>Mirrors App/ScanPageViewer.swift (topBar, controls, correctedToggle, exposureRow, pageIndicator, ScanZoomableImage). The Original half of the toggle: the photograph as shot, the promise that correction never touches it, and an amber "Correct from this" — the only route into the re-correct sheet starts from the photograph, because corners measured on a rectified page would rectify a rectification. On a page that was never corrected the toggle is absent and this button reads "Correct this page".</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.05"/></filter>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}.mono{font-family:ui-monospace,Menlo,monospace}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#000"/>
    <g transform="translate(24,24)">
      <!-- status bar -->
      <g id="status-bar" fill="#FFF">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#FFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#FFF" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#FFF" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>
      <rect x="0" y="0" width="393" height="852" fill="#000"/>
      <rect x="0" y="120" width="393" height="556" fill="#2A2724"/>
      <path d="M74 200 L318 176 L336 596 L96 610 Z" fill="#F2F0EA"/>
      <rect x="110" y="250" width="176" height="7" fill="#59544E"/>
      <rect x="111" y="280" width="176" height="7" fill="#59544E"/>
      <rect x="112" y="310" width="176" height="7" fill="#59544E"/>
      <rect x="113" y="340" width="190" height="7" fill="#59544E"/>
      <rect x="114" y="370" width="176" height="7" fill="#59544E"/>
      <rect x="115" y="400" width="176" height="7" fill="#59544E"/>
      <rect x="116" y="430" width="176" height="7" fill="#59544E"/>
      <rect x="117" y="460" width="190" height="7" fill="#59544E"/>
      <rect x="118" y="490" width="176" height="7" fill="#59544E"/>
      <rect x="119" y="520" width="176" height="7" fill="#59544E"/>
      <rect x="120" y="550" width="176" height="7" fill="#59544E"/>

      <!-- top bar -->
      <g id="top-bar">
        <rect x="0" y="0" width="393" height="120" fill="#000" fill-opacity="0.35"/>
        <text x="20" y="76" font-size="15.5" class="sb" fill="#FFF">Done</text>
        <text x="373" y="70" font-size="13" class="sb" fill="#FFF" fill-opacity="0.75" text-anchor="end">Page 3 of 8</text>
        <text x="373" y="88" font-size="12" fill="#FFF" fill-opacity="0.5" text-anchor="end">16 Aug at 21:23:41</text>
      </g>

      <!-- controls -->
      <g id="controls">
        <rect x="0" y="600" width="393" height="252" fill="#000" fill-opacity="0.74"/>
        <rect x="20" y="640" width="200" height="34" rx="11" fill="#FFF" fill-opacity="0.14"/>
        <text x="70" y="662" font-size="11.5" class="sb" fill="#FFF" fill-opacity="0.75" text-anchor="middle">Corrected</text>
        <rect x="120" y="643" width="97" height="28" rx="8" fill="#FFF" fill-opacity="0.9"/>
        <text x="168.5" y="662" font-size="11.5" class="b" fill="#1C1C1E" text-anchor="middle">Original</text>
        <text x="20" y="700" font-size="12.5" fill="#FFF" fill-opacity="0.6">The file as shot — kept for ever. Correction never touches it.</text>
        <rect x="20" y="716" width="309" height="44" rx="12" fill="#FFB340"/>
        <g transform="translate(114 738) scale(0.7727) translate(-11 -11)" fill="none" stroke="#1C1C1E" stroke-width="2.46" stroke-linejoin="round" data-symbol="perspective"><polygon points="4,6.5 18,8 18,14 4,15.5"/><path d="M1.5 11 h19 M11 3 v16"/></g>
        <text x="131" y="743" font-size="14" class="b" fill="#1C1C1E">Correct from this</text>
        <rect x="337" y="716" width="44" height="44" rx="12" fill="#FFF" fill-opacity="0.16"/>
        <g transform="translate(359 738) scale(1.05) translate(-9 -10)" fill="none" stroke="#FFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" data-symbol="square.and.arrow.up"><path d="M4 9 v9 h10 V9"/><path d="M9 14 V1 M5 5 l4 -4 4 4"/></g>
        <g id="page-dots"><circle cx="175.5" cy="790" r="3" fill="#FFF" fill-opacity="0.3"/><circle cx="187.5" cy="790" r="3" fill="#FFF" fill-opacity="0.3"/><circle cx="199.5" cy="790" r="3" fill="#FFF" fill-opacity="1"/><circle cx="211.5" cy="790" r="3" fill="#FFF" fill-opacity="0.3"/><circle cx="223.5" cy="790" r="3" fill="#FFF" fill-opacity="0.3"/><circle cx="235.5" cy="790" r="3" fill="#FFF" fill-opacity="0.3"/><circle cx="247.5" cy="790" r="3" fill="#FFF" fill-opacity="0.3"/><circle cx="259.5" cy="790" r="3" fill="#FFF" fill-opacity="0.3"/></g>
      </g>
      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#FFF" opacity="0.4"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Scan page viewer · original · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/ScanPageViewer.swift — the photograph, kept for ever, and the way back to a correction</text>
</svg>
