<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Capture — Interval (idle, DNG) · landscape</title>
  <desc>Mirrors App/CaptureHeadroom.swift (CaptureHeadroomChip, stacked under the format pill in the 108pt rail) and App/CaptureView.swift (landscapeLayout): left rail (close, format pill, zoom chips, recent tile), centered 4:3 viewfinder with the interval dials in the bottom-leading corner on a dark capsule, right rail (stacked mode labels, shutter, steady/delay/grid/lock column). Landscape is a known WIP area — the format pill is wider than the 108pt rail and overlaps the viewfinder edge.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="852" height="393" rx="54"/></clipPath>
    <clipPath id="tile"><rect x="83" y="296" width="60" height="60" rx="12"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232B3B"/><stop offset="0.62" stop-color="#3A3628"/><stop offset="1" stop-color="#4A3A22"/>
    </linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="18" y="18" width="864" height="405" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="852" height="393" fill="#000"/>
    <g transform="translate(24,24)">

      <!-- viewfinder: 4:3 fitted in the center column (x 173–669) -->
      <g id="viewfinder">
        <rect x="173" y="2" width="496" height="370" fill="url(#sky)"/>
        <circle cx="300" cy="150" r="26" fill="#FFB340" opacity="0.9"/>
        <circle cx="300" cy="150" r="46" fill="#FFB340" opacity="0.15"/>
        <polygon points="173,250 260,205 350,246 445,180 540,238 669,196 669,372 173,372" fill="#141A24"/>
        <polygon points="173,306 280,272 400,312 500,284 669,308 669,372 173,372" fill="#0B0E14"/>
      </g>

      <!-- left rail -->
      <g id="left-rail">
        <g id="close" data-symbol="xmark">
          <circle cx="113" cy="40" r="19" fill="#2B2B2E" opacity="0.9"/>
          <path d="M107.5 34.5 L118.5 45.5 M118.5 34.5 L107.5 45.5" stroke="#FFF" stroke-width="2.2" stroke-linecap="round"/>
        </g>
        <g id="format-pill">
          <rect x="43" y="133" width="140" height="35" rx="17.5" fill="#2B2B2E" opacity="0.9"/>
          <text x="57" y="155" font-size="13" class="sb" fill="#FFF">12MP 4:3</text>
          <text x="119" y="155" font-size="13" class="sb" fill="#FFB340">· DNG</text>
          <path d="M162 148 l4.5 5 l4.5 -5" stroke="#FFF" stroke-opacity="0.4" stroke-width="2" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
        </g>
        <!-- storage headroom: what is left of the disk in the armed format -->
        <g id="headroom-chip">
          <rect x="71" y="176" width="84" height="31" rx="15.5" fill="#2B2B2E" opacity="0.9"/>
          <g data-symbol="internaldrive" stroke="#FFF" stroke-width="1.2" fill="none">
            <rect x="82" y="186.5" width="12" height="10" rx="2.5"/>
            <path d="M84.5 193.5 h7 M84.5 195.5 h7" stroke-linecap="round"/>
          </g>
          <text x="99" y="196.0" font-size="12.5" class="sb" fill="#FFF">≈1,771</text>
        </g>
        <g id="zoom-chips" data-symbol="lens buttons">
          <circle cx="75" cy="242" r="15" fill="none" stroke="#FFF" stroke-opacity="0.25"/>
          <text x="75" y="246" font-size="12" class="sb" fill="#FFF" opacity="0.6" text-anchor="middle">.5×</text>
          <circle cx="113" cy="242" r="15" fill="none" stroke="#FFB340" stroke-opacity="0.8"/>
          <text x="113" y="246" font-size="12" class="sb" fill="#FFB340" text-anchor="middle">1×</text>
          <circle cx="151" cy="242" r="15" fill="none" stroke="#FFF" stroke-opacity="0.25"/>
          <text x="151" y="246" font-size="12" class="sb" fill="#FFF" opacity="0.6" text-anchor="middle">3×</text>
        </g>
        <g id="recent-tile">
          <g clip-path="url(#tile)">
            <rect x="83" y="296" width="60" height="60" fill="#3A3123"/>
            <polygon points="83,340 107,318 129,336 143,326 143,356 83,356" fill="#241E15"/>
          </g>
          <rect x="83" y="296" width="60" height="60" rx="12" fill="none" stroke="#FFF" stroke-opacity="0.35"/>
        </g>
      </g>

      <!-- interval dials on a dark capsule, bottom-leading corner of the
           viewfinder: MODE / EVERY / BLEND, bare values, no caption -->
      <g id="interval-dials">
        <rect x="177" y="325" width="354" height="37" rx="18.5" fill="#000" opacity="0.5"/>
          <text x="189" y="348" font-size="10" class="b" fill="#FFF" opacity="0.45" letter-spacing="0.8">MODE</text>
          <rect x="228" y="330" width="78" height="27" rx="13.5" fill="#2B2B2E" opacity="0.9"/>
          <text x="240" y="348" font-size="12.5" class="sb" fill="#FFF">Basic</text>
          <path d="M286 341 l4 4.5 l4 -4.5" stroke="#FFF" stroke-opacity="0.4" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
          <text x="314" y="348" font-size="10" class="b" fill="#FFF" opacity="0.45" letter-spacing="0.8">EVERY</text>
          <rect x="356" y="330" width="56" height="27" rx="13.5" fill="#2B2B2E" opacity="0.9"/>
          <text x="368" y="348" font-size="12.5" class="sb" fill="#FFF">2 s</text>
          <path d="M392 341 l4 4.5 l4 -4.5" stroke="#FFF" stroke-opacity="0.4" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
          <text x="420" y="348" font-size="10" class="b" fill="#FFF" opacity="0.45" letter-spacing="0.8">BLEND</text>
          <rect x="466" y="330" width="53" height="27" rx="13.5" fill="#2B2B2E" opacity="0.9"/>
          <text x="478" y="348" font-size="12.5" class="sb" fill="#FFF">10</text>
          <path d="M499 341 l4 4.5 l4 -4.5" stroke="#FFF" stroke-opacity="0.4" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
      </g>

      <!-- right rail -->
      <g id="right-rail">
        <g id="mode-stack" font-size="11" class="b" text-anchor="middle">
          <text x="734" y="34" fill="#FFF" opacity="0.5" letter-spacing="0.6">PHOTO</text>
          <text x="734" y="54" fill="#FFB340" letter-spacing="0.6">INTERVAL</text>
          <text x="734" y="74" fill="#FFF" opacity="0.5" letter-spacing="0.6">VIDEO</text>
        </g>
        <g id="shutter" data-symbol="record button">
          <circle cx="734" cy="129" r="38" fill="none" stroke="#FFF" stroke-width="4"/>
          <circle cx="734" cy="129" r="30" fill="#FF3B30"/>
        </g>
        <!-- landscapeExposureControl: the same four framing toggles portrait
             carries in its two shutter-row columns — steady · 2 s delay ·
             grid · AE/AF lock -->
        <g id="steady-toggle" data-symbol="hand.raised">
          <circle cx="734" cy="205" r="22" fill="#2B2B2E" opacity="0.9"/>
          <path d="M729 210 v-9 m3 9 v-11 m3 11 v-11 m3 11 v-9 m-9 9 a6 6 0 0 0 9 0 v-3" fill="none" stroke="#FFF" stroke-width="1.6" stroke-linecap="round"/>
        </g>
        <g id="delay-toggle" data-symbol="timer">
          <circle cx="734" cy="255" r="22" fill="#2B2B2E" opacity="0.9"/>
          <circle cx="734" cy="256" r="9" fill="none" stroke="#FFF" stroke-width="1.7"/>
          <path d="M734 256 v-6 M731 246 h6" stroke="#FFF" stroke-width="1.7" stroke-linecap="round"/>
        </g>
        <g id="grid-toggle" data-symbol="grid.circle">
          <circle cx="734" cy="305" r="22" fill="#2B2B2E" opacity="0.9"/>
          <circle cx="734" cy="305" r="10" fill="none" stroke="#FFF" stroke-width="1.6"/>
          <path d="M727.5 301.7 h13 M727.5 308.3 h13 M730.7 298.5 v13 M737.3 298.5 v13" stroke="#FFF" stroke-width="1.2"/>
        </g>
        <g id="exposure-lock" data-symbol="lock.open">
          <circle cx="734" cy="355" r="22" fill="#2B2B2E" opacity="0.9"/>
          <rect x="728" y="354" width="12" height="9" rx="2" fill="none" stroke="#FFF" stroke-width="1.8"/>
          <path d="M731 354 v-4 a3.5 3.5 0 0 1 7 -1" fill="none" stroke="#FFF" stroke-width="1.8"/>
        </g>
      </g>

      <!-- hardware: Dynamic Island left, home indicator bottom -->
      <rect x="11" y="134.5" width="36" height="124" rx="18" fill="#000" stroke="#2A2A2E" stroke-width="1"/>
      <rect x="359" y="380" width="134" height="5" rx="2.5" fill="#FFF" opacity="0.4"/>
    </g>
  </g>

  <text x="450" y="450" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Capture — Interval (idle, DNG) · landscape · 852×393 pt</text>
  <text x="450" y="468" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/CaptureView.swift — landscapeLayout · landscapeIntervalRow · landscapeModeToggle</text>
</svg>
