<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Shape-mation · list · portrait</title>
  <desc>Mirrors App/Shapemation/ShapemationListView.swift over ShapemationStore (records, newest first, from Shapemations/shapemations.json) — 2026-09-11, code first, mirrored from the running app (iPhone 16 Pro simulator, LL_SHAPEMATION=list). Pushed inside the Shape-mation sheet from the List Shape-mations door: back "Back" (the home's title does not fit the bar beside this one), large title "Shape-mations". One card per video (llCard 14, 12-pt padding, 12-pt spacing): a 110×82 poster on black — the render's poster JPEG fitted, so a near-square 3948×4032 clip letterboxes to 80 pt wide and a portrait 1068×1430 one to 61 — with a 28-pt play.circle.fill badge at 90 % white over it (the poster is itself a Play button); to its right the title (15 semibold, two lines at most; "Circle · 11. 9. 2026 at 7:50"), the subtitle "family · fit|crop · N photos · width×height" (12 secondary; fit is the stack mode, crop the other), the length "5 s" (12 tertiary), and the 13-pt medium borderless action row in this order: Play (play.fill, accent) · Share (square.and.arrow.up, accent — a ShareLink on the MP4) · Delete (trash, record red). Delete confirms first — a confirmation dialog titled "Delete this Shape-mation?" with "The video is removed from the library. The photos it was built from are untouched." — before the store removes the video and its poster. Play (and the poster) open ShapemationPlayerSheet: an AVKit VideoPlayer on black at the record's aspect, inline title, Done, and Share in its bar. A long press shows a context menu repeating the same three actions. Empty: one card reading "No Shape-mations yet. Create a shape slideshow and it will appear here." Posters here are flat placeholders suggesting the two reference pictures — a Rouen facade behind the nested stack, and a red-rimmed round sign on a grey wall. Measured geometry: the sheet's top edge sits at y 72 on the 16 Pro (69 on the 393-pt canvas device).</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="sheet"><rect x="0" y="72" width="393" height="780" rx="18"/></clipPath>
    <clipPath id="poster1"><rect x="28" y="208" width="110" height="82" rx="8"/></clipPath>
    <clipPath id="poster2"><rect x="28" y="326" width="110" height="82" rx="8"/></clipPath>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.05"/></filter>
    <filter id="badge" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.m{font-weight:500}.sec{fill:#6D6D72}.ter{fill:#C6C6CB}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#000"/>
    <g transform="translate(24,24)">

      <g id="status-bar" fill="#FFF">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g id="signal"><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path id="wifi" d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#FFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g id="battery"><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#FFF" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#FFF" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>
      <rect x="19" y="62" width="355" height="30" rx="12" fill="#D5D5D9"/>

      <g id="shapemations-list" clip-path="url(#sheet)">
        <rect x="0" y="72" width="393" height="780" fill="#F2F2F7"/>
        <g id="back">
          <path d="M18.8 91.5 l-8.3 8.2 8.3 8.2" stroke="#C36A00" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.left"/>
          <text x="31.5" y="105.5" font-size="17" fill="#C36A00">Back</text>
        </g>
        <text x="16" y="164" font-size="34" class="b" fill="#000">Shape-mations</text>

        <!-- record 1: Circle · fit · 5 photos · 3948×4032 (near-square, letterboxed to 80 pt) -->
        <g id="record-1">
          <rect x="16" y="196" width="361" height="106" rx="14" fill="#FFF" filter="url(#card)"/>
          <g id="poster-1" clip-path="url(#poster1)">
            <rect x="28" y="208" width="110" height="82" fill="#000"/>
            <g id="picture-1">
              <rect x="42.7" y="208" width="80.3" height="82" fill="#D9E1EA"/>
              <rect x="42.7" y="208" width="20" height="22" fill="#C6B9A2"/>
              <rect x="103" y="208" width="20" height="22" fill="#CFC3AC"/>
              <rect x="42.7" y="229" width="80.3" height="19" fill="#3B3E47"/>
              <rect x="42.7" y="248" width="80.3" height="42" fill="#C9B89A"/>
              <rect x="47" y="236" width="9" height="6" fill="#8FA1B8"/><rect x="109" y="236" width="9" height="6" fill="#8FA1B8"/>
              <rect x="47" y="256" width="9" height="18" fill="#7C7468"/><rect x="109" y="256" width="9" height="18" fill="#7C7468"/>
              <rect x="66" y="222" width="34" height="42" fill="#4E525C"/>
              <rect x="70" y="228" width="26" height="30" fill="#5E7A55"/>
              <circle cx="83" cy="243" r="5" fill="#D8352B"/>
            </g>
            <g data-symbol="play.circle.fill" filter="url(#badge)">
              <circle cx="83" cy="249" r="14" fill="#FFF" fill-opacity="0.9"/>
              <path d="M78.5 242.6 L90.5 249 L78.5 255.4 Z" fill="#5C5F66" fill-opacity="0.8"/>
            </g>
          </g>
          <text x="150" y="222" font-size="15" class="sb" fill="#000">Circle · 11. 9. 2026 at 7:50</text>
          <text x="150" y="241" font-size="12" class="sec">Circle · fit · 5 photos · 3948×4032</text>
          <text x="150" y="260" font-size="12" class="ter">5 s</text>
          <g id="actions-1" font-size="13" class="m">
            <path d="M151.7 274 L161.3 279.3 L151.7 284.7 Z" fill="#C36A00" data-symbol="play.fill"/>
            <text x="171" y="284" fill="#C36A00">Play</text>
            <path d="M215.3 278.6 h-2.2 v8.2 h9.4 v-8.2 h-2.2 M217.8 282.6 v-9.4 M214.6 276.3 l3.2 -3.2 3.2 3.2" stroke="#C36A00" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="square.and.arrow.up"/>
            <text x="234" y="284" fill="#C36A00">Share</text>
            <path d="M284.8 275.6 h11.6 M288.6 275.6 v-1.6 h3.8 v1.6 M286.1 275.6 l0.8 10.6 h7.2 l0.8 -10.6 M289.2 278.4 v5.4 M291.8 278.4 v5.4" stroke="#FF3B30" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="trash"/>
            <text x="307" y="284" fill="#FF3B30">Delete</text>
          </g>
        </g>

        <!-- record 2: Circle · crop · 6 photos · 1068×1430 (portrait, letterboxed to 61 pt) -->
        <g id="record-2">
          <rect x="16" y="314" width="361" height="106" rx="14" fill="#FFF" filter="url(#card)"/>
          <g id="poster-2" clip-path="url(#poster2)">
            <rect x="28" y="326" width="110" height="82" fill="#000"/>
            <g id="picture-2">
              <rect x="52.3" y="326" width="61" height="82" fill="#737887"/>
              <path d="M70 326 l3 22 M96 326 l-2 18 M60 398 h46" stroke="#E4E6EA" stroke-width="1.2" stroke-opacity="0.6"/>
              <rect x="52.3" y="392" width="61" height="16" fill="#5E6371"/>
              <circle cx="83" cy="367" r="13.4" fill="#F1F1F1" stroke="#D8352B" stroke-width="2"/>
              <path d="M76 361.5 h14 M76 366 h14 M76 370.5 h14" stroke="#D8352B" stroke-width="1.6" stroke-opacity="0.55"/>
            </g>
            <g data-symbol="play.circle.fill" filter="url(#badge)">
              <circle cx="83" cy="367" r="14" fill="#FFF" fill-opacity="0.9"/>
              <path d="M78.5 360.6 L90.5 367 L78.5 373.4 Z" fill="#8E8E93" fill-opacity="0.8"/>
            </g>
          </g>
          <text x="150" y="340.3" font-size="15" class="sb" fill="#000">Circle · 10. 9. 2026 at 20:13</text>
          <text x="150" y="359" font-size="12" class="sec">Circle · crop · 6 photos · 1068×1430</text>
          <text x="150" y="378" font-size="12" class="ter">6 s</text>
          <g id="actions-2" font-size="13" class="m">
            <path d="M151.7 392 L161.3 397.3 L151.7 402.7 Z" fill="#C36A00" data-symbol="play.fill"/>
            <text x="171" y="402" fill="#C36A00">Play</text>
            <path d="M215.3 396.6 h-2.2 v8.2 h9.4 v-8.2 h-2.2 M217.8 400.6 v-9.4 M214.6 394.3 l3.2 -3.2 3.2 3.2" stroke="#C36A00" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="square.and.arrow.up"/>
            <text x="234" y="402" fill="#C36A00">Share</text>
            <path d="M284.8 393.6 h11.6 M288.6 393.6 v-1.6 h3.8 v1.6 M286.1 393.6 l0.8 10.6 h7.2 l0.8 -10.6 M289.2 396.4 v5.4 M291.8 396.4 v5.4" stroke="#FF3B30" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="trash"/>
            <text x="307" y="402" fill="#FF3B30">Delete</text>
          </g>
        </g>
      </g>

      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Shape-mation · list · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors ShapemationListView over ShapemationStore · LL_SHAPEMATION=list</text>
</svg>
