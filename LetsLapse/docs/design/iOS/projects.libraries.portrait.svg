        <rect x="258" y="120" width="86" height="40" rx="20" fill="#000" fill-opacity="0.06"/><text x="301" y="145" font-size="17" fill="#C36A00" text-anchor="middle">Capture ⌄</text><rect x="350" y="120" width="27" height="40" rx="14" fill="#000" fill-opacity="0.06"/><text x="363.5" y="146" font-size="15" fill="#C36A00" text-anchor="middle">▼</text></g>
