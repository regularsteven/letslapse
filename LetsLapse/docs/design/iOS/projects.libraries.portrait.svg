        <rect x="0" y="0" width="393" height="852" fill="#000" fill-opacity="0.12"/>
        <rect x="20" y="152" width="250" height="132" rx="13" fill="#F6F6F8" filter="url(#soft)"/>
        <g transform="translate(36,166)" fill="none" stroke="#000" stroke-width="1.5" data-symbol="books.vertical"><rect x="0" y="1" width="3.5" height="12" rx="0.8"/><rect x="5" y="1" width="3.5" height="12" rx="0.8"/><path d="M10.5 3 l3.2 -1 3 11.5 -3.2 1z"/></g>
        <text x="62" y="178" font-size="16" fill="#000">Holidays</text>
        <line x1="20" y1="196" x2="270" y2="196" stroke="#000" stroke-opacity="0.08"/>
        <g transform="translate(36,210)" fill="none" stroke="#000" stroke-width="1.5" data-symbol="books.vertical"><rect x="0" y="1" width="3.5" height="12" rx="0.8"/><rect x="5" y="1" width="3.5" height="12" rx="0.8"/><path d="M10.5 3 l3.2 -1 3 11.5 -3.2 1z"/></g>
        <text x="62" y="222" font-size="16" fill="#000">Client X</text>
        <rect x="20" y="240" width="250" height="8" fill="#000" fill-opacity="0.06"/>
        <g transform="translate(36,256)" fill="none" stroke="#000" stroke-width="1.5" data-symbol="gearshape"><circle cx="8" cy="8" r="3"/><circle cx="8" cy="8" r="7" stroke-dasharray="2.5 2.2"/></g>
        <text x="62" y="268" font-size="16" fill="#000">Manage libraries…</text>
        <g id="tab-bar" transform="translate(0,0)">
        <rect x="20" y="776" width="353" height="62" rx="31" fill="#FFF" fill-opacity="0.92" filter="url(#soft)"/>
        <text x="55.0" y="826" font-size="10.5" fill="#6D6D72" text-anchor="middle">Create</text>
        <text x="125.5" y="826" font-size="10.5" fill="#6D6D72" text-anchor="middle">Gallery</text>
        <rect x="165.0" y="781" width="62" height="52" rx="26" fill="#C36A00" fill-opacity="0.12"/>
        <text x="196.0" y="826" font-size="10.5" fill="#C36A00" font-weight="600" text-anchor="middle">Projects</text>
        <text x="266.5" y="826" font-size="10.5" fill="#6D6D72" text-anchor="middle">Collections</text>
        <text x="337.0" y="826" font-size="10.5" fill="#6D6D72" text-anchor="middle">Settings</text>
