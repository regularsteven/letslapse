<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Projects · the library menu under the title (open) · portrait</title>
  <desc>Mirrors App/ProjectsView.swift (header: the Menu under the title, iOS only) over ModelHost.switchLibrary and StorageRoot.libraryFolders — libraries plan L21, C2d (2026-09-17, code first; the chip verified on the running Simulator, the open menu drawn from the code). With MORE THAN ONE library on the phone, the open library's name sits under the 34pt title as an accent capsule — books.vertical · the name (14pt semibold) · chevron.down — 12 % accent fill, 10pt horizontal padding, 5pt vertical, 4pt in from the leading edge, 2pt under the title row. It is a Menu: one row per OTHER library (books.vertical · name) that switches in place — the tree re-roots on the new model and lands back on Projects (host.landingTab = .projects) — a divider, then 'Manage libraries…' (gearshape), which sets model.requestedSettingsAnchor = .libraries and lands on the Settings card. A refusal (a shoot being written, a project on its way to a nearby device) is a Libraries alert with the host's reason. One library, no chip: the header is as projects.portrait.svg draws it. The sharing glyph, search, sort and the filter bar are unchanged and sit 46pt lower while the chip is present. On the Mac there is no chip — its libraries switch by relaunch from Settings.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="scroll"><rect x="0" y="58" width="393" height="794"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}.hdr{font-size:13px;font-weight:600;fill:#6D6D72;letter-spacing:0.5px}.ttl{font-size:16px;fill:#000}.sub{font-size:11.5px;fill:#6D6D72}</style>
  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">
