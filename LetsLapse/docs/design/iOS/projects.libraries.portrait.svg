        <g id="sharing-pill"><circle cx="353" cy="97" r="14" fill="#FF3B30" fill-opacity="0.12"/><path d="M347 92 l12 12 M353 91.5 a6 6 0 0 1 4.5 8.5 M353 91.5 a6 6 0 0 0 -4.5 8.5" stroke="#FF3B30" stroke-width="1.6" fill="none" stroke-linecap="round"/></g>
        <g id="library-chip"><rect x="20" y="118" width="222" height="26" rx="13" fill="#C36A00" fill-opacity="0.12"/>
