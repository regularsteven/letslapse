        <text x="49" y="135" font-size="14" fill="#C36A00" font-weight="600">Prague LetsLapse Shots</text>
        <path d="M228 128 l4 4 4 -4" stroke="#C36A00" stroke-width="2" fill="none" stroke-linecap="round" data-symbol="chevron.down"/></g>
