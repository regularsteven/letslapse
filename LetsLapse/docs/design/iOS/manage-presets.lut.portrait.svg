<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Presets · LUT · portrait</title>
  <desc>An imported LUT's screen, pushed from the Presets sheet. Drawn on "Teal and Orange" (Teal_and_Orange.cube, 33³, Resolve). Same compare card as a preset's (manage-presets.preset.portrait.svg), the cube applied at the strength below; the caption says so. NAME: a TextField seeded from the file name with underscores turned to spaces — never from the .cube TITLE. STRENGTH: a slider 0–100 %, the value trailing; this is what a project STARTS at when the LUT is applied, and each project can move its own in the Edit screen's LUT row  — the footer says exactly that. FILE: the file name with the cube size, maker and size beneath it ("Generated by Resolve" is the TITLE these files carry), the import date, and how many projects are on it. A log-input cube — 50 % grey mapped below 0.25 at import — adds an amber note row here: "Expects a log-encoded picture. On a normal photo it will look crushed; try it on a Capture Flat clip." (not drawn: this LUT is display-referred). Delete LUT (record red) with the footer "Projects on this LUT keep rendering it: each carries its own copy of the cube." — the storage rule the spike set (docs/presets-lut-spike.md §4.4). A LUT is not duplicated: import it again under another name.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="sheet"><rect x="0" y="56" width="393" height="796" rx="10"/></clipPath>
    <clipPath id="thumb44"><rect width="44" height="44" rx="8"/></clipPath>
    <clipPath id="thumb56"><rect width="56" height="42" rx="7"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C4F86"/><stop offset="0.55" stop-color="#6D8FBF"/><stop offset="1" stop-color="#F0B27A"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A6F94"/><stop offset="1" stop-color="#1B2A44"/></linearGradient>
    <!-- the preview frame: a dusk over the river, the sample every preset is shown on -->
    <symbol id="scene" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice">
      <rect width="160" height="120" fill="url(#sky)"/>
      <rect y="64" width="160" height="56" fill="url(#water)"/>
      <ellipse cx="118" cy="63" rx="9" ry="6" fill="#FFD27A"/>
      <rect y="62" width="160" height="4" fill="#FFB05A" opacity="0.55"/>
      <path d="M0 66 L28 56 L58 61 L92 50 L128 58 L160 52 V70 H0 Z" fill="#2B2A33"/>
      <path d="M0 70 h160 v6 H0 Z" fill="#26364F" opacity="0.6"/>
      <path d="M0 92 h160 v8 H0 Z" fill="#FFB05A" opacity="0.12"/>
    </symbol>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#000"/>
    <g transform="translate(24,24)">

      <!-- status bar over the shrunken Create tab behind the sheet -->
      <g id="status-bar" fill="#FFF">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g id="signal"><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path id="wifi" d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#FFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g id="battery"><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#FFF" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#FFF" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>
      <!-- the parent's top edge, scaled back behind the sheet -->
      <rect x="16" y="44" width="361" height="30" rx="10" fill="#C7C7CC"/>

      <!-- the sheet -->
      <g id="lut-detail" clip-path="url(#sheet)">
        <rect x="0" y="56" width="393" height="796" fill="#F2F2F7"/>
        <g id="nav-bar">
          <path d="M16 80 l-7 7 7 7" stroke="#C36A00" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.left"/>
          <text x="30" y="92" font-size="17" fill="#C36A00">Presets</text>
          <text x="196.5" y="92" font-size="17" class="sb" fill="#000" text-anchor="middle">Teal and Orange</text>
        </g>
        <g id="compare-card">
          <clipPath id="card"><rect x="20" y="112" width="353" height="200" rx="14"/></clipPath>
          <clipPath id="after"><rect x="170" y="112" width="203" height="200"/></clipPath>
          <g clip-path="url(#card)">
            <use href="#scene" x="20" y="112" width="353" height="200"/>
            <g clip-path="url(#after)"><use href="#scene" x="20" y="112" width="353" height="200"/><rect x="20" y="112" width="353" height="200" fill="#0E7C8C" opacity="0.34"/><rect x="20" y="112" width="353" height="200" fill="#FF7A00" opacity="0.1"/></g>
            <line x1="170" y1="112" x2="170" y2="312" stroke="#FFF" stroke-width="2"/>
          </g>
          <circle cx="170" cy="212.0" r="15" fill="#FFF"/>
          <path d="M162 207.0 l-4 5 4 5 M178 207.0 l4 5 -4 5" stroke="#1C1C1E" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="arrow.left.and.right"/>
          <rect x="32" y="124" width="52" height="20" rx="10" fill="#000" opacity="0.5"/>
          <text x="58" y="138" font-size="11" class="sb" fill="#FFF" text-anchor="middle">Before</text>
          <rect x="315" y="124" width="46" height="20" rx="10" fill="#000" opacity="0.5"/>
          <text x="338" y="138" font-size="11" class="sb" fill="#FFF" text-anchor="middle">After</text>
        </g>
          <text x="36" y="330" font-size="13" class="sec">Drag the divider to compare, or press and hold to</text>
          <text x="36" y="346" font-size="13" class="sec">see the original. 100 % strength, on Vltava dusk.</text>
        <g id="section-name">
          <text x="36" y="386" font-size="13" class="sec" letter-spacing="0.3">NAME</text>
          <rect x="20" y="400" width="353" height="44" rx="10" fill="#FFF"/>
          <text x="36" y="428" font-size="16" fill="#000">Teal and Orange</text>
          <g data-symbol="xmark.circle.fill"><circle cx="353" cy="422" r="8" fill="#C6C6CB"/><path d="M349.5 418.5 l7 7 M356.5 418.5 l-7 7" stroke="#FFF" stroke-width="1.6" stroke-linecap="round"/></g>
        </g>
        <g id="section-strength">
          <text x="36" y="480" font-size="13" class="sec" letter-spacing="0.3">STRENGTH</text>
          <rect x="20" y="494" width="353" height="60" rx="10" fill="#FFF"/>
          <g id="strength-slider">
            <rect x="36" y="522" width="270" height="4" rx="2" fill="#E9E9EB"/>
            <rect x="36" y="522" width="270" height="4" rx="2" fill="#C36A00"/>
            <circle cx="306" cy="524" r="13" fill="#FFF" stroke="#000" stroke-opacity="0.12"/>
            <text x="357" y="529" font-size="16" class="sec" text-anchor="end">100 %</text>
          </g>
          <text x="36" y="572" font-size="13" class="sec">What a project starts at. Each project can set its</text>
          <text x="36" y="588" font-size="13" class="sec">own strength in the Edit screen.</text>
        </g>
        <g id="section-file">
          <text x="36" y="626" font-size="13" class="sec" letter-spacing="0.3">FILE</text>
          <rect x="20" y="640" width="353" height="148" rx="10" fill="#FFF"/>
          <g id="file-0">
            <text x="36" y="666" font-size="16" fill="#000">Teal_and_Orange.cube</text>
            <text x="36" y="683" font-size="11.5" class="sec">33 × 33 × 33 · Generated by Resolve · 0.8 MB</text>
          </g>
          <line x1="36" y1="700" x2="373" y2="700" stroke="#000" stroke-opacity="0.1"/>
          <g id="file-1"><text x="36" y="727" font-size="16" fill="#000">Imported</text><text x="357" y="727" font-size="16" class="sec" text-anchor="end">8 Sep 2026</text></g>
          <line x1="36" y1="744" x2="373" y2="744" stroke="#000" stroke-opacity="0.1"/>
          <g id="file-2"><text x="36" y="771" font-size="16" fill="#000">Used on</text><text x="357" y="771" font-size="16" class="sec" text-anchor="end">2 projects</text></g>
        </g>
        <g id="section-delete">
          <rect x="20" y="804" width="353" height="44" rx="10" fill="#FFF"/>
          <text x="196.5" y="832" font-size="16" fill="#FF3B30" text-anchor="middle">Delete LUT</text>
        </g>
        <!-- footer below the fold: "Projects on this LUT keep rendering it: each carries its own copy of the cube." -->
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Presets · LUT · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors LUTDetailView — compare card · NAME · STRENGTH · FILE (+ Used on) · Delete LUT · LL_PRESETS=lut</text>
</svg>
