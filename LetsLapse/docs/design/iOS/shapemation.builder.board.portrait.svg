  <title>iOS · Shape-mation · builder · Sequence board · portrait</title>
  <desc>Mirrors App/Shapemation/ShapemationBoardView.swift on the phone — the Sequence board stacked in one column (measuredWidth &lt; 760): the option seat Least crop · Fixed shape (iOS segmented, full width), the Sort row ('Sort · ' secondary + 'Smallest first' accent — one concatenated Text in a borderless Menu, with a chevron on the phone) with the size menu '1 920' and '1 440×1 920' trailing, the rect chips (Source · 3:4 lit, 1:1 · 4:5 · 3:2 · 16:9 · 2:3 · 9:16 in a horizontal scroll, the mean loss under each in 10-pt tertiary), the LL.ink numbers pill on its own row (jump 1.72 · crop 15 % · loss 16 %), Auto-reject (on) and Show rejected (off) at the row's two ends, the count line '62 members · 21 rejected · 31 flagged', then the preview (270×360, centred; a drag places a key only once one is armed, so the page scrolls over it), the strip (LL.ink, 84 pt, 51×68 tiles with the index badge, the verdict dot and the amber shape box, the selected tile ringed), its note, the source card (the source dimmed, the output window bright with a white edge; 'the source; the output window over it is what stays'; shape · natural · crop · margins in 12-pt tabular; Reject · Add key here in tinted capsules and the Hold · as timed menu), the charts card (Shape position: x and y dots, the smoothed path solid for x and dashed for y, end handles; Shape share as rendered with dips in red; the dips line) and the cog card 'Path and tolerance · normal · window 5 · median · fixpoint'. Pinned bar: Next · timing. Mirrored 2026-09-21 from the iPhone 16 Pro simulator over the tram clone in the container (-storage.activeLibrary &lt;id&gt;, LL_SHAPEMATION=board LL_CHIPS=tram), swiped by the simulator tool; the numbers are the Mac Debug build's accessibility dump of the same board. Re-anchored from the 402×874 capture to this 393×852 canvas as its siblings are. Photos are flat stand-ins. THIS FILE: the step as it opens — the header rows and the preview, the bar over its foot.</desc>
