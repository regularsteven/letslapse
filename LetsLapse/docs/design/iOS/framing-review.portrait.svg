          <text x="32" y="650" font-size="11.5" fill="#FFF" fill-opacity="0.72">untouched — the correction is applied when a clip is</text>
          <text x="32" y="664" font-size="11.5" fill="#FFF" fill-opacity="0.72">blended or a photo is viewed.</text>
          <text x="32" y="682" font-size="11.5" class="sb" fill="#FFB340">Crops 0.4% · keeps 4016×3012 of 4032×3024</text>
