<text x="329" y="109" font-size="9.5" fill="#6D6D72" text-anchor="end">184 · 3 min</text>
</g>
        </g>
        <!-- the knocks, largest first; the amber bar is the peak on a 10 px scale -->
        <text x="20" y="411" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">KNOCKS · 3</text>
        <g id="knocks-card">
          <rect x="16" y="420" width="361" height="122" rx="16" fill="#FFF" filter="url(#soft)"/>
<text x="32" y="438" font-size="14.5" fill="#000">Photos 121–129</text>
