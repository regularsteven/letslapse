<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Framing review · report · portrait</title>
  <desc>Mirrors App/FramingReviewView.swift (iOS: a large-detent sheet over ProjectDetailView; macOS: its own window, ../macOS/framing-review.svg) in its REPORT state, over LetsLapseKit.FramingReview loaded from the project's source/framing.json. Four blocks, top to bottom: the verdict card (exclamationmark.triangle.fill in amber + "Stabilisation recommended", or checkmark.circle.fill in green + "Framing steady" when the review found no knocks — the copy is `FramingReview.summary`, verbatim); the path card — every photo's vertical offset against the reference framing on a ±10 px scale, knocks shaded amber, the accent line the measured path (`frames[].dy` minus `plan.referenceY`; horizontal is not drawn — on a tripod it is the gravity axis that moves); the knocks card (`events`, largest first, `Event.summary` split into range · count, the amber bar the peak on a 10 px scale); and the plan card in ink — `plan.summary` in words and the crop line, the same numbers `FramingLock` will apply. The primary button commits the plan (`applyingPlan()` → `stabilisation` in the same file — metadata only); once committed the verdict row gains a green "Stabilised" line and the button reads "Undo". Done dismisses; the project's Originals rows update in place. The measuring state is framing-review.measuring.portrait.svg.</desc>
