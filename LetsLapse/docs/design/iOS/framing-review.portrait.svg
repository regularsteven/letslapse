          <text x="32" y="172" font-size="12" fill="#6D6D72">3 knocks across 184 photos over 3 minutes, the</text>
          <text x="32" y="186" font-size="12" fill="#6D6D72">largest 5.6 px at photos 121–129. Locking the</text>
          <text x="32" y="200" font-size="12" fill="#6D6D72">framing crops 0.4% from each edge (4016×3012</text>
          <text x="32" y="214" font-size="12" fill="#6D6D72">of 4032×3024).</text>
