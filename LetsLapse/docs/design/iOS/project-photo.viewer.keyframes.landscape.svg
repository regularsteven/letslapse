<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Interval grading viewer · keyframed · landscape</title>
  <desc>Mirrors App/PhotoViewerView.swift's wide branch (available width ≥ 500pt: iPhone landscape, the iPad sheet, a widened Mac window) with App/GradeTimelineView.swift in it. The scrubber belongs to the MEDIA, so it takes the media pane's width rather than the rail's — which keeps the rail identical to the photo editor's (same chips, same panel, same Save as Preset) and the whole photo/interval difference to exactly one component. The media gives up the strip's 54pt of height; the rail is unchanged. There is still no preview-size handle here — the handle belongs to the stacked layout, where media height and control room compete for the same axis; the rail gives up width instead. The strip runs on its compact metrics (26pt control and track, 20pt playhead, 10pt end labels, 26pt frame-step discs 6pt apart), so it is the same component at a tighter size rather than a second drawing of it. The steps take their width out of the track, so the media pane's width is unchanged and the two end labels still sit at the track's own ends. Drawn in the SNAPPED state: the playhead is standing exactly on the middle moment at 1:09:41, which swells to 15pt and takes a white ring inside a #C36A00 halo. While it holds, the sliders in the rail edit THAT moment — the readouts and the diamonds beside Temp, Exposure and Highlights are that moment's values, not the clip's. See project-photo.viewer.keyframes.portrait.svg for the model, the states and the panel treatment; this file specifies placement only.</desc>
