<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Scans · portrait</title>
  <desc>Mirrors App/ScansView.swift (ScansView, ScanSessionCard, ScanCorrectionPill, ScanPaperPill) over App/ScanSession.swift (ScanSession, ScanSessionGroup). The Scans tab root: scanner runs as documents, newest first, grouped by day in the app's own LLSectionHeader style. Each card is date+time, "n pages · duration", the correction pill and the paper pill, then a 92pt strip of pages at the stock's own ratio (A4 tall, 4×6 wide — never a square crop) with a counter tile for the rest. Three correction states, all real: accent "Corrected" when every detected page is done, an accent ring "2 of 3" when partial, and nothing at all when no page recorded a rectangle (third card). Card x16 w361 r16, 14pt padding. Tab bar from 755, Scans selected — six tabs at 58pt.</desc>
