<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Capture — Photo (manual exposure open, JPEG) · landscape</title>
  <desc>Mirrors App/CaptureView.swift (landscapeLayout, shutterClusterLayer, landscapeClusterReadout, photoControlsRow) + App/CaptureDials.swift (PhotoExposureWheels, DetentWheel). Net-new mirror, 2026-09-07, built on capture-photo.landscape.svg (this file's own idle twin) — the left rail, viewfinder and BLEND corner control are unchanged; only the cluster state and this readout panel differ.

Panel geometry read directly from `shutterClusterLayer` rather than invented: once `pin.geometry.isLandscape &amp;&amp; mode == .photo &amp;&amp; photoManualExposure`, the plain text readout is replaced by `PhotoExposureWheels` in a `.overlay` on the shutter cluster, anchored `.topTrailing` when `shutterClusterLeads` is false (the default — notch-left, drawn here) or `.topLeading` when the cluster pins to the leading edge instead (not drawn, mirrors the "notch-right is the mirror image, not drawn" rule the component contract already states). The overlay frame is forced to 240pt wide (`manualPanel ? 240 : …`) and offset down by the cluster box's own height + 6pt — it cannot centre under the ring the way portrait's 361pt panel does, because the ring sits only 94pt from the physical edge and a 240pt panel centred there would run off-screen; anchoring its TRAILING edge to the cluster box's own trailing edge keeps it fully on-screen instead. Concrete numbers for this file: cluster box is x 678–838, y 136.5–256.5 (ring centre (758, 196.5) minus/plus (80, 60)), so the panel spans x 598–838 (838 − 240) and starts at y 262.5 (256.5 + 6).

`PhotoExposureWheels` is the identical view portrait uses (`landscapeClusterReadout`'s Photo-manual branch calls it directly, unmodified) — VStack(spacing 10): a 16pt readout row, then SHUTTER and ISO `DetentWheel`s at 8pt spacing (44pt each) = 122pt total, matching this file's own 262.5→384.5 span. Two departures from portrait, both because 240pt is much narrower than portrait's 361pt, noted rather than silently taken: (1) the ±3-stop offset meter (`offsetMeter`, a fixed 92pt element) is dropped from the readout row for space — the readout text alone is kept; (2) each `DetentWheel` keeps its real 14pt detent pitch and fixed amber-tick-under-centre-indicator geometry, just showing fewer of them — 4 either side of the selected value (SHUTTER 1/125·…·1/60·…·1/30, ISO 100·…·200·…·400) versus the ~9 that fit portrait's 297pt bar, per `DetentWheel.pitch`. The SHUTTER/ISO `DialCaption`s are KEPT at their real fixed 56pt column (`DialCaption` is `.fixedSize()` and always 56pt wide regardless of container per `PhotoExposureWheels.body`, so the real app does not drop them at this width either — the wheel itself simply narrows to 176pt (240 − 56 − 8) to make room, which is what is drawn). Shown at the wheels' own seed defaults, ISO 200 · 1/60, matching `LL_MANUAL=1`'s staged state and the portrait manual file. Landscape-geometry portion of this file is a reasoned extrapolation from the source, not a fresh device/simulator capture this session.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="852" height="393" rx="54"/></clipPath>
    <clipPath id="tile"><rect x="83" y="296" width="60" height="60" rx="12"/></clipPath>
    <clipPath id="shutter-wheel-clip"><rect x="662" y="288.5" width="176" height="44" rx="10"/></clipPath>
    <clipPath id="iso-wheel-clip"><rect x="662" y="340.5" width="176" height="44" rx="10"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232B3B"/><stop offset="0.62" stop-color="#3A3628"/><stop offset="1" stop-color="#4A3A22"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B2B2E"/><stop offset="1" stop-color="#2B2B2E" stop-opacity="0"/></linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B2B2E" stop-opacity="0"/><stop offset="1" stop-color="#2B2B2E"/></linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="18" y="18" width="864" height="405" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="852" height="393" fill="#000"/>
    <g transform="translate(24,24)">

      <g id="viewfinder">
        <rect x="171" y="43" width="500" height="286" fill="url(#sky)"/>
        <circle cx="300" cy="150" r="26" fill="#FFB340" opacity="0.9"/>
        <circle cx="300" cy="150" r="46" fill="#FFB340" opacity="0.15"/>
        <polygon points="171,240 260,200 350,238 445,182 540,228 671,192 671,329 171,329" fill="#141A24"/>
        <polygon points="171,286 280,258 400,292 500,268 671,288 671,329 171,329" fill="#0B0E14"/>
      </g>

      <!-- left rail: unchanged from capture-photo.landscape.svg -->
      <g id="left-rail">
        <g id="close" data-symbol="xmark">
          <circle cx="113" cy="40" r="19" fill="#2B2B2E" opacity="0.9"/>
          <path d="M107.5 34.5 L118.5 45.5 M118.5 34.5 L107.5 45.5" stroke="#FFF" stroke-width="2.2" stroke-linecap="round"/>
        </g>
        <g id="format-pill" transform="translate(37,0)">
          <rect x="38" y="133" width="150" height="35" rx="17.5" fill="#2B2B2E" opacity="0.9"/>
          <text x="52" y="155" font-size="13" class="sb" fill="#FFF">1920×1080</text>
          <text x="124" y="155" font-size="13" class="sb" fill="#FFF">· JPEG</text>
          <path d="M167 148 l4.5 5 l4.5 -5" stroke="#FFF" stroke-opacity="0.4" stroke-width="2" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
        </g>
        <g id="headroom-chip" transform="translate(7,0)">
          <rect x="68" y="176" width="84" height="31" rx="15.5" fill="#2B2B2E" opacity="0.9"/>
          <g data-symbol="internaldrive" stroke="#FFF" stroke-width="1.2" fill="none">
            <rect x="79" y="186.5" width="12" height="10" rx="2.5"/>
            <path d="M81.5 193.5 h7 M81.5 195.5 h7" stroke-linecap="round"/>
          </g>
          <text x="96" y="196.0" font-size="12.5" class="sb" fill="#FFF">≈62.5k</text>
        </g>
        <g id="zoom-chips" data-symbol="lens buttons">
          <circle cx="75" cy="242" r="15" fill="none" stroke="#FFF" stroke-opacity="0.25"/>
          <text x="75" y="246" font-size="12" class="sb" fill="#FFF" opacity="0.6" text-anchor="middle">.5×</text>
          <circle cx="113" cy="242" r="15" fill="none" stroke="#FFB340" stroke-opacity="0.8"/>
          <text x="113" y="246" font-size="12" class="sb" fill="#FFB340" text-anchor="middle">1×</text>
          <circle cx="151" cy="242" r="15" fill="none" stroke="#FFF" stroke-opacity="0.25"/>
          <text x="151" y="246" font-size="12" class="sb" fill="#FFF" opacity="0.6" text-anchor="middle">3×</text>
        </g>
        <g id="remote-chip">
          <rect x="75" y="259" width="142" height="26" rx="13" fill="#2B2B2E" opacity="0.9"/>
          <circle cx="87" cy="272" r="3.5" fill="#FFB340"/>
          <text x="96" y="276.5" font-size="12.5" fill="#FFF" font-weight="500">Remote</text>
          <text x="149" y="276.5" font-size="12.5" class="b m" fill="#FFF" letter-spacing="1.5">931156</text>
        </g>
        <g id="recent-tile">
          <g clip-path="url(#tile)">
            <rect x="83" y="296" width="60" height="60" fill="#3A3123"/>
            <polygon points="83,340 107,318 129,336 143,326 143,356 83,356" fill="#241E15"/>
          </g>
          <rect x="83" y="296" width="60" height="60" rx="12" fill="none" stroke="#FFF" stroke-opacity="0.35"/>
        </g>
      </g>

      <!-- Photo's BLEND dial: unchanged — photoManualExposure does not set isCapturing, so this overlay stays -->
      <g id="photo-controls">
        <text x="181" y="310" font-size="10" class="b" fill="#FFF" opacity="0.45" letter-spacing="0.8">BLEND</text>
        <rect x="227" y="292" width="53" height="27" rx="13.5" fill="#2B2B2E" opacity="0.9"/>
        <text x="239" y="310" font-size="12.5" class="sb" fill="#FFF">10</text>
        <path d="M260 303 l4 4.5 l4 -4.5" stroke="#FFF" stroke-opacity="0.4" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
      </g>

      <g id="right-rail">
        <g id="mode-stack" font-size="11" class="b" text-anchor="middle">
          <text x="734" y="34" fill="#FFB340" letter-spacing="0.6">PHOTO</text>
          <text x="734" y="54" fill="#FFF" opacity="0.5" letter-spacing="0.6">INTERVAL</text>
          <text x="734" y="74" fill="#FFF" opacity="0.5" letter-spacing="0.6">VIDEO</text>
        </g>
        <!-- Shutter cluster: shared component. Edit ../components/shutter-cluster.photo-manual.landscape.svg,
             not this file; placement unchanged from the idle file (ring centre 758,196.5). -->
        <image id="shutter-cluster" href="../components/shutter-cluster.photo-manual.landscape.svg" x="678" y="136.5" width="160" height="120"/>
      </g>

      <!-- PhotoExposureWheels, compact: readout line, then SHUTTER and ISO DetentWheels.
           Panel x 598–838 (240pt, trailing-anchored to the cluster box's own trailing edge, 838),
           y 262.5–384.5 (cluster box bottom 256.5 + 6, then 122pt tall per PhotoExposureWheels'
           own rhythm: 16 + 10 gap + 44 + 8 gap + 44). No offset meter at this width (see desc). -->
      <g id="manual-exposure-panel">
        <text x="598" y="275" font-size="12" class="m" fill="#FFB340">ISO 200 · 1/60</text>

        <text x="598" y="313.5" font-size="10" class="b" fill="#FFF" opacity="0.45" letter-spacing="0.8">SHUTTER</text>
        <g id="shutter-wheel">
          <rect x="662" y="288.5" width="176" height="44" rx="10" fill="#2B2B2E" opacity="0.9"/>
          <g clip-path="url(#shutter-wheel-clip)">
            <rect x="693.25" y="294.5" width="1.5" height="8" fill="#FFF" opacity="0.4"/>
            <rect x="707.25" y="294.5" width="1.5" height="14" fill="#FFF" opacity="0.85"/>
            <text x="708.00" y="322.5" font-size="9.5" class="m sb" fill="#FFF" opacity="0.85" text-anchor="middle">1/125</text>
            <rect x="721.25" y="294.5" width="1.5" height="8" fill="#FFF" opacity="0.4"/>
            <rect x="735.25" y="294.5" width="1.5" height="8" fill="#FFF" opacity="0.4"/>
            <rect x="749.25" y="294.5" width="1.5" height="14" fill="#FFB340" opacity="1"/>
            <text x="750.00" y="322.5" font-size="9.5" class="m sb" fill="#FFB340" opacity="1" text-anchor="middle">1/60</text>
            <rect x="763.25" y="294.5" width="1.5" height="8" fill="#FFF" opacity="0.4"/>
            <rect x="777.25" y="294.5" width="1.5" height="8" fill="#FFF" opacity="0.4"/>
            <rect x="791.25" y="294.5" width="1.5" height="14" fill="#FFF" opacity="0.85"/>
            <text x="792.00" y="322.5" font-size="9.5" class="m sb" fill="#FFF" opacity="0.85" text-anchor="middle">1/30</text>
            <rect x="805.25" y="294.5" width="1.5" height="8" fill="#FFF" opacity="0.4"/>
          </g>
          <rect x="662" y="288.5" width="32" height="44" rx="10" fill="url(#fadeL)"/><rect x="806" y="288.5" width="32" height="44" rx="10" fill="url(#fadeR)"/>
          <rect x="749" y="290.5" width="2" height="20" rx="1" fill="#FFB340"/>
        </g>

        <text x="598" y="365.5" font-size="10" class="b" fill="#FFF" opacity="0.45" letter-spacing="0.8">ISO</text>
        <g id="iso-wheel">
          <rect x="662" y="340.5" width="176" height="44" rx="10" fill="#2B2B2E" opacity="0.9"/>
          <g clip-path="url(#iso-wheel-clip)">
            <rect x="693.25" y="346.5" width="1.5" height="8" fill="#FFF" opacity="0.4"/>
            <rect x="707.25" y="346.5" width="1.5" height="14" fill="#FFF" opacity="0.85"/>
            <text x="708.00" y="374.5" font-size="9.5" class="m sb" fill="#FFF" opacity="0.85" text-anchor="middle">100</text>
            <rect x="721.25" y="346.5" width="1.5" height="8" fill="#FFF" opacity="0.4"/>
            <rect x="735.25" y="346.5" width="1.5" height="8" fill="#FFF" opacity="0.4"/>
            <rect x="749.25" y="346.5" width="1.5" height="14" fill="#FFB340" opacity="1"/>
            <text x="750.00" y="374.5" font-size="9.5" class="m sb" fill="#FFB340" opacity="1" text-anchor="middle">200</text>
            <rect x="763.25" y="346.5" width="1.5" height="8" fill="#FFF" opacity="0.4"/>
            <rect x="777.25" y="346.5" width="1.5" height="8" fill="#FFF" opacity="0.4"/>
            <rect x="791.25" y="346.5" width="1.5" height="14" fill="#FFF" opacity="0.85"/>
            <text x="792.00" y="374.5" font-size="9.5" class="m sb" fill="#FFF" opacity="0.85" text-anchor="middle">400</text>
            <rect x="805.25" y="346.5" width="1.5" height="8" fill="#FFF" opacity="0.4"/>
          </g>
          <rect x="662" y="340.5" width="32" height="44" rx="10" fill="url(#fadeL)"/><rect x="806" y="340.5" width="32" height="44" rx="10" fill="url(#fadeR)"/>
          <rect x="749" y="342.5" width="2" height="20" rx="1" fill="#FFB340"/>
        </g>
      </g>

      <!-- hardware -->
      <rect x="11" y="134.5" width="36" height="124" rx="18" fill="#000" stroke="#2A2A2E" stroke-width="1"/>
      <rect x="359" y="380" width="134" height="5" rx="2.5" fill="#FFF" opacity="0.4"/>
    </g>
  </g>

  <text x="450" y="450" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Capture — Photo (manual exposure) · landscape · 852×393 pt</text>
  <text x="450" y="468" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/CaptureView.swift — landscapeClusterReadout · App/CaptureDials.swift — PhotoExposureWheels</text>
</svg>
