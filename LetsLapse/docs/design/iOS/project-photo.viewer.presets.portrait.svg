<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Interval grading viewer · Presets · portrait</title>
  <desc>Mirrors App/PhotoAdjustmentsPanel.swift's Presets group (`presetsContent` .phone, `presetTiles`, `presetsFooter`) with App/EditorControls/PresetTile.swift (.phone), PresetThumbnails.swift (`PresetThumbnailCache`, `EditorPresetThumbnail`) and App/PresetState.swift's `PresetStatePill`, inside App/PhotoViewerView.swift's `phoneEditorBody` (`presetsContext`, `request(_:)`, `isNamingPreset`). New 2026-09-13 for the editor controls redesign (board 2a's Presets panel, spec §9). The preset chip strip that used to head the control stack is now the Presets group's own sheet. LAYOUT (2a / 6a, `phoneEditorBody`): the picture fills the safe area (59 top / 34 bottom on this canvas) and is fitted into it — a 3:4 portrait shoot spans the width and centres vertically, 176…700 — and everything else floats over it. `touchChrome`: the 36 pt back disc at (16, 71) and the `EditorTabPill` top-right (right 16, top 74: 12 pt of vertical padding under the safe area, the 30 pt pill centred on the 36 pt disc) — the boards draw both at top 60, the app sits them 11 pt lower. The pill is rgba(28,28,30,.85) over material, radius 18, 12 pt semibold, the selected tab amber with black text, the rest amber on ink; Frames appears only on a shoot with more than one frame. The foot (`phoneFoot`) is bottom-anchored on the safe area: the timeline card where `hasTimeline`, then EITHER the six main buttons (`EditorGroupBar(.phone)`) OR the open group's sheet (`PhotoAdjustmentsPanel(layout: .phone)`) — one or the other, the sheet needs the buttons' room. The sheet: 22 pt top corners, rgba(28,28,30,.86) over material running under the home indicator, padded 12 top / 16 sides / 0 bottom, 10 pt between rows, shadow up; header = title 15 pt semibold white · 6 pt dot (accent when the group holds a value or a travelling field, clear otherwise so the row never reflows) · spacer · ✕ 32 pt white 10 % (reverts to the snapshot `openPanel(for:)` took) · ✓ 32 pt amber (keeps and closes). Long-press the title for Reset &lt;group&gt; / Reset all adjustments. The 1:1 toggle (`zoomControls`, 32 pt black 45 %) sits bottom-trailing of the picture pane 12 pt in, lifted above the foot by its measured height; it exists only while `hasPixelsToReveal`, so a small source shows none. The readouts print the app's own formats (`%+.2f`, `%+.0f`, unsigned 0…100, Kelvin) with a real minus sign, U+2212, like the boards (`PhotoAdjustmentsPanel.minusSigned`, 2026-09-13). THIS CANVAS: the header reads 'Presets', then the state pill (`PresetStatePill`: 'Edited' in 12.5 pt semibold secondary on primary 8 %; a named preset would be amber with black text, 'Original' grey), then the dot — lit, because the project is not on Original. The strip: 76 pt tiles (radius 12, #111 placeholder until the render lands) 10 pt apart from x = 16, scrolling horizontally and bleeding edge to edge under the sheet's sides — Natural · Cinema · Matte · Vivid · Original (`PhotoPreset.strip`) then every saved preset (`CustomPresetStore`, long-press → Delete preset) — each with its name 11 pt semibold #8E8E93 5 pt under. Every tile shows the frame under the playhead rendered through that preset ALONE (a built-in at neutral adjustments, a saved preset as the whole grade it is, the geometry in hand left out) at 160 px on the grading lane, cached by preset + adjustments + frame, refreshed on open and on gesture end, never per tick — the tap's honest preview, since tapping a built-in REPLACES the edits (settled 2026-09-13; spec §9 first asked for 'this preset + my edits'). The applied preset takes a 2.5 pt amber ring inside its edge and an amber caption — and so does the BASE preset while the state is Edited (settled 2026-09-13, board 2a's rule: `EditorPresetsContext.basePreset`, ringed when `presetState.isEdited` and the tile is that preset; Original rings only while `isOriginal`), so here Natural is ringed under the 'Edited' pill. Under the strip `presetsFooter`: the owner's Lightroom import card where a sidecar exists, then EITHER the owner's inline 'Save these edits as a preset?' offer OR 'Save as Preset' (square.and.arrow.down + 13 pt semibold amber, leading), never both (2026-09-13); on the phone the editor owns its exit, so the offer is the exit-time overlay and the row is what shows here — the board draws none of these (⚠️). A tile tap goes through `request(_:)`, which may confirm first; Original clears the timeline with everything else. Staged by LL_EDITOR=latest LL_VIEWER=1 LL_KEYFRAMES=sunset LL_SECTIONS=presets (the sim library has no saved presets, so the strip ends at Original, clipped by the screen edge).</desc>
