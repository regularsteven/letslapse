<rect x="114" y="605.7" width="5.5" height="47.2" fill="#C9A36A" opacity="0.35"/>
<rect x="134.4" y="605.7" width="5.5" height="47.2" fill="#C9A36A" opacity="0.35"/>
<rect x="0" y="595.2" width="393" height="104.8" fill="#000" opacity="0.18"/>
</g>
<g id="touch-chrome"><!-- touchChrome: back disc leading, tab pill trailing, 16/12 padding under the safe area -->
