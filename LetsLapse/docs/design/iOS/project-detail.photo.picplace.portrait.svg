<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Project detail (photo) · portrait</title>
  <desc>Mirrors App/ProjectDetailView.swift with the PICPLACE section (PicPlaceStatusCard, planned) — the photo detail of project-detail.photo.portrait.svg drawn with Blend Off (no Burst frames card) and the PicPlace card in the seat that card would take: after Save to Photos / Share, before Rename · Storage · Delete…. The card is one of six states, drawn once each as components/picplace-status.&lt;state&gt;.phone.svg; this mirror shows SYNCING — the amber bar, "127 of 341 files · 1.8 MB of 4.9 MB", Cancel. Tapping Sync to PicPlace on a not-synced or changed project claims the project on the server, uploads project.json as the manifest, then negotiates every file under the project folder in batches, PUTs them straight to object storage with the returned presigned URLs, confirms them, posts this device's presence and releases the claim; the card follows each step. The same card, at 302pt, sits in the Mac Gallery item inspector (macOS/gallery.item.picplace.svg). Interval and video details take the card in the same seat, unchanged. Signed out, the card offers Sign in itself, so a project screen never dead-ends in Settings.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
    <linearGradient id="falls" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26303C"/><stop offset="1" stop-color="#141A22"/></linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- inline nav bar -->
      <g id="nav-bar">
        <path d="M22 76 l-9 10 9 10" stroke="#C36A00" stroke-width="2.6" fill="none" stroke-linecap="round" data-symbol="chevron.backward"/>
        <text x="30" y="91" font-size="17" fill="#C36A00">Projects</text>
        <text x="196.5" y="91" font-size="17" class="sb" fill="#000" text-anchor="middle">Long exposure — falls</text>
        <g data-symbol="ellipsis.circle">
          <circle cx="367" cy="86" r="11" fill="none" stroke="#C36A00" stroke-width="1.8"/>
          <circle cx="361.5" cy="86" r="1.6" fill="#C36A00"/><circle cx="367" cy="86" r="1.6" fill="#C36A00"/><circle cx="372.5" cy="86" r="1.6" fill="#C36A00"/>
        </g>
      </g>

      <!-- graded photo card -->
      <g id="photo-grading-card">
        <rect x="16" y="112" width="361" height="210" rx="18" fill="url(#falls)"/>
        <polygon points="16,150 90,128 130,148 196,120 270,150 340,126 377,142 377,322 16,322" fill="#1C242E"/>
        <rect x="168" y="150" width="56" height="150" rx="6" fill="#E9F1F7" opacity="0.5"/>
        <rect x="176" y="150" width="12" height="150" fill="#FFF" opacity="0.45"/>
        <rect x="202" y="150" width="8" height="150" fill="#FFF" opacity="0.3"/>
        <ellipse cx="196" cy="304" rx="120" ry="16" fill="#DAE7F0" opacity="0.3"/>
        <circle cx="196.5" cy="217" r="26" fill="#000" opacity="0.45"/>
        <g data-symbol="arrow.up.left.and.arrow.down.right" stroke="#FFF" stroke-width="2.2" fill="none" stroke-linecap="round">
          <path d="M188 209 l-5 -5 m0 5.5 v-5.5 h5.5 M205 226 l5 5 m0 -5.5 v5.5 h-5.5"/>
        </g>
        <rect x="28" y="124" width="66" height="22" rx="11" fill="#000" opacity="0.5"/>
        <text x="61" y="139" font-size="11.5" class="sb" fill="#FFF" text-anchor="middle">PHOTO</text>
        <!-- the edit affordance every hero carries, one label for every mode -->
        <g id="edit-pill">
          <rect x="28" y="284" width="68" height="26" rx="13" fill="#000" opacity="0.45"/>
          <g data-symbol="slider.horizontal.3" stroke="#FFF" stroke-width="1.7" stroke-linecap="round">
            <path d="M40 292 h14 M40 297 h14 M40 302 h14"/>
            <circle cx="50" cy="292" r="2.1" fill="#FFF" stroke="none"/>
            <circle cx="45" cy="297" r="2.1" fill="#FFF" stroke="none"/>
            <circle cx="52" cy="302" r="2.1" fill="#FFF" stroke="none"/>
          </g>
          <text x="61" y="301" font-size="12.5" class="sb" fill="#FFF">Edit</text>
        </g>
      </g>

      <!-- preset strip -->
      <g id="preset-strip">
        <rect x="16" y="334" width="74" height="33" rx="16.5" fill="#C36A00"/>
        <text x="53" y="355" font-size="13.5" class="sb" fill="#FFF" text-anchor="middle">Natural</text>
        <rect x="98" y="334" width="72" height="33" rx="16.5" fill="#FFF" filter="url(#soft)"/>
        <text x="134" y="355" font-size="13.5" class="sb" fill="#000" text-anchor="middle">Cinema</text>
        <rect x="178" y="334" width="64" height="33" rx="16.5" fill="#FFF" filter="url(#soft)"/>
        <text x="210" y="355" font-size="13.5" class="sb" fill="#000" text-anchor="middle">Matte</text>
        <rect x="250" y="334" width="60" height="33" rx="16.5" fill="#FFF" filter="url(#soft)"/>
        <text x="280" y="355" font-size="13.5" class="sb" fill="#000" text-anchor="middle">Vivid</text>
        <rect x="318" y="334" width="76" height="33" rx="16.5" fill="#FFF" filter="url(#soft)"/>
        <text x="356" y="355" font-size="13.5" class="sb" fill="#000" text-anchor="middle">Original</text>
      </g>

      <!-- photo actions -->
      <g id="photo-actions">
        <rect x="16" y="383" width="175.5" height="50" rx="14" fill="#C36A00"/>
        <text x="103.75" y="413" font-size="15" class="b" fill="#FFF" text-anchor="middle">Save to Photos</text>
        <rect x="201.5" y="383" width="175.5" height="50" rx="14" fill="#FFF" filter="url(#soft)"/>
        <text x="289.25" y="413" font-size="15.5" class="b" fill="#C36A00" text-anchor="middle">Share</text>
      </g>

      <!-- PICPLACE — the project's copy on the user's PicPlace account (components/picplace-status.*.phone.svg).
           Sits where BURST FRAMES sits on a blended shot: after the actions, before the management card; on a
           blended shot it follows the Burst frames card. The screen draws the white card at the component's height
           (56 · 76 · 96 by state) and the header above it; this file shows SYNCING (76pt) — the other five states are
           the component files. Only the management card moves: 471 + 76 + 14 = 561 (581 under the 96pt burst card). -->
      <text x="20" y="462" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">PICPLACE</text>
      <g id="picplace-card">
        <rect x="16" y="471" width="361" height="76" rx="16" fill="#FFF" filter="url(#soft)"/>
        <image href="../components/picplace-status.syncing.phone.svg" x="16" y="471" width="361" height="76"/>
      </g>

      <!-- management card -->
      <g id="management-card">
        <rect x="16" y="561" width="361" height="140" rx="16" fill="#FFF" filter="url(#soft)"/>
        <text x="32" y="589" font-size="16" fill="#000">Rename</text>
        <path d="M363 577 l6 7 -6 7" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <line x1="32" y1="605" x2="377" y2="605" stroke="#000" stroke-opacity="0.08"/>
        <text x="32" y="630" font-size="16" fill="#000">Storage</text>
        <text x="32" y="645" font-size="11.5" fill="#6D6D72">photo + burst frames</text>
        <text x="361" y="634" font-size="14" fill="#6D6D72" text-anchor="end">48 MB</text>
        <line x1="32" y1="657" x2="377" y2="657" stroke="#000" stroke-opacity="0.08"/>
        <text x="32" y="683" font-size="16" fill="#FF3B30">Delete…</text>
      </g>

      <!-- floating tab bar (Projects selected) -->
      <g id="tab-bar">
        <rect x="17.5" y="755" width="358" height="57" rx="28.5" fill="#FBFBFD" opacity="0.96" filter="url(#soft)"/>
        <rect x="17.5" y="755" width="358" height="57" rx="28.5" fill="none" stroke="#000" stroke-opacity="0.08"/>
        <g id="tab-create" fill="none" stroke="#8E8E93">
          <g transform="translate(56.5 776) scale(0.7727) translate(-11 -11)"><circle cx="11" cy="11" r="8" stroke-width="2.2" data-symbol="record.circle"/><circle cx="11" cy="11" r="3.4" fill="#8E8E93" stroke="none"/></g>
          <text x="56.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Create</text>
        </g>
        <g id="tab-gallery" fill="none" stroke="#8E8E93">
          <g transform="translate(126.5 776) scale(0.7727) translate(-11 -11)"><rect x="3" y="5.5" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(-6 10 10.5)" data-symbol="photo.on.rectangle.angled"/><rect x="6" y="8" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(4 13 13)"/></g>
          <text x="126.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Gallery</text>
        </g>
        <rect x="163.5" y="761" width="66" height="45" rx="22.5" fill="#C36A00" opacity="0.12"/>
        <g id="tab-projects" fill="none" stroke="#C36A00">
          <g transform="translate(196.5 776) scale(0.7727) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="square.stack"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="196.5" y="800" font-size="10.5" class="sb" fill="#C36A00" stroke="none" text-anchor="middle">Projects</text>
        </g>
        <g id="tab-collections" fill="none" stroke="#8E8E93">
          <g transform="translate(266.5 776) scale(0.7727) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="film.stack"/><path d="M7 4.5 v8 M15 4.5 v8" stroke-width="1.38" opacity="0.7"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="266.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Collections</text>
        </g>
        <g id="tab-settings" fill="none" stroke="#8E8E93">
          <g transform="translate(336.5 776) scale(0.7727) translate(-11 -11)"><path d="M3.5 6.5 h15 M3.5 11 h15 M3.5 15.5 h15" stroke-width="2.48" stroke-linecap="round" data-symbol="line.3.horizontal"/></g>
          <text x="336.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Settings</text>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Project detail (photo) · PicPlace card, syncing · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/ProjectDetailView.swift — GradingCard · presetStrip · photoActions · PicPlaceStatusCard (planned) · managementCard</text>
</svg>
