<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Collection detail (timeline builder) · portrait</title>
  <desc>Mirrors App/CollectionDetailView.swift (portraitLayout, previewSurface, canvasRatioMenu, timelineCard, clipRow): the timeline builder at rest, initial scroll, Ken Burns off. Native inline nav (back chevron, collection name, ⋯ menu: Rename collection / Delete collection…). The preview IS the crop surface: the SELECTED clip fills its own shape (16:9 → 361×203 at x16), a black-on-media badge "Tram Tester · 50×" top-left, a 44pt play circle when the clip matches the canvas. Under it ONE row replaces the retired CANVAS chips section (2026-08-30 up-the-fold rework): the caption left-aligned ("This clip matches the 16:9 canvas — nothing to crop.") and the compact canvas menu chip right (h34 white capsule, accent ratio + chevron.down — the Adjust flow's collapsed-chip pattern). Its menu rows carry each ratio's consequence with a checkmark on the current choice: "16:9 — 3840×2160 · the first clip's shape", "9:16 — 2160×3840", "1:1 — 2160×2160", "4:3 — 2880×2160", "3:4 — 2160×2880". The chip is hidden while the collection is empty — the caption then reads "Add a clip — the first one sets the canvas." TIMELINE · 3 CLIPS sits directly under that row, so the select-a-row → frame-it loop shares one screen: 66pt rows in one card — 58×42 r7 thumb with play glyph, project title 14.5 semibold, sub "50× · 11s of 15s" with TRIMMED badge (amber 28%, accentDeep text) when in/out set; round 34pt trim button (accent 10%); drag grip (line.3.horizontal) reorders. A row swipes left to reveal a 72pt red trash action (SwipeToDelete.swift, claimsDrag false so a drag starting on the grip still reorders) — removal is recipe-only, no confirmation, toasts "Removed from the timeline — the clip stays in its project". Selected row tinted accent 7%. Below: dashed "+ Add clips" (52pt, opens the picker sheet), then the Ken Burns card — toggle off at rest ("A gentle zoom and pan across every clip on export"), placed BELOW the timeline on purpose: its options are set once per collection, the rows above are the working loop. Ken Burns on: collection-detail.kenburns.portrait.svg. Below the fold: dark summary card, "Export collection" CTA, last-export row (drawn in collection-detail.crop.portrait.svg); bottom clearance 140pt for the floating tab bar. Crop state: collection-detail.crop.portrait.svg. Wide layout: collection-detail.landscape.svg.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.05"/></filter>
    <linearGradient id="clipA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33415A"/><stop offset="1" stop-color="#1B2330"/></linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- inline nav: back · title · ⋯ (one row — the phantom More bar is dead, App/LetsLapseApp.swift hiddenMoreNavigationBar) -->
      <g id="nav">
        <circle cx="38" cy="84" r="17" fill="#FFF" filter="url(#card)"/>
        <path d="M42 76 l-8 8 8 8" stroke="#1C1C1E" stroke-width="2.6" fill="none" stroke-linecap="round" data-symbol="chevron.left"/>
        <text x="196.5" y="90" font-size="17" class="sb" fill="#000" text-anchor="middle">Harbour reel</text>
        <circle cx="355" cy="84" r="17" fill="#FFF" filter="url(#card)"/>
        <g stroke="#C36A00" fill="#C36A00" data-symbol="ellipsis.circle"><circle cx="355" cy="84" r="10" fill="none" stroke-width="1.8"/><circle cx="350" cy="84" r="1.4" stroke="none"/><circle cx="355" cy="84" r="1.4" stroke="none"/><circle cx="360" cy="84" r="1.4" stroke="none"/></g>
      </g>

      <!-- preview: the selected clip at its own shape (16:9 matches the canvas) -->
      <g id="preview">
        <rect x="16" y="115" width="361" height="203" rx="12" fill="url(#clipA)"/>
        <rect x="26" y="125" width="118" height="19" rx="9.5" fill="#000" opacity="0.5"/>
        <text x="85" y="138" font-size="10.5" class="sb" fill="#FFF" text-anchor="middle">Tram Tester · 50×</text>
        <circle cx="196.5" cy="216.5" r="22" fill="#000" opacity="0.45"/>
        <path d="M191 208.5 l15 8 -15 8 z" fill="#FFF" data-symbol="play.fill"/>
      </g>

      <!-- caption (left) + canvas menu chip (right) — the row the CANVAS section became -->
      <g id="caption-row">
        <text x="18" y="338" font-size="11.5" class="sec">This clip matches the 16:9 canvas — nothing</text>
        <text x="18" y="353" font-size="11.5" class="sec">to crop.</text>
        <g id="canvas-menu">
          <rect x="309" y="326" width="66" height="34" rx="17" fill="#FFF" filter="url(#card)"/>
          <text x="336" y="348" font-size="13.5" class="sb" fill="#C36A00" text-anchor="middle">16:9</text>
          <path d="M352 340.5 l4.5 4.5 4.5 -4.5" stroke="#C36A00" stroke-width="2" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
        </g>
      </g>

      <!-- TIMELINE -->
      <g id="timeline">
        <text x="20" y="387" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">TIMELINE · 3 CLIPS</text>
        <rect x="16" y="399" width="361" height="198" rx="16" fill="#FFF" filter="url(#card)"/>

        <!-- row 1 (selected · trimmed) -->
        <g id="row-1">
          <rect x="16" y="399" width="361" height="66" rx="12" fill="#C36A00" opacity="0.07"/>
          <rect x="28" y="411" width="58" height="42" rx="7" fill="url(#clipA)"/>
          <path d="M53 426 l9 6 -9 6 z" fill="#FFF" opacity="0.8" data-symbol="play.fill"/>
          <text x="96" y="427" font-size="14.5" class="sb" fill="#000">Tram Tester</text>
          <text x="96" y="446" font-size="11.5" class="sec">50× · 11s of 15s</text>
          <rect x="188" y="435" width="58" height="14" rx="7" fill="#FFB340" opacity="0.28"/>
          <text x="217" y="445" font-size="9.5" class="b" fill="#8A4A00" text-anchor="middle">TRIMMED</text>
          <circle cx="322" cy="432" r="17" fill="#C36A00" opacity="0.1"/>
          <g stroke="#C36A00" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="timeline.selection"><path d="M316 425 h-2 v14 h2 M328 425 h2 v14 h-2"/><path d="M319 432 h6"/></g>
          <path d="M352 426 h16 M352 432 h16 M352 438 h16" stroke="#B9B9BE" stroke-width="1.8" stroke-linecap="round" data-symbol="line.3.horizontal"/>
        </g>
        <line x1="96" y1="465" x2="377" y2="465" stroke="#000" stroke-opacity="0.06"/>

        <!-- row 2 -->
        <g id="row-2">
          <rect x="28" y="477" width="58" height="42" rx="7" fill="url(#clipA)"/>
          <path d="M53 492 l9 6 -9 6 z" fill="#FFF" opacity="0.8"/>
          <text x="96" y="493" font-size="14.5" class="sb" fill="#000">Tram Tester</text>
          <text x="96" y="512" font-size="11.5" class="sec">50× · 15s</text>
          <circle cx="322" cy="498" r="17" fill="#C36A00" opacity="0.1"/>
          <g stroke="#C36A00" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M316 491 h-2 v14 h2 M328 491 h2 v14 h-2"/><path d="M319 498 h6"/></g>
          <path d="M352 492 h16 M352 498 h16 M352 504 h16" stroke="#B9B9BE" stroke-width="1.8" stroke-linecap="round"/>
        </g>
        <line x1="96" y1="531" x2="377" y2="531" stroke="#000" stroke-opacity="0.06"/>

        <!-- row 3 -->
        <g id="row-3">
          <rect x="28" y="543" width="58" height="42" rx="7" fill="url(#clipA)"/>
          <path d="M53 558 l9 6 -9 6 z" fill="#FFF" opacity="0.8"/>
          <text x="96" y="559" font-size="14.5" class="sb" fill="#000">Tram Tester</text>
          <text x="96" y="578" font-size="11.5" class="sec">50× · 15s</text>
          <circle cx="322" cy="564" r="17" fill="#C36A00" opacity="0.1"/>
          <g stroke="#C36A00" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M316 557 h-2 v14 h2 M328 557 h2 v14 h-2"/><path d="M319 564 h6"/></g>
          <path d="M352 558 h16 M352 564 h16 M352 570 h16" stroke="#B9B9BE" stroke-width="1.8" stroke-linecap="round"/>
        </g>
      </g>

      <!-- add clips (dashed) -->
      <g id="add-clips">
        <rect x="16" y="609" width="361" height="52" rx="14" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="5 4"/>
        <path d="M158 640 v-10 M153 635 h10" stroke="#C36A00" stroke-width="2.2" stroke-linecap="round" data-symbol="plus"/>
        <text x="172" y="645" font-size="15" class="sb" fill="#C36A00">Add clips</text>
      </g>

      <!-- Ken Burns (off at rest) — below the timeline: set once, not the loop -->
      <g id="ken-burns">
        <rect x="16" y="673" width="361" height="70" rx="16" fill="#FFF" filter="url(#card)"/>
        <text x="30" y="696" font-size="14.5" class="sb" fill="#000">Ken Burns</text>
        <text x="30" y="712" font-size="11.5" class="sec">A gentle zoom and pan across every clip</text>
        <text x="30" y="727" font-size="11.5" class="sec">on export</text>
        <rect x="312" y="693" width="51" height="31" rx="15.5" fill="#E9E9EA"/>
        <circle cx="327.5" cy="708.5" r="13.5" fill="#FFF" filter="url(#card)"/>
      </g>

      <!-- floating tab bar (Collections selected; shown over pushed screens too) -->
      <g id="tab-bar">
        <rect x="17.5" y="755" width="358" height="57" rx="28.5" fill="#FBFBFD" opacity="0.96" filter="url(#soft)"/>
        <rect x="17.5" y="755" width="358" height="57" rx="28.5" fill="none" stroke="#000" stroke-opacity="0.08"/>
        <g id="tab-create" fill="none" stroke="#8E8E93">
          <g transform="translate(56.5 776) scale(0.7727) translate(-11 -11)"><circle cx="11" cy="11" r="8" stroke-width="2.2" data-symbol="record.circle"/><circle cx="11" cy="11" r="3.4" fill="#8E8E93" stroke="none"/></g>
          <text x="56.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Create</text>
        </g>
        <g id="tab-gallery" fill="none" stroke="#8E8E93">
          <g transform="translate(126.5 776) scale(0.7727) translate(-11 -11)"><rect x="3" y="5.5" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(-6 10 10.5)" data-symbol="photo.on.rectangle.angled"/><rect x="6" y="8" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(4 13 13)"/></g>
          <text x="126.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Gallery</text>
        </g>
        <g id="tab-projects" fill="none" stroke="#8E8E93">
          <g transform="translate(196.5 776) scale(0.7727) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="square.stack"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="196.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Projects</text>
        </g>
        <g id="tab-collections" fill="none" stroke="#8E8E93">
          <g transform="translate(266.5 776) scale(0.7727) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="film.stack"/><path d="M7 4.5 v8 M15 4.5 v8" stroke-width="1.38" opacity="0.7"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="266.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Collections</text>
        </g>
        <g id="tab-settings" fill="none" stroke="#8E8E93">
          <g transform="translate(336.5 776) scale(0.7727) translate(-11 -11)"><path d="M3.5 6.5 h15 M3.5 11 h15 M3.5 15.5 h15" stroke-width="2.48" stroke-linecap="round" data-symbol="line.3.horizontal"/></g>
          <text x="336.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Settings</text>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Collection detail (timeline builder) · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/CollectionDetailView.swift — caption + canvas menu · clip rows (trim · reorder) · Ken Burns below the timeline</text>
</svg>
