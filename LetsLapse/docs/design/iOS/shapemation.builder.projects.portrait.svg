<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Shape-mation · builder · projects · portrait</title>
  <desc>Mirrors App/Shapemation/ShapemationBuilderView.swift (ShapemationProjectsView + ShapemationProjectRow + ShapeOverlayThumbnail, step 2 of the shape-slideshow builder) over ShapemationBuilder. 2026-09-11, code first, mirrored from the running app. Pushed from the family step (shapemation.builder.family.portrait.svg) inside the Shape-mation sheet: back chevron + "Shape slideshow" in accent, large title "Circles" (the family's title, pluralised), then the count line "5 of 5 picked" (13 secondary) and a LazyVStack of white llCards (radius 14, spacing 10, padding 12), one per project whose register holds at least one instance of the family, in capture order. Each row: the project's representative picture on the leading side, fitted into a 96×96 frame (so a 3:4 portrait is 72×96, a 4:3 landscape 96×72) with every instance of the family traced over it — white at 85% (1.5 pt), the picked instance in amber (2.5 pt); then the title (15 semibold, one line), "1 circle · Photo" (12 secondary — instance count · capture mode) and "519 px across" (12 tertiary — the largest instance's native diameter); a Spacer; and the pick mark, checkmark.circle.fill (22, accent) when picked or circle (22, secondary at 50%) when not. Tapping anywhere on the row toggles it. INSTANCE PILLS — when a picked project holds SEVERAL instances of the family, the "px across" line is replaced by a row of capsules, one per instance, "1 · 519 px", "2 · 312 px" … (11 medium, 8×4 padding, spacing 6; the chosen instance accent-filled with white text, the rest secondary at 15% with primary text); tapping one makes it the instance the slideshow locks on. An unpicked multi-instance project shows the plain "px across" line. None of the 2026-09-11 circle projects holds more than one, so no pill is drawn here. Bottom: a safeAreaInset bar over .regularMaterial (drawn flat, 92% opaque) — "Clear" when everything is picked, otherwise "Pick all" (17, accent, leading) and the "Next · mode" NavigationLink (15 semibold, 18×10 padding, borderedProminent in accent, radius ~10) to ShapemationBuildStep.mode(family); it is DISABLED until at least two projects are picked (near-white #F8F8F7 fill, #C6C6C8 label). DRAWN STATE: everything picked — "5 of 5 picked", amber rings, accent check marks, "Clear", Next live. The unpicked state (ios-shapemation-build-projects.png) is the same layout with "0 of 5 picked", white rings on the pictures, grey ring marks, "Pick all" and the greyed Next. The fifth project's card starts at y 728 and lies under the bar until the list scrolls; its copy is not visible in the screenshot, so it is drawn as a bare card. Sample data is the 2026-09-11 library: Photo 9. 9. at 09:26 (a street traffic light, 519 px), Photo 9. 9. at 09:26 (the Gros-Horloge dial, 1 350 px), Photo 9. 9. at 10:07 (a museum façade clock, landscape, 530 px), Photo 9. 9. at 17:15 (a no-parking sign, 879 px). Pictures are flat placeholders. Measured from an iPhone 16 Pro screenshot (402×874 pt) and re-anchored to this 393×852 canvas: leading/top positions as measured, the pick marks 9 pt further left, the bottom bar 22 pt higher.</desc>
