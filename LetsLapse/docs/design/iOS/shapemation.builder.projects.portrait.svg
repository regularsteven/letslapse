      <path d="M-5.2 0.6 L-1.6 4.2 L5.4 -3.8" stroke="#FFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}.ter{fill:#C4C4C7}</style>

