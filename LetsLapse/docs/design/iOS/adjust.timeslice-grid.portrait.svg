<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Adjust — Time slicing, one Grid slice · portrait</title>
  <desc>Mirrors the `timeSlicingSection` of App/AdjustView.swift with ONE slice armed and Shape = Grid (2026-09-02), drawn scrolled so the card top meets the header. Grid is a first-class shape now — picking it seats a `TimeSliceGrid` (Top-left origin, Manhattan wavefront) on the recipe, and the Time-starts row gives way to SWEEPS FROM: a 2×2 of chips in the corners' own arrangement (Top left · Top right / Bottom left · Bottom right), the chosen corner ink with amber text, naming the cell that holds the newest moment. The wavefront metric (Stepped = Manhattan / Radial = Euclidean) is no longer a control; a recipe re-opened from a Radial batch member keeps its metric silently. Segments reads Columns in its Custom stepper here; the readout resolves the grid against the frame — "Ready — 24 × 14 grid" for 1920×1080 at 24 columns. With a batch (count 4/8) and Shape = Grid, this same corner picker pins every take's origin (`lockOrigin`), the metric alternating so no two grids read the same. Sample: the 184-photo harbour-dusk shoot, 24 columns, 25% spread — `LL_ADJUST=stills` + `LL_TIMESLICE="segs:24,lag:2,grid:topLeft"`.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="chip" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.1"/></filter>
    <filter id="knob" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.2"/></filter>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- flow header -->
      <g id="flow-header">
        <circle cx="33" cy="88" r="17" fill="#FFF" filter="url(#soft)"/>
        <path d="M37 80 l-8 8 8 8" stroke="#C36A00" stroke-width="2.4" fill="none" stroke-linecap="round" data-symbol="chevron.left"/>
        <text x="196.5" y="93" font-size="16" class="sb" fill="#000" text-anchor="middle">New blended clip</text>
      </g>

      <!-- Time slicing card, one Grid slice -->
      <g id="time-slicing-card">
        <rect x="16" y="116" width="361" height="570" rx="16" fill="#FFF" filter="url(#soft)"/>

        <g id="header-row">
          <text x="32" y="148" font-size="15.5" fill="#000">Time slicing</text>
          <text x="32" y="164" font-size="11.5" fill="#6D6D72">Grid</text>
          <g id="count-segment" data-symbol="LLInkSegment">
            <rect x="211" y="134" width="158" height="33" rx="9" fill="#E9E9EB"/>
            <rect x="252" y="136" width="37" height="29" rx="7" fill="#1C1C1E"/>
            <g font-size="14" class="b" text-anchor="middle">
              <text x="231.5" y="155.5" fill="#000">0</text>
              <text x="270.5" y="155.5" fill="#FFB340">1</text>
              <text x="309.5" y="155.5" fill="#000">4</text>
              <text x="348.5" y="155.5" fill="#000">8</text>
            </g>
          </g>
        </g>
        <line x1="32" y1="185" x2="361" y2="185" stroke="#000" stroke-opacity="0.09"/>

        <g id="shape">
          <text x="32" y="215" font-size="14" fill="#000">Shape</text>
          <rect x="32" y="227" width="329" height="31" rx="8" fill="#E9E9EB"/>
          <rect x="250.5" y="229" width="108.5" height="27" rx="7" fill="#FFF" filter="url(#knob)"/>
          <g font-size="13" fill="#000" text-anchor="middle">
            <text x="86" y="247">Vertical</text>
            <text x="196.5" y="247">Horizontal</text>
            <text x="307" y="247" class="sb">Grid</text>
          </g>
        </g>

        <g id="sweeps-from">
          <text x="32" y="287" font-size="14" fill="#000">Sweeps from</text>
          <g font-size="12.5" class="b" text-anchor="middle">
            <rect x="32" y="299" width="161.5" height="36" rx="12" fill="#1C1C1E"/><text x="112.75" y="321.5" fill="#FFB340">Top left</text>
            <rect x="199.5" y="299" width="161.5" height="36" rx="12" fill="#FFF" filter="url(#chip)"/><text x="280.25" y="321.5" fill="#000">Top right</text>
            <rect x="32" y="341" width="161.5" height="36" rx="12" fill="#FFF" filter="url(#chip)"/><text x="112.75" y="363.5" fill="#000">Bottom left</text>
            <rect x="199.5" y="341" width="161.5" height="36" rx="12" fill="#FFF" filter="url(#chip)"/><text x="280.25" y="363.5" fill="#000">Bottom right</text>
          </g>
        </g>

        <g id="segments">
          <text x="32" y="410" font-size="14" fill="#000">Segments</text>
          <rect x="32" y="422" width="329" height="31" rx="8" fill="#E9E9EB"/>
          <rect x="34" y="424" width="81.25" height="27" rx="7" fill="#FFF" filter="url(#knob)"/>
          <g font-size="13" fill="#000" text-anchor="middle">
            <text x="74.5" y="442" class="sb">Fine</text>
            <text x="155.5" y="442">Medium</text>
            <text x="237.5" y="442">Bold</text>
            <text x="320" y="442">Custom</text>
          </g>
        </g>

        <g id="output">
          <text x="32" y="482" font-size="14" fill="#000">Output</text>
          <rect x="32" y="494" width="329" height="31" rx="8" fill="#E9E9EB"/>
          <rect x="250.5" y="496" width="108.5" height="27" rx="7" fill="#FFF" filter="url(#knob)"/>
          <g font-size="13" fill="#000" text-anchor="middle">
            <text x="86" y="514">Image</text>
            <text x="196.5" y="514">Animation</text>
            <text x="307" y="514" class="sb">Both</text>
          </g>
        </g>

        <g id="spread">
          <text x="32" y="554" font-size="14" fill="#000">Spread</text>
          <rect x="32" y="566" width="329" height="31" rx="8" fill="#E9E9EB"/>
          <rect x="115.25" y="568" width="81.25" height="27" rx="7" fill="#FFF" filter="url(#knob)"/>
          <g font-size="13" fill="#000" text-anchor="middle">
            <text x="73" y="586">Tight</text>
            <text x="155.5" y="586" class="sb">Medium</text>
            <text x="237.5" y="586">Wide</text>
            <text x="320" y="586">Custom</text>
          </g>
        </g>

        <g id="include-regular">
          <text x="32" y="633" font-size="14" fill="#000">Include regular timelapse</text>
          <g data-symbol="Toggle (on, accent)"><rect x="310" y="613" width="51" height="31" rx="15.5" fill="#C36A00"/><circle cx="345.5" cy="628.5" r="13.5" fill="#FFF" filter="url(#knob)"/></g>
        </g>

        <text id="readout" x="32" y="669" font-size="12" fill="#6D6D72">Ready — 24 × 14 grid</text>
      </g>

      <!-- bottom bar -->
      <g id="bottom-bar">
        <rect x="0" y="726" width="393" height="126" fill="#F2F2F7"/>
        <rect x="16" y="735" width="305" height="50" rx="14" fill="#C36A00"/>
        <text x="168.5" y="766" font-size="15" class="b" fill="#FFF" text-anchor="middle">Create 184-frame timelapse + slice</text>
        <rect x="329" y="735" width="48" height="50" rx="12" fill="#C36A00"/>
        <path d="M347 757 l6 -6.5 6 6.5" stroke="#FFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.up"/>
        <text x="16" y="806" font-size="11" fill="#6D6D72">Your original is kept — you can always make another…</text>
        <text x="377" y="806" font-size="11" class="sb" fill="#C36A00" text-anchor="end">+ Field note</text>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Adjust — Time slicing, one Grid slice · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/AdjustView.swift `timeSlicingSection` — Shape = Grid · Sweeps from corner chips (`timeSliceCornerGrid`) · Segments · Output · Spread · readout</text>
</svg>
