<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Adjust — Time slicing, a grid recipe re-opened · portrait</title>
  <desc>Mirrors the grid branch of `timeSlicingControls` in App/AdjustView.swift — the state a clip rendered as a Grid variation re-opens in ("New blended clip from these settings" rehydrates `BlendProject.timeSlice`, grid and variation stamp included). Grid mode is deliberately NOT offered as a fresh single-slice choice; it arrives through Variations, and this screen exists so a grid recipe can be re-edited rather than silently dropped. Two rows replace Horizontal bands and Time starts: SWEEPS FROM — the origin corner holding the newest cell, the point the wavefront travels away from (top left · top right · bottom left · bottom right) — and WAVEFRONT — Stepped (Manhattan: column + row, so every cell on an anti-diagonal shares a moment) or Radial (Euclidean: a curved front from the corner). Under them, "Use single-axis bands instead" clears the grid and returns the card to the banded controls. Segments is relabelled COLUMNS, because the user-facing count applies to the horizontal axis only and the row count is DERIVED from the shoot's aspect to keep cells square — the value line reads back what resolved against this clip ("24 × 14 of 160 px"), since that is not something the number alone tells you. Cells are exactly square: the cell side is the frame width divided by the column count, rounded up so the columns always cover the frame, and the overhang is split between the two outer cells of each axis, which crop — squareness wins over full coverage, but never at the price of an uncovered strip, which would be unwritten black rather than a crop. Cells under 8 px, or a frame that derives fewer than two rows, are refused in red (a stricter floor than the banded path's 2 px: a band is full-height in its other axis by definition, a cell is not). The spread arithmetic divides by the far corner's DISTANCE rather than by segments − 1, so the same 25% spread means the same thing in both modes. Everything below the divider is the batch, unchanged from adjust.timeslice.portrait.svg — shown here with Variations off, which is how a re-opened single grid clip arrives.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="knob" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.2"/></filter>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.mono{font-family:'SF Mono','Menlo',monospace}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- flow header -->
      <g id="flow-header">
        <circle cx="33" cy="88" r="17" fill="#FFF" filter="url(#soft)"/>
        <path d="M37 80 l-8 8 8 8" stroke="#C36A00" stroke-width="2.4" fill="none" stroke-linecap="round" data-symbol="chevron.left"/>
        <text x="196.5" y="93" font-size="16" class="sb" fill="#000" text-anchor="middle">New blended clip</text>
      </g>

      <!-- Time slicing card, grid recipe -->
      <g id="time-slicing-card">
        <rect x="16" y="116" width="361" height="490" rx="16" fill="#FFF" filter="url(#soft)"/>

        <g id="slicing-toggle-row">
          <g data-symbol="rectangle.split.3x1" fill="none" stroke="#C36A00" stroke-width="1.6">
            <rect x="32" y="133" width="18" height="13" rx="2"/>
            <path d="M38 133 v13 M44 133 v13"/>
          </g>
          <text x="60" y="141" font-size="15.5" fill="#000">Time slicing</text>
          <text x="60" y="155" font-size="10.5" class="mono" fill="#6D6D72">timeslice-grid-bl-manh-segs_24-lag_2-v2of4</text>
          <text x="336" y="146" font-size="12" fill="#8A4A00" text-anchor="end">On</text>
          <path d="M349 148 l6 -6.5 6 6.5" stroke="#A0A0A6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.up"/>
        </g>
        <line x1="32" y1="168" x2="361" y2="168" stroke="#000" stroke-opacity="0.09"/>

        <!-- grid-only rows -->
        <g id="sweeps-from">
          <text x="32" y="199" font-size="14" fill="#000">Sweeps from</text>
          <text x="345" y="199" font-size="13.5" fill="#C36A00" text-anchor="end">Bottom left</text>
          <path d="M354 191 l4 -4.5 4 4.5 M354 197 l4 4.5 4 -4.5" stroke="#C36A00" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.up.chevron.down"/>
        </g>

        <g id="wavefront">
          <text x="32" y="239" font-size="14" fill="#000">Wavefront</text>
          <rect x="161" y="221" width="200" height="28" rx="8" fill="#E9E9EB"/>
          <rect x="163" y="223" width="96" height="24" rx="7" fill="#FFF" filter="url(#knob)"/>
          <text x="211" y="239" font-size="12" class="sb" fill="#000" text-anchor="middle">Stepped</text>
          <text x="311" y="239" font-size="12" fill="#000" text-anchor="middle">Radial</text>
        </g>

        <text x="32" y="272" font-size="12" fill="#C36A00">Use single-axis bands instead</text>

        <g id="columns">
          <text x="32" y="305" font-size="14" fill="#000">Columns</text>
          <text x="273" y="305" font-size="11" class="mono" fill="#6D6D72" text-anchor="end">24 × 14 of 160 px</text>
          <rect x="283" y="287" width="94" height="28" rx="8" fill="#E9E9EB"/>
          <line x1="330" y1="289" x2="330" y2="313" stroke="#FFF" stroke-width="1.5"/>
          <path d="M300 301 h14" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M346 301 h14 M353 294 v14" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>
        </g>

        <g id="spread">
          <text x="32" y="345" font-size="14" fill="#000">Spread</text>
          <text x="273" y="345" font-size="11" class="mono" fill="#6D6D72" text-anchor="end">25% · lag 2 · ≈ 3.0 s</text>
          <rect x="283" y="327" width="94" height="28" rx="8" fill="#E9E9EB"/>
          <line x1="330" y1="329" x2="330" y2="353" stroke="#FFF" stroke-width="1.5"/>
          <path d="M300 341 h14" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M346 341 h14 M353 334 v14" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>
        </g>

        <g id="output">
          <text x="32" y="385" font-size="14" fill="#000">Output</text>
          <rect x="101" y="367" width="260" height="28" rx="8" fill="#E9E9EB"/>
          <rect x="275" y="369" width="84" height="24" rx="7" fill="#FFF" filter="url(#knob)"/>
          <text x="144" y="385" font-size="12" fill="#000" text-anchor="middle">Image</text>
          <text x="230" y="385" font-size="12" fill="#000" text-anchor="middle">Animation</text>
          <text x="317" y="385" font-size="12" class="sb" fill="#000" text-anchor="middle">Both</text>
        </g>

        <g id="include-regular">
          <text x="32" y="425" font-size="14" fill="#000">Include regular timelapse</text>
          <g><rect x="310" y="406" width="51" height="31" rx="15.5" fill="#34C759"/><circle cx="345.5" cy="421.5" r="13.5" fill="#FFF" filter="url(#knob)"/></g>
        </g>

        <line x1="32" y1="447" x2="361" y2="447" stroke="#000" stroke-opacity="0.09"/>

        <g id="variations">
          <text x="32" y="477" font-size="14" fill="#000">Variations</text>
          <rect x="161" y="459" width="200" height="28" rx="8" fill="#E9E9EB"/>
          <rect x="163" y="461" width="48" height="24" rx="7" fill="#FFF" filter="url(#knob)"/>
          <text x="186" y="477" font-size="12" class="sb" fill="#000" text-anchor="middle">Off</text>
          <text x="236" y="477" font-size="12" fill="#000" text-anchor="middle">2</text>
          <text x="285" y="477" font-size="12" fill="#000" text-anchor="middle">4</text>
          <text x="335" y="477" font-size="12" fill="#000" text-anchor="middle">8</text>
        </g>
        <text x="32" y="509" font-size="11" fill="#6D6D72">Blending runs once — each extra take is a slice pass</text>

        <g id="readout" font-size="11.5" fill="#6D6D72">
          <text x="32" y="533">Spread 36 frames · 25% of the clip ≈ 3.0 s</text>
          <text x="32" y="547">Sliced clip 266 frames — the spread is trimmed off the end</text>
          <text x="32" y="561">Poster: the whole shoot spread across 24 bands</text>
          <text x="32" y="575">Scratch ≈ 71.6 MB while rendering</text>
        </g>
      </g>

      <!-- bottom bar -->
      <g id="bottom-bar">
        <rect x="0" y="726" width="393" height="126" fill="#F2F2F7"/>
        <rect x="16" y="735" width="305" height="50" rx="14" fill="#C36A00"/>
        <text x="168.5" y="766" font-size="15" class="b" fill="#FFF" text-anchor="middle">Create 302-frame timelapse + slice</text>
        <rect x="329" y="735" width="48" height="50" rx="12" fill="#C36A00"/>
        <path d="M347 757 l6 -6.5 6 6.5" stroke="#FFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.up"/>
        <text x="16" y="806" font-size="11" fill="#6D6D72">Your original is kept — you can always make another…</text>
        <text x="377" y="806" font-size="11" class="sb" fill="#C36A00" text-anchor="end">+ Field note</text>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Adjust — Time slicing, grid recipe re-opened · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/AdjustView.swift `timeSliceGridControls` — Sweeps from · Wavefront · escape link · Columns with the derived row count and cell size</text>
</svg>
