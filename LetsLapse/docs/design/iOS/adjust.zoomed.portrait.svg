<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Adjust — warp timeline zoomed, just after a nominate · portrait</title>
  <desc>Mirrors App/WarpTimelineView.swift in the zoomed, just-edited state (2026-08-03 trust-and-navigation pass) — the moment after a drag carved a 1× stretch inside a pinch-zoomed window. Sample: the 8:16 capture zoomed to 3:21–4:53 (92s window; pinch is anchored under the fingers, floored at min(20s, source) with a rigid tick at either travel end), a fresh 1× stretch nominated 4:07–4:42. Header: "SOURCE · 8:16", then the "Undo" chip (ink capsule, amber arrow.uturn.backward + label — present whenever timeline history exists; each edit is one snapshot on a 30-deep stack, continuous gestures coalesce, Cmd-Z / shake / three-finger-swipe drive the same stack) and the "Fit 8:16" chip (zoomed only; tap returns to the whole source). The 10pt gesture-hint line is gone — it yields once the Undo chip exists. The transient toast capsule "Added 1× stretch · Undo" (ink, white text, amber Undo, 4s, success haptic) floats top-center over the thumbnail area after every nominate commit; an under-2s release instead warns "Too short — drag past 2s, or zoom in". Bar: the ¼× moment's 12pt amber sliver clipped at the window's left edge, 100× tile, the new 1× stretch (slow gradient, amber stroke + accent selection ring, both 44pt-target resize handles, relative drag), trailing 100× sliver; smart seams "~1s ·?" flank the carve (side unpicked), the surviving "~1s ▶" sits clamped at the left edge. Playhead knob (18pt visual in a 44pt target) at 4:42 with its floating keyframe thumbnail; when a zoomed window scrolls PAST the playhead the knob is replaced by an accent chevron pinned at the near bar edge (tap recenters, non-destructive) and the thumbnail dims to 55% with a directional badge ("◀ 3:10"). Clock ruler 3:21 · 4:07 · 4:53 — dragging it pans 1:1, anchored at the drag start. Below it the MINIMAP (zoomed only): full-source track with 1pt stretch-bound ticks, an accent playhead tick, and the amber lens marking the visible window — drag the strip to move the window (lens centers on the finger). Selection line "Stretch 4 of 7 · 4:07–4:42 · 1× real time → 35s of the clip" + ⋯. Chips highlight 1×; estimate updates to 2:19 min · 7 stretches. Nominating overlay (not drawn here): grey-dashed below the 2s minimum, amber above it, selection tick on crossing. A pinch always cancels an in-flight nomination — zooming can never carve.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
    <linearGradient id="baseTile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33415A"/><stop offset="1" stop-color="#1B2330"/></linearGradient>
    <linearGradient id="momentTile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6B4A16"/><stop offset="1" stop-color="#3A2E14"/></linearGradient>
    <linearGradient id="thumbImage" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A5A6E"/><stop offset="0.55" stop-color="#2E3B4C"/><stop offset="1" stop-color="#1B2330"/></linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- flow header -->
      <g id="flow-header">
        <circle cx="33" cy="88" r="17" fill="#FFF" filter="url(#soft)"/>
        <path d="M37 80 l-8 8 8 8" stroke="#C36A00" stroke-width="2.4" fill="none" stroke-linecap="round" data-symbol="chevron.left"/>
        <text x="196.5" y="93" font-size="16" class="sb" fill="#000" text-anchor="middle">New blended clip</text>
      </g>

      <!-- source card -->
      <g id="source-card">
        <rect x="16" y="115" width="361" height="72" rx="16" fill="#FFF" filter="url(#soft)"/>
        <rect x="28" y="127" width="64" height="48" rx="7" fill="#33415A"/>
        <circle cx="48" cy="141" r="7" fill="#FFB340" opacity="0.85"/>
        <polygon points="28,163 52,151 74,161 92,153 92,175 28,175" fill="#1E2632"/>
        <text x="104" y="147" font-size="14.5" class="sb" fill="#000">Sunset over harbour</text>
        <text x="104" y="164" font-size="12"><tspan fill="#6D6D72">08:16 · 4K · 30 fps</tspan><tspan fill="#8A4A00" class="sb"> · 2 moments</tspan></text>
        <text x="363" y="155" font-size="12.5" class="sb" fill="#C36A00" text-anchor="end">Change</text>
      </g>

      <!-- SOURCE warp card — zoomed to 3:21–4:53, one nominate just committed -->
      <g id="warp-card">
        <rect x="16" y="201" width="361" height="298" rx="16" fill="#FFF" filter="url(#soft)"/>
        <text x="32" y="230" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">SOURCE · 8:16</text>
        <!-- header chips: Undo (history exists) + Fit (zoomed); the hint line has yielded -->
        <g id="undo-chip">
          <rect x="233" y="215" width="60" height="20" rx="10" fill="#1C1C1E"/>
          <path d="M243 225 a4.5 4.5 0 1 1 2 3.6 M243 225 l-1.5 -3 M243 225 l3 -1" stroke="#FFB340" stroke-width="1.5" fill="none" stroke-linecap="round" data-symbol="arrow.uturn.backward"/>
          <text x="272" y="228.5" font-size="10" class="b" fill="#FFB340" text-anchor="middle">Undo</text>
        </g>
        <g id="fit-chip">
          <rect x="299" y="215" width="62" height="20" rx="10" fill="#1C1C1E"/>
          <text x="330" y="228.5" font-size="10" class="b" fill="#FFB340" text-anchor="middle">Fit 8:16</text>
        </g>

        <!-- floating keyframe thumbnail at the playhead (4:42, fraction clamped 0.83) -->
        <g id="playhead-thumbnail">
          <rect x="241" y="248" width="120" height="72" rx="9" fill="url(#thumbImage)" filter="url(#soft)"/>
          <rect x="247" y="299" width="38" height="16" rx="6" fill="#000" opacity="0.55"/>
          <text x="266" y="310.5" font-size="10" class="b" fill="#FFF" text-anchor="middle">4:42</text>
          <rect x="297" y="253" width="59" height="14" rx="6" fill="#000" opacity="0.4"/>
          <text x="326.5" y="263" font-size="8.5" fill="#FFF" fill-opacity="0.8" text-anchor="middle">≈ keyframe</text>
        </g>

        <!-- stretch bar, window 3:21–4:53: moment sliver · 100× · NEW 1× (selected) · 100× -->
        <g id="stretch-bar">
          <rect x="32" y="334" width="12" height="50" rx="6" fill="url(#momentTile)"/>
          <rect x="32.75" y="334.75" width="10.5" height="48.5" rx="5.5" fill="none" stroke="#FFB340" stroke-width="1.5"/>
          <rect x="46" y="334" width="148" height="50" rx="8" fill="url(#baseTile)"/>
          <rect x="196" y="334" width="123" height="50" rx="8" fill="url(#momentTile)"/>
          <rect x="196.75" y="334.75" width="121.5" height="48.5" rx="7.5" fill="none" stroke="#FFB340" stroke-width="1.5"/>
          <rect x="197.25" y="335.25" width="120.5" height="47.5" rx="7" fill="none" stroke="#C36A00" stroke-width="2.5"/>
          <rect x="321" y="334" width="40" height="50" rx="8" fill="url(#baseTile)"/>
          <!-- speed pills -->
          <g font-size="10" font-weight="700">
            <rect x="106" y="360" width="28" height="16" rx="8" fill="#000" opacity="0.55"/>
            <text x="120" y="371.5" fill="#FFF" text-anchor="middle">100×</text>
            <rect x="245.5" y="360" width="24" height="16" rx="8" fill="#000" opacity="0.55"/>
            <text x="257.5" y="371.5" fill="#FFB340" text-anchor="middle">1×</text>
            <rect x="327" y="360" width="28" height="16" rx="8" fill="#000" opacity="0.55"/>
            <text x="341" y="371.5" fill="#FFF" text-anchor="middle">100×</text>
          </g>
          <!-- resize handles (12pt visual inside 44pt targets) on the new stretch's edges -->
          <g id="resize-handles">
            <rect x="190" y="331" width="12" height="56" rx="6" fill="#C36A00"/>
            <rect x="194.5" y="347" width="3" height="24" rx="1.5" fill="#FFF"/>
            <rect x="315" y="331" width="12" height="56" rx="6" fill="#C36A00"/>
            <rect x="319.5" y="347" width="3" height="24" rx="1.5" fill="#FFF"/>
          </g>
          <!-- playhead at the carve's end (4:42) -->
          <rect x="320" y="326" width="2" height="60" fill="#C36A00"/>
          <circle cx="321" cy="323" r="9" fill="#C36A00" filter="url(#soft)"/>
        </g>

        <!-- seam pills: survivor "~1s ▶" clamped at the window edge; the carve's
             smart seams "~1s ·?" until a side is picked -->
        <g id="seam-pills" font-size="9.5" font-weight="700">
          <rect x="34" y="392" width="44" height="17" rx="8.5" fill="#1C1C1E"/>
          <text x="56" y="404" fill="#FFB340" text-anchor="middle">~1s ▶</text>
          <rect x="174" y="392" width="44" height="17" rx="8.5" fill="#1C1C1E"/>
          <text x="196" y="404" fill="#FFB340" text-anchor="middle">~1s ·?</text>
          <rect x="299" y="392" width="44" height="17" rx="8.5" fill="#1C1C1E"/>
          <text x="321" y="404" fill="#FFB340" text-anchor="middle">~1s ·?</text>
        </g>

        <!-- zoom clock ruler — drag pans the window 1:1 -->
        <g font-size="10" fill="#8E8E93">
          <text x="32" y="428">3:21</text>
          <text x="196.5" y="428" text-anchor="middle">4:07</text>
          <text x="361" y="428" text-anchor="end">4:53</text>
        </g>

        <!-- minimap (zoomed only): whole source, bound ticks, playhead tick, amber lens -->
        <g id="minimap">
          <rect x="32" y="442" width="329" height="6" rx="3" fill="#8E8E93" opacity="0.28"/>
          <g fill="#8E8E93" opacity="0.6">
            <rect x="150" y="442" width="1" height="6"/>
            <rect x="166" y="442" width="1" height="6"/>
            <rect x="196" y="442" width="1" height="6"/>
            <rect x="219" y="442" width="1" height="6"/>
            <rect x="297" y="442" width="1" height="6"/>
            <rect x="303" y="442" width="1" height="6"/>
          </g>
          <rect x="219" y="438" width="1.5" height="12" fill="#C36A00"/>
          <rect x="165" y="438" width="61" height="14" rx="4" fill="#FFB340" opacity="0.14"/>
          <rect x="165.75" y="438.75" width="59.5" height="12.5" rx="3.5" fill="none" stroke="#FFB340" stroke-width="1.5"/>
        </g>

        <!-- selection line + stretch options -->
        <g id="selection-line">
          <rect x="32" y="463" width="329" height="30" rx="10" fill="#F2F2F7"/>
          <text x="42" y="482" font-size="11.5" fill="#1C1C1E">Stretch 4 of 7 · 4:07–4:42 · 1× real time → 35s of clip</text>
          <circle cx="347" cy="478" r="8" fill="none" stroke="#C36A00" stroke-width="1.6" data-symbol="ellipsis.circle"/>
          <circle cx="343.5" cy="478" r="0.9" fill="#C36A00"/><circle cx="347" cy="478" r="0.9" fill="#C36A00"/><circle cx="350.5" cy="478" r="0.9" fill="#C36A00"/>
        </g>

        <!-- transient toast (4s): success haptic + one-tap undo of the carve -->
        <g id="toast" filter="url(#soft)">
          <rect x="105" y="241" width="183" height="30" rx="15" fill="#1C1C1E"/>
          <text x="118" y="260" font-size="12" class="sb" fill="#FFF">Added 1× stretch</text>
          <text x="243" y="260" font-size="12" class="b" fill="#FFB340">Undo</text>
        </g>
      </g>

      <!-- speed chips: the new 1× stretch is selected -->
      <g id="speed-chips">
        <rect x="16" y="513" width="46.4" height="47" rx="12" fill="#FFF" filter="url(#soft)"/>
        <text x="39.2" y="534" font-size="14" class="b" fill="#000" text-anchor="middle">¼×</text>
        <text x="39.2" y="548" font-size="9.5" fill="#6D6D72" text-anchor="middle">¼× slow</text>
        <rect x="68.4" y="513" width="46.4" height="47" rx="12" fill="#1C1C1E"/>
        <text x="91.6" y="534" font-size="14" class="b" fill="#FFB340" text-anchor="middle">1×</text>
        <text x="91.6" y="548" font-size="9.5" fill="#FFF" opacity="0.6" text-anchor="middle">real time</text>
        <rect x="120.8" y="513" width="46.4" height="47" rx="12" fill="#FFF" filter="url(#soft)"/>
        <text x="144" y="534" font-size="14" class="b" fill="#000" text-anchor="middle">4×</text>
        <text x="144" y="548" font-size="9.5" fill="#6D6D72" text-anchor="middle">gentle</text>
        <rect x="173.2" y="513" width="46.4" height="47" rx="12" fill="#FFF" filter="url(#soft)"/>
        <text x="196.4" y="534" font-size="14" class="b" fill="#000" text-anchor="middle">15×</text>
        <text x="196.4" y="548" font-size="9.5" fill="#6D6D72" text-anchor="middle">subtle</text>
        <rect x="225.6" y="513" width="46.4" height="47" rx="12" fill="#FFF" filter="url(#soft)"/>
        <text x="248.8" y="534" font-size="14" class="b" fill="#000" text-anchor="middle">60×</text>
        <text x="248.8" y="548" font-size="9.5" fill="#6D6D72" text-anchor="middle">flowing</text>
        <rect x="278" y="513" width="46.4" height="47" rx="12" fill="#FFF" filter="url(#soft)"/>
        <text x="301.2" y="534" font-size="14" class="b" fill="#000" text-anchor="middle">100×</text>
        <text x="301.2" y="548" font-size="9.5" fill="#6D6D72" text-anchor="middle">streaks</text>
        <rect x="330.4" y="513" width="46.4" height="47" rx="12" fill="#FFF" filter="url(#soft)"/>
        <text x="353.6" y="534" font-size="14" class="b" fill="#000" text-anchor="middle">···</text>
        <text x="353.6" y="548" font-size="9.5" fill="#6D6D72" text-anchor="middle">custom</text>
        <text x="20" y="578" font-size="11" fill="#6D6D72">Every stretch is speedable — no separate “base”. Hold a stretch for</text>
        <text x="20" y="592" font-size="11" fill="#6D6D72">Remove · Split · Reset.</text>
      </g>

      <!-- estimate card: the carve added ~35s of real time -->
      <g id="estimate-card">
        <rect x="16" y="606" width="361" height="152" rx="16" fill="#1C1C1E"/>
        <text x="32" y="630" font-size="12" fill="#FFF" opacity="0.55">Your clip will be</text>
        <text x="345" y="630" font-size="11" fill="#FFF" opacity="0.45" text-anchor="end">30 fps ⌄</text>
        <text x="32" y="662" font-size="28" class="b" fill="#FFF">2:19 min</text>
        <text x="152" y="660" font-size="14" class="sb" fill="#FFB340">· 7 stretches</text>
        <g id="before-after-bar">
          <rect x="32" y="685" width="170" height="8" rx="4" fill="#3D3D3F"/>
          <text x="212" y="693" font-size="11" fill="#FFF" opacity="0.4">08:16</text>
          <path d="M246 689 h10 m-4 -3.5 4 3.5 -4 3.5" stroke="#FFF" stroke-opacity="0.3" stroke-width="1.4" fill="none"/>
          <rect x="266" y="685" width="42" height="8" rx="4" fill="#FFB340"/>
          <text x="314" y="693" font-size="11" class="b" fill="#FFB340">2:19</text>
        </g>
        <text x="32" y="722" font-size="11" fill="#FFF" opacity="0.45">Time-warp, never a trim — every source frame lands in the clip;</text>
        <text x="32" y="736" font-size="11" fill="#FFF" opacity="0.45">blur follows speed through each ease.</text>
      </g>

      <!-- bottom CTA -->
      <g id="bottom-bar">
        <rect x="0" y="748" width="393" height="104" fill="#F2F2F7"/>
        <rect x="16" y="760" width="361" height="50" rx="14" fill="#C36A00"/>
        <text x="196.5" y="790" font-size="16" class="b" fill="#FFF" text-anchor="middle">Create 2:19 min clip</text>
        <text x="196.5" y="828" font-size="11.5" fill="#6D6D72" text-anchor="middle">Your original is kept — you can always make another blended clip.</text>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Adjust — zoomed 3:21–4:53, just after a nominate · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/WarpTimelineView.swift — Undo + Fit chips (hint yielded) · toast · anchored pinch · minimap lens · 1:1 ruler pan · off-window playhead ⇒ edge chevron + dimmed directional thumbnail</text>
</svg>
