<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Interval grading viewer · pads off · portrait</title>
  <desc>Mirrors App/PhotoAdjustmentsPanel.swift with `padsEnabled` false (`sliderRow`, `axes(for:)`, `readoutInk`) inside App/PhotoViewerView.swift's `phoneEditorBody` — board 6e: Settings › Advanced › Layout › 'Use Pads in Editor' OFF (`LayoutSettings.editorPadsKey`, @AppStorage, default on; `LL_PADS=off` forces it for a screenshot without touching the setting). New 2026-09-13 for the editor controls redesign. Every pad in every group then renders as its two sliders, the Y field first (Exposure over Contrast, Highlights over Whites, Temp over Tint …); the tool chips, the grouping, the presets and the timeline are unchanged either way — which is the whole point of the switch, and what the Settings footer promises. LAYOUT (2a / 6a, `phoneEditorBody`): the picture fills the safe area (59 top / 34 bottom on this canvas) and is fitted into it — a 3:4 portrait shoot spans the width and centres vertically, 176…700 — and everything else floats over it. `touchChrome`: the 36 pt back disc at (16, 71) and the `EditorTabPill` top-right (right 16, top 74: 12 pt of vertical padding under the safe area, the 30 pt pill centred on the 36 pt disc) — the boards draw both at top 60, the app sits them 11 pt lower. The pill is rgba(28,28,30,.85) over material, radius 18, 12 pt semibold, the selected tab amber with black text, the rest amber on ink; Frames appears only on a shoot with more than one frame. The foot (`phoneFoot`) is bottom-anchored on the safe area: the timeline card where `hasTimeline`, then EITHER the six main buttons (`EditorGroupBar(.phone)`) OR the open group's sheet (`PhotoAdjustmentsPanel(layout: .phone)`) — one or the other, the sheet needs the buttons' room. The sheet: 22 pt top corners, rgba(28,28,30,.86) over material running under the home indicator, padded 12 top / 16 sides / 0 bottom, 10 pt between rows, shadow up; header = title 15 pt semibold white · 6 pt dot (accent when the group holds a value or a travelling field, clear otherwise so the row never reflows) · spacer · ✕ 32 pt white 10 % (reverts to the snapshot `openPanel(for:)` took) · ✓ 32 pt amber (keeps and closes). Long-press the title for Reset &lt;group&gt; / Reset all adjustments. The 1:1 toggle (`zoomControls`, 32 pt black 45 %) sits bottom-trailing of the picture pane 12 pt in, lifted above the foot by its measured height; it exists only while `hasPixelsToReveal`, so a small source shows none. The readouts print the app's own formats (`%+.2f`, `%+.0f`, unsigned 0…100, Kelvin) with an ASCII hyphen-minus where the boards typeset U+2212. THIS CANVAS: the same Light › Exp · Con moment as the keyframed file (LL_KEYFRAMES=sunset, playhead at 30 %), the card 22 pt higher because the sheet is shorter. Each `sliderRow` is 49 pt: a 13.5 pt white label with the 7 pt diamond after it where the field travels, the 12.5 pt semibold readout end-anchored (accent when keyframed or moved, #8E8E93 at neutral — 'Contrast 0' is the neutral case), 2 pt, then the native SwiftUI Slider tinted amber: a 4 pt track, amber below the 27 pt white knob and white ~12 % above it, inset 1 pt from the sheet's 16 pt sides. Rows are 10 pt apart. Double-tap a label to reset that axis alone (through `onResetField` while a timeline is in play). Temp and Tint in this mode take gradient tracks (`GradientTrackSlider`: #3F7BD9 → #D8D8DC → #F4B23A and #4CAF50 → #D8D8DC → #D64BC6) rather than the native slider; Dehaze, Angle and Noise's Detail are plain sliders in both modes. Staged by LL_EDITOR=latest LL_VIEWER=1 LL_KEYFRAMES=sunset LL_SECTIONS=light:expcon LL_PADS=off.</desc>
