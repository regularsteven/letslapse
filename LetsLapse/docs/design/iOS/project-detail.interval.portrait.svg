<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Project detail (interval) · portrait</title>
  <desc>Mirrors App/ProjectDetailView.swift (GradingCard, originalsSection, versionRow, managementCard) for an interval capture — kind == .photos and NOT isPhotoCapture. The card previews the shoot's FIRST SOURCE FRAME rendered through the project's preset + PhotoAdjustments (not its hero: once a stacked image version exists that version is the hero, and it is a finished render that already carries the grade that made it). An interval project's card carries TWO affordances, because it has both a sequence to watch and a frame to grade. The circular button in the middle is play: it opens FullscreenMediaSheet on `.intervalMotion`, which plays the shoot's own frames as motion at the frame rate of its newest rendered version (12 fps until one exists) — the preview that used to cost a full render to see (see player.portrait.svg). Bottom-left, over the image, an "Edit photo" pill opens App/PhotoViewerView.swift on that frame — presets, sliders, white balance — so an interval project still customises its grade there rather than in the card; see project-photo.viewer.portrait.svg. Beneath the preset strip, where the video variant shows a Source Clips card, an interval shoot shows the Originals card: a "Source photos" row carrying the batched Save all to Photos export (deliberately ungraded — it hands over the captured files byte for byte), and a "View all photos" row that presents CapturePhotoGrid over the individual frames, every tile rendered through the same grade. Save-all states replace the trailing control in place: Save all to Photos → spinner → "Saved" (checkmark, secondary) → "Retry" with the error as the row subtitle. The grade is baked into the timelapse the blend writes, frame by frame; the stills on disk are never rewritten.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6B4A2E"/><stop offset="0.55" stop-color="#3E2E22"/><stop offset="1" stop-color="#241B14"/></linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- inline nav bar -->
      <g id="nav-bar">
        <path d="M22 76 l-9 10 9 10" stroke="#C36A00" stroke-width="2.6" fill="none" stroke-linecap="round" data-symbol="chevron.backward"/>
        <text x="30" y="91" font-size="17" fill="#C36A00">Projects</text>
        <text x="196.5" y="91" font-size="17" class="sb" fill="#000" text-anchor="middle">Interval — harbour dusk</text>
        <g data-symbol="ellipsis.circle">
          <circle cx="367" cy="86" r="11" fill="none" stroke="#C36A00" stroke-width="1.8"/>
          <circle cx="361.5" cy="86" r="1.6" fill="#C36A00"/><circle cx="367" cy="86" r="1.6" fill="#C36A00"/><circle cx="372.5" cy="86" r="1.6" fill="#C36A00"/>
        </g>
      </g>

      <!-- grading card: the shoot's first frame, graded -->
      <g id="grading-card">
        <rect x="16" y="112" width="361" height="210" rx="18" fill="url(#dusk)"/>
        <circle cx="128" cy="176" r="20" fill="#FFD9A0" opacity="0.8"/>
        <polygon points="16,262 96,222 176,258 258,220 336,254 377,236 377,322 16,322" fill="#2A2118"/>
        <polygon points="16,292 112,264 236,298 338,272 377,288 377,322 16,322" fill="#191309"/>
        <circle cx="196.5" cy="217" r="26" fill="#000" opacity="0.45"/>
        <path d="M190 206 l19 11 -19 11 z" fill="#FFF" data-symbol="play.fill"/>
        <rect x="28" y="124" width="150" height="22" rx="11" fill="#000" opacity="0.5"/>
        <text x="103" y="139" font-size="11.5" class="sb" fill="#FFF" text-anchor="middle">ORIGINAL · 184 photos</text>
        <!-- second affordance: the frame editor, under the play button -->
        <g id="edit-photo-pill">
          <rect x="28" y="284" width="106" height="26" rx="13" fill="#000" opacity="0.45"/>
          <g data-symbol="slider.horizontal.3" stroke="#FFF" stroke-width="1.7" stroke-linecap="round">
            <path d="M40 292 h14 M40 297 h14 M40 302 h14"/>
            <circle cx="50" cy="292" r="2.1" fill="#FFF" stroke="none"/>
            <circle cx="45" cy="297" r="2.1" fill="#FFF" stroke="none"/>
            <circle cx="52" cy="302" r="2.1" fill="#FFF" stroke="none"/>
          </g>
          <text x="61" y="301" font-size="12.5" class="sb" fill="#FFF">Edit photo</text>
        </g>
        <rect x="263" y="288" width="102" height="22" rx="11" fill="#000" opacity="0.5"/>
        <text x="314" y="303" font-size="11.5" class="sb" fill="#FFF" text-anchor="middle">4032×3024</text>
      </g>

      <!-- preset strip: same chips, same geometry, as the photo and video cards -->
      <g id="preset-strip">
        <rect x="16" y="334" width="74" height="33" rx="16.5" fill="#C36A00"/>
        <text x="53" y="355" font-size="13.5" class="sb" fill="#FFF" text-anchor="middle">Natural</text>
        <rect x="98" y="334" width="72" height="33" rx="16.5" fill="#FFF" filter="url(#soft)"/>
        <text x="134" y="355" font-size="13.5" class="sb" fill="#000" text-anchor="middle">Cinema</text>
        <rect x="178" y="334" width="64" height="33" rx="16.5" fill="#FFF" filter="url(#soft)"/>
        <text x="210" y="355" font-size="13.5" class="sb" fill="#000" text-anchor="middle">Matte</text>
        <rect x="250" y="334" width="60" height="33" rx="16.5" fill="#FFF" filter="url(#soft)"/>
        <text x="280" y="355" font-size="13.5" class="sb" fill="#000" text-anchor="middle">Vivid</text>
        <rect x="318" y="334" width="76" height="33" rx="16.5" fill="#FFF" filter="url(#soft)"/>
        <text x="356" y="355" font-size="13.5" class="sb" fill="#000" text-anchor="middle">Original</text>
      </g>

      <!-- originals card: batch export + the per-frame browser -->
      <text x="20" y="396" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">ORIGINALS</text>
      <g id="originals-card">
        <rect x="16" y="405" width="361" height="96" rx="16" fill="#FFF" filter="url(#soft)"/>
        <g id="row-source-photos">
          <text x="32" y="430" font-size="16" fill="#000">Source photos</text>
          <text x="32" y="445" font-size="11.5" fill="#6D6D72">184 photos</text>
          <text x="363" y="434" font-size="12.5" class="sb" fill="#C36A00" text-anchor="end">Save all to Photos</text>
        </g>
        <line x1="32" y1="457" x2="377" y2="457" stroke="#000" stroke-opacity="0.08"/>
        <g id="row-view-all">
          <text x="32" y="485" font-size="16" fill="#000">View all photos</text>
          <path d="M363 472 l6 7 -6 7" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round" data-symbol="chevron.right"/>
        </g>
      </g>

      <!-- new version button -->
      <g id="new-version">
        <rect x="16" y="515" width="361" height="50" rx="14" fill="#C36A00"/>
        <path d="M158 540 v-14 M151 533 h14" stroke="#FFF" stroke-width="2.4" stroke-linecap="round" data-symbol="plus"/>
        <text x="172" y="546" font-size="16" class="b" fill="#FFF">New version</text>
      </g>

      <!-- versions -->
      <text x="20" y="594" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">VERSIONS · 1</text>
      <g id="versions-card">
        <rect x="16" y="603" width="361" height="62" rx="16" fill="#FFF" filter="url(#soft)"/>
        <rect x="30" y="613" width="58" height="42" rx="7" fill="#463522"/>
        <circle cx="59" cy="627" r="7" fill="#FFB340" opacity="0.8"/>
        <path d="M53 627 l12 7 -12 7 z" fill="#FFF" opacity="0.8" data-symbol="play.fill"/>
        <text x="100" y="631" font-size="14.5" class="sb" fill="#000">v1 · 18 frames · 6.1 s</text>
        <text x="100" y="648" font-size="11.5" fill="#6D6D72">24 fps · yesterday</text>
        <text x="363" y="638" font-size="12.5" class="sb" fill="#C36A00" text-anchor="end">Open</text>
      </g>

      <!-- management card -->
      <g id="management-card">
        <rect x="16" y="679" width="361" height="140" rx="16" fill="#FFF" filter="url(#soft)"/>
        <text x="32" y="707" font-size="16" fill="#000">Rename project</text>
        <path d="M363 695 l6 7 -6 7" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round" data-symbol="chevron.right"/>
        <line x1="32" y1="723" x2="377" y2="723" stroke="#000" stroke-opacity="0.08"/>
        <text x="32" y="748" font-size="16" fill="#000">Storage</text>
        <text x="32" y="763" font-size="11.5" fill="#6D6D72">original + versions</text>
        <text x="361" y="752" font-size="14" fill="#6D6D72" text-anchor="end">3.1 GB</text>
        <line x1="32" y1="775" x2="377" y2="775" stroke="#000" stroke-opacity="0.08"/>
        <text x="32" y="801" font-size="16" fill="#FF3B30">Delete project…</text>
      </g>

      <!-- floating tab bar (Projects selected) over content -->
      <g id="tab-bar" opacity="0.98">
        <rect x="2" y="755" width="389" height="57" rx="28.5" fill="#FBFBFD" opacity="0.96" filter="url(#soft)"/>
        <rect x="2" y="755" width="389" height="57" rx="28.5" fill="none" stroke="#000" stroke-opacity="0.08"/>
        <g fill="none" stroke="#8E8E93">
          <circle cx="54" cy="776" r="8" stroke-width="1.6"/><circle cx="54" cy="776" r="3.4" fill="#8E8E93" stroke="none"/>
          <text x="54" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Create</text>
        </g>
        <g fill="none" stroke="#8E8E93">
          <rect x="143" y="769" width="15" height="11" rx="2" stroke-width="1.6" transform="rotate(-6 150 775)"/>
          <rect x="147" y="772" width="15" height="11" rx="2" stroke-width="1.6" transform="rotate(4 154 778)"/>
          <text x="150" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Gallery</text>
        </g>
        <rect x="200" y="761" width="92" height="45" rx="22.5" fill="#C36A00" opacity="0.12"/>
        <g fill="none" stroke="#C36A00">
          <rect x="239" y="768" width="14" height="10" rx="2" stroke-width="1.6"/>
          <path d="M240.5 781 h11 M242.5 784.5 h7" stroke-width="1.6" stroke-linecap="round"/>
          <text x="246" y="800" font-size="10.5" class="sb" fill="#C36A00" stroke="none" text-anchor="middle">Projects</text>
        </g>
        <g stroke="#8E8E93">
          <path d="M334 771 h16 M334 776.5 h16 M334 782 h16" stroke-width="1.8" stroke-linecap="round"/>
          <text x="342" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Settings</text>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Project detail (interval) · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/ProjectDetailView.swift — GradingCard (first frame graded · presetStrip) · originalsSection · versionRow · managementCard</text>
</svg>
