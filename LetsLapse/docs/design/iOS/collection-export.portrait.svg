<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Collections · export progress · portrait</title>
  <desc>Mirrors App/CollectionExportView.swift (CollectionExportProgressView) + App/CollectionExporter.swift: the app's Processing pattern reused for a collection export — a fullscreen cover with the first clip's thumbnail blurred and dimmed under a 92pt amber progress ring (white 20% track, monospaced % label, black 35% backing circle), then the four-phase checklist card: Preparing clips ✓ · Cropping &amp; scaling (active amber dot, monospaced "1 / 3" detail = which clip the export session's head is inside) · Combining 3 clips ○ · Saving to collection ○. Status line beneath ("About 55 seconds left · Clip 1 of 3" — honest ETA from session progress; "Getting started…" before it stabilises, "Combining 3 clips…" while the writer finalises, "Almost done" while saving). Cancel (LLSecondaryButtonStyle, red) with "Cancelling keeps your collection — nothing is lost." — cancel really cancels (session.cancelExport, scratch deleted, collection untouched). The render runs at the canvas ratio's export resolution; a valid kept render (recipe unchanged, file on disk) skips this screen entirely and lands on the result.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.05"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <linearGradient id="clipB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A5A43"/><stop offset="1" stop-color="#232E1D"/></linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- hero: blurred first clip + ring -->
      <g id="hero">
        <clipPath id="hero-clip"><rect x="16" y="99" width="361" height="260" rx="20"/></clipPath>
        <g clip-path="url(#hero-clip)">
          <rect x="16" y="99" width="361" height="260" fill="url(#clipB)" filter="url(#blur)"/>
          <rect x="16" y="99" width="361" height="260" fill="#000" opacity="0.45"/>
        </g>
        <circle cx="196.5" cy="229" r="54" fill="#000" opacity="0.35"/>
        <circle cx="196.5" cy="229" r="46" fill="none" stroke="#FFF" stroke-opacity="0.2" stroke-width="8"/>
        <!-- 17% arc -->
        <path d="M196.5 183 a46 46 0 0 1 40.6 22.5" fill="none" stroke="#FFB340" stroke-width="8" stroke-linecap="round"/>
        <text x="196.5" y="235" font-size="17" class="b" fill="#FFF" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">17%</text>
      </g>

      <!-- phase checklist -->
      <g id="checklist">
        <rect x="16" y="375" width="361" height="174" rx="16" fill="#FFF" filter="url(#card)"/>
        <g id="phase-1">
          <path d="M31 396 l4 4 8 -9" stroke="#34C759" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="checkmark"/>
          <text x="52" y="401" font-size="15" fill="#000">Preparing clips</text>
        </g>
        <g id="phase-2">
          <circle cx="36" cy="438" r="4.5" fill="#FFB340"/>
          <text x="52" y="443" font-size="15" class="sb" fill="#000">Cropping &amp; scaling</text>
          <text x="361" y="443" font-size="13" class="sec" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace">1 / 3</text>
        </g>
        <g id="phase-3">
          <circle cx="36" cy="480" r="4.5" fill="none" stroke="#A9A9AE" stroke-width="1.2"/>
          <text x="52" y="485" font-size="15" fill="#9C9CA1">Combining 3 clips</text>
        </g>
        <g id="phase-4">
          <circle cx="36" cy="522" r="4.5" fill="none" stroke="#A9A9AE" stroke-width="1.2"/>
          <text x="52" y="527" font-size="15" fill="#9C9CA1">Saving to collection</text>
        </g>
      </g>

      <text x="196.5" y="580" font-size="13" class="sec" text-anchor="middle">About 55 seconds left · Clip 1 of 3</text>

      <!-- cancel -->
      <g id="cancel">
        <rect x="16" y="742" width="361" height="50" rx="14" fill="#FFF" filter="url(#card)"/>
        <text x="196.5" y="773" font-size="15.5" class="sb" fill="#FF3B30" text-anchor="middle">Cancel</text>
        <text x="196.5" y="816" font-size="11.5" class="sec" text-anchor="middle">Cancelling keeps your collection — nothing is lost.</text>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Collections · export progress · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/CollectionExportView.swift + CollectionExporter.swift — ring · 4-phase checklist · honest ETA · safe cancel</text>
</svg>
