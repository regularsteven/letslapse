<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Settings · Libraries card · three libraries, the doors · portrait</title>
  <desc>Mirrors App/SettingsView.swift (librariesCardPhone, the iOS extension at the foot of the file) over App/StorageLocation.swift (StorageRoot's iOS block: libraryFolders, makeLibraryFolder, createFromPicPlace, removeLibraryFolder) and App/LetsLapseApp.swift (ModelHost.switchLibrary) — libraries plan L21/L25, C2c (2026-09-17, code first, mirrored from the running Simulator). Settings scrolled so the LIBRARIES header sits under the status bar, the card in full and the PICPLACE card following. THE CARD: one LLRow per folder of &lt;App Support&gt;/LetsLapse/Libraries/ — title = the identity file's name (grey while it is only the healed placeholder, namedByPerson false), subtitle = 'N projects' (a listing of Projects/) · '@user on host' from the folder's binding, or 'not on PicPlace' (it wraps under the button, as the row's HStack gives the title side the width that is left) — trailing 'Current' (15pt secondary) on the open one and a bordered SWITCH button on the others (disabled while a render runs). Rows sort: the open one first, then by name. A long press opens the row's menu: Rename… (Name this library… while unnamed) and — never on the open one — Remove from this iPhone… (settings.libraries.remove.portrait.svg). THE DOORS, accent LLRows: Add Library from PicPlace… (only while librariesNotOnThisDevice is non-empty; the subtitle names them) and New Library on PicPlace… (signed in on a server with libraries). Signed out with one library the two doors give way to one quiet row, 'One library on this iPhone — Sign in with PicPlace to add your other libraries here or start a new one.' A SWITCH is a new model over the other folder, in place (L22): the tree re-roots and lands back on Settings. The Libraries header carries SettingsAnchor.libraries, so LL_SCROLL=libraries lands here; LL_LIBRARY=switch:|add:|new:|remove:|rename: works the doors without a finger. Verified 2026-09-17 on the Simulator 'C2c Bench' with the throwaway account (the drawn names are Steven's world: Prague LetsLapse Shots open, Holidays and the phone's own library beside it). The tab bar is drawn simplified (labels only).</desc>
  <defs>
