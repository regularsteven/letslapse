        <text x="361" y="623" font-size="15" fill="#6D6D72" text-anchor="end">401 projects · 300,9 MB</text>
        <text x="32" y="640" font-size="11.5" fill="#6D6D72">originals for 98</text>
        <line x1="32" y1="658" x2="361" y2="658" stroke="#000" stroke-opacity="0.08"/>
        <text x="32" y="685" font-size="16" fill="#000">Library “Prague</text>
        <text x="32" y="704" font-size="16" fill="#000">LetsLapse Shots”</text>
        <text x="361" y="694" font-size="15" fill="#6D6D72" text-anchor="end">@regularsteven on pic…</text>
        <text x="32" y="722" font-size="11.5" fill="#6D6D72">Connected on 17. 9. 2026 at 14:23</text>
