<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Shape-mation · home · portrait</title>
  <desc>Mirrors App/Shapemation/ShapemationHomeView.swift (2026-09-11, code first, mirrored from the running app — iPhone 16 Pro simulator, LL_SHAPEMATION=home) over ShapemationStore (the List door's count) and the per-project ShapeRegister sidecars (the SHAPE REGISTER card). A sheet from the Create tab's "Create Shape-mation" row, under Manage presets (create-home.portrait.svg); it owns its own NavigationStack the way the Presets sheet does, so Find shapes, the builder and the list push inside it. Large title "Shape-mation", Done trailing. Then, at 16-pt padding: the intro paragraph (14, secondary, three lines as wrapped on the 402-pt device); the DOORS card (llCard 18) — three chevron rows, each a 30-pt rounded-8 icon tile, a 16-pt title, a 12-pt secondary detail line, separated by hairlines inset 58 from the card edge: Find shapes (viewfinder.circle on LL.accent, "Analyse projects not yet checked"), Create shape slideshow (square.stack.3d.down.right on Shape-mation's own purple #6E5AC8, "Pick a shape, the projects, and a mode"), List Shape-mations (list.and.film on LL.accentDeep, the store's count — "1 video", "None yet" when empty). Then the SHAPE REGISTER card (llCard 18): an 11-pt semibold secondary label, "10 projects analysed · 8 with shapes" at 14, and one 13-pt medium capsule chip per shape family that has a count (accent at 12 % over white), in family order — circle 5 · oval 1 · square 7 · rectangle 7 — the family's own SF Symbol as the chip's glyph. With nothing analysed the card reads "No project has been analysed yet. Start with Find shapes." and shows no chips; the card is absent until the counts have loaded. Measured geometry: the shipped sheet's top edge sits at y 72 on the 16 Pro (the Create tab's scaled-back edge shows as a 10-pt band above it), not at the design-first Presets template's 56; on the 393-pt canvas device the same edge lands at 69.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="sheet"><rect x="0" y="72" width="393" height="780" rx="18"/></clipPath>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.05"/></filter>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.m{font-weight:500}.sec{fill:#6D6D72}.ter{fill:#C6C6CB}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#000"/>
    <g transform="translate(24,24)">

      <!-- status bar over the shrunken Create tab behind the sheet -->
      <g id="status-bar" fill="#FFF">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g id="signal"><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path id="wifi" d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#FFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g id="battery"><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#FFF" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#FFF" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>
      <!-- the Create tab's top edge, scaled back behind the sheet (measured: a 10-pt band, inset 19) -->
      <rect x="19" y="62" width="355" height="30" rx="12" fill="#D5D5D9"/>

      <!-- the sheet -->
      <g id="shapemation-sheet" clip-path="url(#sheet)">
        <rect x="0" y="72" width="393" height="780" fill="#F2F2F7"/>
        <text x="376.5" y="106.3" font-size="17" class="sb" fill="#C36A00" text-anchor="end">Done</text>
        <text x="16" y="164" font-size="34" class="b" fill="#000">Shape-mation</text>

        <g id="intro" font-size="14" class="sec">
          <text x="16" y="209">Find a shape that repeats across your photos — a clock</text>
          <text x="16" y="226">face, a sign, a window — and stack the photos so the</text>
          <text x="16" y="243">shape holds still while the world changes behind it.</text>
        </g>

        <g id="doors">
          <rect x="16" y="262.5" width="361" height="173" rx="18" fill="#FFF" filter="url(#card)"/>
          <g id="door-find">
            <rect x="32" y="276.3" width="30" height="30" rx="8" fill="#C36A00"/>
            <g data-symbol="viewfinder.circle" fill="none" stroke="#FFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="47" cy="291.3" r="6.7"/>
              <path d="M43.4 289.9 v-1 a1.6 1.6 0 0 1 1.6 -1.6 h1 M48 287.3 h1 a1.6 1.6 0 0 1 1.6 1.6 v1 M50.6 292.7 v1 a1.6 1.6 0 0 1 -1.6 1.6 h-1 M46 295.3 h-1 a1.6 1.6 0 0 1 -1.6 -1.6 v-1"/>
            </g>
            <text x="74" y="288" font-size="16" fill="#000">Find shapes</text>
            <text x="74" y="305.5" font-size="12" class="sec">Analyse projects not yet checked</text>
            <path d="M354.5 286 l5 5.3 -5 5.3" stroke="#C6C6CB" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.right"/>
          </g>
          <line x1="74" y1="320" x2="377" y2="320" stroke="#C6C6C8" stroke-width="0.5"/>
          <g id="door-build">
            <rect x="32" y="334.3" width="30" height="30" rx="8" fill="#6E5AC8"/>
            <g data-symbol="square.stack.3d.down.right" fill="none" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M40.5 340.2 l3 1.6 M40.5 340.2 v9.6 l3 1.6"/>
              <path d="M43.5 341.8 l3 1.6 M43.5 341.8 v9.6 l3 1.6"/>
              <path d="M46.5 343.4 l7 3.7 v9.8 l-7 -3.7 z"/>
            </g>
            <text x="74" y="346" font-size="16" fill="#000">Create shape slideshow</text>
            <text x="74" y="363.5" font-size="12" class="sec">Pick a shape, the projects, and a mode</text>
            <path d="M354.5 344 l5 5.3 -5 5.3" stroke="#C6C6CB" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.right"/>
          </g>
          <line x1="74" y1="378" x2="377" y2="378" stroke="#C6C6C8" stroke-width="0.5"/>
          <g id="door-list">
            <rect x="32" y="392.3" width="30" height="30" rx="8" fill="#8A4A00"/>
            <g data-symbol="list.and.film" fill="none" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M39.5 401 h15 M39.5 405.2 h6 M39.5 409 h6 M39.5 412.8 h6"/>
              <rect x="47.8" y="403.6" width="7" height="10" rx="1"/>
              <path d="M49.6 403.6 v10 M53 403.6 v10 M47.8 406.4 h1.8 M53 406.4 h1.8 M47.8 410.8 h1.8 M53 410.8 h1.8"/>
            </g>
            <text x="74" y="404" font-size="16" fill="#000">List Shape-mations</text>
            <text x="74" y="421.5" font-size="12" class="sec">1 video</text>
            <path d="M354.5 402 l5 5.3 -5 5.3" stroke="#C6C6CB" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.right"/>
          </g>
        </g>

        <g id="shape-register">
          <rect x="16" y="452" width="361" height="104" rx="18" fill="#FFF" filter="url(#card)"/>
          <text x="32" y="478.3" font-size="11" class="sb sec">SHAPE REGISTER</text>
          <text x="32" y="502" font-size="14" fill="#000">10 projects analysed · 8 with shapes</text>
          <g id="family-chips" font-size="13" class="m">
            <g id="chip-circle">
              <rect x="32" y="514.3" width="51.3" height="25.3" rx="12.65" fill="#F6EBDF"/>
              <circle cx="49.3" cy="526.8" r="6.4" fill="none" stroke="#000" stroke-width="1.4" data-symbol="circle"/>
              <text x="66" y="531.5" fill="#000">5</text>
            </g>
            <g id="chip-oval">
              <rect x="91.7" y="514.3" width="53" height="25.3" rx="12.65" fill="#F6EBDF"/>
              <ellipse cx="110.8" cy="526.8" rx="8.2" ry="5.5" fill="none" stroke="#000" stroke-width="1.4" data-symbol="oval"/>
              <text x="129" y="531.5" fill="#000">1</text>
            </g>
            <g id="chip-square">
              <rect x="153" y="514.3" width="50.7" height="25.3" rx="12.65" fill="#F6EBDF"/>
              <rect x="164.7" y="521.5" width="11.3" height="10.6" rx="2" fill="none" stroke="#000" stroke-width="1.4" data-symbol="square"/>
              <text x="186.5" y="531.5" fill="#000">7</text>
            </g>
            <g id="chip-rectangle">
              <rect x="212" y="514.3" width="54" height="25.3" rx="12.65" fill="#F6EBDF"/>
              <rect x="223.7" y="521.6" width="14.3" height="10.4" rx="2" fill="none" stroke="#000" stroke-width="1.4" data-symbol="rectangle"/>
              <text x="249" y="531.5" fill="#000">7</text>
            </g>
          </g>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Shape-mation · home · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors ShapemationHomeView · SHAPE REGISTER · LL_SHAPEMATION=home</text>
</svg>
