<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Capture — Interval (running, Ladder) · portrait</title>
  <desc>Mirrors App/LightLadderViews.swift (LadderRail, LadderToast) inside App/CaptureView.swift (ladderViewfinderOverlays, intervalRunningPills, holyGrailReadout) over CameraController.LadderState and the Holy Grail engine — the handoff's 2f state, 41:08 into a Ladder shoot. The Holy Grail readout keeps its geometry: line 1 the exposure the servo has arrived at ("1/8 · ISO 1250"), line 2 the smoothed scene EV and the frame count, and line 3 — the slot that reads "shutter at max · ISO ramping" under Dynamic — now carries the ladder: "Dusk · every 2 s · blend 3 → 2, thermal" in amber (the active rung, its pacing, and the governor's clamp; when a pinned shutter also applies, that amber warning wins the line). The RAIL sits at the viewfinder's trailing edge, 14 pt in, vertically centred: one bar per rung, heights proportional to EV span inside the 16 … −2 window (Daylight 3 · Fading 5 · Dusk 4 · Night 6 of a 180 pt total, 5 pt apart, 14 pt wide at 30% — the last at 60% with a faint ring), the ACTIVE rung widened to 22 pt, opaque, ringed 2 pt in LL.amber, its name in an amber chip beside it (black 55%, r6, 11 semibold, max 90 pt). The TOAST — "Stepped down to Dusk" (or "Stepped up to …"), a capsule 34 pt tall, black 65%, with a four-line ladder glyph whose active line is amber — appears for 3 s on a rung change, 28 pt above the viewfinder's bottom edge. The burst pill runs open-ended (823 outputs — a zebra this dense reads as a solid amber bar); the elapsed pill keeps the run clock. Mode row hidden and the shutter is the stop square while capturing. Staged by LL_LADDER=running with LL_CAPTURE=1: the simulator has no camera to meter, so the hook fabricates the built-in on Dusk at scene EV 5.2, 823 frames, 41:08, the governor at blend 3 → 2 and fires the toast 2 s in — there the session is not truly recording, so the sim screenshot keeps the mode row and record button that a real run hides; the overlays are drawn here on the device's 4:3 frame.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="tile"><rect x="16" y="728" width="60" height="60" rx="12"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232B3B"/><stop offset="0.62" stop-color="#3A3628"/><stop offset="1" stop-color="#4A3A22"/>
    </linearGradient>
    <linearGradient id="zebra" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB340" stop-opacity="0.3"/><stop offset="1" stop-color="#FFB340" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#000"/>
    <g transform="translate(24,24)">

      <!-- viewfinder 4:3 -->
      <g id="viewfinder">
        <rect x="0" y="86" width="393" height="440" fill="url(#sky)"/>
        <circle cx="132" cy="252" r="28" fill="#FFB340" opacity="0.9"/>
        <circle cx="132" cy="252" r="48" fill="#FFB340" opacity="0.15"/>
        <polygon points="0,370 70,330 150,364 235,308 310,357 393,321 393,526 0,526" fill="#141A24"/>
        <polygon points="0,429 85,395 185,434 268,405 393,429 393,526 0,526" fill="#0B0E14"/>
        <rect x="0" y="473" width="393" height="53" fill="#080A0E"/>
      </g>

      <!-- top bar: close stays; format pill locked -->
      <g id="top-bar">
        <g id="close" data-symbol="xmark">
          <circle cx="35" cy="88" r="19" fill="#2B2B2E" opacity="0.9"/>
          <path d="M29.5 82.5 L40.5 93.5 M40.5 82.5 L29.5 93.5" stroke="#FFF" stroke-width="2.2" stroke-linecap="round"/>
        </g>
        <g id="format-pill">
          <rect x="198" y="70" width="179" height="35" rx="17.5" fill="#2B2B2E" opacity="0.9"/>
          <text x="212" y="92" font-size="13" class="sb" fill="#FFF" opacity="0.55">12MP 4:3</text>
          <text x="274" y="92" font-size="13" class="sb" fill="#FFF" opacity="0.55">· JPEG</text>
          <g data-symbol="lock.fill" transform="translate(356,80)">
            <rect x="0" y="5" width="10" height="8" rx="1.5" fill="#FFF" opacity="0.4"/>
            <path d="M2 5 v-1.5 a3 3 0 0 1 6 0 V5" fill="none" stroke="#FFF" stroke-opacity="0.4" stroke-width="1.6"/>
          </g>
        </g>
        <g id="headroom-chip">
          <rect x="106" y="72" width="84" height="31" rx="15.5" fill="#2B2B2E" opacity="0.9"/>
          <g data-symbol="internaldrive" stroke="#FFF" stroke-width="1.2" fill="none">
            <rect x="117" y="82.5" width="12" height="10" rx="2.5"/>
            <path d="M119.5 89.5 h7 M119.5 91.5 h7" stroke-linecap="round"/>
          </g>
          <text x="134" y="92.0" font-size="12.5" class="sb" fill="#FFF">≈10.5k</text>
        </g>
      </g>

      <!-- LADDER RAIL — trailing, 14 pt in, centred on the viewfinder -->
      <g id="ladder-rail">
        <rect x="345" y="200" width="34" height="211" rx="17" fill="#000" opacity="0.45"/>
        <rect x="355" y="208" width="14" height="30" rx="7" fill="#FFB340" opacity="0.3"/>
        <rect x="355" y="243" width="14" height="50" rx="7" fill="#C36A00" opacity="0.3"/>
        <g id="rail-active-rung">
          <rect x="351" y="298" width="22" height="40" rx="11" fill="#8A4A00"/>
          <rect x="351" y="298" width="22" height="40" rx="11" fill="none" stroke="#FFB340" stroke-width="2"/>
        </g>
        <rect x="355" y="343" width="14" height="60" rx="7" fill="#1C1C1E" opacity="0.6"/>
        <rect x="355" y="343" width="14" height="60" rx="7" fill="none" stroke="#FFF" stroke-opacity="0.15"/>
        <g id="rail-name-chip">
          <rect x="295" y="308" width="42" height="20" rx="6" fill="#000" opacity="0.55"/>
          <text x="316" y="322" font-size="11" class="sb" fill="#FFB340" text-anchor="middle">Dusk</text>
        </g>
      </g>

      <!-- TOAST — 3 s on a rung change, 28 pt above the viewfinder's foot -->
      <g id="ladder-toast">
        <rect x="102" y="464" width="189" height="34" rx="17" fill="#000" opacity="0.65"/>
        <g id="toast-glyph">
          <rect x="116" y="475" width="11" height="1.8" rx="1" fill="#FFF" opacity="0.3"/>
          <rect x="116" y="478.3" width="11" height="1.8" rx="1" fill="#FFF" opacity="0.3"/>
          <rect x="116" y="481.6" width="11" height="1.8" rx="1" fill="#FFB340"/>
          <rect x="116" y="484.9" width="11" height="1.8" rx="1" fill="#FFF" opacity="0.3"/>
        </g>
        <text x="135" y="485.5" font-size="12.5" class="sb" fill="#FFF">Stepped down to Dusk</text>
      </g>

      <!-- running pills + readout -->
      <g id="interval-running">
        <g id="running-pills">
          <rect x="33" y="600" width="249" height="26" rx="13" fill="#000" opacity="0.5"/>
          <rect x="45" y="610.5" width="170" height="5" rx="2.5" fill="#FFF" opacity="0.16"/>
          <rect x="45" y="610.5" width="170" height="5" rx="2.5" fill="url(#zebra)"/>
          <text x="271" y="617.5" font-size="12" class="m" text-anchor="end" fill="#FFB340">823</text>
          <rect x="294" y="600" width="66" height="26" rx="13" fill="#000" opacity="0.5"/>
          <text x="327" y="617" font-size="11.5" class="m" fill="#FFF" opacity="0.7" text-anchor="middle">41:08</text>
        </g>
        <g id="holy-grail-readout">
          <rect x="72" y="634" width="249" height="63" rx="8" fill="#000" opacity="0.5"/>
          <text x="82" y="650" font-size="10.5" class="m" fill="#FFF" opacity="0.75">1/8 · ISO 1250</text>
          <text x="82" y="666" font-size="10.5" class="m" fill="#FFF" opacity="0.75">scene EV 5.2 · 823 frames</text>
          <text x="82" y="682" font-size="10.5" class="m" fill="#FFB340">Dusk · every 2 s · blend 3 → 2, thermal</text>
        </g>
      </g>

      <!-- shutter row (mode row hidden while capturing) -->
      <g id="shutter-row">
        <g id="recent-tile">
          <g clip-path="url(#tile)">
            <rect x="16" y="728" width="60" height="60" fill="#3A3123"/>
            <polygon points="16,772 40,750 62,768 76,758 76,788 16,788" fill="#241E15"/>
          </g>
          <rect x="16" y="728" width="60" height="60" rx="12" fill="none" stroke="#FFF" stroke-opacity="0.35"/>
        </g>
        <g id="grid-toggle" data-symbol="grid.circle">
          <circle cx="108" cy="732" r="22" fill="#2B2B2E" opacity="0.9"/>
          <circle cx="108" cy="732" r="10" fill="none" stroke="#FFF" stroke-width="1.6"/>
          <path d="M101.5 728.7 h13 M101.5 735.3 h13 M104.7 725.5 v13 M111.3 725.5 v13" stroke="#FFF" stroke-width="1.2"/>
        </g>
        <g id="focus-lock" data-symbol="camera.metering.center.weighted">
          <circle cx="108" cy="784" r="22" fill="#2B2B2E" opacity="0.9"/>
          <circle cx="108" cy="784" r="10" fill="none" stroke="#FFF" stroke-width="1.6"/>
          <circle cx="108" cy="784" r="4.5" fill="#FFF"/>
        </g>
        <g id="shutter" data-symbol="stop button">
          <circle cx="196.5" cy="758" r="38" fill="none" stroke="#FFF" stroke-width="4"/>
          <rect x="180.5" y="742" width="32" height="32" rx="8" fill="#FF3B30"/>
        </g>
        <g id="delay-toggle" data-symbol="timer">
          <circle cx="285" cy="732" r="22" fill="#2B2B2E" opacity="0.9"/>
          <circle cx="285" cy="733" r="9" fill="none" stroke="#FFF" stroke-width="1.7"/>
          <path d="M285 733 v-6 M282 723 h6" stroke="#FFF" stroke-width="1.7" stroke-linecap="round"/>
        </g>
        <g id="steady-toggle" data-symbol="hand.raised">
          <circle cx="285" cy="784" r="22" fill="#2B2B2E" opacity="0.9"/>
          <path d="M280 789 v-9 m3 9 v-11 m3 11 v-11 m3 11 v-9 m-9 9 a6 6 0 0 0 9 0 v-3" fill="none" stroke="#FFF" stroke-width="1.6" stroke-linecap="round"/>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000" stroke="#2A2A2E" stroke-width="1"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#FFF" opacity="0.4"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Capture — Interval (running, Ladder) · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors LightLadderViews (LadderRail · LadderToast) · holyGrailReadout line 3 · LL_LADDER=running</text>
</svg>
