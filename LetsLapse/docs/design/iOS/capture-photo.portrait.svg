<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Capture — Photo (idle, JPEG) · portrait</title>
  <desc>Mirrors App/CaptureView.swift (photoControlsRow) + App/CaptureDials.swift (PhotoBlendDial) + App/CaptureHeadroom.swift (CaptureHeadroomChip). Photo mode, JPEG output: still label in the format pill with the storage-headroom chip ahead of it, 16:9 preview. The single BLEND dial reads a bare count; its menu is Bulb · 20 Frames · 10 Frames · 5 Frames · 3 Frames · Off, the same list Interval uses. Same shutter row as the other modes; the steady toggle arms the capture-when-steady gate.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="tile"><rect x="16" y="728" width="60" height="60" rx="12"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232B3B"/><stop offset="0.62" stop-color="#3A3628"/><stop offset="1" stop-color="#4A3A22"/>
    </linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#000"/>
    <g transform="translate(24,24)">

      <!-- viewfinder 16:9 -->
      <g id="viewfinder">
        <rect x="0" y="89" width="393" height="699" fill="url(#sky)"/>
        <circle cx="132" cy="360" r="30" fill="#FFB340" opacity="0.9"/>
        <circle cx="132" cy="360" r="52" fill="#FFB340" opacity="0.15"/>
        <polygon points="0,552 70,500 150,544 235,472 310,534 393,490 393,788 0,788" fill="#141A24"/>
        <polygon points="0,638 85,594 185,646 268,608 393,640 393,788 0,788" fill="#0B0E14"/>
        <rect x="0" y="700" width="393" height="88" fill="#080A0E"/>
      </g>

      <!-- top bar -->
      <g id="top-bar">
        <g id="close" data-symbol="xmark">
          <circle cx="35" cy="88" r="19" fill="#2B2B2E" opacity="0.9"/>
          <path d="M29.5 82.5 L40.5 93.5 M40.5 82.5 L29.5 93.5" stroke="#FFF" stroke-width="2.2" stroke-linecap="round"/>
        </g>
        <g id="format-pill">
          <rect x="217" y="70" width="160" height="35" rx="17.5" fill="#2B2B2E" opacity="0.9"/>
          <text x="231" y="92" font-size="13" class="sb" fill="#FFF">1920×1080</text>
          <text x="306" y="92" font-size="13" class="sb" fill="#FFF">· JPEG</text>
          <path d="M356 85 l4.5 5 l4.5 -5" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
        </g>
        <!-- storage headroom: what is left of the disk in the armed format -->
        <g id="headroom-chip">
          <rect x="62" y="72" width="147" height="31" rx="15.5" fill="#2B2B2E" opacity="0.9"/>
          <g data-symbol="internaldrive" stroke="#FFF" stroke-width="1.2" fill="none">
            <rect x="73" y="82.5" width="12" height="10" rx="2.5"/>
            <path d="M75.5 89.5 h7 M75.5 91.5 h7" stroke-linecap="round"/>
          </g>
          <text x="90" y="92.0" font-size="12.5" class="sb" fill="#FFF">≈62.5k</text>
          <text x="140" y="92.0" font-size="12.5" fill="#FFF" opacity="0.45">· 32.4 GB</text>
        </g>
      </g>

      <!-- photo controls: single BLEND dial. Menu top-to-bottom
           Bulb · 20 Frames · 10 Frames · 5 Frames · 3 Frames · Off — the same
           list, order and wording Interval's dial uses -->
      <g id="photo-controls">
          <text x="147" y="657" font-size="10" class="b" fill="#FFF" opacity="0.45" letter-spacing="0.8">BLEND</text>
          <rect x="193" y="639" width="53" height="27" rx="13.5" fill="#2B2B2E" opacity="0.9"/>
          <text x="205" y="657" font-size="12.5" class="sb" fill="#FFF">10</text>
          <path d="M226 650 l4 4.5 l4 -4.5" stroke="#FFF" stroke-opacity="0.4" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
      </g>

      <!-- mode row + zoom chips -->
      <g id="mode-row" font-size="13" class="sb">
        <text x="44" y="697" fill="#FFB340" letter-spacing="0.3">PHOTO</text>
        <text x="105" y="697" fill="#FFF" opacity="0.5" letter-spacing="0.3">INTERVAL</text>
        <text x="185" y="697" fill="#FFF" opacity="0.5" letter-spacing="0.3">VIDEO</text>
        <g id="zoom-chips" data-symbol="lens buttons">
          <circle cx="256" cy="692" r="15" fill="none" stroke="#FFF" stroke-opacity="0.25"/>
          <text x="256" y="696" font-size="12" class="sb" fill="#FFF" opacity="0.6" text-anchor="middle">.5×</text>
          <circle cx="294" cy="692" r="15" fill="none" stroke="#FFB340" stroke-opacity="0.8"/>
          <text x="294" y="696" font-size="12" class="sb" fill="#FFB340" text-anchor="middle">1×</text>
          <circle cx="332" cy="692" r="15" fill="none" stroke="#FFF" stroke-opacity="0.25"/>
          <text x="332" y="696" font-size="12" class="sb" fill="#FFF" opacity="0.6" text-anchor="middle">3×</text>
        </g>
      </g>

      <!-- shutter row -->
      <g id="shutter-row">
        <g id="recent-tile">
          <g clip-path="url(#tile)">
            <rect x="16" y="728" width="60" height="60" fill="#3A3123"/>
            <polygon points="16,772 40,750 62,768 76,758 76,788 16,788" fill="#241E15"/>
          </g>
          <rect x="16" y="728" width="60" height="60" rx="12" fill="none" stroke="#FFF" stroke-opacity="0.35"/>
        </g>
        <!-- Shutter cluster: shared component (ring + four framing slots). Edit ../components/shutter-cluster.idle.portrait.svg,
             not this file; placement = ring centre (196.5, 758) minus (90, 50). Contract: components/README.md -->
        <image id="shutter-cluster" href="../components/shutter-cluster.idle.portrait.svg" x="106.5" y="708" width="180" height="100"/>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000" stroke="#2A2A2E" stroke-width="1"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#FFF" opacity="0.4"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Capture — Photo (idle, JPEG) · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/CaptureView.swift — photoControlsRow · steadyToggleCircle</text>
</svg>
