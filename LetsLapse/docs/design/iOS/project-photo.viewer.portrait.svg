<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Photo grading viewer · Customise collapsed · portrait</title>
  <desc>Mirrors App/PhotoViewerView.swift, the sheet presented from App/ProjectDetailView.swift (GradingCard's expand button) for a Photo-mode capture — and for an interval shoot, which opens it on its first source frame and persists the grade onto the same project fields. (A video project has no such viewer; it customises in the card — see project-detail.video.portrait.svg.) Not to be confused with project-photos.viewer.portrait.svg, which is the interval-frame pager (CaptureFrameViewer). Stacked layout, used whenever the available width is under 500pt — iPhone portrait at 393–440pt, and nothing else: the iPad sheet (~578pt) and iPhone landscape both take the side rail. The graded image sits on top, then the preset chip strip, the collapsed Customise disclosure, and Save as Preset. The image renders through PhotoGrader.render(url:preset:adjustments:maxDimension:) at 2000px, so it shows the live grade rather than the untouched original; renders are debounced 100ms. The control rail hugs its content (layoutPriority 1) so the photo keeps every point the controls do not need. Chips are the five built-ins (Natural · Cinema · Matte · Vivid · Original) followed by any saved CustomPreset; the strip scrolls horizontally, so Original is clipped at the screen edge at this width. A built-in chip is highlighted only when no saved preset matches the current preset+adjustments exactly. Long-pressing a custom chip offers Delete preset. See project-photo.viewer.expanded.portrait.svg for the open panel and project-photo.viewer.landscape.svg for the side rail.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="sheet"><rect x="24" y="94" width="393" height="782" rx="10"/></clipPath>
    <clipPath id="photo"><rect x="33.75" y="156" width="373.5" height="498"/></clipPath>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <!-- dimmed project detail behind the sheet -->
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)" opacity="0.4">
      <text x="196.5" y="60" font-size="17" class="sb" fill="#000" text-anchor="middle">Photo of rocks</text>
    </g>

    <!-- sheet -->
    <g clip-path="url(#sheet)">
      <rect x="24" y="94" width="393" height="782" fill="#F2F2F7"/>
      <g transform="translate(24,94)">
        <rect x="178.5" y="6" width="36" height="5" rx="2.5" fill="#000" opacity="0.2"/>

        <!-- title bar (.bar material) -->
        <g id="title-bar">
          <rect x="0" y="14" width="393" height="48" fill="#F7F7FA"/>
          <rect x="0" y="61.5" width="393" height="0.5" fill="#000" opacity="0.12"/>
          <text x="20" y="44" font-size="15.5" class="sb" fill="#C36A00">Done</text>
          <text x="196.5" y="44" font-size="15.5" class="sb" fill="#000" text-anchor="middle">Photo of rocks</text>
        </g>

        <!-- image pane: scaledToFit against black, 3:4 still letterboxed -->
        <g id="image-pane">
          <rect x="0" y="62" width="393" height="498" fill="#000"/>
        </g>
      </g>
    </g>

    <!-- the graded still, drawn in screen space so the clip path is simple -->
    <g clip-path="url(#photo)">
      <rect x="33.75" y="156" width="373.5" height="498" fill="#8FB4CE"/>
      <rect x="33.75" y="156" width="373.5" height="230" fill="#A9C8DC"/>
      <ellipse cx="150" cy="250" rx="120" ry="46" fill="#E4EEF4" opacity="0.75"/>
      <ellipse cx="300" cy="215" rx="90" ry="34" fill="#E4EEF4" opacity="0.6"/>
      <polygon points="33.75,404 120,330 190,392 268,300 330,360 407,318 407,654 33.75,654" fill="#C9C6BE"/>
      <polygon points="33.75,470 96,430 150,478 214,436 270,486 340,442 407,470 407,654 33.75,654" fill="#B4B1A8"/>
      <path d="M300 300 l30 -18 v372 h-30 z" fill="#6E6B64"/>
      <g fill="#3E5B33">
        <polygon points="86,300 116,404 56,404"/>
        <polygon points="86,352 122,466 50,466"/>
        <polygon points="86,420 128,548 44,548"/>
        <polygon points="212,470 236,548 188,548"/>
        <polygon points="212,512 242,600 182,600"/>
      </g>
      <rect x="82" y="404" width="7" height="220" fill="#4A3B2A"/>
      <rect x="209" y="548" width="6" height="106" fill="#4A3B2A"/>
    </g>

    <g clip-path="url(#sheet)">
      <g transform="translate(24,94)">
        <!-- preset chip strip (horizontal scroll; Original clipped at the edge) -->
        <g id="preset-strip">
          <rect x="18" y="574" width="76" height="33" rx="16.5" fill="#C36A00"/>
          <text x="56" y="595.5" font-size="13.5" class="sb" fill="#FFF" text-anchor="middle">Natural</text>
          <rect x="102" y="574" width="77" height="33" rx="16.5" fill="#FFF"/>
          <text x="140.5" y="595.5" font-size="13.5" class="sb" fill="#000" text-anchor="middle">Cinema</text>
          <rect x="187" y="574" width="66" height="33" rx="16.5" fill="#FFF"/>
          <text x="220" y="595.5" font-size="13.5" class="sb" fill="#000" text-anchor="middle">Matte</text>
          <rect x="261" y="574" width="61" height="33" rx="16.5" fill="#FFF"/>
          <text x="291.5" y="595.5" font-size="13.5" class="sb" fill="#000" text-anchor="middle">Vivid</text>
          <rect x="330" y="574" width="90" height="33" rx="16.5" fill="#FFF"/>
          <text x="375" y="595.5" font-size="13.5" class="sb" fill="#000" text-anchor="middle">Original</text>
        </g>

        <!-- Customise disclosure, collapsed (chevron.down rotated -90) -->
        <g id="customise">
          <rect x="16" y="621" width="361" height="50" rx="12" fill="#FFF"/>
          <text x="30" y="651.5" font-size="15" class="sb" fill="#000">Customise</text>
          <path d="M352 645 l7 6 -7 6" stroke="#6D6D72" stroke-width="2.2" fill="none"
                stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.down"/>
        </g>

        <!-- Save as Preset -->
        <g id="save-preset">
          <rect x="16" y="685" width="361" height="50" rx="12" fill="#FFF"/>
          <g data-symbol="square.and.arrow.down" stroke="#C36A00" stroke-width="1.9" fill="none" stroke-linecap="round">
            <path d="M141 703 v13 M136 711 l5 5 5 -5"/>
            <path d="M134 700 v-3 h14 v3" stroke-opacity="0.9"/>
          </g>
          <text x="157" y="715.5" font-size="15" class="sb" fill="#C36A00">Save as Preset</text>
        </g>
      </g>
    </g>

    <!-- hardware -->
    <g transform="translate(24,24)">
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Photo grading viewer · Customise collapsed · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/PhotoViewerView.swift — stacked layout under 500pt · preset chips · collapsed Customise · Save as Preset</text>
</svg>
