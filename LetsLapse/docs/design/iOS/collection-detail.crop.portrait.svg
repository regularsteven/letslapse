<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Collection detail · crop on the preview · portrait</title>
  <desc>Mirrors App/CollectionDetailView.swift (previewSurface + cropFrame, commitCrop): the timeline builder when the selected clip mismatches the canvas — City set, 9:16 canvas over a 16:9 clip. The preview shows the clip itself filling its shape; the largest canvas-shaped rect becomes a draggable white 2pt frame with rule-of-thirds lines, everything outside dimmed black 60%. Dragging pans the frame along the free axis; on release: a collection-local crop updates in place ("Crop updated for this collection"); else if the clip's default crop for this ratio exists AND another collection uses the clip, the "Save this crop?" alert offers Replace the default / Just for City set / Cancel; else it saves silently as the clip's default ("Saved as this clip's default 9:16 crop"). Caption is honest pixels: "Drag the white frame — it keeps 608×1080 of 1920×1080 for the 9:16 export." Rows carry CROP 9:16 badges (outlined accent); a collection-local override adds "· CUSTOM". Below the fold: dark summary card (total timecode 26 bold · "exports 2160×3840" · "3 clips · 9:16 canvas" · "Trims retime the cut automatically — clips always butt together."), "Export collection" primary CTA (50pt), and when a kept render exists a "Last export kept · today 14:02" row (50pt, green check, trailing Share) — 140pt clearance keeps them above the tab bar at scroll end. Tall (aspect &lt; 1) clips also get an "Apply letterbox / Remove letterbox" pill bottom-right of the preview.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="preview"><rect x="16" y="115" width="361" height="203" rx="12"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.05"/></filter>
    <linearGradient id="clipA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33415A"/><stop offset="1" stop-color="#1B2330"/></linearGradient>
    <linearGradient id="clipB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A5A43"/><stop offset="1" stop-color="#232E1D"/></linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- inline nav -->
      <g id="nav">
        <circle cx="38" cy="84" r="17" fill="#FFF" filter="url(#card)"/>
        <path d="M42 76 l-8 8 8 8" stroke="#1C1C1E" stroke-width="2.6" fill="none" stroke-linecap="round" data-symbol="chevron.left"/>
        <text x="196.5" y="90" font-size="17" class="sb" fill="#000" text-anchor="middle">City set</text>
        <circle cx="355" cy="84" r="17" fill="#FFF" filter="url(#card)"/>
        <g stroke="#C36A00" fill="#C36A00" data-symbol="ellipsis.circle"><circle cx="355" cy="84" r="10" fill="none" stroke-width="1.8"/><circle cx="350" cy="84" r="1.4" stroke="none"/><circle cx="355" cy="84" r="1.4" stroke="none"/><circle cx="360" cy="84" r="1.4" stroke="none"/></g>
      </g>

      <!-- preview: 16:9 clip with the 9:16 crop frame -->
      <g id="crop-preview">
        <g clip-path="url(#preview)">
          <rect x="16" y="115" width="361" height="203" fill="url(#clipA)"/>
          <!-- dim outside the kept rect (crop x: 246-360, offset ≈ 0.5) -->
          <rect x="16" y="115" width="230" height="203" fill="#000" opacity="0.6"/>
          <rect x="360" y="115" width="17" height="203" fill="#000" opacity="0.6"/>
        </g>
        <!-- white frame (114×203 ≈ 9:16 of the 203pt clip height) + thirds -->
        <g id="crop-frame">
          <rect x="246" y="115" width="114" height="203" fill="none" stroke="#FFF" stroke-width="2"/>
          <path d="M284 115 v203 M322 115 v203 M246 182.7 h114 M246 250.3 h114" stroke="#FFF" stroke-opacity="0.35"/>
        </g>
        <rect x="26" y="125" width="118" height="19" rx="9.5" fill="#000" opacity="0.5"/>
        <text x="85" y="138" font-size="10.5" class="sb" fill="#FFF" text-anchor="middle">Tram Tester · 50×</text>
        <text x="196.5" y="337" font-size="11.5" class="sec" text-anchor="middle">Drag the white frame — it keeps 608×1080 of 1920×1080 for</text>
        <text x="196.5" y="352" font-size="11.5" class="sec" text-anchor="middle">the 9:16 export.</text>
      </g>

      <!-- CANVAS (9:16 selected, overriding) -->
      <g id="canvas-chips">
        <text x="20" y="386" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">CANVAS</text>
        <rect x="16" y="398" width="61" height="33" rx="16.5" fill="#FFF" filter="url(#card)"/>
        <text x="46.5" y="419" font-size="13.5" class="sb" fill="#000" text-anchor="middle">16:9</text>
        <rect x="85" y="398" width="61" height="33" rx="16.5" fill="#C36A00"/>
        <text x="115.5" y="419" font-size="13.5" class="sb" fill="#FFF" text-anchor="middle">9:16</text>
        <rect x="154" y="398" width="48" height="33" rx="16.5" fill="#FFF" filter="url(#card)"/>
        <text x="178" y="419" font-size="13.5" class="sb" fill="#000" text-anchor="middle">1:1</text>
        <rect x="210" y="398" width="54" height="33" rx="16.5" fill="#FFF" filter="url(#card)"/>
        <text x="237" y="419" font-size="13.5" class="sb" fill="#000" text-anchor="middle">4:3</text>
        <rect x="272" y="398" width="54" height="33" rx="16.5" fill="#FFF" filter="url(#card)"/>
        <text x="299" y="419" font-size="13.5" class="sb" fill="#000" text-anchor="middle">3:4</text>
        <text x="20" y="452" font-size="11.5" class="sec">9:16 — overriding the first clip’s 3:4. Export: 2160×3840.</text>
      </g>

      <!-- TIMELINE with crop badges -->
      <g id="timeline">
        <text x="20" y="488" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">TIMELINE · 3 CLIPS</text>
        <rect x="16" y="500" width="361" height="198" rx="16" fill="#FFF" filter="url(#card)"/>

        <!-- row 1: 3:4 clip (selected) -->
        <g id="row-1">
          <rect x="16" y="500" width="361" height="66" rx="12" fill="#C36A00" opacity="0.07"/>
          <rect x="28" y="512" width="58" height="42" rx="7" fill="url(#clipB)"/>
          <path d="M53 527 l9 6 -9 6 z" fill="#FFF" opacity="0.8"/>
          <text x="96" y="528" font-size="14.5" class="sb" fill="#000">Capture 27. 7. at 11:14</text>
          <text x="96" y="547" font-size="11.5" class="sec">50× · 28s</text>
          <rect x="160" y="536" width="66" height="14" rx="7" fill="#C36A00" opacity="0.06"/>
          <rect x="160" y="536" width="66" height="14" rx="7" fill="none" stroke="#C36A00" stroke-opacity="0.55" stroke-width="1.2"/>
          <text x="193" y="546" font-size="9.5" class="b" fill="#C36A00" text-anchor="middle">CROP 9:16</text>
          <circle cx="322" cy="533" r="17" fill="#C36A00" opacity="0.1"/>
          <g stroke="#C36A00" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M316 526 h-2 v14 h2 M328 526 h2 v14 h-2"/><path d="M319 533 h6"/></g>
          <path d="M352 527 h16 M352 533 h16 M352 539 h16" stroke="#B9B9BE" stroke-width="1.8" stroke-linecap="round"/>
        </g>
        <line x1="96" y1="566" x2="377" y2="566" stroke="#000" stroke-opacity="0.06"/>

        <!-- row 2: trimmed + crop -->
        <g id="row-2">
          <rect x="28" y="578" width="58" height="42" rx="7" fill="url(#clipA)"/>
          <path d="M53 593 l9 6 -9 6 z" fill="#FFF" opacity="0.8"/>
          <text x="96" y="594" font-size="14.5" class="sb" fill="#000">Tram Tester</text>
          <text x="96" y="613" font-size="11.5" class="sec">50× · 1…</text>
          <rect x="140" y="602" width="58" height="14" rx="7" fill="#FFB340" opacity="0.28"/>
          <text x="169" y="612" font-size="9.5" class="b" fill="#8A4A00" text-anchor="middle">TRIMMED</text>
          <rect x="204" y="602" width="66" height="14" rx="7" fill="#C36A00" opacity="0.06"/>
          <rect x="204" y="602" width="66" height="14" rx="7" fill="none" stroke="#C36A00" stroke-opacity="0.55" stroke-width="1.2"/>
          <text x="237" y="612" font-size="9.5" class="b" fill="#C36A00" text-anchor="middle">CROP 9:16</text>
          <circle cx="322" cy="599" r="17" fill="#C36A00" opacity="0.1"/>
          <g stroke="#C36A00" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M316 592 h-2 v14 h2 M328 592 h2 v14 h-2"/><path d="M319 599 h6"/></g>
          <path d="M352 593 h16 M352 599 h16 M352 605 h16" stroke="#B9B9BE" stroke-width="1.8" stroke-linecap="round"/>
        </g>
        <line x1="96" y1="632" x2="377" y2="632" stroke="#000" stroke-opacity="0.06"/>

        <!-- row 3: collection-local override -->
        <g id="row-3">
          <rect x="28" y="644" width="58" height="42" rx="7" fill="url(#clipA)"/>
          <path d="M53 659 l9 6 -9 6 z" fill="#FFF" opacity="0.8"/>
          <text x="96" y="660" font-size="14.5" class="sb" fill="#000">Tram Tester</text>
          <text x="96" y="679" font-size="11.5" class="sec">50× · 15s</text>
          <rect x="140" y="668" width="120" height="14" rx="7" fill="#C36A00" opacity="0.06"/>
          <rect x="140" y="668" width="120" height="14" rx="7" fill="none" stroke="#C36A00" stroke-opacity="0.55" stroke-width="1.2"/>
          <text x="200" y="678" font-size="9.5" class="b" fill="#C36A00" text-anchor="middle">CROP 9:16 · CUSTOM</text>
          <circle cx="322" cy="665" r="17" fill="#C36A00" opacity="0.1"/>
          <g stroke="#C36A00" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M316 658 h-2 v14 h2 M328 658 h2 v14 h-2"/><path d="M319 665 h6"/></g>
          <path d="M352 659 h16 M352 665 h16 M352 671 h16" stroke="#B9B9BE" stroke-width="1.8" stroke-linecap="round"/>
        </g>
      </g>

      <!-- summary card peeking below (scrolls fully into view; see desc) -->
      <g id="summary-peek">
        <rect x="16" y="710" width="361" height="120" rx="18" fill="#1C1C1E"/>
        <text x="32" y="746" font-size="26" class="b" fill="#FFF">0:59</text>
        <text x="361" y="742" font-size="12" fill="#FFF" opacity="0.65" text-anchor="end">exports 2160×3840</text>
        <text x="32" y="764" font-size="12.5" fill="#FFF" opacity="0.65">3 clips · 9:16 canvas</text>
      </g>

      <!-- floating tab bar -->
      <g id="tab-bar">
        <rect x="17.5" y="755" width="358" height="57" rx="28.5" fill="#FBFBFD" opacity="0.96" filter="url(#soft)"/>
        <rect x="17.5" y="755" width="358" height="57" rx="28.5" fill="none" stroke="#000" stroke-opacity="0.08"/>
        <g id="tab-create" fill="none" stroke="#8E8E93">
          <g transform="translate(56.5 776) scale(0.7727) translate(-11 -11)"><circle cx="11" cy="11" r="8" stroke-width="2.2" data-symbol="record.circle"/><circle cx="11" cy="11" r="3.4" fill="#8E8E93" stroke="none"/></g>
          <text x="56.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Create</text>
        </g>
        <g id="tab-gallery" fill="none" stroke="#8E8E93">
          <g transform="translate(126.5 776) scale(0.7727) translate(-11 -11)"><rect x="3" y="5.5" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(-6 10 10.5)" data-symbol="photo.on.rectangle.angled"/><rect x="6" y="8" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(4 13 13)"/></g>
          <text x="126.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Gallery</text>
        </g>
        <g id="tab-projects" fill="none" stroke="#8E8E93">
          <g transform="translate(196.5 776) scale(0.7727) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="square.stack"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="196.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Projects</text>
        </g>
        <g id="tab-collections" fill="none" stroke="#8E8E93">
          <g transform="translate(266.5 776) scale(0.7727) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="film.stack"/><path d="M7 4.5 v8 M15 4.5 v8" stroke-width="1.38" opacity="0.7"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="266.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Collections</text>
        </g>
        <g id="tab-settings" fill="none" stroke="#8E8E93">
          <g transform="translate(336.5 776) scale(0.7727) translate(-11 -11)"><path d="M3.5 6.5 h15 M3.5 11 h15 M3.5 15.5 h15" stroke-width="2.48" stroke-linecap="round" data-symbol="line.3.horizontal"/></g>
          <text x="336.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Settings</text>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Collection detail · crop on the preview · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/CollectionDetailView.swift — white crop frame w/ thirds · CROP badges (· CUSTOM) · summary card · save rules in desc</text>
</svg>
