<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Collection detail · crop on the preview · portrait</title>
  <desc>Mirrors App/CollectionDetailView.swift (previewSurface + cropFrame, cropHUDText/cropKeepLabel/lingerCropHUD, commitCrop): the timeline builder when the selected clip mismatches the canvas — City set, 9:16 canvas, 16:9 clip selected, drawn MID-DRAG. The preview shows the clip itself filling its shape; the largest canvas-shaped rect becomes a draggable white 2pt frame with rule-of-thirds lines, everything outside dimmed black 60%. Dragging pans the frame along the free axis, and while a finger holds it the HONEST-PIXELS HUD rides the preview's top — "keeps 1215×2160 of 3840×2160" on the on-media black 50% capsule, monospaced digits, 40pt down so it clears the clip badge's line — lingering 1.4s after release then fading. That HUD is all that remains of the retired caption row (the 2026-08-31 rework deleted the row: reassurance copy is gone, the empty-state guidance moved into the empty-timeline card, and the canvas choice moved onto the preview itself). It hides while the "Save this crop?" alert is up. On release: a collection-local crop updates in place ("Crop updated for this collection"); else if the clip's default crop for this ratio exists AND another collection uses the clip, the "Save this crop?" alert offers Replace the default / Just for City set / Cancel; else it saves silently as the clip's default ("Saved as this clip's default 9:16 crop"). The canvas menu chip sits bottom-right ON the media (9:16 current; rows are bare ratios widest→tallest with a checkmark on current and the first clip's shape marked). Tall (aspect &lt; 1) clips get the "Apply letterbox / Remove letterbox" pill bottom-LEFT — the chip owns bottom-right now. The header row carries TIMELINE · 2 CLIPS and the Ken Burns tri-state (Off here). Rows carry CROP 9:16 badges (outlined accent); a collection-local override adds "· CUSTOM". Then the dashed "+ Add clips" and the export path: dark summary card (0:26 · "exports 2160×3840" · "2 clips · 9:16 canvas" · "Trims retime the cut automatically — clips always butt together."), "Export collection" CTA, and the kept-render row "Last export kept · today 14:02" peeking behind the tab bar. At-rest screen: collection-detail.portrait.svg.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="preview"><rect x="16" y="115" width="361" height="203" rx="12"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.05"/></filter>
    <linearGradient id="clipA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33415A"/><stop offset="1" stop-color="#1B2330"/></linearGradient>
    <linearGradient id="clipB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A5A43"/><stop offset="1" stop-color="#232E1D"/></linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- inline nav -->
      <g id="nav">
        <circle cx="38" cy="84" r="17" fill="#FFF" filter="url(#card)"/>
        <path d="M42 76 l-8 8 8 8" stroke="#1C1C1E" stroke-width="2.6" fill="none" stroke-linecap="round" data-symbol="chevron.left"/>
        <text x="196.5" y="90" font-size="17" class="sb" fill="#000" text-anchor="middle">City set</text>
        <circle cx="355" cy="84" r="17" fill="#FFF" filter="url(#card)"/>
        <g stroke="#C36A00" fill="#C36A00" data-symbol="ellipsis.circle"><circle cx="355" cy="84" r="10" fill="none" stroke-width="1.8"/><circle cx="350" cy="84" r="1.4" stroke="none"/><circle cx="355" cy="84" r="1.4" stroke="none"/><circle cx="360" cy="84" r="1.4" stroke="none"/></g>
      </g>

      <!-- preview: 16:9 clip with the 9:16 crop frame (offset ≈ 0.48), mid-drag -->
      <g id="crop-preview">
        <g clip-path="url(#preview)">
          <rect x="16" y="115" width="361" height="203" fill="url(#clipA)"/>
          <rect x="16" y="115" width="128" height="203" fill="#000" opacity="0.6"/>
          <rect x="258" y="115" width="119" height="203" fill="#000" opacity="0.6"/>
        </g>
        <!-- white frame (114×203 ≈ 9:16 of the 203pt clip height) + thirds -->
        <g id="crop-frame">
          <rect x="144" y="115" width="114" height="203" fill="none" stroke="#FFF" stroke-width="2"/>
          <path d="M182 115 v203 M220 115 v203 M144 182.7 h114 M144 250.3 h114" stroke="#FFF" stroke-opacity="0.35"/>
        </g>
        <rect x="26" y="125" width="124" height="19" rx="9.5" fill="#000" opacity="0.5"/>
        <text x="88" y="138" font-size="10.5" class="sb" fill="#FFF" text-anchor="middle">Ridge sunset · 100×</text>
        <!-- honest-pixels HUD: only while a hand is in the crop (+1.4s linger) -->
        <g id="crop-hud">
          <rect x="105" y="155" width="183" height="18" rx="9" fill="#000" opacity="0.5"/>
          <text x="196.5" y="167.5" font-size="10.5" class="sb" fill="#FFF" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">keeps 1215×2160 of 3840×2160</text>
        </g>
        <g id="canvas-menu">
          <rect x="305" y="284" width="62" height="24" rx="12" fill="#000" opacity="0.55"/>
          <text x="328" y="300" font-size="12" class="sb" fill="#FFF" text-anchor="middle">9:16</text>
          <path d="M347 296 l4 4 4 -4" stroke="#FFF" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
        </g>
      </g>

      <!-- header row: TIMELINE left, Ken Burns tri-state right (Off) -->
      <g id="timeline-header">
        <text x="20" y="354" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">TIMELINE · 2 CLIPS</text>
        <text x="234" y="353" font-size="10.5" class="sb" fill="#6D6D72" text-anchor="end">Ken Burns</text>
        <rect x="240" y="336" width="137" height="28" rx="14" fill="#FFF" filter="url(#card)"/>
        <rect x="242" y="338" width="33" height="24" rx="12" fill="#C36A00"/>
        <text x="258.5" y="354" font-size="11" class="sb" fill="#FFF" text-anchor="middle">Off</text>
        <text x="297" y="354" font-size="11" class="sb" fill="#C36A00" text-anchor="middle">Auto</text>
        <text x="347" y="354" font-size="11" class="sb" fill="#C36A00" text-anchor="middle">Custom</text>
      </g>

      <!-- TIMELINE card, two rows -->
      <g id="timeline">
        <rect x="16" y="374" width="361" height="132" rx="16" fill="#FFF" filter="url(#card)"/>

        <!-- row 1 (selected · crop) -->
        <g id="row-1">
          <rect x="16" y="374" width="361" height="66" rx="12" fill="#C36A00" opacity="0.07"/>
          <rect x="28" y="386" width="58" height="42" rx="7" fill="url(#clipA)"/>
          <path d="M53 401 l9 6 -9 6 z" fill="#FFF" opacity="0.8" data-symbol="play.fill"/>
          <text x="96" y="402" font-size="14.5" class="sb" fill="#000">Ridge sunset</text>
          <text x="96" y="421" font-size="11.5" class="sec">100× · 15s</text>
          <rect x="168" y="410" width="66" height="14" rx="7" fill="#C36A00" opacity="0.06"/>
          <rect x="168" y="410" width="66" height="14" rx="7" fill="none" stroke="#C36A00" stroke-opacity="0.55" stroke-width="1.2"/>
          <text x="201" y="420" font-size="9.5" class="b" fill="#C36A00" text-anchor="middle">CROP 9:16</text>
          <circle cx="322" cy="407" r="17" fill="#C36A00" opacity="0.1"/>
          <g stroke="#C36A00" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="timeline.selection"><path d="M316 400 h-2 v14 h2 M328 400 h2 v14 h-2"/><path d="M319 407 h6"/></g>
          <path d="M352 401 h16 M352 407 h16 M352 413 h16" stroke="#B9B9BE" stroke-width="1.8" stroke-linecap="round" data-symbol="line.3.horizontal"/>
        </g>
        <line x1="96" y1="440" x2="377" y2="440" stroke="#000" stroke-opacity="0.06"/>

        <!-- row 2 (local override) -->
        <g id="row-2">
          <rect x="28" y="452" width="58" height="42" rx="7" fill="url(#clipB)"/>
          <path d="M53 467 l9 6 -9 6 z" fill="#FFF" opacity="0.8"/>
          <text x="96" y="468" font-size="14.5" class="sb" fill="#000">Tram Tester</text>
          <text x="96" y="487" font-size="11.5" class="sec">50× · 15s</text>
          <rect x="168" y="476" width="118" height="14" rx="7" fill="#C36A00" opacity="0.06"/>
          <rect x="168" y="476" width="118" height="14" rx="7" fill="none" stroke="#C36A00" stroke-opacity="0.55" stroke-width="1.2"/>
          <text x="227" y="486" font-size="9.5" class="b" fill="#C36A00" text-anchor="middle">CROP 9:16 · CUSTOM</text>
          <circle cx="322" cy="473" r="17" fill="#C36A00" opacity="0.1"/>
          <g stroke="#C36A00" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M316 466 h-2 v14 h2 M328 466 h2 v14 h-2"/><path d="M319 473 h6"/></g>
          <path d="M352 467 h16 M352 473 h16 M352 479 h16" stroke="#B9B9BE" stroke-width="1.8" stroke-linecap="round"/>
        </g>
      </g>

      <!-- add clips (dashed) -->
      <g id="add-clips">
        <rect x="16" y="518" width="361" height="52" rx="14" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="5 4"/>
        <path d="M158 549 v-10 M153 544 h10" stroke="#C36A00" stroke-width="2.2" stroke-linecap="round" data-symbol="plus"/>
        <text x="172" y="554" font-size="15" class="sb" fill="#C36A00">Add clips</text>
      </g>

      <!-- summary card -->
      <g id="summary">
        <rect x="16" y="582" width="361" height="120" rx="18" fill="#1C1C1E"/>
        <text x="32" y="618" font-size="26" class="b" fill="#FFF">0:26</text>
        <text x="361" y="614" font-size="12" fill="#FFF" opacity="0.65" text-anchor="end">exports 2160×3840</text>
        <text x="32" y="636" font-size="12.5" fill="#FFF" opacity="0.65">2 clips · 9:16 canvas</text>
        <text x="32" y="658" font-size="11.5" fill="#FFF" opacity="0.45">Trims retime the cut automatically — clips always butt together.</text>
      </g>

      <!-- export CTA -->
      <g id="export-cta">
        <rect x="16" y="714" width="361" height="50" rx="14" fill="#C36A00"/>
        <text x="196.5" y="744" font-size="15" class="b" fill="#FFF" text-anchor="middle">Export collection</text>
      </g>

      <!-- last export kept, peeking behind the tab bar -->
      <g id="last-export">
        <rect x="16" y="776" width="361" height="50" rx="14" fill="#FFF" filter="url(#card)"/>
        <path d="M32 801 l5 5 9 -10" stroke="#34C759" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="checkmark"/>
        <text x="56" y="806" font-size="13" fill="#000">Last export kept · today 14:02</text>
        <text x="363" y="806" font-size="12.5" class="sb" fill="#C36A00" text-anchor="end">Share</text>
      </g>

      <!-- floating tab bar -->
      <g id="tab-bar">
        <rect x="17.5" y="755" width="358" height="57" rx="28.5" fill="#FBFBFD" opacity="0.96" filter="url(#soft)"/>
        <rect x="17.5" y="755" width="358" height="57" rx="28.5" fill="none" stroke="#000" stroke-opacity="0.08"/>
        <g id="tab-create" fill="none" stroke="#8E8E93">
          <g transform="translate(56.5 776) scale(0.7727) translate(-11 -11)"><circle cx="11" cy="11" r="8" stroke-width="2.2" data-symbol="record.circle"/><circle cx="11" cy="11" r="3.4" fill="#8E8E93" stroke="none"/></g>
          <text x="56.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Create</text>
        </g>
        <g id="tab-gallery" fill="none" stroke="#8E8E93">
          <g transform="translate(126.5 776) scale(0.7727) translate(-11 -11)"><rect x="3" y="5.5" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(-6 10 10.5)" data-symbol="photo.on.rectangle.angled"/><rect x="6" y="8" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(4 13 13)"/></g>
          <text x="126.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Gallery</text>
        </g>
        <g id="tab-projects" fill="none" stroke="#8E8E93">
          <g transform="translate(196.5 776) scale(0.7727) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="square.stack"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="196.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Projects</text>
        </g>
        <g id="tab-collections" fill="none" stroke="#8E8E93">
          <g transform="translate(266.5 776) scale(0.7727) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="film.stack"/><path d="M7 4.5 v8 M15 4.5 v8" stroke-width="1.38" opacity="0.7"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="266.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Collections</text>
        </g>
        <g id="tab-settings" fill="none" stroke="#8E8E93">
          <g transform="translate(336.5 776) scale(0.7727) translate(-11 -11)"><path d="M3.5 6.5 h15 M3.5 11 h15 M3.5 15.5 h15" stroke-width="2.48" stroke-linecap="round" data-symbol="line.3.horizontal"/></g>
          <text x="336.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Settings</text>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Collection detail · crop on the preview · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/CollectionDetailView.swift — crop frame mid-drag with the transient honest-pixels HUD · chip on the preview · no caption row</text>
</svg>
