<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Processing · portrait</title>
  <desc>Mirrors App/ProcessingView.swift + App/LLRigProgress.swift: blurred source preview under the 120pt rig gauge (App/LLRigMark.swift, style .gauge, sweep on) — the LetsLapse mark with the percentage reading out INSIDE its lens, replacing the old 92pt Circle().trim ring. Shared with Collections export (collection-export.portrait.svg); the two screens used to carry byte-identical copies of the ring. Three things to know about it: the arc around the pipe is an indeterminate SWEEP on a 1.70s cycle, not a determinate fill — the design deliberately moves the resolution into the number and lets the sweep keep the motion honest between progress updates, with the checklist, frame counts and ETA below carrying the rest of the state; the size floor is 120pt, because the lens is only 34% of the mark's width and the digits stop being legible below it; and the mark keeps its OWN palette (amber #F0A32C is the app icon's, not LL.amber #FFB340) while every other element on this screen stays on LL tokens. The old hard black-35% backing disc is gone in favour of a soft radial vignette — a cut edge around a mark that has its own silver body read as a sticker over footage — and the preview scrim went 45% → 55% so the silver pipe holds against a bright frame. Four-stage checklist (Preparing footage ✓ · Blending frames ● with live counts · Encoding video ○ · Saving to project ○), ETA line, red-tinted Cancel with reassurance caption. Flow screen — no tab bar. The ring is ONE monotonic global bar for the whole run: a multi-clip project's bar is partitioned by each clip's frame count (BlendProgressPlan bands), then stitch/grade-bake export bands, then save to 100% — it never resets per clip. The checklist follows AppModel.processingPhase (explicit pipeline state), not progress thresholds, so each stage ticks exactly once. Blending counts are whole-run frames done/total on both platforms. ETA line states: while blending a multi-clip project it suffixes the clip position ("About 4 minutes left · Clip 2 of 5"); when a phase has no honest countdown yet it shows the phase label instead — "Blending clip 2 of 5...", "Combining 5 clips..." (stitch export), "Applying the colour grade..." (grade-bake export), "Almost done" (saving). Never blank, never a raw engine log line.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="prev"><rect x="16" y="107" width="361" height="260" rx="20"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2.5"/></filter>
    <radialGradient id="vignette" cx="196.5" cy="237" r="93.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="markGlow" cx="512" cy="486" r="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0A32C" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#F0A32C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markPipe" x1="190.4" y1="84" x2="833.6" y2="888" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9EEF6"/>
      <stop offset="0.45" stop-color="#BAC6D8"/>
      <stop offset="1" stop-color="#7C8CA5"/>
    </linearGradient>
    <linearGradient id="markBoard" x1="242" y1="234" x2="458" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E2E4E"/>
      <stop offset="1" stop-color="#04101F"/>
    </linearGradient>
    <linearGradient id="markLens" x1="478" y1="279" x2="478" y2="625" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E1C48"/>
      <stop offset="0.26" stop-color="#4A4A93"/>
      <stop offset="0.42" stop-color="#150332"/>
      <stop offset="0.72" stop-color="#0C0322"/>
      <stop offset="1" stop-color="#001C4C"/>
    </linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- preview card with progress ring -->
      <g id="preview-card">
        <g clip-path="url(#prev)">
          <rect x="16" y="107" width="361" height="260" fill="#33415A"/>
          <g filter="url(#blur2)">
            <circle cx="120" cy="180" r="24" fill="#FFB340" opacity="0.8"/>
            <polygon points="16,300 100,252 190,294 280,250 377,286 377,367 16,367" fill="#1A222E"/>
          </g>
          <rect x="16" y="107" width="361" height="260" fill="#000" opacity="0.55"/>
        </g>
        <!-- The gauge: the rig at 120pt with the lens as the readout. The arc
             around the pipe is an indeterminate SWEEP, not a fill — the design
             moves the resolution into the number and lets the sweep keep the
             motion honest between progress updates. -->
        <g id="progress-mark">
          <circle cx="196.5" cy="237" r="93.6" fill="url(#vignette)"/>
          <g transform="translate(136.5,177) scale(0.1171875)">
            <circle cx="512" cy="486" r="440" fill="url(#markGlow)"/>
            <g transform="rotate(-5 512 486)">
              <rect x="281" y="790" width="34" height="112" rx="9" fill="#1E4368"/>
              <rect x="269" y="884" width="58" height="20" rx="10" fill="#F0A32C"/>
              <rect x="709" y="790" width="34" height="112" rx="9" fill="#1E4368"/>
              <rect x="697" y="884" width="58" height="20" rx="10" fill="#F0A32C"/>
            </g>
            <circle cx="512" cy="486" r="402" fill="url(#markPipe)"/>
            <circle cx="512" cy="486" r="402" fill="none" stroke="#6E7F99" stroke-width="9"/>
            <!-- sweeping head + trail, 9-27% of the circumference, 1.70s cycle -->
            <circle cx="512" cy="486" r="402" fill="none" stroke="#F0A32C" stroke-width="17" stroke-linecap="round" pathLength="100" stroke-dasharray="24 76" opacity="0.28" transform="rotate(-145 512 486)"/>
            <circle cx="512" cy="486" r="402" fill="none" stroke="#F0A32C" stroke-width="17" stroke-linecap="round" pathLength="100" stroke-dasharray="18 82" transform="rotate(-145 512 486)"/>
            <g transform="rotate(-5 512 486)">
              <rect x="340" y="640" width="48" height="134" rx="12" fill="#12324F"/>
              <rect x="325" y="752" width="78" height="24" rx="12" fill="#F0A32C"/>
              <rect x="636" y="640" width="48" height="134" rx="12" fill="#12324F"/>
              <rect x="621" y="752" width="78" height="24" rx="12" fill="#F0A32C"/>
              <rect x="242" y="234" width="540" height="456" rx="18" fill="url(#markBoard)"/>
              <rect x="242" y="234" width="540" height="456" rx="18" fill="none" stroke="#245A85" stroke-width="7"/>
              <rect x="274" y="266" width="32" height="32" rx="8" fill="#F0A32C"/>
              <rect x="718" y="266" width="32" height="32" rx="8" fill="#F0A32C"/>
              <rect x="718" y="626" width="32" height="32" rx="8" fill="#F0A32C"/>
              <rect x="274" y="626" width="32" height="32" rx="8" fill="#F0A32C"/>
            </g>
            <circle cx="478" cy="452" r="196" fill="none" stroke="#F0A32C" stroke-width="14"/>
            <circle cx="478" cy="452" r="173" fill="#02040C"/>
            <!-- lens dimmed to 55% (vs 85% on launch) so the digits own the aperture -->
            <circle cx="478" cy="452" r="173" fill="url(#markLens)" opacity="0.55"/>
          </g>
          <!-- readout centred on the LENS (478,452 in mark space), not the view -->
          <text x="192.5" y="235.4" font-size="15.6" class="sb" fill="#F0A32C" text-anchor="middle">34<tspan font-size="8.4" fill="#8A9AB5"> %</tspan></text>
        </g>
      </g>

      <!-- stage checklist -->
      <g id="stage-checklist">
        <rect x="16" y="383" width="361" height="172" rx="16" fill="#FFF" filter="url(#soft)"/>
        <g id="stage-preparing">
          <path d="M32 409 l5 5 9 -10" stroke="#34C759" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="checkmark"/>
          <text x="58" y="415" font-size="15" fill="#000">Preparing footage</text>
        </g>
        <g id="stage-blending">
          <circle cx="39" cy="451" r="4.5" fill="#FFB340"/>
          <text x="58" y="456" font-size="15" class="sb" fill="#000">Blending frames</text>
          <text x="361" y="456" font-size="13" class="m" fill="#6D6D72" text-anchor="end">1,240 / 3,600</text>
        </g>
        <g id="stage-encoding">
          <circle cx="39" cy="493" r="4.5" fill="none" stroke="#A9A9AE" stroke-width="1.2"/>
          <text x="58" y="498" font-size="15" fill="#9C9CA1">Encoding video</text>
        </g>
        <g id="stage-saving">
          <circle cx="39" cy="535" r="4.5" fill="none" stroke="#A9A9AE" stroke-width="1.2"/>
          <text x="58" y="540" font-size="15" fill="#9C9CA1">Saving to project</text>
        </g>
      </g>

      <!-- ETA · clip position while blending a multi-clip project -->
      <text x="196.5" y="585" font-size="13" fill="#6D6D72" text-anchor="middle">About 4 minutes left · Clip 2 of 5</text>

      <!-- cancel -->
      <g id="cancel">
        <rect x="16" y="738" width="361" height="50" rx="14" fill="#FFF" filter="url(#soft)"/>
        <text x="196.5" y="768" font-size="15.5" class="sb" fill="#FF3B30" text-anchor="middle">Cancel</text>
        <text x="196.5" y="806" font-size="11.5" fill="#6D6D72" text-anchor="middle">Cancelling discards this blended clip. Your original is safe.</text>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Processing · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/ProcessingView.swift — previewCard rig gauge · stageChecklist · ETA</text>
</svg>
