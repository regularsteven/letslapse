<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Scans · empty · portrait</title>
  <desc>Mirrors App/ScansView.swift (ScansEmptyState). The Scans tab before any scan exists: doc.viewfinder in tertiary, "No scans yet", the two-sentence explanation, and an accent-tinted "Open Create" pill (38pt, r19, accent at 12%) — Scanner is a mode of the camera, so the empty state points at the tab where a scan starts rather than offering an action this screen cannot perform. Card x16 y130 w361 r18. Tab bar from 755, Scans selected.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.05"/></filter>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}.mono{font-family:ui-monospace,Menlo,monospace}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">
      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>
      <text x="20" y="94" font-size="34" class="b" fill="#000">Scans</text>

      <!-- empty state -->
      <g id="empty-state">
        <rect x="16" y="130" width="361" height="253" rx="18" fill="#FFF" filter="url(#card)"/>
        <g transform="translate(196.5 187) scale(1.9091) translate(-11 -11)" fill="none" stroke="#B9B9BE" stroke-width="0.79" stroke-linecap="round" data-symbol="doc.viewfinder"><path d="M4 7 V4 h3 M15 4 h3 v3 M18 15 v3 h-3 M7 18 H4 v-3"/><rect x="6.5" y="6.5" width="9" height="9" rx="1.6"/></g>
        <text x="196.5" y="230" font-size="17" class="sb" fill="#000" text-anchor="middle">No scans yet</text>
        <text x="196.5" y="253" font-size="13" class="sec" text-anchor="middle">Start a scan from the Create tab. Scanner fires</text>
        <text x="196.5" y="272" font-size="13" class="sec" text-anchor="middle">when the scene settles and keeps each page as its</text>
        <text x="196.5" y="291" font-size="13" class="sec" text-anchor="middle">own file.</text>
        <rect x="130" y="311" width="133" height="38" rx="19" fill="#C36A00" opacity="0.12"/>
        <g fill="none" stroke="#C36A00"><circle cx="152" cy="330" r="7" stroke-width="1.5" data-symbol="record.circle"/><circle cx="152" cy="330" r="3" fill="#C36A00" stroke="none"/></g>
        <text x="167" y="335" font-size="13.5" class="sb" fill="#C36A00">Open Create</text>
      </g>

      <g id="tab-bar">
        <rect x="6.5" y="755" width="380" height="57" rx="28.5" fill="#FBFBFD" opacity="0.96" filter="url(#soft)"/>
        <rect x="6.5" y="755" width="380" height="57" rx="28.5" fill="none" stroke="#000" stroke-opacity="0.08"/>
        <g id="tab-create" fill="none" stroke="#8E8E93">
          <g transform="translate(41.5 776) scale(0.7273) translate(-11 -11)"><circle cx="11" cy="11" r="8" stroke-width="2.2" data-symbol="record.circle"/><circle cx="11" cy="11" r="3.4" fill="#8E8E93" stroke="none"/></g>
          <text x="41.5" y="800" font-size="9.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Create</text>
        </g>
        <g id="tab-gallery" fill="none" stroke="#8E8E93">
          <g transform="translate(103.5 776) scale(0.7273) translate(-11 -11)"><rect x="3" y="5.5" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(-6 10 10.5)" data-symbol="photo.on.rectangle.angled"/><rect x="6" y="8" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(4 13 13)"/></g>
          <text x="103.5" y="800" font-size="9.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Gallery</text>
        </g>
        <rect x="136.5" y="761" width="58" height="45" rx="22.5" fill="#C36A00" opacity="0.12"/>
        <g id="tab-scans" fill="none" stroke="#C36A00">
          <g transform="translate(165.5 776) scale(0.7273) translate(-11 -11)"><path d="M4 7 V4 h3 M15 4 h3 v3 M18 15 v3 h-3 M7 18 H4 v-3" stroke-width="2.34" stroke-linecap="round" data-symbol="doc.viewfinder"/><rect x="6.5" y="6.5" width="9" height="9" rx="1.6" stroke-width="2.34"/></g>
          <text x="165.5" y="800" font-size="9.5" class="sb" fill="#C36A00" stroke="none" text-anchor="middle">Scans</text>
        </g>
        <g id="tab-projects" fill="none" stroke="#8E8E93">
          <g transform="translate(227.5 776) scale(0.7273) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="square.stack"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="227.5" y="800" font-size="9.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Projects</text>
        </g>
        <g id="tab-collections" fill="none" stroke="#8E8E93">
          <g transform="translate(289.5 776) scale(0.7273) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="film.stack"/><path d="M7 4.5 v8 M15 4.5 v8" stroke-width="1.38" opacity="0.7"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="289.5" y="800" font-size="9.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Collections</text>
        </g>
        <g id="tab-settings" fill="none" stroke="#8E8E93">
          <g transform="translate(351.5 776) scale(0.7273) translate(-11 -11)"><path d="M3.5 6.5 h15 M3.5 11 h15 M3.5 15.5 h15" stroke-width="2.48" stroke-linecap="round" data-symbol="line.3.horizontal"/></g>
          <text x="351.5" y="800" font-size="9.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Settings</text>
        </g>
      </g>
      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Scans · empty · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/ScansView.swift — doc.viewfinder · No scans yet · Open Create</text>
</svg>
