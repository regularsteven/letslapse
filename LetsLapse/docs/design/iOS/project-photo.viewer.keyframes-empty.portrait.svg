<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Interval grading viewer · first run · portrait</title>
  <desc>Mirrors App/PhotoViewerView.swift (`phoneEditorBody`, `phoneTimelineCard`) with App/GradeTimelineView.swift and App/PhotoAdjustmentsPanel.swift (layout .phone) for an interval shoot that has never been graded at a second moment — the state every interval project starts in, and the one the keyframe concept is designed to be invisible from. Redrawn 2026-09-13 for the editor controls redesign (board 6a's card with the first-run strip from design 1c). No dots, no coach mark, the word 'keyframe' nowhere: the pads behave exactly as they do on a photo, and an edit made here grades the WHOLE clip. LAYOUT (2a / 6a, `phoneEditorBody`): the picture fills the safe area (59 top / 34 bottom on this canvas) and is fitted into it — a 3:4 portrait shoot spans the width and centres vertically, 176…700 — and everything else floats over it. `touchChrome`: the 36 pt back disc at (16, 71) and the `EditorTabPill` top-right (right 16, top 74: 12 pt of vertical padding under the safe area, the 30 pt pill centred on the 36 pt disc) — the boards draw both at top 60, the app sits them 11 pt lower. The pill is rgba(28,28,30,.85) over material, radius 18, 12 pt semibold, the selected tab amber with black text, the rest amber on ink; Frames appears only on a shoot with more than one frame. The foot (`phoneFoot`) is bottom-anchored on the safe area: the timeline card where `hasTimeline`, then EITHER the six main buttons (`EditorGroupBar(.phone)`) OR the open group's sheet (`PhotoAdjustmentsPanel(layout: .phone)`) — one or the other, the sheet needs the buttons' room. The sheet: 22 pt top corners, rgba(28,28,30,.86) over material running under the home indicator, padded 12 top / 16 sides / 0 bottom, 10 pt between rows, shadow up; header = title 15 pt semibold white · 6 pt dot (accent when the group holds a value or a travelling field, clear otherwise so the row never reflows) · spacer · ✕ 32 pt white 10 % (reverts to the snapshot `openPanel(for:)` took) · ✓ 32 pt amber (keeps and closes). Long-press the title for Reset &lt;group&gt; / Reset all adjustments. The 1:1 toggle (`zoomControls`, 32 pt black 45 %) sits bottom-trailing of the picture pane 12 pt in, lifted above the foot by its measured height; it exists only while `hasPixelsToReveal`, so a small source shows none. The readouts print the app's own formats (`%+.2f`, `%+.0f`, unsigned 0…100, Kelvin) with an ASCII hyphen-minus where the boards typeset U+2212. THIS CANVAS: the card holds the badge (60 frames — nothing hidden) and a quiet strip: rail, the playhead at the head with its '0:00:00' bubble held at the 7 % floor so it never hangs off the track's end, the elapsed-capture clocks that say how long the shoot ran, and the two one-frame steps — ‹ disabled (chevron #8E8E93 at 45 %) because the playhead is at the head, › live. Scrubbing changes which frame is on screen and nothing else. The Light sheet is at its neutral: title without a dot, chips without diamonds, the knob on the crosshair, 'Exposure 0 · Contrast 0' — the values still amber, the dark editors' rule for a pad readout. THE LEAP happens on the first edit made at a SECOND position and is never a mode switch: the grade already made becomes a moment where it was authored (GradeTimeline.baselineAnchor), the new edit becomes a moment where the playhead is now, and two dots animate in — see project-photo.viewer.keyframes.portrait.svg for what the screen becomes. Staged by LL_EDITOR=latest LL_VIEWER=1 LL_KEYFRAMES=empty LL_SECTIONS=light:expcon (the reference shoot read 6 min 4 s · 183 frames and a '0:00' bubble; the boards' 2 h 14 min clock is kept).</desc>
