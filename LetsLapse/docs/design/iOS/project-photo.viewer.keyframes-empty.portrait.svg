<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Interval grading viewer · first run · portrait</title>
  <desc>Mirrors App/PhotoViewerView.swift for an interval shoot that has never been graded at a second moment — the state every interval project starts in, and the one the concept is designed to be invisible from. No dots, no coach mark, and the word “keyframe” nowhere on screen: the sliders behave exactly as they do on a photo, and an edit made here grades the WHOLE clip. Staged by LL_KEYFRAMES=empty over LL_VIEWER=1. The only new thing is the strip itself, and it is quiet: rail, playhead at the head, and the elapsed-capture-time labels that say how long the shoot ran. Scrubbing it changes which frame is on screen and nothing else. THE LEAP happens on the first edit made at a SECOND position, and it is never a mode switch: the grade already made becomes a moment where it was authored (GradeTimeline.baselineAnchor), the new edit becomes a moment where the playhead is now, and two dots animate in. That is the entire announcement — see project-photo.viewer.keyframes.portrait.svg for what the screen becomes.</desc>
