<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Adjust — Punch-in reframe lane open · portrait</title>
  <desc>Mirrors App/ReframeCanvasView.swift + App/ReframeLaneView.swift inside App/AdjustView.swift + App/WarpTimelineView.swift — the punch-in reframe, drawn 2026-08-10 from the iPhone 16 simulator (393×852) via LL_REFRAME=latest LL_REFRAME_SEED=1. Opening the lane (the "Punch-in reframe" row here, or the second button on a video project's detail page, which lands with it already expanded) swaps the warp card's keyframe preview for the INTERACTIVE PUNCH CANVAS and inserts the KEY LANE under the stretch bar. Canvas: the playhead's frame cropped to the current framing at the chosen canvas ratio, WYSIWYG — pinch to punch (z 1…6), drag to position, both clamped so the crop stays inside the source. On a keyframe those gestures edit that key directly (one coalesced undo step per touch); between keys they shape a DRAFT instead (see adjust.reframe-draft.portrait.svg) because a keyframe is only ever made on purpose. An amber hairline marks the output frame; the badge bottom-leading names what is on screen — "K2 · 2.4× punch" parked on a key, "≈ between keys · 2.3×" on the interpolated move, "Full frame" on an empty track — with the kept pixel width appended once punched ("· 822px", the only signal that a punch is a magnification: the render crops the finished clip and Lanczos-scales it back to the canvas-shaped base crop, so 822px of a 1920px source is upscaled 2.3×). A minimap earns the bottom-trailing corner once the crop is smaller than the frame, drawn as the source with the crop window cut out of a 45% scrim. The Undo chip overlays the top-leading corner — reframe edits share the warp timeline's history, so speed and punch edits unwind in the order they were made. LANE: one diamond per key on the SAME output-proportional axis as the bar above (white, amber once punched, accent ring on the selection, 36pt touch target around an 11pt diamond) — tap to select and scrub there, drag to slide a key in time clamped at its neighbours. A move pill sits at each gap's midpoint and opens the MOVE INTO KEY N popover (span: span · 0.5s · 1s · 2s, curve: Ease — a planned move / Thru — keeps tracking); the pill is hidden when the gap is narrower than 58pt. Move spans are OUTPUT (clip) seconds and the move ARRIVES: the crop holds the earlier key's framing, then eases into the later one over the last span of the gap. Note the honest hazard on show here — the pills read "~1s ease" and "~2s ease" on a clip the estimate card says will be 0.6s long, because a span silently clamps to its gap (ReframeTrack.frame) and the label does not follow it down. The key line beneath carries the selection's facts ("Key 2 of 3 · 0:27 · 2.4× punch") with a delete button, or the count when nothing is selected, plus the explicit "+ Keyframe at m:ss" chip whenever the playhead is off every key — nothing here ever auto-adds a key. Empty track reads "Full frame — pinch the preview to punch in" (there is no pinch on a mouse-only Mac). The reframe row's trailing value flips from "Off" to "3 keys" in accent-deep, and the chevron points up. Sample data: a 1:00 source at 100× with three seeded keys (full frame → 2.4× punch → full frame) and ~1s / ~2s arriving eases; the estimate card and Advanced row are below the fold at this content height.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="canvasBox"><rect x="32" y="127" width="329" height="185" rx="9"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
    <linearGradient id="baseTile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33415A"/><stop offset="1" stop-color="#1B2330"/></linearGradient>
    <linearGradient id="punched" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B5170"/><stop offset="0.55" stop-color="#28405C"/><stop offset="1" stop-color="#1D3048"/></linearGradient>
    <mask id="minimapHole"><rect x="277" y="261" width="76" height="43" fill="#FFF"/><rect x="309" y="272" width="33" height="19" fill="#000"/></mask>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- flow header -->
      <g id="flow-header">
        <circle cx="33" cy="88" r="17" fill="#FFF" filter="url(#soft)"/>
        <path d="M37 80 l-8 8 8 8" stroke="#C36A00" stroke-width="2.4" fill="none" stroke-linecap="round" data-symbol="chevron.left"/>
        <text x="196.5" y="93" font-size="16" class="sb" fill="#000" text-anchor="middle">New blended clip</text>
        <g id="canvas-menu">
          <rect x="310" y="71" width="67" height="34" rx="17" fill="#FFF" filter="url(#soft)"/>
          <text x="336" y="93" font-size="13.5" class="sb" fill="#C36A00" text-anchor="middle">16:9</text>
          <path d="M355 89 l4 4.5 4 -4.5" stroke="#C36A00" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.down"/>
        </g>
      </g>

      <!-- warp card, taller by the lane + key line -->
      <g id="warp-card">
        <rect x="16" y="112" width="361" height="459" rx="16" fill="#FFF" filter="url(#soft)"/>

        <!-- punch canvas: the crop fills the box, so the picture is scaled and
             offset behind it (the source frame is bigger than what you see) -->
        <g id="punch-canvas">
          <g clip-path="url(#canvasBox)">
            <rect x="32" y="127" width="329" height="185" fill="url(#punched)"/>
            <circle cx="250" cy="205" r="34" fill="#FFB340" opacity="0.9"/>
            <rect x="32" y="270" width="329" height="42" fill="#141C26"/>
          </g>
          <rect x="33" y="128" width="327" height="183" rx="8" fill="none" stroke="#FFB340" stroke-opacity="0.4" stroke-width="1.5"/>

          <!-- undo chip (shared warp/reframe history) -->
          <g id="undo-chip">
            <rect x="38" y="131" width="57" height="17" rx="8.5" fill="#1C1C1E"/>
            <path d="M50 137 l-3 2.5 3 2.5 M47 139.5 h6 a3.5 3.5 0 0 1 0 5" stroke="#FFB340" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="arrow.uturn.backward"/>
            <text x="76" y="143.5" font-size="10" class="b" fill="#FFB340" text-anchor="middle">Undo</text>
          </g>

          <!-- state badge: framing on screen + kept pixels -->
          <rect x="40" y="285" width="180" height="19" rx="9.5" fill="#000" opacity="0.55"/>
          <text x="49" y="298" font-size="10" class="b" fill="#FFB340">≈ between keys · 2.3×<tspan fill="#FFF" fill-opacity="0.7"> · 822px</tspan></text>

          <!-- minimap: where the crop sits in the whole source -->
          <g id="minimap">
            <rect x="277" y="261" width="76" height="43" rx="4" fill="#000" opacity="0.55"/>
            <rect x="277" y="261" width="76" height="43" fill="#000" opacity="0.45" mask="url(#minimapHole)"/>
            <rect x="309" y="272" width="33" height="19" fill="none" stroke="#FFB340" stroke-width="1.5"/>
            <rect x="277" y="261" width="76" height="43" rx="4" fill="none" stroke="#FFF" stroke-opacity="0.25" stroke-width="0.5"/>
          </g>
        </g>

        <!-- stretch bar: one 100× stretch over the whole source -->
        <g id="stretch-bar">
          <rect x="32" y="327" width="329" height="50" rx="8" fill="url(#baseTile)"/>
          <rect x="33.25" y="328.25" width="326.5" height="47.5" rx="6.75" fill="none" stroke="#C36A00" stroke-width="2.5"/>
          <rect x="182" y="353" width="30" height="16" rx="8" fill="#000" opacity="0.55"/>
          <text x="197" y="364.5" font-size="10" class="b" fill="#FFF" text-anchor="middle">100×</text>
          <rect x="196" y="319" width="2" height="60" fill="#C36A00"/>
          <circle cx="197" cy="316" r="9" fill="#C36A00" filter="url(#soft)"/>
        </g>
        <!-- the bar zone is a fixed 96pt frame: with one stretch and no seams
             the space under the tile stays empty -->

        <!-- reframe lane: diamonds + move pills on the output axis -->
        <g id="reframe-lane">
          <rect x="32" y="436" width="329" height="1" fill="#8E8E93" opacity="0.28"/>
          <!-- key 1 — full frame -->
          <g transform="translate(98,436) rotate(45)">
            <rect x="-4.5" y="-4.5" width="9" height="9" rx="2" fill="#FFF" stroke="#000" stroke-opacity="0.3" stroke-width="0.75"/>
          </g>
          <!-- key 2 — punched, selected -->
          <g transform="translate(180,436) rotate(45)">
            <rect x="-5.5" y="-5.5" width="11" height="11" rx="2" fill="#FFB340" stroke="#000" stroke-opacity="0.3" stroke-width="0.75"/>
          </g>
          <circle cx="180" cy="436" r="11" fill="none" stroke="#C36A00" stroke-width="2"/>
          <!-- key 3 — full frame -->
          <g transform="translate(263,436) rotate(45)">
            <rect x="-4.5" y="-4.5" width="9" height="9" rx="2" fill="#FFF" stroke="#000" stroke-opacity="0.3" stroke-width="0.75"/>
          </g>
          <!-- move pills at each gap's midpoint (hidden under a 58pt gap) -->
          <g font-size="9.5" font-weight="700">
            <rect x="113" y="427" width="52" height="18" rx="9" fill="#1C1C1E"/>
            <text x="139" y="439.5" fill="#FFB340" text-anchor="middle">~1s ease</text>
            <rect x="196" y="427" width="52" height="18" rx="9" fill="#1C1C1E"/>
            <text x="222" y="439.5" fill="#FFB340" text-anchor="middle">~2s ease</text>
          </g>
          <rect x="196" y="421" width="2" height="30" fill="#C36A00"/>
        </g>

        <!-- key line: selection facts / count, and the explicit add -->
        <g id="key-line">
          <rect x="32" y="458" width="329" height="32" rx="10" fill="#F2F2F7"/>
          <text x="42" y="478" font-size="12" fill="#6D6D72">3 keys — tap one to edit</text>
          <rect x="225" y="464" width="126" height="20" rx="10" fill="#F2F2F7" stroke="#FFF" stroke-width="1"/>
          <path d="M236 474 h7 M239.5 470.5 v7" stroke="#C36A00" stroke-width="1.8" stroke-linecap="round"/>
          <text x="248" y="478" font-size="11" class="b" fill="#C36A00">Keyframe at 0:30</text>
        </g>
        <!-- with a key selected this line reads
             "Key 2 of 3 · 0:27 · 2.4× punch" + a red trash button -->

        <!-- ruler — CLIP time -->
        <g font-size="10" fill="#8E8E93">
          <text x="32" y="510">0s</text>
          <text x="196.5" y="510" text-anchor="middle">0.3s</text>
          <text x="361" y="510" text-anchor="end">0.6s</text>
        </g>

        <!-- selection line -->
        <g id="selection-line">
          <rect x="32" y="517" width="329" height="45" rx="10" fill="#F2F2F7"/>
          <text x="42" y="536" font-size="11.5" fill="#1C1C1E">Stretch 1 of 1 · 0:00–1:00 · 100× streaks → 0.6s of</text>
          <text x="42" y="551" font-size="11.5" fill="#1C1C1E">the clip</text>
          <circle cx="347" cy="539" r="8" fill="none" stroke="#C36A00" stroke-width="1.6" data-symbol="ellipsis.circle"/>
          <circle cx="343.5" cy="539" r="0.9" fill="#C36A00"/><circle cx="347" cy="539" r="0.9" fill="#C36A00"/><circle cx="350.5" cy="539" r="0.9" fill="#C36A00"/>
        </g>
      </g>

      <!-- speed chips -->
      <g id="speed-chips">
        <rect x="16" y="585" width="46.4" height="47" rx="12" fill="#FFF" filter="url(#soft)"/>
        <text x="39.2" y="606" font-size="14" class="b" fill="#000" text-anchor="middle">¼×</text>
        <text x="39.2" y="620" font-size="9.5" fill="#6D6D72" text-anchor="middle">¼× slow</text>
        <rect x="68.4" y="585" width="46.4" height="47" rx="12" fill="#FFF" filter="url(#soft)"/>
        <text x="91.6" y="606" font-size="14" class="b" fill="#000" text-anchor="middle">1×</text>
        <text x="91.6" y="620" font-size="9.5" fill="#6D6D72" text-anchor="middle">real time</text>
        <rect x="120.8" y="585" width="46.4" height="47" rx="12" fill="#FFF" filter="url(#soft)"/>
        <text x="144" y="606" font-size="14" class="b" fill="#000" text-anchor="middle">4×</text>
        <text x="144" y="620" font-size="9.5" fill="#6D6D72" text-anchor="middle">gentle</text>
        <rect x="173.2" y="585" width="46.4" height="47" rx="12" fill="#FFF" filter="url(#soft)"/>
        <text x="196.4" y="606" font-size="14" class="b" fill="#000" text-anchor="middle">15×</text>
        <text x="196.4" y="620" font-size="9.5" fill="#6D6D72" text-anchor="middle">subtle</text>
        <rect x="225.6" y="585" width="46.4" height="47" rx="12" fill="#FFF" filter="url(#soft)"/>
        <text x="248.8" y="606" font-size="14" class="b" fill="#000" text-anchor="middle">60×</text>
        <text x="248.8" y="620" font-size="9.5" fill="#6D6D72" text-anchor="middle">flowing</text>
        <rect x="278" y="585" width="46.4" height="47" rx="12" fill="#1C1C1E"/>
        <text x="301.2" y="606" font-size="14" class="b" fill="#FFB340" text-anchor="middle">100×</text>
        <text x="301.2" y="620" font-size="9.5" fill="#FFF" opacity="0.6" text-anchor="middle">streaks</text>
        <rect x="330.4" y="585" width="46.4" height="47" rx="12" fill="#FFF" filter="url(#soft)"/>
        <text x="353.6" y="606" font-size="14" class="b" fill="#000" text-anchor="middle">···</text>
        <text x="353.6" y="620" font-size="9.5" fill="#6D6D72" text-anchor="middle">custom</text>
        <text x="20" y="646" font-size="11" fill="#6D6D72">Every stretch is speedable — no separate “base”. Hold a stretch for</text>
        <text x="20" y="660" font-size="11" fill="#6D6D72">Remove · Split · Reset.</text>
      </g>

      <!-- reframe row, now expanded and counting keys -->
      <g id="reframe-row">
        <rect x="16" y="681" width="361" height="50" rx="16" fill="#FFF" filter="url(#soft)"/>
        <g stroke="#C36A00" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="viewfinder">
          <path d="M33 711 v-4 a3 3 0 0 1 3 -3 h4"/><path d="M46 704 h4 a3 3 0 0 1 3 3 v4"/>
          <path d="M53 717 v4 a3 3 0 0 1 -3 3 h-4"/><path d="M40 724 h-4 a3 3 0 0 1 -3 -3 v-4"/>
        </g>
        <text x="65" y="711" font-size="15.5" fill="#000">Punch-in reframe</text>
        <text x="336" y="711" font-size="12" class="sb" fill="#8A4A00" text-anchor="end">3 keys</text>
        <path d="M348 706 l5 -5 5 5" stroke="#B8B8BD" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.up"/>
      </g>

      <!-- bottom bar (the estimate card is below the fold at this height) -->
      <g id="bottom-bar">
        <rect x="0" y="726" width="393" height="126" fill="#F2F2F7"/>
        <rect x="16" y="735" width="361" height="50" rx="14" fill="#C36A00"/>
        <text x="196.5" y="766" font-size="16" class="b" fill="#FFF" text-anchor="middle">Create 0.6 s clip</text>
        <text x="196.5" y="806" font-size="11.5" fill="#6D6D72" text-anchor="middle">Your original is kept — you can always make another blended clip.</text>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Adjust — Punch-in reframe, lane open · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/ReframeCanvasView.swift + App/ReframeLaneView.swift in App/AdjustView.swift — punch canvas (pinch/drag · badge · minimap) · key lane (diamonds · move pills · key line)</text>
</svg>
