<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Editor · the ⓘ sheet (a video, Output above Info) · portrait · 393×852</title>
  <desc>Mirrors the editor pager's ⓘ SHEET on the iPhone — App/EditorPager.swift (infoSheet: GalleryPreviewPanel in its .inspector dress inside a NavigationStack titled with the project, Done trailing; medium / large detents, the drag indicator) over App/GalleryPreviewPanel.swift (body, outputSection, sourceApprovalRow, editedClipsSection), App/BlendedClipRow.swift and App/ApprovedAssetViews.swift. This is the phone's ONE project panel since 2026-09-21, when a tap on a Gallery tile began opening the editor and the Gallery's own preview sheet was retired (gallery.preview.portrait.svg and gallery.preview.presets.portrait.svg draw that retired sheet). NEW 2026-11-06, drawn from the iPhone 16 simulator (iOS 18.6, 393 × 852) on real projects — LL_TAB=gallery LL_ITEM=&lt;uuid&gt; LL_INFO=large, the hook added that day (it presses ⓘ and opens the sheet tall; a tap opens it at medium) — after Steven signed off the running Mac app (docs/approved-assets.md). The sheet covers the editor from y 69 (the pager is a black cover, so no parent card shows above it). THE PANEL, its one order since 2026-09-27 / 2026-11-05, in a 365 pt column 14 in: the title 16 bold over date · size (18 under the bar), a full-bleed divider, Auto rename &amp; tag, TAGS (empty here — the dashed + Add tag chip), PICPLACE (PicPlaceStatusCard in its narrow style at this width: Changes to sync · Sync now), Storage and Here, a divider, a footer of TWO buttons — Rename · Delete… (Finder is the Mac's; Share went on 2026-11-05) — a divider, then OUTPUT ABOVE INFO: New clip · Render Edits · Share project at three equal widths (116.33, 8 apart; wand.and.stars for Render Edits — the clip at 1× with the edits baked in and its sound kept), the project's own approval (sourceApprovalRow — APPROVED here: the accent seal and title on LL.accent 10 %, the caption wrapping to three lines in the phone's 299 pt column and ending Tap to remove. on touch devices, Click on the Mac), and EDITED CLIPS · 1 — BlendedClipRow titled Edited clip N · length, with sound in its subtitle, no Open, the approve seal filled. INFO and METADATA follow under the screen edge; a project with blends lists BLENDED CLIPS · N under EDITED CLIPS with the tick-chip filter, which wraps to two rows at this width. Rhythm as the Mac's panel (macOS/gallery.svg's PANE REDRAWN paragraph) with iOS text metrics: the title block 42.5, rows 26.5 apart, the footer 49. SAMPLE: a graded video, both its source and its edited clip approved — two approved outputs from one project.</desc>
