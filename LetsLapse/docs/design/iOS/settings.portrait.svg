<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Settings · portrait</title>
  <desc>Mirrors App/SettingsView.swift: Creative defaults (Default speed, Output frame rate, True-light), Video (Default ramp, Remember last — the burst slow-motion ramp), Recording (Remember recording settings, Manage resolutions, Record audio), Location (Geotag captures), Storage (library bar + legend, Review large originals, Clear cache). On-device AI, Storage and Advanced scroll below the fold — see settings.advanced.portrait.svg for the end of the list, including the Incomplete Captures row. With DNG output selected, Recording gains the DNG experiment rows + Capture benchmark. Drawn with DNG off and the ramp default Off.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <text x="20" y="101" font-size="34" class="b" fill="#000">Settings</text>

      <!-- creative defaults -->
      <text x="20" y="130" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">CREATIVE DEFAULTS</text>
      <g id="creative-defaults-card">
        <rect x="16" y="138" width="361" height="138" rx="16" fill="#FFF" filter="url(#soft)"/>
        <text x="32" y="166" font-size="16" fill="#000">Default speed</text>
        <text x="352" y="166" font-size="15" fill="#6D6D72" text-anchor="end">25×</text>
        <path d="M359 156 l4 -4.5 4 4.5 m-8 5 l4 4.5 4 -4.5" stroke="#8E8E93" stroke-width="1.6" fill="none" stroke-linecap="round" data-symbol="chevron.up.chevron.down"/>
        <line x1="32" y1="182" x2="377" y2="182" stroke="#000" stroke-opacity="0.08"/>
        <text x="32" y="210" font-size="16" fill="#000">Output frame rate</text>
        <text x="352" y="210" font-size="15" fill="#6D6D72" text-anchor="end">30 fps</text>
        <path d="M359 200 l4 -4.5 4 4.5 m-8 5 l4 4.5 4 -4.5" stroke="#8E8E93" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <line x1="32" y1="226" x2="377" y2="226" stroke="#000" stroke-opacity="0.08"/>
        <text x="32" y="249" font-size="16" fill="#000">True-light blending</text>
        <text x="32" y="264" font-size="11.5" fill="#6D6D72">Blends in linear light — smoother highlights</text>
        <rect x="316" y="236" width="51" height="31" rx="15.5" fill="#34C759"/>
        <circle cx="351" cy="251.5" r="13.5" fill="#FFF" filter="url(#soft)"/>
      </g>

      <!-- video (burst ramp) -->
      <text x="20" y="304" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">VIDEO</text>
      <g id="burst-ramp-card">
        <rect x="16" y="312" width="361" height="130" rx="16" fill="#FFF" filter="url(#soft)"/>
        <text x="32" y="338" font-size="16" fill="#000">Default ramp</text>
        <text x="32" y="353" font-size="11.5" fill="#6D6D72">Eases burst clips into and out of slow motion instead of</text>
        <text x="32" y="366" font-size="11.5" fill="#6D6D72">cutting straight to it.</text>
        <text x="352" y="338" font-size="15" fill="#6D6D72" text-anchor="end">Off</text>
        <path d="M359 328 l4 -4.5 4 4.5 m-8 5 l4 4.5 4 -4.5" stroke="#8E8E93" stroke-width="1.6" fill="none" stroke-linecap="round" data-symbol="chevron.up.chevron.down"/>
        <line x1="32" y1="380" x2="377" y2="380" stroke="#000" stroke-opacity="0.08"/>
        <text x="32" y="406" font-size="16" fill="#000">Remember last</text>
        <text x="32" y="421" font-size="11.5" fill="#6D6D72">A project's ramp becomes the next default.</text>
        <rect x="316" y="398" width="51" height="31" rx="15.5" fill="#E9E9EB"/>
        <circle cx="332" cy="413.5" r="13.5" fill="#FFF" filter="url(#soft)"/>
      </g>
      <!-- With Remember last ON the Default ramp menu is disabled (read-only) and
           its subtitle reads "Following the last ramp you set on a project." -->

      <!-- recording -->
      <text x="20" y="470" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">RECORDING</text>
      <g id="recording-card">
        <rect x="16" y="478" width="361" height="188" rx="16" fill="#FFF" filter="url(#soft)"/>
        <text x="32" y="504" font-size="16" fill="#000">Remember recording settings</text>
        <text x="32" y="519" font-size="11.5" fill="#6D6D72">Start each shoot in your last-used mode with its settings —</text>
        <text x="32" y="532" font-size="11.5" fill="#6D6D72">lens, resolution, frame rate, stabilization, interval spacing…</text>
        <rect x="316" y="496" width="51" height="31" rx="15.5" fill="#34C759"/>
        <circle cx="351" cy="511.5" r="13.5" fill="#FFF" filter="url(#soft)"/>
        <line x1="32" y1="546" x2="377" y2="546" stroke="#000" stroke-opacity="0.08"/>
        <text x="32" y="572" font-size="16" fill="#000">Manage resolutions</text>
        <text x="32" y="587" font-size="11.5" fill="#6D6D72">Choose which resolutions Capture Format offers —</text>
        <text x="32" y="600" font-size="11.5" fill="#6D6D72">separate lists for stills and video</text>
        <path d="M363 576 l6 7 -6 7" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <line x1="32" y1="612" x2="377" y2="612" stroke="#000" stroke-opacity="0.08"/>
        <text x="32" y="636" font-size="16" fill="#000">Record audio</text>
        <text x="32" y="651" font-size="11.5" fill="#6D6D72">Capture microphone sound with video shoots.</text>
        <rect x="316" y="622" width="51" height="31" rx="15.5" fill="#E9E9EB"/>
        <circle cx="332" cy="637.5" r="13.5" fill="#FFF" filter="url(#soft)"/>
      </g>

      <!-- location -->
      <text x="20" y="694" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">LOCATION</text>
      <g id="location-card">
        <rect x="16" y="702" width="361" height="62" rx="16" fill="#FFF" filter="url(#soft)"/>
        <text x="32" y="728" font-size="16" fill="#000">Geotag captures</text>
        <text x="32" y="743" font-size="11.5" fill="#6D6D72">Save GPS in photo EXIF · GPX track sidecar next to video</text>
        <rect x="316" y="718" width="51" height="31" rx="15.5" fill="#34C759"/>
        <circle cx="351" cy="733.5" r="13.5" fill="#FFF" filter="url(#soft)"/>
      </g>

      <!-- storage -->
      <text x="20" y="792" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">STORAGE</text>
      <g id="storage-card">
        <rect x="16" y="800" width="361" height="166" rx="16" fill="#FFF" filter="url(#soft)"/>
        <text x="32" y="827" font-size="16" fill="#000">LetsLapse library</text>
        <text x="361" y="827" font-size="15" fill="#6D6D72" text-anchor="end">12.6 GB</text>
        <g id="storage-bar">
          <rect x="32" y="838" width="329" height="8" rx="4" fill="#E4E4E9"/>
          <rect x="32" y="838" width="214" height="8" fill="#C36A00"/>
          <rect x="246" y="838" width="100" height="8" fill="#FFB340"/>
          <rect x="32" y="838" width="329" height="8" rx="4" fill="none"/>
        </g>
        <g id="legend" font-size="11" fill="#6D6D72">
          <circle cx="36" cy="860" r="3.5" fill="#C36A00"/><text x="44" y="864">Originals 8.2 GB</text>
          <circle cx="140" cy="860" r="3.5" fill="#FFB340"/><text x="148" y="864">Blended clips 3.9 GB</text>
          <circle cx="266" cy="860" r="3.5" fill="#B9B9C0"/><text x="274" y="864">Cache 542 MB</text>
        </g>
        <line x1="32" y1="876" x2="377" y2="876" stroke="#000" stroke-opacity="0.08"/>
        <text x="32" y="903" font-size="16" fill="#000">Review large originals</text>
        <path d="M363 891 l6 7 -6 7" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <line x1="32" y1="919" x2="377" y2="919" stroke="#000" stroke-opacity="0.08"/>
        <text x="32" y="946" font-size="16" fill="#C36A00">Clear cache (542 MB)</text>
      </g>
      <!-- STORAGE (drawn above, now starting under the tab bar), ON-DEVICE AI and the
           ADVANCED section (Allow remote access · Custom frame rate · Blend learning ·
           Auto blend strategy · Performance · Diagnostics · Incomplete Captures, the last
           one only while orphaned capture logs exist) scroll below the fold — drawn in
           settings.advanced.portrait.svg -->

      <!-- floating tab bar (Settings selected) -->
      <g id="tab-bar">
        <rect x="17.5" y="755" width="358" height="57" rx="28.5" fill="#FBFBFD" opacity="0.96" filter="url(#soft)"/>
        <rect x="17.5" y="755" width="358" height="57" rx="28.5" fill="none" stroke="#000" stroke-opacity="0.08"/>
        <g id="tab-create" fill="none" stroke="#8E8E93">
          <g transform="translate(56.5 776) scale(0.7727) translate(-11 -11)"><circle cx="11" cy="11" r="8" stroke-width="2.2" data-symbol="record.circle"/><circle cx="11" cy="11" r="3.4" fill="#8E8E93" stroke="none"/></g>
          <text x="56.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Create</text>
        </g>
        <g id="tab-gallery" fill="none" stroke="#8E8E93">
          <g transform="translate(126.5 776) scale(0.7727) translate(-11 -11)"><rect x="3" y="5.5" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(-6 10 10.5)" data-symbol="photo.on.rectangle.angled"/><rect x="6" y="8" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(4 13 13)"/></g>
          <text x="126.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Gallery</text>
        </g>
        <g id="tab-projects" fill="none" stroke="#8E8E93">
          <g transform="translate(196.5 776) scale(0.7727) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="square.stack"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="196.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Projects</text>
        </g>
        <g id="tab-collections" fill="none" stroke="#8E8E93">
          <g transform="translate(266.5 776) scale(0.7727) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="film.stack"/><path d="M7 4.5 v8 M15 4.5 v8" stroke-width="1.38" opacity="0.7"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="266.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Collections</text>
        </g>
        <rect x="303.5" y="761" width="66" height="45" rx="22.5" fill="#C36A00" opacity="0.12"/>
        <g id="tab-settings" fill="none" stroke="#C36A00">
          <g transform="translate(336.5 776) scale(0.7727) translate(-11 -11)"><path d="M3.5 6.5 h15 M3.5 11 h15 M3.5 15.5 h15" stroke-width="2.48" stroke-linecap="round" data-symbol="line.3.horizontal"/></g>
          <text x="336.5" y="800" font-size="10.5" class="sb" fill="#C36A00" stroke="none" text-anchor="middle">Settings</text>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Settings · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/SettingsView.swift — creativeDefaultsCard · burstRampCard · recordingCard · locationCard · storageCard</text>
</svg>
