<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Project tags · adding · portrait</title>
  <desc>project-tags.portrait.svg with text in the field — the state that answers "there is no way to manually add a custom tag" outright. Drawn on the case that matters most: a word the library has never held, so both SUGGESTED and YOUR TAGS filter down to nothing and the Create row is the only thing left to do (components/tag-suggestions.filtered.svg). Typing a string that DOES match filters the two groups in place and keeps the Create row above them, until the text matches an existing tag exactly; that needs no file of its own, the same way blend-list-filter does not draw every tick combination. Tapping Create applies the tag immediately — it joins the field above, and joins YOUR TAGS for every other project in this library from then on. The applied half is untouched; only the second card changes height, 276pt to 150pt, and the keyboard takes the room. NOT YET IN CODE — design-first, 2026-09-08.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="sheet"><rect x="0" y="62" width="393" height="790" rx="22"/></clipPath>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.05"/></filter>
    <filter id="pill" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.13"/></filter>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- the project's management card, dimmed behind: the Tags row is the door -->
      <g id="behind">
        <rect x="16" y="50" width="361" height="132" rx="18" fill="#FFF"/>
        <text x="32" y="80" font-size="16" fill="#000">Auto rename &amp; tag</text>
        <text x="32" y="124" font-size="16" fill="#000">Tags</text>
      </g>
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g id="signal"><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path id="wifi" d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g id="battery"><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>
      <rect x="0" y="0" width="393" height="852" fill="#000" opacity="0.22"/>

      <!-- ================= THE SHEET ================= -->
      <g id="tags-sheet" clip-path="url(#sheet)">
        <rect x="0" y="62" width="393" height="790" fill="#F2F2F7"/>

        <g id="toolbar">
          <rect x="150" y="76" width="93" height="44" rx="22" fill="#FFF" filter="url(#pill)"/>
          <text x="196.5" y="104" font-size="17" class="sb" fill="#000" text-anchor="middle">Tags</text>
          <rect x="303" y="76" width="74" height="44" rx="22" fill="#FFF" filter="url(#pill)"/>
          <text x="340" y="104" font-size="17" class="sb" fill="#C36A00" text-anchor="middle">Done</text>
        </g>

        <!-- applied -->
        <text x="20" y="148" font-size="13" class="sb sec" letter-spacing="0.5">ON THIS PROJECT</text>
        <rect x="16" y="160" width="361" height="100" rx="16" fill="#FFF" filter="url(#card)"/>
        <!-- components/tag-field.plain.wide.svg — 329pt content box, card top-left + (16,13).
             "plain" = no "+ Add tag" chip: the field below is the add affordance here. -->
        <image href="../components/tag-field.plain.wide.svg" x="32" y="173" width="329" height="74"/>

        <!-- everything not applied -->
        <rect x="16" y="276" width="361" height="150" rx="16" fill="#FFF" filter="url(#card)"/>
        <!-- components/tag-suggestions.filtered.svg — same 329pt content box as the default
             state, 118pt instead of 244 because both chip groups have filtered to nothing and
             only the Create row is left. -->
        <image href="../components/tag-suggestions.filtered.svg" x="32" y="292" width="329" height="118"/>

        <!-- system keyboard (schematic) -->
        <g id="keyboard">
          <rect x="0" y="437" width="393" height="415" fill="#D1D3D9"/>
          <g fill="#FFF">
            <rect x="6" y="460" width="33" height="42" rx="5"/><rect x="45" y="460" width="33" height="42" rx="5"/><rect x="84" y="460" width="33" height="42" rx="5"/><rect x="123" y="460" width="33" height="42" rx="5"/><rect x="162" y="460" width="33" height="42" rx="5"/><rect x="201" y="460" width="33" height="42" rx="5"/><rect x="240" y="460" width="33" height="42" rx="5"/><rect x="279" y="460" width="33" height="42" rx="5"/><rect x="318" y="460" width="33" height="42" rx="5"/><rect x="354" y="460" width="33" height="42" rx="5"/>
            <rect x="25" y="512" width="33" height="42" rx="5"/><rect x="64" y="512" width="33" height="42" rx="5"/><rect x="103" y="512" width="33" height="42" rx="5"/><rect x="142" y="512" width="33" height="42" rx="5"/><rect x="181" y="512" width="33" height="42" rx="5"/><rect x="220" y="512" width="33" height="42" rx="5"/><rect x="259" y="512" width="33" height="42" rx="5"/><rect x="298" y="512" width="33" height="42" rx="5"/><rect x="337" y="512" width="33" height="42" rx="5"/>
            <rect x="6" y="564" width="45" height="42" rx="5" opacity="0.7"/><rect x="64" y="564" width="33" height="42" rx="5"/><rect x="103" y="564" width="33" height="42" rx="5"/><rect x="142" y="564" width="33" height="42" rx="5"/><rect x="181" y="564" width="33" height="42" rx="5"/><rect x="220" y="564" width="33" height="42" rx="5"/><rect x="259" y="564" width="33" height="42" rx="5"/><rect x="298" y="564" width="33" height="42" rx="5"/><rect x="342" y="564" width="45" height="42" rx="5" opacity="0.7"/>
            <rect x="6" y="616" width="90" height="42" rx="5" opacity="0.7"/><rect x="102" y="616" width="189" height="42" rx="5"/><rect x="297" y="616" width="90" height="42" rx="5" opacity="0.7"/>
          </g>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.6"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Project tags · adding · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">typing a tag the library has never held: both groups filter to nothing and Create is the whole answer</text>
</svg>
