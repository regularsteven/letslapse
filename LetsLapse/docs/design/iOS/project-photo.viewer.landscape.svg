<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Photo grading viewer · side rail · landscape</title>
  <desc>Mirrors App/PhotoViewerView.swift's rail layout (`railBody`, `controlRail`, `railEditorStack`, `railPanelStyle`) on a landscape iPhone with App/EditorControls/EditorGroupBar.swift (.macCard, dark), App/RailTabBar.swift and App/PhotoAdjustmentsPanel.swift (layout .rail, style .dark) — a PHOTO capture, so no strip under the pane (`hasTimeline` false), the pane the column's full 372 pt. Redrawn 2026-09-13 for the editor controls redesign: the light title bar, Done, the preset chip strip and the slider stack drawn before are gone. THE RAIL LAYOUT (`railBody` + `controlRail` + `railEditorStack`, `EditorLayout.rail`): taken by a landscape iPhone, a wide split and iPad portrait (settled 2026-09-13: wide enough for a rail, too tall for the sheet to reach the picture) — and by the Mac, whose rail is the light board 3b; on iOS the same rail is forced dark. Rail width = min(340, 0.42 × width) of the SAFE width — 734 pt on this canvas (59 pt insets either side) gives 308.3, so the media column is 425.4 pt from x = 59 and the rail runs 484.7…793 with its content inset 16 (276.3 pt wide; the iPhone 16 Pro simulator, at 750 pt safe, measured a 315 pt rail with 288 pt of content). The whole rail scrolls, tab pill included, padded 14 top / 16 sides / 20 bottom with 12 pt between cards: (1) `RailTabBar` — NOT the over-picture pill — a 36 pt LL.cardBackground capsule, padding 3, four equal 13 pt semibold segments padded 7, amber on ink with the selected one amber and black; (2) `EditorGroupBar(.macCard)` drawn dark: a radius-12 card padded 6 holding six 46 pt cells (SF Symbol 18 pt, 9.5 pt semibold label, 4 pt dot; the open group amber on amber 14 %, the rest #8E8E93) — the buttons STAY visible here, the sheet does not cover them, and on this rail the six cells (276 pt) overrun the card's 6 pt padding and sit flush with its edges; (3) the open group's `PhotoAdjustmentsPanel(layout: .rail, style: .dark)`: a radius-12 card padded 12 with the phone sheet's own header (15 pt title, dot, ✕ white 10 %, ✓ amber), chips, pad (170 pt) and readouts — at 252 pt of card content the three chips are 80 pt each, and 'Exp · Con' plus its icon and diamond does not fit: the label shrinks to 0.75 and then truncates to 'Exp ·…', 'High ·…', 'Shad ·…' (⚠️ noted in INDEX.md); (4) the Masks card (`MasksCard`, 'Masks · + Add' when the project has none); (5) the inline save offer where the project is Edited. 'Reset adjustments' is Mac-only (spec §3); on iOS the resets live under a long-press on the panel title. No marquee badge over the picture (`railMarqueeBadge` is macOS-only). The back disc floats top-leading of the pane (`chrome`, 16 / 12 padding); the 1:1 toggle bottom-trailing, 12 pt in, while `hasPixelsToReveal`. The picture fills the column's height or width, centred; the home indicator (21 pt safe inset) is the only bottom inset, so the rail's foot and the strip run to y = 372. THIS CANVAS: Light › Exp · Con open at board 2a's seed (exposure +0.30, contrast +12), a 3:2 photo 425×284 centred at 44…328. The pad is cut by the screen's foot at 393 — its readouts sit at y ≈ 414 and the Masks card below; scroll the rail. Stage with LL_VIEWER=1 LL_SECTIONS=light:expcon on a photo project in landscape (rotate the simulator through Device ▸ Rotate Left and read the orientation back — the click is dropped about one time in three); the reference capture iphone-land-light-expcon.png was an interval shoot with the strip.</desc>
