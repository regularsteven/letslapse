        <circle cx="132" cy="360" r="52" fill="#FFB340" opacity="0.15"/>
        <polygon points="0,552 70,500 150,544 235,472 310,534 393,490 393,788 0,788" fill="#141A24"/>
        <polygon points="0,638 85,594 185,646 268,608 393,640 393,788 0,788" fill="#0B0E14"/>
        <rect x="0" y="700" width="393" height="88" fill="#080A0E"/>
