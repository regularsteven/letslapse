            <rect x="115.75" y="617" width="1.5" height="8" fill="#FFF" opacity="0.4"/>
            <rect x="129.75" y="617" width="1.5" height="8" fill="#FFF" opacity="0.4"/>
            <rect x="143.75" y="617" width="1.5" height="14" fill="#FFF" opacity="0.85"/>
