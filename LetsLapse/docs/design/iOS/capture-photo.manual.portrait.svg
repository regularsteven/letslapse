<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Capture — Photo (manual exposure open, JPEG) · portrait</title>
  <desc>Mirrors App/CaptureView.swift (photoControlsRow · exposurePanel, Photo branch) + App/CaptureDials.swift (PhotoBlendDial · PhotoExposureWheels). Photo mode with manual exposure engaged from cluster slot 3 (M, amber). The panel — amber monospaced readout, ±3 EV offset meter, SHUTTER and ISO film-scroll wheels — sits between the mode row and the shutter row exactly where the locked-exposure panel does, pushing BLEND and the mode row up by its height (122 pt + 13 pt gap); the shutter row stays put. Wheels are third-stop detents, 1/8000–1.0s and ISO 32–6400, full stops labelled, selected detent amber under the fixed centre indicator; each wheel's left end is an A detent that hands that parameter back to AE — while it's on, CameraController runs a light live servo (gain-limited like the Holy Grail ramp engine) so that side keeps tracking the scene rather than freezing at whatever it was when A was reached. Shown at the AE values the wheels open on (ISO 200 · 1/60, offset 0). Simple capture is unchanged: the shutter fires with whatever the wheels say. There is no AE/AF lock in Photo mode any more — M's own seed-on-entry already freezes the current exposure, and tap-to-focus is separate.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="tile"><rect x="16" y="728" width="60" height="60" rx="12"/></clipPath>
    <clipPath id="shutter-wheel-clip"><rect x="80" y="611" width="297" height="44" rx="10"/></clipPath>
    <clipPath id="iso-wheel-clip"><rect x="80" y="663" width="297" height="44" rx="10"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232B3B"/><stop offset="0.62" stop-color="#3A3628"/><stop offset="1" stop-color="#4A3A22"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B2B2E"/><stop offset="1" stop-color="#2B2B2E" stop-opacity="0"/></linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B2B2E" stop-opacity="0"/><stop offset="1" stop-color="#2B2B2E"/></linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

