<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Editor preview page · downloading the originals · portrait</title>
  <desc>Mirrors App/EditorPreviewPage.swift's status card as PROGRESS (plan §4.2 / §9, §16; new 2026-09-26): after 'Download and Continue' for Light (project-photo.viewer.preview.prompt.portrait.svg) — or the card's own Download — `status` answers the download first (`picplace.progress[id].phase == .downloading`, stage 1's ordering fix): glyph `.cloud(.downloading)` — icloud.and.arrow.down.fill in LL.amber #FFB340 (§16: amber = moving; the tile's holdings pill shows the same cloud, `there.downloading`); title 'Downloading \(noun.text)' → 'Downloading the originals'; caption '\(bytesDone) of \(bytesTotal)' plus, with a `resume` group, ' · \(group) opens when \(pronoun) \(verb) here' → '120 MB of 209,9 MB · Light opens when they are here', wrapping in the column's 259.5 pt; under it `ProgressView(value: 0.57).tint(LL.amber)`, 2 pt below the caption — a 4 pt bar, the track white at 16 % — which stretches the text column to its full width (x 52 → 311.5); the action 'Stop' 13 pt semibold amber (`picplace.cancelSync`, drops `resume`). The badge row is unchanged. The card grows by the bar and a caption line (109.45 pt, top at 638.55), so the room above it shrinks and the 3:4 poster is height-limited: 389.7 × 519.6, centred, top 119 (the change animates). Non-blocking: the chrome, ⓘ and the swipe all still work, and moving on leaves the download running — nothing jumps. Before the first byte the caption is '209,9 MB to download', before PicPlace has listed the files 'Asking PicPlace for the files…'; a download from the card's own Download has no group, so no ' · Light opens …'. When the last file lands (`checkArrival`), App/PhotoViewerView.swift replaces the page on the same page with the Light panel open (`EditorPageRequest.group` → the editor's pending panel). Everything else as project-photo.viewer.preview.portrait.svg. HOOK: the PicPlace bench — a bound scratch root (`LL_PICPLACE_TOKENS` always), `LL_PICPLACE_REMOVE=&lt;uuid&gt;:originals`, then `LL_TAB=gallery LL_ITEM=&lt;uuid&gt; LL_PREVIEW_PROMPT=light:download`, with `LL_PICPLACE_TRANSFER_OUTAGE=0:20` to hold the progress on screen.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <linearGradient id="psky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FA3B8"/><stop offset="0.45" stop-color="#E8B98C"/><stop offset="1" stop-color="#F6DFB2"/></linearGradient>
    <linearGradient id="priver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9A45E"/><stop offset="1" stop-color="#5C666E"/></linearGradient>
    <clipPath id="pframe"><rect x="0" y="0" width="582" height="776"/></clipPath>
    
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.m{font-weight:500}</style>

