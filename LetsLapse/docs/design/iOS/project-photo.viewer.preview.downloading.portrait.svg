<text x="343.2" y="93.3" text-anchor="middle" font-size="12" class="sb" fill="#FFB340" fill-opacity="0.38">Masks</text>
</g>
</g>
<g id="foot"><!-- phoneBody's foot, bottom-anchored on the safe area (818): VStack(spacing 0) { statusCard(.dark) padded 12 sides / 8 below ; EditorGroupBar(.phone, locked) } — where the timeline card and the six buttons are in the editor -->
<g id="status-card"><!-- statusCard(style: .dark) — 369 × 109.4; the text column may take 259.5 pt (the card less padding, the 18 pt glyph, three 10 pt gaps, the Spacer's 8 and the action) -->
