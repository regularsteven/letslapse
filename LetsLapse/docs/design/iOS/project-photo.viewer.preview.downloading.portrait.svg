<text x="35.0" y="664.55" font-size="11" class="sb" fill="#FFF">INTERVAL · 54 s · 55 frames</text></g>
<!-- StatusGlyphView(.cloud(.downloading)): icloud.and.arrow.down.fill in LL.amber — the originals coming down (plan §16) -->
