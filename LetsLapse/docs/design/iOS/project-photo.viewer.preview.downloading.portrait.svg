      </g>
      </g>
<g id="touch-chrome"><!-- EditorPreviewPage.touchChrome: HStack(spacing 8) padded 16 / 12 under the safe area — Back · ⓘ · Spacer · EditorTabPill -->
<g id="back-button"><!-- chromeDisc("chevron.left", "Back"): 36 pt, black 40 % -->
