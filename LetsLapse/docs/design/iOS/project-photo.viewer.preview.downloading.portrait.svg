</g>
<g id="tab-pill"><!-- EditorTabPill(locked: Text · Frames · Masks): rgba(28,28,30,.85) over material, radius 18; the Editor page selected (amber, black label); a locked page's label is amber at 38 % — still tappable, the tap asks (hint "Needs the originals") -->
<rect x="127.7" y="74" width="249.3" height="30" rx="15" fill="#1C1C1E" opacity="0.85"/>
<rect x="130.7" y="77" width="59.2" height="24" rx="12" fill="#FFB340"/>
