<text x="52.0" y="710.01" font-size="11.5" fill="#8E8E93">120 MB of 209,9 MB · Light opens when they</text>
<text x="52.0" y="723.73" font-size="11.5" fill="#8E8E93">are here</text>
<!-- ProgressView(value: 120 / 209.9 = 0.57).tint(LL.amber), 2 pt under the caption: the VStack takes the whole column (259.5 pt) once the bar is in it -->
