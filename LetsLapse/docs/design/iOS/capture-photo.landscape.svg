<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Capture — Photo (idle, JPEG) · landscape</title>
  <desc>Mirrors App/CaptureView.swift (landscapeLayout, landscapeChromeRail, landscapeModeRail, photoControlsRow). Net-new mirror, 2026-09-07 — Photo had never had a landscape file before (the iOS/INDEX.md placeholder row "same rails as interval landscape, BLEND-only corner overlay" is superseded by this drawing). Structural template copied from capture-video.landscape.svg, since Photo shares Video's exact 16:9 viewfinder shape and the same `landscapeLayout` HStack: left chrome rail (close, format pill, headroom chip, lens zoom chips, remote-link chip, recent tile — identical shape to Video's own left rail, since `landscapeChromeRail` is one shared view gated only by `isCapturing`/recording, not by mode), centered 16:9 viewfinder, right mode rail (stacked PHOTO/INTERVAL/VIDEO labels via `landscapeModeToggle` — nothing else lives in this rail) plus the shutter cluster pinned separately over it by `shutterClusterLayer`. Read directly from `landscapeLayout` rather than guessed: **BLEND is not rail content.** `photoControlsRow` (`PhotoBlendDial` — a bare "BLEND" caption + graphite pill + chevron menu, no enclosing card, no orientation-specific version) is the exact same view used in portrait, hung by `landscapeLayout` as a `.overlay(alignment: .bottomLeading)` on the viewfinder's own frame with 10pt padding — the identical overlay slot Video's `landscapeEstimateChips` and Interval's `landscapeIntervalRow` occupy in their own mode branches (the three are mutually exclusive cases of one switch). No schedule-shoot button is drawn in the left rail: `scheduleShootButton` renders only `mode == .interval`, so Photo's copy of that slot is empty. Lens zoom chips sit in the chrome rail exactly where Video's do (`landscapeChromeRail`'s own `zoomChips`) — they are NOT beside the mode labels; the only Video-specific thing genuinely absent here is the "N× → Ts" speed-estimate chip pair, which is Video's alone. The BLEND control's exact pixel placement is a reasoned extrapolation (matched to the sibling idle mirrors' own measured bottom-leading corner, x≈181/y≈292 in both `capture-video.landscape.svg` and `capture-interval.landscape.svg`) rather than a fresh simulator capture — no device/sim screenshot was taken for this file.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="852" height="393" rx="54"/></clipPath>
    <clipPath id="tile"><rect x="83" y="296" width="60" height="60" rx="12"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232B3B"/><stop offset="0.62" stop-color="#3A3628"/><stop offset="1" stop-color="#4A3A22"/>
    </linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="18" y="18" width="864" height="405" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="852" height="393" fill="#000"/>
    <g transform="translate(24,24)">

      <!-- viewfinder: 16:9 fitted in the center column, vertically centered — same shape as capture-video.landscape.svg, Photo sharing Video's 16:9 preview aspect (see capture-photo.portrait.svg's own desc) -->
      <g id="viewfinder">
        <rect x="171" y="43" width="500" height="286" fill="url(#sky)"/>
        <circle cx="300" cy="150" r="26" fill="#FFB340" opacity="0.9"/>
        <circle cx="300" cy="150" r="46" fill="#FFB340" opacity="0.15"/>
        <polygon points="171,240 260,200 350,238 445,182 540,228 671,192 671,329 171,329" fill="#141A24"/>
        <polygon points="171,286 280,258 400,292 500,268 671,288 671,329 171,329" fill="#0B0E14"/>
      </g>

      <!-- left rail: landscapeChromeRail — shared with Interval/Video, gated only by isCapturing/recording, not mode -->
      <g id="left-rail">
        <g id="close" data-symbol="xmark">
          <circle cx="113" cy="40" r="19" fill="#2B2B2E" opacity="0.9"/>
          <path d="M107.5 34.5 L118.5 45.5 M118.5 34.5 L107.5 45.5" stroke="#FFF" stroke-width="2.2" stroke-linecap="round"/>
        </g>
        <!-- No schedule button here: scheduleShootButton renders only mode == .interval && !isCapturing, so Photo's copy of this slot is empty -->
        <g id="format-pill" transform="translate(37,0)">
          <rect x="38" y="133" width="150" height="35" rx="17.5" fill="#2B2B2E" opacity="0.9"/>
          <text x="52" y="155" font-size="13" class="sb" fill="#FFF">1920×1080</text>
          <text x="124" y="155" font-size="13" class="sb" fill="#FFF">· JPEG</text>
          <path d="M167 148 l4.5 5 l4.5 -5" stroke="#FFF" stroke-opacity="0.4" stroke-width="2" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
        </g>
        <!-- storage headroom, compact (no free-space half — headroomChip(compact: true)) -->
        <g id="headroom-chip" transform="translate(7,0)">
          <rect x="68" y="176" width="84" height="31" rx="15.5" fill="#2B2B2E" opacity="0.9"/>
          <g data-symbol="internaldrive" stroke="#FFF" stroke-width="1.2" fill="none">
            <rect x="79" y="186.5" width="12" height="10" rx="2.5"/>
            <path d="M81.5 193.5 h7 M81.5 195.5 h7" stroke-linecap="round"/>
          </g>
          <text x="96" y="196.0" font-size="12.5" class="sb" fill="#FFF">≈62.5k</text>
        </g>
        <g id="zoom-chips" data-symbol="lens buttons">
          <circle cx="75" cy="242" r="15" fill="none" stroke="#FFF" stroke-opacity="0.25"/>
          <text x="75" y="246" font-size="12" class="sb" fill="#FFF" opacity="0.6" text-anchor="middle">.5×</text>
          <circle cx="113" cy="242" r="15" fill="none" stroke="#FFB340" stroke-opacity="0.8"/>
          <text x="113" y="246" font-size="12" class="sb" fill="#FFB340" text-anchor="middle">1×</text>
          <circle cx="151" cy="242" r="15" fill="none" stroke="#FFF" stroke-opacity="0.25"/>
          <text x="151" y="246" font-size="12" class="sb" fill="#FFF" opacity="0.6" text-anchor="middle">3×</text>
        </g>
        <!-- remote link chip (RemoteLinkChip, advertising) — same leading edge as the pills -->
        <g id="remote-chip">
          <rect x="75" y="259" width="142" height="26" rx="13" fill="#2B2B2E" opacity="0.9"/>
          <circle cx="87" cy="272" r="3.5" fill="#FFB340"/>
          <text x="96" y="276.5" font-size="12.5" fill="#FFF" font-weight="500">Remote</text>
          <text x="149" y="276.5" font-size="12.5" class="b m" fill="#FFF" letter-spacing="1.5">931156</text>
        </g>
        <g id="recent-tile">
          <g clip-path="url(#tile)">
            <rect x="83" y="296" width="60" height="60" fill="#3A3123"/>
            <polygon points="83,340 107,318 129,336 143,326 143,356 83,356" fill="#241E15"/>
          </g>
          <rect x="83" y="296" width="60" height="60" rx="12" fill="none" stroke="#FFF" stroke-opacity="0.35"/>
        </g>
      </g>

      <!-- Photo's BLEND dial: photoControlsRow (PhotoBlendDial) hung bottom-leading of the
           viewfinder's own frame, 10pt padded — the same .overlay slot Video's landscapeEstimateChips
           and Interval's landscapeIntervalRow occupy in their branches of the same switch. Bare
           caption + pill, no enclosing card, identical markup to the portrait file's #photo-controls
           group (PhotoBlendDial has no landscape-specific layout) — just repositioned to this corner. -->
      <g id="photo-controls">
        <text x="181" y="310" font-size="10" class="b" fill="#FFF" opacity="0.45" letter-spacing="0.8">BLEND</text>
        <rect x="227" y="292" width="53" height="27" rx="13.5" fill="#2B2B2E" opacity="0.9"/>
        <text x="239" y="310" font-size="12.5" class="sb" fill="#FFF">10</text>
        <path d="M260 303 l4 4.5 l4 -4.5" stroke="#FFF" stroke-opacity="0.4" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
      </g>

      <!-- right rail: landscapeModeRail — stacked mode labels ONLY; the cluster is a separate
           pin (shutterClusterLayer), not rail content, though it visually lands in this column -->
      <g id="right-rail">
        <g id="mode-stack" font-size="11" class="b" text-anchor="middle">
          <text x="734" y="34" fill="#FFB340" letter-spacing="0.6">PHOTO</text>
          <text x="734" y="54" fill="#FFF" opacity="0.5" letter-spacing="0.6">INTERVAL</text>
          <text x="734" y="74" fill="#FFF" opacity="0.5" letter-spacing="0.6">VIDEO</text>
        </g>
        <!-- Shutter cluster: shared component. Edit ../components/shutter-cluster.photo-idle.landscape.svg,
             not this file; placement = ring centre (758, 196.5) minus (80, 60) — the same pin point
             capture-video.landscape.svg uses. Contract: components/README.md -->
        <image id="shutter-cluster" href="../components/shutter-cluster.photo-idle.landscape.svg" x="678" y="136.5" width="160" height="120"/>
      </g>

      <!-- hardware -->
      <rect x="11" y="134.5" width="36" height="124" rx="18" fill="#000" stroke="#2A2A2E" stroke-width="1"/>
      <rect x="359" y="380" width="134" height="5" rx="2.5" fill="#FFF" opacity="0.4"/>
    </g>
  </g>

  <text x="450" y="450" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Capture — Photo (idle, JPEG) · landscape · 852×393 pt</text>
  <text x="450" y="468" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/CaptureView.swift — landscapeLayout · photoControlsRow · landscapeModeToggle</text>
</svg>
