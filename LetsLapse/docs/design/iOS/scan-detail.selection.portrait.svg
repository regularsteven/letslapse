<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Scan session detail · selecting pages · portrait</title>
  <desc>Mirrors App/ScanDetailView.swift (selectionBar, ScanPageTile selection state, exportSelectionBar). Selection is entered from the detail's own nav bar, so the export sheet's "Export selected pages…" row is a shortcut into this same mode rather than a second mechanism. The bar becomes Done · "n selected" · All/None; selected tiles take a 3pt accent border and an accent check, unselected ones dim to 55%. The accent export bar sits 72pt off the bottom so it clears the floating tab bar — at the drawn 8pt it hides behind the pill and tints it orange through the material. Export renumbers from 1 across the selection: a gap in the numbers reads downstream as a missing page.</desc>
