<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Scan session detail · portrait</title>
  <desc>Mirrors App/ScanDetailView.swift (navigationBar, sessionMenu, header, correctionStrip, pageGrid, ScanPageTile). One scan opened, shaped like a shoot's project detail: back · the name centred · one ellipsis.circle. Its menu is Rename · Select · Export · Share project · Delete… — Select and Export are the two controls that used to be buttons in this bar and open the flows they always did, Share project writes the whole capture folder (pages, rectified copies, grouping, paper stock) as one importable .lapse. Nothing titles the scroll any more and the rename pencil went with the title, so the header opens on the facts — "8 pages · A4 · 3 min 12 s" and the correction ring whose fill is corrected ÷ DETECTED, so it never claims progress on pages with no corners — 36pt higher than they sat before. The grid still runs to the bottom edge with nothing pinned over it. The one card is the prompt strip — LL.ink with amber on it, shown only while some page has corners and no correction, and retired for good once the set is done. Pages are 2-up in portrait (177.5×251 at the A4 ratio), 3-up from 600pt and 4-up from 1000pt; each tile carries its number bottom-left and, when corrected, the amber perspective badge top-right — amber is legible there because it sits on imagery. Tab bar from 755, Scans selected.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.05"/></filter>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}.mono{font-family:ui-monospace,Menlo,monospace}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">
      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>
      <!-- nav bar: back · name centred · ⋯ — the same three parts a shoot's
           bar has (see project-detail.*.portrait.svg), so opening a scan and
           opening a shoot are one screen with different contents -->
      <g id="nav-bar">
        <path d="M27 74 l-6 7 6 7" fill="none" stroke="#C36A00" stroke-width="2.6" stroke-linecap="round" data-symbol="chevron.left"/>
        <text x="34" y="87" font-size="17" fill="#C36A00">Scans</text>
        <text x="196.5" y="87" font-size="17" class="sb" fill="#000" text-anchor="middle">16 Aug, 21:21</text>
        <g data-symbol="ellipsis.circle">
          <circle cx="367" cy="82" r="11" fill="none" stroke="#C36A00" stroke-width="1.8"/>
          <circle cx="361.5" cy="82" r="1.6" fill="#C36A00"/><circle cx="367" cy="82" r="1.6" fill="#C36A00"/><circle cx="372.5" cy="82" r="1.6" fill="#C36A00"/>
        </g>
      </g>

      <!-- header: no title of its own — the name is in the bar, so this opens
           on the facts and the correction state, 36pt higher than it sat when
           a 28pt title and its rename pencil were here -->
      <g id="header">
        <text x="20" y="117" font-size="13.5" class="sec">8 pages · A4 · 3 min 12 s</text>
        <g data-symbol="progress-ring"><circle cx="26.5" cy="132" r="5.5" fill="none" stroke="#E2E2E6" stroke-width="3.4"/><circle cx="26.5" cy="132" r="5.5" fill="none" stroke="#C36A00" stroke-width="3.4" stroke-dasharray="29.62 4.94" stroke-linecap="round" transform="rotate(-90 26.5 132)"/></g>
        <text x="39" y="136" font-size="13" class="sec">Rectangle on 7 of 8 · 6 corrected</text>
