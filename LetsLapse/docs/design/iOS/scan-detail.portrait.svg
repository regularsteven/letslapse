        <!-- row 3: the sliver the grid shows under the floating tab bar —
             36pt more of it now the title has gone -->
        <g id="page-5"><rect x="16" y="778" width="177.5" height="251" rx="9" fill="#F2F0EA"/><rect x="26" y="792" width="141.8" height="5.3" fill="#59544E"/><rect x="26" y="810.9" width="141.8" height="5.3" fill="#59544E"/><rect x="26" y="829.8" width="141.8" height="5.3" fill="#59544E"/><rect x="26" y="848.7" width="86.6" height="5.3" fill="#59544E"/></g>
        <g id="page-6"><rect x="199.5" y="778" width="177.5" height="251" rx="9" fill="#F2F0EA"/><rect x="209.5" y="792" width="141.8" height="5.3" fill="#59544E"/><rect x="209.5" y="810.9" width="141.8" height="5.3" fill="#59544E"/><rect x="209.5" y="829.8" width="141.8" height="5.3" fill="#59544E"/><rect x="209.5" y="848.7" width="86.6" height="5.3" fill="#59544E"/></g>
