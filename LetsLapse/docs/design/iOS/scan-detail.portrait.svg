        <text x="61" y="210" font-size="11.5" fill="#FFF" fill-opacity="0.55">Originals are kept either way</text>
        <rect x="285" y="183" width="78" height="30" rx="15" fill="#FFB340"/>
        <text x="324" y="203" font-size="12.5" class="b" fill="#1C1C1E" text-anchor="middle">Correct</text>
      </g>

