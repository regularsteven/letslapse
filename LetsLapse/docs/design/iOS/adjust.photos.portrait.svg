<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Adjust — New blended clip (photos source) · portrait</title>
  <desc>Mirrors App/AdjustView.swift for an interval/photos source: FlowHeader, source card, tail-frame banner (shaky end-of-shoot frames with Keep/Exclude), ink stack card with blend-depth slider, photos→frames line and True-light toggle, bottom CTA. No tab bar on flow screens.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- flow header -->
      <g id="flow-header">
        <circle cx="33" cy="88" r="17" fill="#FFF" filter="url(#soft)"/>
        <path d="M37 80 l-8 8 8 8" stroke="#C36A00" stroke-width="2.4" fill="none" stroke-linecap="round" data-symbol="chevron.left"/>
        <text x="196.5" y="93" font-size="16" class="sb" fill="#000" text-anchor="middle">New blended clip</text>
      </g>

      <!-- source card -->
      <g id="source-card">
        <rect x="16" y="115" width="361" height="72" rx="16" fill="#FFF" filter="url(#soft)"/>
        <rect x="28" y="127" width="64" height="48" rx="7" fill="#4A3B2E"/>
        <circle cx="50" cy="142" r="6" fill="#FFD9A0" opacity="0.85"/>
        <polygon points="28,164 54,152 76,162 92,154 92,175 28,175" fill="#2E2419"/>
        <text x="104" y="147" font-size="14.5" class="sb" fill="#000">Interval — harbour dusk</text>
        <text x="104" y="164" font-size="12" fill="#6D6D72">184 photos · Interval · DNG · shot yesterday</text>
        <text x="363" y="155" font-size="12.5" class="sb" fill="#C36A00" text-anchor="end">Change</text>
      </g>

      <!-- tail-frame banner -->
      <g id="tail-frame-banner">
        <rect x="16" y="201" width="361" height="64" rx="16" fill="#FFF" filter="url(#soft)"/>
        <path d="M32 233 q3 -10 6 0 t6 0 t6 0" stroke="#FFB340" stroke-width="2" fill="none" stroke-linecap="round" data-symbol="waveform"/>
        <text x="60" y="228" font-size="13.5" class="sb" fill="#000">3 shaky frames at the end</text>
        <text x="60" y="245" font-size="11.5" fill="#6D6D72">Looks like a phone-grab as you stopped — drop them?</text>
        <text x="306" y="238" font-size="12.5" class="sb" fill="#6D6D72" text-anchor="end">Keep</text>
        <rect x="316" y="219" width="70" height="28" rx="14" fill="#FFB340" transform="translate(-6,0)"/>
        <text x="345" y="238" font-size="12.5" class="b" fill="#000" text-anchor="middle">Exclude</text>
      </g>

      <!-- stack card (ink) -->
      <g id="stack-card">
        <rect x="16" y="279" width="361" height="278" rx="16" fill="#1C1C1E"/>
        <text x="32" y="311" font-size="20" class="b" fill="#FFF">A blended timelapse</text>
        <text x="32" y="331" font-size="12.5" fill="#FFF" opacity="0.6">Every 10 photos average into one frame — a rolling long</text>
        <text x="32" y="346" font-size="12.5" fill="#FFF" opacity="0.6">exposure that carries motion blur through the whole sequence.</text>

        <text x="32" y="379" font-size="13" class="sb" fill="#FFF">Blend depth</text>
        <text x="361" y="379" font-size="12" class="sb" fill="#FFB340" text-anchor="end">10 photos → 1 frame</text>
        <g id="depth-slider">
          <rect x="32" y="392" width="329" height="4" rx="2" fill="#48484A"/>
          <rect x="32" y="392" width="46" height="4" rx="2" fill="#FFB340"/>
          <circle cx="78" cy="394" r="13" fill="#FFF" filter="url(#soft)"/>
        </g>
        <text x="32" y="424" font-size="10" fill="#FFF" opacity="0.35">Crisp</text>
        <text x="361" y="424" font-size="10" fill="#FFF" opacity="0.35" text-anchor="end">Long exposure</text>

        <text x="32" y="455" font-size="13.5" class="sb" fill="#FFF">184 photos → 18 frames</text>
        <text x="196" y="455" font-size="12" fill="#FFF" opacity="0.45">· 0.6s at 30 fps</text>

        <text x="32" y="492" font-size="15" fill="#FFF">True-light blending</text>
        <text x="32" y="508" font-size="11.5" fill="#FFF" opacity="0.5">Blends in linear light — smoother highlights</text>
        <g id="truelight-toggle" data-symbol="Toggle (on, green)">
          <rect x="310" y="483" width="51" height="31" rx="15.5" fill="#34C759"/>
          <circle cx="345" cy="498.5" r="13.5" fill="#FFF" filter="url(#soft)"/>
        </g>
      </g>

      <!-- bottom CTA -->
      <g id="bottom-bar">
        <rect x="0" y="726" width="393" height="126" fill="#F2F2F7"/>
        <rect x="16" y="738" width="361" height="50" rx="14" fill="#C36A00"/>
        <text x="196.5" y="768" font-size="16" class="b" fill="#FFF" text-anchor="middle">Create 18-frame timelapse</text>
        <text x="196.5" y="806" font-size="11.5" fill="#6D6D72" text-anchor="middle">Your original is kept — you can always make another blended clip.</text>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Adjust — New blended clip (photos) · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/AdjustView.swift — TailFrameBanner · stackCard · blend-depth slider</text>
</svg>
