<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Capture — Photo (burst running) · portrait</title>
  <desc>Mirrors App/CaptureView.swift (burstStatusPill) + App/BurstStatusIndicator.swift. A plain-still burst mid-run: the burst pill takes the BLEND dial's slot, centred above the mode row — 249×26 black @ 50%, a 5 pt bar (track #FFF @ 16%) and an SF Mono 12 count in a 46 pt trailing column (amber taken, #FFF @ 40% denominator). Shown capped at 7/10: continuous amber fill. The Bulb twin swaps the fill for a decay zebra (13 pt pitch · 55% duty, compressing to barWidth/n, opacity 30% oldest → 100% newest) and a bare counter — same pill, nothing else differs. JPEG and DNG alike: plain bursts count stills (camera.photoCount), DNG shots count the RAW frames gathered in the blend window (liveBlendDiagnostics), replacing the old "Blending DNG…" text. Appears on the first shot; after the last it holds 900 ms, fades 400 ms, unmounts. Mode row stays visible but inert; shutter is the stop square; format pill locks. Seed with LL_CAPTURE=1 LL_BURST=7/10 (or LL_BURST=47 for the zebra).</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="tile"><rect x="16" y="728" width="60" height="60" rx="12"/></clipPath>
    <clipPath id="bar"><rect x="84" y="648.5" width="170" height="5" rx="2.5"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232B3B"/><stop offset="0.62" stop-color="#3A3628"/><stop offset="1" stop-color="#4A3A22"/>
    </linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#000"/>
    <g transform="translate(24,24)">

      <!-- viewfinder 16:9 -->
      <g id="viewfinder">
        <rect x="0" y="89" width="393" height="699" fill="url(#sky)"/>
        <circle cx="132" cy="360" r="30" fill="#FFB340" opacity="0.9"/>
        <circle cx="132" cy="360" r="52" fill="#FFB340" opacity="0.15"/>
        <polygon points="0,552 70,500 150,544 235,472 310,534 393,490 393,788 0,788" fill="#141A24"/>
        <polygon points="0,638 85,594 185,646 268,608 393,640 393,788 0,788" fill="#0B0E14"/>
        <rect x="0" y="700" width="393" height="88" fill="#080A0E"/>
      </g>

      <!-- top bar: close stays (a burst is not camera.isRecording); format pill locks -->
      <g id="top-bar">
        <g id="close" data-symbol="xmark">
          <circle cx="35" cy="88" r="19" fill="#2B2B2E" opacity="0.9"/>
          <path d="M29.5 82.5 L40.5 93.5 M40.5 82.5 L29.5 93.5" stroke="#FFF" stroke-width="2.2" stroke-linecap="round"/>
        </g>
        <g id="format-pill">
          <rect x="217" y="70" width="160" height="35" rx="17.5" fill="#2B2B2E" opacity="0.9"/>
          <text x="231" y="92" font-size="13" class="sb" fill="#FFF" opacity="0.55">1920×1080</text>
          <text x="306" y="92" font-size="13" class="sb" fill="#FFF" opacity="0.55">· JPEG</text>
          <g data-symbol="lock.fill" transform="translate(352,79)">
            <rect x="0" y="5" width="10" height="8" rx="1.5" fill="#FFF" opacity="0.4"/>
            <path d="M2 5 v-1.5 a3 3 0 0 1 6 0 V5" fill="none" stroke="#FFF" stroke-opacity="0.4" stroke-width="1.6"/>
          </g>
        </g>
        <!-- storage headroom: what is left of the disk in the armed format -->
        <g id="headroom-chip">
          <rect x="62" y="72" width="147" height="31" rx="15.5" fill="#2B2B2E" opacity="0.9"/>
          <g data-symbol="internaldrive" stroke="#FFF" stroke-width="1.2" fill="none">
            <rect x="73" y="82.5" width="12" height="10" rx="2.5"/>
            <path d="M75.5 89.5 h7 M75.5 91.5 h7" stroke-linecap="round"/>
          </g>
          <text x="90" y="92.0" font-size="12.5" class="sb" fill="#FFF">≈62.4k</text>
          <text x="140" y="92.0" font-size="12.5" fill="#FFF" opacity="0.45">· 32.4 GB</text>
        </g>
      </g>

      <!-- burst pill: BurstStatusIndicator in the interval-pills slot.
           249×26 r13 #000@50% · insets 12 lead / 11 trail · 10 gap ·
           bar 170×5 r2.5 on #FFF@16% · count SF Mono 12 in a 46 pt column -->
      <g id="burst-pill">
        <rect x="72" y="638" width="249" height="26" rx="13" fill="#000" opacity="0.5"/>
        <rect x="84" y="648.5" width="170" height="5" rx="2.5" fill="#FFF" opacity="0.16"/>
        <g clip-path="url(#bar)">
          <rect x="84" y="648.5" width="119" height="5" rx="2.5" fill="#FFB340"/>
        </g>
        <text x="310" y="655.5" font-size="12" class="m" text-anchor="end"><tspan fill="#FFB340">7</tspan><tspan fill="#FFF" fill-opacity="0.4">/10</tspan></text>
      </g>

      <!-- mode row + zoom chips: on screen under the run, but inert -->
      <g id="mode-row" font-size="13" class="sb">
        <text x="44" y="697" fill="#FFB340" letter-spacing="0.3">PHOTO</text>
        <text x="105" y="697" fill="#FFF" opacity="0.5" letter-spacing="0.3">INTERVAL</text>
        <text x="185" y="697" fill="#FFF" opacity="0.5" letter-spacing="0.3">VIDEO</text>
        <g id="zoom-chips" data-symbol="lens buttons">
          <circle cx="256" cy="692" r="15" fill="none" stroke="#FFF" stroke-opacity="0.25"/>
          <text x="256" y="696" font-size="12" class="sb" fill="#FFF" opacity="0.6" text-anchor="middle">.5×</text>
          <circle cx="294" cy="692" r="15" fill="none" stroke="#FFB340" stroke-opacity="0.8"/>
          <text x="294" y="696" font-size="12" class="sb" fill="#FFB340" text-anchor="middle">1×</text>
          <circle cx="332" cy="692" r="15" fill="none" stroke="#FFF" stroke-opacity="0.25"/>
          <text x="332" y="696" font-size="12" class="sb" fill="#FFF" opacity="0.6" text-anchor="middle">3×</text>
        </g>
      </g>

      <!-- shutter row: stop square while the run lasts -->
      <g id="shutter-row">
        <g id="recent-tile">
          <g clip-path="url(#tile)">
            <rect x="16" y="728" width="60" height="60" fill="#3A3123"/>
            <polygon points="16,772 40,750 62,768 76,758 76,788 16,788" fill="#241E15"/>
          </g>
          <rect x="16" y="728" width="60" height="60" rx="12" fill="none" stroke="#FFF" stroke-opacity="0.35"/>
        </g>
        <g id="grid-toggle" data-symbol="grid.circle">
          <circle cx="108" cy="732" r="22" fill="#2B2B2E" opacity="0.9"/>
          <circle cx="108" cy="732" r="10" fill="none" stroke="#FFF" stroke-width="1.6"/>
          <path d="M101.5 728.7 h13 M101.5 735.3 h13 M104.7 725.5 v13 M111.3 725.5 v13" stroke="#FFF" stroke-width="1.2"/>
        </g>
        <g id="exposure-lock" data-symbol="lock.open">
          <circle cx="108" cy="784" r="22" fill="#2B2B2E" opacity="0.9"/>
          <rect x="102" y="783" width="12" height="9" rx="2" fill="none" stroke="#FFF" stroke-width="1.8"/>
          <path d="M105 783 v-4 a3.5 3.5 0 0 1 7 -1" fill="none" stroke="#FFF" stroke-width="1.8"/>
        </g>
        <g id="shutter" data-symbol="stop button">
          <circle cx="196.5" cy="758" r="38" fill="none" stroke="#FFF" stroke-width="4"/>
          <rect x="180.5" y="742" width="32" height="32" rx="8" fill="#FF3B30"/>
        </g>
        <g id="delay-toggle" data-symbol="timer">
          <circle cx="285" cy="732" r="22" fill="#2B2B2E" opacity="0.9"/>
          <circle cx="285" cy="733" r="9" fill="none" stroke="#FFF" stroke-width="1.7"/>
          <path d="M285 733 v-6 M282 723 h6" stroke="#FFF" stroke-width="1.7" stroke-linecap="round"/>
        </g>
        <g id="steady-toggle" data-symbol="hand.raised">
          <circle cx="285" cy="784" r="22" fill="#2B2B2E" opacity="0.9"/>
          <path d="M280 789 v-9 m3 9 v-11 m3 11 v-11 m3 11 v-9 m-9 9 a6 6 0 0 0 9 0 v-3" fill="none" stroke="#FFF" stroke-width="1.6" stroke-linecap="round"/>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000" stroke="#2A2A2E" stroke-width="1"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#FFF" opacity="0.4"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Capture — Photo (burst running, 7/10) · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/CaptureView.swift — burstStatusPill · App/BurstStatusIndicator.swift</text>
</svg>
