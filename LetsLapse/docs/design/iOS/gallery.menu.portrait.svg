        <g id="timeline-toggle">
          <rect x="345" y="84" width="32" height="32" rx="7" fill="#000" fill-opacity="0.05"/>
          <g fill="none" stroke="#6D6D72" stroke-width="1.7" stroke-linecap="round" data-symbol="calendar">
