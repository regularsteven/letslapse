<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Gallery · long-press menu with Select Multiple and Select All · portrait</title>
  <desc>gallery.portrait.svg with the tile's long-press menu open over tile 2 (App/GalleryGridContent.swift tileContextMenu), as of 2026-09-13: Open · New blended clip · ─ · Select Multiple · Select All · ─ · Edit · ─ · Delete…. Select Multiple turns selection mode on — every tile wears an empty circle and taps toggle (gallery.selecting.portrait.svg); Select All ticks every tile the Library sheet's filters leave visible (gallery.batch.portrait.svg). Neither selects the tile the menu was held on. The Mac's right-click menu is the same list plus Show in Finder (macOS/gallery.menu.svg). Drawn from the iPhone 17 Pro simulator, 2026-09-13.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="t00"><rect x="14" y="140" width="113.67" height="85.25" rx="8"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.m{font-weight:500}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
