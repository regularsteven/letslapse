        <text x="132" y="374" font-size="17" fill="#000">Select Multiple</text>
        <g data-symbol="checkmark.circle.fill"><circle cx="106" cy="412" r="8.5" fill="#C36A00"/><path d="M102 412 l3 3 5.5-5.5" fill="none" stroke="#FFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
        <text x="132" y="418" font-size="17" fill="#000">Select All</text>
