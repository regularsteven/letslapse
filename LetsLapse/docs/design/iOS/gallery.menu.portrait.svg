      <!-- ===== the long-press context menu (GalleryGridContent.tileContextMenu), 2026-09-13:
           the tile lifts on its preview, the rest of the screen dims, and the menu drops under
           it — Open · New blended clip (Interval / Video only) · ─ · Select Multiple · Select All
           · ─ · Edit · ─ · Delete…. Select Multiple turns selection mode on (gallery.selecting);
           Select All ticks every visible tile (gallery.batch). Standard UIMenu: 250 pt, 44 pt
           rows, 17 pt, the glyph leading in LL.accent, the destructive row red. -->
      <g id="context-menu">
        <rect x="0" y="0" width="393" height="852" fill="#000" fill-opacity="0.18"/>
        <rect x="135.67" y="136" width="121.67" height="93.25" rx="10" fill="#4A3B2E" filter="url(#soft)"/>
