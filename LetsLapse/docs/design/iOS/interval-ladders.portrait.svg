<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Interval ladders · portrait</title>
  <desc>Mirrors App/LightLaddersView.swift (LightLaddersView, LadderRow) over App/LightLadderStore.swift. A sheet from either door — the Create tab's "Interval ladders" row (create-home.portrait.svg) or the ladder picker's Manage — owning its own NavigationStack (LadderRoute.editor / .rung), so it presents the same way from both. Large title "Interval ladders", Done trailing. Two inset-grouped sections: BUILT IN — one pinned row, the built-in, whose subtitle's first word is the badge ("Built in · 4 rungs · EV 13 · 8 · 4 · darker" — a trailing BUILT IN pill truncated the name to "Bright &amp; Fast, Dar…" on a 393 pt phone), a checkmark in LL.accent when it is the armed ladder, chevron; footer "Open to read it or duplicate it. The built-in is never edited in place, so a shoot from six months ago still means what it meant." YOUR LADDERS — the store's rows (swipe to delete), then "+ New ladder" in LL.accent, which creates a two-rung starter and pushes its editor; footer "Ladders are portable: a rung stores ISO as min, max, auto or a value, resolved for whichever device and lens arms it." Each row = 26 pt LadderSwatch (the ladder's rungs as a gradient) · name 16 · subtitle 11.5 secondary. Tapping a row pushes its editor (interval-ladder.editor.portrait.svg). The armed ladder here is the built-in, so the user clone carries no check. Staged by LL_LADDERS=list, which seeds the one user clone drawn ("Bright &amp; Fast (copy)") when the store is empty.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="sheet"><rect x="0" y="56" width="393" height="796" rx="10"/></clipPath>
    <linearGradient id="swatch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB340"/><stop offset="0.33" stop-color="#C36A00"/><stop offset="0.67" stop-color="#8A4A00"/><stop offset="1" stop-color="#1C1C1E"/>
    </linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#000"/>
    <g transform="translate(24,24)">

      <!-- status bar over the shrunken Create tab behind the sheet -->
      <g id="status-bar" fill="#FFF">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g id="signal"><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path id="wifi" d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#FFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g id="battery"><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#FFF" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#FFF" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>
      <!-- the parent's top edge, scaled back behind the sheet -->
      <rect x="16" y="44" width="361" height="30" rx="10" fill="#C7C7CC"/>

      <!-- the sheet -->
      <g id="ladders-sheet" clip-path="url(#sheet)">
        <rect x="0" y="56" width="393" height="796" fill="#F2F2F7"/>
        <text x="373" y="80" font-size="17" class="sb" fill="#C36A00" text-anchor="end">Done</text>
        <text x="16" y="144" font-size="34" class="b" fill="#000">Interval ladders</text>

        <g id="section-built-in">
          <text x="36" y="184" font-size="13" class="sec" letter-spacing="0.3">BUILT IN</text>
          <rect x="20" y="198" width="353" height="61" rx="10" fill="#FFF"/>
          <g id="row-built-in">
            <rect x="36" y="216" width="26" height="26" rx="7" fill="url(#swatch)"/>
            <text x="74" y="227" font-size="16" fill="#000">Bright &amp; Fast, Dark &amp; Slow</text>
            <text x="74" y="244" font-size="11.5" class="sec">Built in · 4 rungs · EV 13 · 8 · 4 · darker</text>
            <path d="M320 229 l4.5 4.5 l9 -9.5" stroke="#C36A00" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="checkmark"/>
            <path d="M345 222 l6 7 -6 7" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round" data-symbol="chevron.right"/>
          </g>
          <text x="36" y="273" font-size="13" class="sec">Open to read it or duplicate it. The built-in is never</text>
          <text x="36" y="289" font-size="13" class="sec">edited in place, so a shoot from six months ago still</text>
          <text x="36" y="305" font-size="13" class="sec">means what it meant.</text>
        </g>

        <g id="section-your-ladders">
          <text x="36" y="350" font-size="13" class="sec" letter-spacing="0.3">YOUR LADDERS</text>
          <rect x="20" y="364" width="353" height="103" rx="10" fill="#FFF"/>
          <g id="row-user-ladder">
            <rect x="36" y="381" width="26" height="26" rx="7" fill="url(#swatch)"/>
            <text x="74" y="393" font-size="16" fill="#000">Bright &amp; Fast (copy)</text>
            <text x="74" y="410" font-size="11.5" class="sec">4 rungs · EV 13 · 8 · 4 · darker</text>
            <path d="M345 387 l6 7 -6 7" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round" data-symbol="chevron.right"/>
          </g>
          <line x1="74" y1="424" x2="373" y2="424" stroke="#000" stroke-opacity="0.1"/>
          <g id="row-new-ladder">
            <path d="M49 440 v14 M42 447 h14" stroke="#C36A00" stroke-width="2" stroke-linecap="round" data-symbol="plus"/>
            <text x="80" y="453" font-size="17" fill="#C36A00">New ladder</text>
          </g>
          <text x="36" y="483" font-size="13" class="sec">Ladders are portable: a rung stores ISO as min, max,</text>
          <text x="36" y="499" font-size="13" class="sec">auto or a value, resolved for whichever device and</text>
          <text x="36" y="515" font-size="13" class="sec">lens arms it.</text>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Interval ladders · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors LightLaddersView (LightLaddersView · LadderRow) — BUILT IN · YOUR LADDERS · LL_LADDERS=list</text>
</svg>
