<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Capture — Interval (idle, DNG) · portrait</title>
  <desc>Mirrors App/CaptureView.swift (intervalPickerRow) + App/CaptureDials.swift (IntervalDialsRow) + App/CaptureHeadroom.swift (CaptureHeadroomChip). DNG armed: the session frames on the full 4:3 sensor, so the preview is 4:3 (y 115–639) and the pill reads "12MP 4:3 · DNG", with the storage-headroom chip ahead of it. MODE, EVERY and BLEND share one line below the preview — bare-value chips, no trailing caption. The clock beside the close button opens the schedule sheet; with it in the bar the headroom chip drops to its compact (shot-count-only) form.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="tile"><rect x="16" y="728" width="60" height="60" rx="12"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232B3B"/><stop offset="0.62" stop-color="#3A3628"/><stop offset="1" stop-color="#4A3A22"/>
    </linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#000"/>
    <g transform="translate(24,24)">

      <!-- viewfinder: full 4:3 sensor = 393×524, top-anchored under the top bar -->
      <g id="viewfinder">
        <rect x="0" y="115" width="393" height="524" fill="url(#sky)"/>
        <circle cx="132" cy="300" r="28" fill="#FFB340" opacity="0.9"/>
        <circle cx="132" cy="300" r="48" fill="#FFB340" opacity="0.15"/>
        <polygon points="0,440 70,392 150,432 235,366 310,424 393,382 393,639 0,639" fill="#141A24"/>
        <polygon points="0,510 85,470 185,516 268,482 393,510 393,639 0,639" fill="#0B0E14"/>
        <rect x="0" y="562" width="393" height="77" fill="#080A0E"/>
      </g>

      <!-- top bar -->
      <g id="top-bar">
        <g id="close" data-symbol="xmark">
          <circle cx="35" cy="88" r="19" fill="#2B2B2E" opacity="0.9"/>
          <path d="M29.5 82.5 L40.5 93.5 M40.5 82.5 L29.5 93.5" stroke="#FFF" stroke-width="2.2" stroke-linecap="round"/>
        </g>
        <!-- schedule shoot: Interval only, idle only. Opens the schedule
             sheet (capture-schedule-sheet.portrait.svg); the shoot it arms
             takes the screen to capture-standby.portrait.svg -->
        <g id="schedule" data-symbol="clock">
          <circle cx="81" cy="88" r="19" fill="#2B2B2E" opacity="0.9"/>
          <circle cx="81" cy="88" r="8.5" fill="none" stroke="#FFF" stroke-width="1.8"/>
          <path d="M81 83 v5 h3.5" stroke="#FFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g id="format-pill">
          <rect x="237" y="70" width="140" height="35" rx="17.5" fill="#2B2B2E" opacity="0.9"/>
          <text x="251" y="92" font-size="13" class="sb" fill="#FFF">12MP 4:3</text>
          <text x="313" y="92" font-size="13" class="sb" fill="#FFB340">· DNG</text>
          <path d="M356 85 l4.5 5 l4.5 -5" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
        </g>
        <!-- storage headroom: what is left of the disk in the armed format.
             COMPACT form (shot count only) — the clock button costs the bar
             46pt, and the pair is sized so the free-space half gives ground
             first (ViewThatFits in portraitTopBar) -->
        <g id="headroom-chip">
          <rect x="139" y="72" width="90" height="31" rx="15.5" fill="#2B2B2E" opacity="0.9"/>
          <g data-symbol="internaldrive" stroke="#FFF" stroke-width="1.2" fill="none">
            <rect x="150" y="82.5" width="12" height="10" rx="2.5"/>
            <path d="M152.5 89.5 h7 M152.5 91.5 h7" stroke-linecap="round"/>
          </g>
          <text x="167" y="92.0" font-size="12.5" class="sb" fill="#FFF">≈1,771</text>
        </g>
      </g>

      <!-- interval dials: MODE / EVERY / BLEND on ONE line. The chips read as
           bare values ("Basic", "2 s", "10") and there is no trailing caption,
           which is what lets all three share a line on a 393pt screen -->
      <g id="interval-dials">
          <text x="28" y="657" font-size="10" class="b" fill="#FFF" opacity="0.45" letter-spacing="0.8">MODE</text>
          <rect x="67" y="639" width="78" height="27" rx="13.5" fill="#2B2B2E" opacity="0.9"/>
          <text x="79" y="657" font-size="12.5" class="sb" fill="#FFF">Basic</text>
          <path d="M125 650 l4 4.5 l4 -4.5" stroke="#FFF" stroke-opacity="0.4" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
          <text x="153" y="657" font-size="10" class="b" fill="#FFF" opacity="0.45" letter-spacing="0.8">EVERY</text>
          <rect x="195" y="639" width="62" height="27" rx="13.5" fill="#2B2B2E" opacity="0.9"/>
          <text x="207" y="657" font-size="12.5" class="sb" fill="#FFF">2 s</text>
          <path d="M237 650 l4 4.5 l4 -4.5" stroke="#FFF" stroke-opacity="0.4" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
          <text x="265" y="657" font-size="10" class="b" fill="#FFF" opacity="0.45" letter-spacing="0.8">BLEND</text>
          <rect x="311" y="639" width="53" height="27" rx="13.5" fill="#2B2B2E" opacity="0.9"/>
          <text x="323" y="657" font-size="12.5" class="sb" fill="#FFF">10</text>
          <path d="M344 650 l4 4.5 l4 -4.5" stroke="#FFF" stroke-opacity="0.4" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
      </g>

      <!-- mode row + zoom chips -->
      <g id="mode-row" font-size="13" class="sb">
        <text x="44" y="697" fill="#FFF" opacity="0.5" letter-spacing="0.3">PHOTO</text>
        <text x="105" y="697" fill="#FFB340" letter-spacing="0.3">INTERVAL</text>
        <text x="185" y="697" fill="#FFF" opacity="0.5" letter-spacing="0.3">VIDEO</text>
        <g id="zoom-chips" data-symbol="lens buttons">
          <circle cx="256" cy="692" r="15" fill="none" stroke="#FFF" stroke-opacity="0.25"/>
          <text x="256" y="696" font-size="12" class="sb" fill="#FFF" opacity="0.6" text-anchor="middle">.5×</text>
          <circle cx="294" cy="692" r="15" fill="none" stroke="#FFB340" stroke-opacity="0.8"/>
          <text x="294" y="696" font-size="12" class="sb" fill="#FFB340" text-anchor="middle">1×</text>
          <circle cx="332" cy="692" r="15" fill="none" stroke="#FFF" stroke-opacity="0.25"/>
          <text x="332" y="696" font-size="12" class="sb" fill="#FFF" opacity="0.6" text-anchor="middle">3×</text>
        </g>
      </g>

      <!-- shutter row -->
      <g id="shutter-row">
        <g id="recent-tile">
          <g clip-path="url(#tile)">
            <rect x="16" y="728" width="60" height="60" fill="#3A3123"/>
            <polygon points="16,772 40,750 62,768 76,758 76,788 16,788" fill="#241E15"/>
          </g>
          <rect x="16" y="728" width="60" height="60" rx="12" fill="none" stroke="#FFF" stroke-opacity="0.35"/>
        </g>
        <g id="grid-toggle" data-symbol="grid.circle">
          <circle cx="108" cy="732" r="22" fill="#2B2B2E" opacity="0.9"/>
          <circle cx="108" cy="732" r="10" fill="none" stroke="#FFF" stroke-width="1.6"/>
          <path d="M101.5 728.7 h13 M101.5 735.3 h13 M104.7 725.5 v13 M111.3 725.5 v13" stroke="#FFF" stroke-width="1.2"/>
        </g>
        <g id="exposure-lock" data-symbol="lock.open">
          <circle cx="108" cy="784" r="22" fill="#2B2B2E" opacity="0.9"/>
          <rect x="102" y="783" width="12" height="9" rx="2" fill="none" stroke="#FFF" stroke-width="1.8"/>
          <path d="M105 783 v-4 a3.5 3.5 0 0 1 7 -1" fill="none" stroke="#FFF" stroke-width="1.8"/>
        </g>
        <g id="shutter" data-symbol="record button">
          <circle cx="196.5" cy="758" r="38" fill="none" stroke="#FFF" stroke-width="4"/>
          <circle cx="196.5" cy="758" r="30" fill="#FF3B30"/>
        </g>
        <g id="delay-toggle" data-symbol="timer">
          <circle cx="285" cy="732" r="22" fill="#2B2B2E" opacity="0.9"/>
          <circle cx="285" cy="733" r="9" fill="none" stroke="#FFF" stroke-width="1.7"/>
          <path d="M285 733 v-6 M282 723 h6" stroke="#FFF" stroke-width="1.7" stroke-linecap="round"/>
        </g>
        <g id="steady-toggle" data-symbol="hand.raised">
          <circle cx="285" cy="784" r="22" fill="#2B2B2E" opacity="0.9"/>
          <path d="M280 789 v-9 m3 9 v-11 m3 11 v-11 m3 11 v-9 m-9 9 a6 6 0 0 0 9 0 v-3" fill="none" stroke="#FFF" stroke-width="1.6" stroke-linecap="round"/>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000" stroke="#2A2A2E" stroke-width="1"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#FFF" opacity="0.4"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Capture — Interval (idle, DNG) · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/CaptureView.swift — intervalPickerRow · formatPill (DNG) · 4:3 sensor preview</text>
</svg>
