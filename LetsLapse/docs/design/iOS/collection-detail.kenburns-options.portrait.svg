<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Collection detail · Ken Burns Custom drawer · portrait</title>
  <desc>Mirrors App/CollectionDetailView.swift (kenBurnsCustomDrawer, kenBurnsOptionRows, openKenBurnsDrawer, closeKenBurnsDrawer): the Custom drawer, right after tapping Custom in the header's tri-state. Tapping Custom snapshots the settings, switches the live values to the remembered custom ones (KenBurnsSettings.lastCustom, parked when Auto took over — nothing is ever destroyed, so no confirmation exists anywhere in this flow), flags custom, and presents this drawer: a SHEET on iPhone (medium detent, drag indicator hidden, interactive dismiss disabled) and a POPOVER on iPad and the Mac (380×480, anchored to the control). Content, top to bottom: title "Ken Burns · Custom" 15 semibold with sub "Tune the pacing and the joins — the preview and timeline follow along." (and they do: every edit in here applies LIVE — the summary total, row subtitles and preview all move while the drawer is up); a divider; then the four option rows at 14pt rhythm — Consistent durations toggle ("Every clip plays the same length" / off: "Clips keep their own lengths, as shot"); Clip duration stepper ("The shortest clip caps it at 6s", value "6s" accentDeep monospaced — the stored preference survives the timeline changing under it, a clamp is never a preference, floor 1s); Auto adjust clip speed toggle (shown only under consistent durations, "Longer clips speed up to fit — only when required" / off: "Each clip plays a 6s window — set its start point from the timeline", which turns the rows' trim button into "Set the clip's start point"); Fade transition toggle ("Clips crossfade for 0.5s" / off: "Straight cuts between clips"); a divider; then Cancel (accent 9% fill, accent text) and Apply (accent fill, white bold) at 44pt. Apply keeps what is live and Custom stays selected; Cancel — or ANY dismissal without Apply — restores the snapshot wholesale, back to whichever mode the drawer opened from. Behind the sheet the screen shows Custom selected in the tri-state and the framing editor untouched, under the system scrim. At-rest screen: collection-detail.portrait.svg; the framing editor: collection-detail.kenburns.portrait.svg.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.05"/></filter>
    <linearGradient id="clipA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33415A"/><stop offset="1" stop-color="#1B2330"/></linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- inline nav -->
      <g id="nav">
        <circle cx="38" cy="84" r="17" fill="#FFF" filter="url(#card)"/>
        <path d="M42 76 l-8 8 8 8" stroke="#1C1C1E" stroke-width="2.6" fill="none" stroke-linecap="round" data-symbol="chevron.left"/>
        <text x="196.5" y="90" font-size="17" class="sb" fill="#000" text-anchor="middle">Harbour reel</text>
        <circle cx="355" cy="84" r="17" fill="#FFF" filter="url(#card)"/>
        <g stroke="#C36A00" fill="#C36A00" data-symbol="ellipsis.circle"><circle cx="355" cy="84" r="10" fill="none" stroke-width="1.8"/><circle cx="350" cy="84" r="1.4" stroke="none"/><circle cx="355" cy="84" r="1.4" stroke="none"/><circle cx="360" cy="84" r="1.4" stroke="none"/></g>
      </g>

      <!-- the screen behind: framing editor + header with Custom selected -->
      <g id="behind">
        <rect x="16" y="115" width="361" height="203" rx="12" fill="url(#clipA)"/>
        <rect x="17" y="116" width="359" height="201" fill="none" stroke="#FFF" stroke-width="2"/>
        <path d="M136.3 116 v201 M256.7 116 v201 M17 182.7 h359 M17 250.3 h359" stroke="#FFF" stroke-opacity="0.35"/>
        <rect x="228" y="180" width="120" height="68" fill="none" stroke="#FFB340" stroke-opacity="0.75" stroke-width="1.5" stroke-dasharray="5 4"/>
        <rect x="21" y="297" width="58" height="16" rx="8" fill="#000" opacity="0.55"/>
        <circle cx="30" cy="305" r="3" fill="#FFF"/>
        <text x="36" y="308.5" font-size="8.5" class="b" fill="#FFF" letter-spacing="0.5">START</text>
        <rect x="26" y="125" width="128" height="19" rx="9.5" fill="#000" opacity="0.5"/>
        <text x="90" y="138" font-size="10.5" class="sb" fill="#FFF" text-anchor="middle">Harbour dawn · 100×</text>
        <rect x="305" y="284" width="62" height="24" rx="12" fill="#000" opacity="0.55"/>
        <text x="328" y="300" font-size="12" class="sb" fill="#FFF" text-anchor="middle">16:9</text>
        <path d="M347 296 l4 4 4 -4" stroke="#FFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>

        <rect x="18" y="326" width="74" height="24" rx="12" fill="#C36A00"/>
        <circle cx="31" cy="338" r="3.5" fill="#FFF"/>
        <text x="60" y="342" font-size="10.5" class="b" fill="#FFF" text-anchor="middle" letter-spacing="0.5">START</text>
        <rect x="100" y="326" width="62" height="24" rx="12" fill="#C36A00" opacity="0.09"/>
        <circle cx="113" cy="338" r="3.5" fill="#FFB340"/>
        <text x="137" y="342" font-size="10.5" class="b" fill="#C36A00" text-anchor="middle" letter-spacing="0.5">END</text>
        <text x="174" y="342" font-size="11.5" class="sb" fill="#6D6D72">1.00×</text>

        <text x="20" y="384" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">TIMELINE · 3 CLIPS</text>
        <text x="234" y="383" font-size="10.5" class="sb" fill="#6D6D72" text-anchor="end">Ken Burns</text>
        <rect x="240" y="366" width="137" height="28" rx="14" fill="#FFF" filter="url(#card)"/>
        <text x="258.5" y="384" font-size="11" class="sb" fill="#C36A00" text-anchor="middle">Off</text>
        <text x="297" y="384" font-size="11" class="sb" fill="#C36A00" text-anchor="middle">Auto</text>
        <rect x="319" y="368" width="56" height="24" rx="12" fill="#C36A00"/>
        <text x="347" y="384" font-size="11" class="sb" fill="#FFF" text-anchor="middle">Custom</text>
      </g>

      <!-- system scrim under the sheet -->
      <rect x="0" y="0" width="393" height="852" fill="#000" opacity="0.16"/>

      <!-- the Custom drawer: medium-detent sheet -->
      <g id="drawer">
        <path d="M0 424 a24 24 0 0 1 24 -24 h345 a24 24 0 0 1 24 24 v428 h-393 z" fill="#FBFBFD"/>
        <text x="24" y="434" font-size="15" class="sb" fill="#000">Ken Burns · Custom</text>
        <text x="24" y="452" font-size="11.5" class="sec">Tune the pacing and the joins — the preview and</text>
        <text x="24" y="467" font-size="11.5" class="sec">timeline follow along.</text>
        <line x1="24" y1="482" x2="393" y2="482" stroke="#000" stroke-opacity="0.06"/>

        <!-- Consistent durations (on) -->
        <text x="24" y="510" font-size="14" fill="#000">Consistent durations</text>
        <text x="24" y="526" font-size="11.5" class="sec">Every clip plays the same length</text>
        <rect x="318" y="500" width="51" height="31" rx="15.5" fill="#C36A00"/>
        <circle cx="353.5" cy="515.5" r="13.5" fill="#FFF" filter="url(#card)"/>

        <!-- Clip duration (stepper) -->
        <text x="24" y="557" font-size="14" fill="#000">Clip duration</text>
        <text x="24" y="573" font-size="11.5" class="sec">The shortest clip caps it at 6s</text>
        <text x="263" y="572" font-size="14" class="sb" fill="#8A4A00" text-anchor="end">6s</text>
        <g id="stepper" data-symbol="minus / plus">
          <rect x="275" y="551" width="94" height="32" rx="8" fill="#E9E9EA"/>
          <line x1="322" y1="558" x2="322" y2="576" stroke="#000" stroke-opacity="0.12"/>
          <path d="M292 567 h13" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round"/>
          <path d="M339 567 h13 M345.5 560.5 v13" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round"/>
        </g>

        <!-- Auto adjust clip speed (on; only under consistent durations) -->
        <text x="24" y="604" font-size="14" fill="#000">Auto adjust clip speed</text>
        <text x="24" y="620" font-size="11.5" class="sec">Longer clips speed up to fit — only when required</text>
        <rect x="318" y="594" width="51" height="31" rx="15.5" fill="#C36A00"/>
        <circle cx="353.5" cy="609.5" r="13.5" fill="#FFF" filter="url(#card)"/>

        <!-- Fade transition (on) -->
        <text x="24" y="651" font-size="14" fill="#000">Fade transition</text>
        <text x="24" y="667" font-size="11.5" class="sec">Clips crossfade for 0.5s</text>
        <rect x="318" y="641" width="51" height="31" rx="15.5" fill="#C36A00"/>
        <circle cx="353.5" cy="656.5" r="13.5" fill="#FFF" filter="url(#card)"/>

        <line x1="0" y1="692" x2="393" y2="692" stroke="#000" stroke-opacity="0.06"/>

        <!-- Cancel / Apply -->
        <rect x="24" y="708" width="166" height="44" rx="12" fill="#C36A00" opacity="0.09"/>
        <text x="107" y="735" font-size="14" class="sb" fill="#C36A00" text-anchor="middle">Cancel</text>
        <rect x="203" y="708" width="166" height="44" rx="12" fill="#C36A00"/>
        <text x="286" y="735" font-size="14" class="b" fill="#FFF" text-anchor="middle">Apply</text>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Collection detail · Ken Burns Custom drawer · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/CollectionDetailView.swift — sheet on iPhone, popover on iPad/Mac · live edits · Apply keeps, any other exit restores the snapshot</text>
</svg>
