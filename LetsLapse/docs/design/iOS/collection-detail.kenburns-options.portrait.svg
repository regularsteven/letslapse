<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Collection detail · Ken Burns options · portrait</title>
  <desc>Mirrors App/CollectionDetailView.swift (kenBurnsSection, summaryCard, lastExportRow): the timeline builder scrolled to the Ken Burns card grown open — the state right after flipping the toggle, which deals best-effort defaults (consistentDurations ON, clipSeconds at the shortest-clip max, autoAdjustSpeed ON, fadeTransition ON) so Export straight away already cuts well; the settings are kept when the mode is toggled off. Card rows, top to bottom: the Ken Burns toggle ("A gentle zoom and pan across every clip on export"), a divider (inset 14), then at 14pt rhythm — Consistent durations toggle, sub "Every clip plays the same length" (off: "Clips keep their own lengths, as shot"); Clip duration stepper, sub "The shortest clip caps it at 6s", value "6s" accentDeep monospaced (the stored preference survives the timeline changing under it — a clamp is never a preference; floor 1s); Auto adjust clip speed toggle (shown only under consistent durations), sub "Longer clips speed up to fit — only when required" (off: "Each clip plays a 6s window — set its start point from the timeline", and the rows' trim button becomes "Set the clip's start point"); Fade transition toggle, sub "Clips crossfade for 0.5s" (off: "Straight cuts between clips"). Below, the export path in full: dark summary card — total "0:17" (3×6s minus two 0.5s crossfades) · "exports 3840×2160" · "3 clips · 16:9 canvas" · footer "Ken Burns moves on every clip, crossfades between them." (straight cuts variant swaps the ending; Ken Burns off: "Trims retime the cut automatically — clips always butt together.") — the "Export collection" primary CTA (50pt), and the kept-render row "Last export kept · yesterday" with green checkmark and trailing Share. The framing editor above this scroll position: collection-detail.kenburns.portrait.svg. At-rest screen: collection-detail.portrait.svg.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.05"/></filter>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- inline nav -->
      <g id="nav">
        <circle cx="38" cy="84" r="17" fill="#FFF" filter="url(#card)"/>
        <path d="M42 76 l-8 8 8 8" stroke="#1C1C1E" stroke-width="2.6" fill="none" stroke-linecap="round" data-symbol="chevron.left"/>
        <text x="196.5" y="90" font-size="17" class="sb" fill="#000" text-anchor="middle">Harbour reel</text>
        <circle cx="355" cy="84" r="17" fill="#FFF" filter="url(#card)"/>
        <g stroke="#C36A00" fill="#C36A00" data-symbol="ellipsis.circle"><circle cx="355" cy="84" r="10" fill="none" stroke-width="1.8"/><circle cx="350" cy="84" r="1.4" stroke="none"/><circle cx="355" cy="84" r="1.4" stroke="none"/><circle cx="360" cy="84" r="1.4" stroke="none"/></g>
      </g>

      <!-- add clips (dashed) — the timeline sits just above this scroll position -->
      <g id="add-clips">
        <rect x="16" y="108" width="361" height="52" rx="14" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="5 4"/>
        <path d="M158 139 v-10 M153 134 h10" stroke="#C36A00" stroke-width="2.2" stroke-linecap="round" data-symbol="plus"/>
        <text x="172" y="144" font-size="15" class="sb" fill="#C36A00">Add clips</text>
      </g>

      <!-- Ken Burns card, ON, grown open with the dealt defaults -->
      <g id="ken-burns-options">
        <rect x="16" y="172" width="361" height="268" rx="16" fill="#FFF" filter="url(#card)"/>

        <!-- toggle row -->
        <text x="30" y="195" font-size="14.5" class="sb" fill="#000">Ken Burns</text>
        <text x="30" y="211" font-size="11.5" class="sec">A gentle zoom and pan across every clip</text>
        <text x="30" y="226" font-size="11.5" class="sec">on export</text>
        <rect x="312" y="192" width="51" height="31" rx="15.5" fill="#C36A00"/>
        <circle cx="347.5" cy="207.5" r="13.5" fill="#FFF" filter="url(#card)"/>

        <line x1="30" y1="242" x2="377" y2="242" stroke="#000" stroke-opacity="0.06"/>

        <!-- Consistent durations (on) -->
        <text x="30" y="265" font-size="14" fill="#000">Consistent durations</text>
        <text x="30" y="281" font-size="11.5" class="sec">Every clip plays the same length</text>
        <rect x="312" y="255" width="51" height="31" rx="15.5" fill="#C36A00"/>
        <circle cx="347.5" cy="270.5" r="13.5" fill="#FFF" filter="url(#card)"/>

        <!-- Clip duration (stepper) -->
        <text x="30" y="312" font-size="14" fill="#000">Clip duration</text>
        <text x="30" y="328" font-size="11.5" class="sec">The shortest clip caps it at 6s</text>
        <text x="257" y="327" font-size="14" class="sb" fill="#8A4A00" text-anchor="end">6s</text>
        <g id="stepper" data-symbol="minus / plus">
          <rect x="269" y="306" width="94" height="32" rx="8" fill="#E9E9EA"/>
          <line x1="316" y1="313" x2="316" y2="331" stroke="#000" stroke-opacity="0.12"/>
          <path d="M286 322 h13" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round"/>
          <path d="M333 322 h13 M339.5 315.5 v13" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round"/>
        </g>

        <!-- Auto adjust clip speed (on; only under consistent durations) -->
        <text x="30" y="359" font-size="14" fill="#000">Auto adjust clip speed</text>
        <text x="30" y="375" font-size="11.5" class="sec">Longer clips speed up to fit — only when required</text>
        <rect x="312" y="349" width="51" height="31" rx="15.5" fill="#C36A00"/>
        <circle cx="347.5" cy="364.5" r="13.5" fill="#FFF" filter="url(#card)"/>

        <!-- Fade transition (on) -->
        <text x="30" y="406" font-size="14" fill="#000">Fade transition</text>
        <text x="30" y="422" font-size="11.5" class="sec">Clips crossfade for 0.5s</text>
        <rect x="312" y="396" width="51" height="31" rx="15.5" fill="#C36A00"/>
        <circle cx="347.5" cy="411.5" r="13.5" fill="#FFF" filter="url(#card)"/>
      </g>

      <!-- summary card, in full -->
      <g id="summary">
        <rect x="16" y="452" width="361" height="120" rx="18" fill="#1C1C1E"/>
        <text x="32" y="488" font-size="26" class="b" fill="#FFF">0:17</text>
        <text x="361" y="484" font-size="12" fill="#FFF" opacity="0.65" text-anchor="end">exports 3840×2160</text>
        <text x="32" y="506" font-size="12.5" fill="#FFF" opacity="0.65">3 clips · 16:9 canvas</text>
        <text x="32" y="528" font-size="11.5" fill="#FFF" opacity="0.45">Ken Burns moves on every clip, crossfades between them.</text>
      </g>

      <!-- export CTA -->
      <g id="export-cta">
        <rect x="16" y="584" width="361" height="50" rx="14" fill="#C36A00"/>
        <text x="196.5" y="614" font-size="15" class="b" fill="#FFF" text-anchor="middle">Export collection</text>
      </g>

      <!-- last export kept -->
      <g id="last-export">
        <rect x="16" y="646" width="361" height="50" rx="14" fill="#FFF" filter="url(#card)"/>
        <path d="M32 671 l5 5 9 -10" stroke="#34C759" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="checkmark"/>
        <text x="56" y="676" font-size="13" fill="#000">Last export kept · yesterday</text>
        <text x="363" y="676" font-size="12.5" class="sb" fill="#C36A00" text-anchor="end">Share</text>
      </g>

      <!-- floating tab bar -->
      <g id="tab-bar">
        <rect x="17.5" y="755" width="358" height="57" rx="28.5" fill="#FBFBFD" opacity="0.96" filter="url(#soft)"/>
        <rect x="17.5" y="755" width="358" height="57" rx="28.5" fill="none" stroke="#000" stroke-opacity="0.08"/>
        <g id="tab-create" fill="none" stroke="#8E8E93">
          <g transform="translate(56.5 776) scale(0.7727) translate(-11 -11)"><circle cx="11" cy="11" r="8" stroke-width="2.2" data-symbol="record.circle"/><circle cx="11" cy="11" r="3.4" fill="#8E8E93" stroke="none"/></g>
          <text x="56.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Create</text>
        </g>
        <g id="tab-gallery" fill="none" stroke="#8E8E93">
          <g transform="translate(126.5 776) scale(0.7727) translate(-11 -11)"><rect x="3" y="5.5" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(-6 10 10.5)" data-symbol="photo.on.rectangle.angled"/><rect x="6" y="8" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(4 13 13)"/></g>
          <text x="126.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Gallery</text>
        </g>
        <g id="tab-projects" fill="none" stroke="#8E8E93">
          <g transform="translate(196.5 776) scale(0.7727) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="square.stack"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="196.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Projects</text>
        </g>
        <g id="tab-collections" fill="none" stroke="#8E8E93">
          <g transform="translate(266.5 776) scale(0.7727) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="film.stack"/><path d="M7 4.5 v8 M15 4.5 v8" stroke-width="1.38" opacity="0.7"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="266.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Collections</text>
        </g>
        <g id="tab-settings" fill="none" stroke="#8E8E93">
          <g transform="translate(336.5 776) scale(0.7727) translate(-11 -11)"><path d="M3.5 6.5 h15 M3.5 11 h15 M3.5 15.5 h15" stroke-width="2.48" stroke-linecap="round" data-symbol="line.3.horizontal"/></g>
          <text x="336.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Settings</text>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Collection detail · Ken Burns options · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/CollectionDetailView.swift — the grown card's four option rows (dealt defaults) · summary · export CTA · kept render</text>
</svg>
