<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Settings · Layout · portrait</title>
  <desc>Mirrors LayoutSettingsView in App/SettingsView.swift, pushed from Settings ▸ Advanced ▸ Layout (SettingsDestination.layout, the first row of the Advanced card). A Form of single-row sections with explanatory footers — the same shape as Performance and Manage resolutions, and like them it is pushed inside the Settings tab, so the floating tab bar stays over it.

Drawn in the DEFAULT state of a library that has never scanned anything: Enable Scans menu ON, Display count in Projects OFF, and therefore a FIVE-tab bar. That pairing is the point of the screen — "on" does not mean "showing". The Scans tab appears once the library actually holds a scan (the setting AND AppModel.hasScanSessions), and it also stays put while you are standing on it, so deleting your last scan empties the screen you are looking at rather than pulling it out from under you.

The first footer says which half of that rule is currently in force, because "on but not showing" is otherwise indistinguishable from a bug. Its three states: setting on + no scans yet (drawn here) — "The Scans tab appears in the tab bar as soon as you have a scan. Turn this off to list scans in Projects instead, behind their own filter."; setting on + scans exist — "The Scans tab is in the tab bar. Turn this off to…"; setting off — "Scans are listed in Projects instead, behind their own filter between Photos and Interval." Turning the switch off while standing on the Scans tab moves the selection to Projects, which is where its contents have just gone.

Display count in Projects is off by default: the counts are useful when auditing a library and noise the rest of the time. Both switches take the app tint (LL.accent) rather than the green of Advanced's "Allow remote access", which sets its own. Their effect on the list is drawn in projects.scans-filter.portrait.svg.

Known artifact, shared with every pushed Settings screen (Performance, Diagnostics, Blend learning) and not introduced here: the round back control is drawn TWICE, once above the title row and once beside it. It is mirrored as it renders.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- nav: inline title, with the doubled round back control the pushed
           Settings screens all render (see desc) -->
      <g id="nav-bar">
        <circle cx="38" cy="83" r="21" fill="#FBFBFD" opacity="0.96" filter="url(#soft)"/>
        <path d="M43 76 l-8 7 8 7" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="38" cy="138" r="21" fill="#FBFBFD" opacity="0.96" filter="url(#soft)"/>
        <path d="M43 131 l-8 7 8 7" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="196.5" y="144" font-size="17" class="sb" fill="#000" text-anchor="middle">Layout</text>
      </g>

      <!-- section 1: the Scans tab -->
      <g id="scans-row">
        <rect x="16" y="205" width="361" height="56" rx="16" fill="#FFF" filter="url(#soft)"/>
        <text x="32" y="239" font-size="16" fill="#000">Enable Scans menu</text>
        <rect x="316" y="217.5" width="51" height="31" rx="15.5" fill="#C36A00"/>
        <circle cx="351.5" cy="233" r="13.5" fill="#FFF" filter="url(#soft)"/>
      </g>
      <text x="32" y="284" font-size="12.5" fill="#6D6D72">The Scans tab appears in the tab bar as soon as you have a</text>
      <text x="32" y="301" font-size="12.5" fill="#6D6D72">scan. Turn this off to list scans in Projects instead, behind</text>
      <text x="32" y="318" font-size="12.5" fill="#6D6D72">their own filter.</text>

      <!-- section 2: counts in the Projects filter bar -->
      <g id="counts-row">
        <rect x="16" y="344" width="361" height="56" rx="16" fill="#FFF" filter="url(#soft)"/>
        <text x="32" y="378" font-size="16" fill="#000">Display count in Projects</text>
        <rect x="316" y="356.5" width="51" height="31" rx="15.5" fill="#E9E9EB"/>
        <circle cx="331.5" cy="372" r="13.5" fill="#FFF" filter="url(#soft)"/>
      </g>
      <text x="32" y="423" font-size="12.5" fill="#6D6D72">Spells out how many projects each filter holds — “All 292”,</text>
      <text x="32" y="440" font-size="12.5" fill="#6D6D72">“Photos 18”. The counts follow the search, so they always</text>
      <text x="32" y="457" font-size="12.5" fill="#6D6D72">match what tapping a filter shows.</text>

      <!-- floating tab bar (Settings selected) — five tabs, because the
           library in this mock holds no scans -->
      <g id="tab-bar">
        <rect x="17.5" y="755" width="358" height="57" rx="28.5" fill="#FBFBFD" opacity="0.96" filter="url(#soft)"/>
        <rect x="17.5" y="755" width="358" height="57" rx="28.5" fill="none" stroke="#000" stroke-opacity="0.08"/>
        <g id="tab-create" fill="none" stroke="#8E8E93">
          <g transform="translate(56.5 776) scale(0.7727) translate(-11 -11)"><circle cx="11" cy="11" r="8" stroke-width="2.2" data-symbol="record.circle"/><circle cx="11" cy="11" r="3.4" fill="#8E8E93" stroke="none"/></g>
          <text x="56.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Create</text>
        </g>
        <g id="tab-gallery" fill="none" stroke="#8E8E93">
          <g transform="translate(126.5 776) scale(0.7727) translate(-11 -11)"><rect x="3" y="5.5" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(-6 10 10.5)" data-symbol="photo.on.rectangle.angled"/><rect x="6" y="8" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(4 13 13)"/></g>
          <text x="126.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Gallery</text>
        </g>
        <g id="tab-projects" fill="none" stroke="#8E8E93">
          <g transform="translate(196.5 776) scale(0.7727) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="square.stack"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="196.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Projects</text>
        </g>
        <g id="tab-collections" fill="none" stroke="#8E8E93">
          <g transform="translate(266.5 776) scale(0.7727) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="film.stack"/><path d="M7 4.5 v8 M15 4.5 v8" stroke-width="1.38" opacity="0.7"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="266.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Collections</text>
        </g>
        <rect x="303.5" y="761" width="66" height="45" rx="22.5" fill="#C36A00" opacity="0.12"/>
        <g id="tab-settings" fill="none" stroke="#C36A00">
          <g transform="translate(336.5 776) scale(0.7727) translate(-11 -11)"><path d="M3.5 6.5 h15 M3.5 11 h15 M3.5 15.5 h15" stroke-width="2.48" stroke-linecap="round" data-symbol="line.3.horizontal"/></g>
          <text x="336.5" y="800" font-size="10.5" class="sb" fill="#C36A00" stroke="none" text-anchor="middle">Settings</text>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Settings · Layout · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors LayoutSettingsView in App/SettingsView.swift — the two Layout switches, in their defaults</text>
</svg>
