<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Project (Scanner) · portrait</title>
  <desc>Mirrors App/ScannerProjectView.swift (ScannerProjectSections — headerCard, actions, framesSection, frameCell) as routed from App/ProjectDetailView.swift, which swaps this body in whenever AppModel.isScannerProject(_:) answers yes. It is the answer to a Scanner set landing in a screen built for timelapses: every other photo project in the app is MATERIAL — frames that exist to be averaged into something else, which is why theirs leads with "New blended clip" and files the originals under a footnote — and a Scanner set is the opposite, 36 individually composed poses each framed by hand and fired when the scene settled, on their way to a solver or a document pile. Blending them destroys the only thing they are for. So the hierarchy inverts: the frames ARE the content (a numbered grid, showing the rectified page wherever one has been written, falling back to the photograph where it hasn’t), Export frames is the primary action, and the blend path survives as one quiet secondary button — "View as timelapse", the same model.openCapture the old primary called. "New blended clip" is not shown at all here. The header states the three facts that decide what can be done with the set: how many poses were banked, when, and whether the detector had geometry — read from the frames.timestamps sidecar, whose `rectangle` key is also the heuristic that identifies a Scanner project registered before CaptureProject.captureMode existed. Between them sits Correct perspective, which runs LetsLapseKit’s PerspectiveCorrector over the set at the paper stock the capture screen’s PAPER row last named; it appears only while some frame HAS corners and has not been rectified, so it retires once the set is done (a pose shot with nothing flat in view can never be corrected and must not keep the button alive). This canvas draws the state a shoot ENDS in: rectangles found, nothing corrected yet. The toolbar, the title and the management card below the fold are the ordinary project screen’s — a Scanner set is still a project. Off-device only through LL_PROJECT_SCANNER (add =corrected for the other state): a Scanner shoot cannot be captured on a simulator at all, having no camera to difference frames from and nothing flat to detect.</desc>
