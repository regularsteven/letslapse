<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Project detail (video) · blend can't resume · portrait</title>
  <desc>Signed off by Steven 2026-09-30 (with the paused glyph grey rather than amber — the 2026-09-26 status scheme keeps amber for things in motion) and implemented the same day; verified against the running app on the iPhone 16 Pro Simulator (iOS 18.6) and the Mac with LL_OPEN=latest LL_AUTO=process LL_BLEND_PAUSE_AT=&lt;0…1&gt; (paused), a background/foreground round trip (resumed), a kill and relaunch (the offer), Resume Later (the card) and LL_BLEND_CANT_RESUME=1 (the Start Again card). project-detail.video.blend-paused.portrait.svg's card in the case where the blend CAN'T pick up where it stopped: the project's look or its source changed while the job was paused, so the pieces already saved no longer belong to the clip it would now make. Same card, same metrics (llCard, 16 / 14 pt padding, HStack(spacing: 12) of a 28 pt glyph and the text, the actions 12 pt under it, trailing): the glyph is arrow.counterclockwise.circle.fill in .secondary grey #8A8A8E; the title 'Blend can't resume' (15 pt semibold); the detail 'This project changed while the blend was paused — it has to start again.' (13 pt secondary), which wraps to two lines in the 289 pt text column as CoreText breaks it, so the card is 122.9 pt and everything under it moves down 136.9 pt. Actions: Discard (plain, 14 pt semibold system red) 16 pt before Start Again — a 32 pt LL.accent capsule, arrow.counterclockwise + 'Start Again' in 14 pt semibold white. Start Again throws the saved pieces away and opens Processing on a fresh run of the same blend, from 0 %; Discard throws them away and the card goes. The project and its original are untouched either way. The same state reaches Resume on the launch offer or from Processing's own Resume if the project changed in the meantime: the check runs when a resume is asked for, and this card is where the answer shows. Navigation title 'Sunset over Vltava' as in the paused file; everything else is project-detail.video.portrait.svg (App/ProjectDetailView.swift) unchanged.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#33415A"/><stop offset="1" stop-color="#1B2330"/></linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- inline nav bar -->
      <g id="nav-bar">
        <path d="M22 76 l-9 10 9 10" stroke="#C36A00" stroke-width="2.6" fill="none" stroke-linecap="round" data-symbol="chevron.backward"/>
        <text x="30" y="91" font-size="17" fill="#C36A00">Projects</text>
        <text x="196.5" y="91" font-size="17" class="sb" fill="#000" text-anchor="middle">Sunset over Vltava</text>
        <g data-symbol="ellipsis.circle">
          <circle cx="367" cy="86" r="11" fill="none" stroke="#C36A00" stroke-width="1.8"/>
          <circle cx="361.5" cy="86" r="1.6" fill="#C36A00"/><circle cx="367" cy="86" r="1.6" fill="#C36A00"/><circle cx="372.5" cy="86" r="1.6" fill="#C36A00"/>
        </g>
      </g>

      <!-- BLEND JOB CARD — can't resume (2026-09-30, design-first). The same card
           as project-detail.video.blend-paused.portrait.svg; the detail wraps to
           two lines in the 289 pt text column, so it is 15.5 pt taller:
           14 + 17.9 + 2 + 31 + 12 + 32 + 14 = 122.9 pt. -->
      <g id="blend-job-card" data-state="restart">
        <rect x="16" y="112" width="361" height="122.9" rx="16" fill="#FFF" filter="url(#soft)"/>
        <!-- arrow.counterclockwise.circle.fill, 28 pt, .secondary grey — centred on the text (126…176.9) -->
        <g data-symbol="arrow.counterclockwise.circle.fill">
          <circle cx="46" cy="151.5" r="14" fill="#8A8A8E"/>
          <path d="M41.9 148.5 A5.8 5.8 0 1 0 46 146.8" fill="none" stroke="#FFF" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M42.9 146.8 L46.9 143.7 L46.9 149.9 Z" fill="#FFF" stroke="#FFF" stroke-width="0.8" stroke-linejoin="round"/>
        </g>
        <text x="72" y="140.3" font-size="15" class="sb" fill="#000">Blend can't resume</text>
        <!-- wrapped as CoreText breaks it at 289 pt -->
        <text x="72" y="158.3" font-size="13" fill="#6D6D72">This project changed while the blend was</text>
        <text x="72" y="173.8" font-size="13" fill="#6D6D72">paused — it has to start again.</text>
        <!-- actions, trailing: Discard 16 pt before Start Again (a 32 pt LL.accent
             capsule: arrow.counterclockwise + "Start Again", 14 pt semibold white —
             10 + 5 + 75.2 + 28 = 118.2 pt) -->
        <g id="discard">
          <text x="226.8" y="209.8" font-size="14" class="sb" fill="#FF3B30" text-anchor="end">Discard</text>
        </g>
        <g id="start-again">
          <rect x="242.8" y="188.9" width="118.2" height="32" rx="16" fill="#C36A00"/>
          <g data-symbol="arrow.counterclockwise" stroke="#FFF" fill="none" stroke-linecap="round">
            <path d="M258.83 203.03 A4.2 4.2 0 1 0 261.8 201.8" stroke-width="1.8"/>
            <path d="M259.3 201.8 L262.3 199.5 L262.3 204.1 Z" fill="#FFF" stroke-width="0.6" stroke-linejoin="round"/>
          </g>
          <text x="271.8" y="209.8" font-size="14" class="sb" fill="#FFF">Start Again</text>
        </g>
      </g>

      <!-- everything the base screen draws, 136.9 pt lower: the card replaces nothing -->
      <g id="base-content" transform="translate(0,136.9)">
      <!-- grading card: one frame of the movie, graded -->
      <g id="grading-card">
        <rect x="16" y="112" width="361" height="210" rx="18" fill="url(#hero)"/>
        <circle cx="120" cy="180" r="22" fill="#FFB340" opacity="0.85"/>
        <polygon points="16,268 90,224 170,262 250,222 330,258 377,238 377,322 16,322" fill="#1A222E"/>
        <polygon points="16,296 120,266 240,300 340,276 377,292 377,322 16,322" fill="#10151D"/>
        <circle cx="196.5" cy="217" r="26" fill="#000" opacity="0.45"/>
        <path d="M190 206 l19 11 -19 11 z" fill="#FFF" data-symbol="play.fill"/>
        <rect x="28" y="124" width="118" height="22" rx="11" fill="#000" opacity="0.5"/>
        <text x="87" y="139" font-size="11.5" class="sb" fill="#FFF" text-anchor="middle">ORIGINAL · 0:36</text>
        <!-- the edit affordance every hero carries, one label for every mode;
             here it opens App/VideoEditorView.swift on the movie -->
        <g id="edit-pill">
          <rect x="28" y="284" width="68" height="26" rx="13" fill="#000" opacity="0.45"/>
          <g data-symbol="slider.horizontal.3" stroke="#FFF" stroke-width="1.7" stroke-linecap="round">
            <path d="M40 292 h14 M40 297 h14 M40 302 h14"/>
            <circle cx="50" cy="292" r="2.1" fill="#FFF" stroke="none"/>
            <circle cx="45" cy="297" r="2.1" fill="#FFF" stroke="none"/>
            <circle cx="52" cy="302" r="2.1" fill="#FFF" stroke="none"/>
          </g>
          <text x="61" y="301" font-size="12.5" class="sb" fill="#FFF">Edit</text>
        </g>
        <rect x="243" y="288" width="122" height="22" rx="11" fill="#000" opacity="0.5"/>
        <text x="304" y="303" font-size="11.5" class="sb" fill="#FFF" text-anchor="middle">1920×1080 · 30 fps</text>
      </g>

      <!-- preset strip: same chips, same geometry, as the photo card -->
      <g id="preset-strip">
        <rect x="16" y="334" width="74" height="33" rx="16.5" fill="#C36A00"/>
        <text x="53" y="355" font-size="13.5" class="sb" fill="#FFF" text-anchor="middle">Natural</text>
        <rect x="98" y="334" width="72" height="33" rx="16.5" fill="#FFF" filter="url(#soft)"/>
        <text x="134" y="355" font-size="13.5" class="sb" fill="#000" text-anchor="middle">Cinema</text>
        <rect x="178" y="334" width="64" height="33" rx="16.5" fill="#FFF" filter="url(#soft)"/>
        <text x="210" y="355" font-size="13.5" class="sb" fill="#000" text-anchor="middle">Matte</text>
        <rect x="250" y="334" width="60" height="33" rx="16.5" fill="#FFF" filter="url(#soft)"/>
        <text x="280" y="355" font-size="13.5" class="sb" fill="#000" text-anchor="middle">Vivid</text>
        <rect x="318" y="334" width="76" height="33" rx="16.5" fill="#FFF" filter="url(#soft)"/>
        <text x="356" y="355" font-size="13.5" class="sb" fill="#000" text-anchor="middle">Original</text>
      </g>

      <!-- Customise disclosure, collapsed (chevron.down rotated -90°) -->
      <g id="customise">
        <rect x="16" y="379" width="361" height="50" rx="12" fill="#FFF" filter="url(#soft)"/>
        <text x="30" y="409.5" font-size="15" class="sb" fill="#000">Customise</text>
        <path d="M352 398 l7 6 -7 6" stroke="#6D6D72" stroke-width="2.2" fill="none"
              stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.down"/>
      </g>

      <!-- blended clips (results lead; section hidden entirely while empty).
           Rows are the shared component — see components/README.md for the
           coordinate contract (62pt per row, stacked with no gap, one
           divider per internal boundary from the title column to the edge).
           2026-09-07 (Part 2, design-first, tick-chip revision same day):
           four independent tick chips — Blends, Slices, Image, Video — sit
           between the header and the card; all ticked here (unfiltered).
           Header count reflects the FILTERED result count, not the total. -->
      <text x="20" y="456" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">BLENDED CLIPS · 2</text>
      <image href="../components/blend-list-filter.all.wide.svg" x="16" y="465" width="361" height="33"/>
      <g id="versions-card">
        <rect x="16" y="507" width="361" height="124" rx="16" fill="#FFF" filter="url(#soft)"/>
        <image href="../components/blended-clip-row.from-codec.wide.svg" x="16" y="507" width="361" height="62"/>
        <line x1="100" y1="569" x2="377" y2="569" stroke="#000" stroke-opacity="0.08"/>
        <image href="../components/blended-clip-row.true-light.wide.svg" x="16" y="569" width="361" height="62"/>
      </g>

      <g transform="translate(0,42)">
      <!-- new blended clip button -->
      <g id="new-version">
