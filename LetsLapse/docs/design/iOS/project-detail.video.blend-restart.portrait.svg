      <g id="guided-clip-button">
        <rect x="16" y="663" width="361" height="50" rx="14" fill="#FFF" filter="url(#soft)"/>
        <g stroke="#C36A00" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" data-symbol="wand.and.stars">
          <path d="M92 695 l8 -8 M102 685 l2 2"/>
          <path d="M104 680 l1.2 -2.6 1.2 2.6 2.6 1.2 -2.6 1.2 -1.2 2.6 -1.2 -2.6 -2.6 -1.2 Z"/>
          <path d="M96 677 l0.9 -2 0.9 2 2 0.9 -2 0.9 -0.9 2 -0.9 -2 -2 -0.9 Z"/>
        </g>
        <text x="118" y="694" font-size="15.5" class="sb" fill="#C36A00">Guided clip (experimental)</text>
      </g>

      <!-- punch-in reframe — the Adjust flow with the reframe lane open -->
      <g id="punch-in-button">
        <rect x="16" y="723" width="361" height="50" rx="14" fill="#FFF" filter="url(#soft)"/>
        <path d="M128 743 v-3 h3 M141 740 h3 v3 M144 753 v3 h-3 M131 756 h-3 v-3" stroke="#C36A00" fill="none" stroke-width="1.6" stroke-linecap="round" data-symbol="viewfinder"/>
        <text x="152" y="754" font-size="15.5" class="sb" fill="#C36A00">Punch-in reframe</text>
      </g>

      <!-- source clips + management card: pushed under the fold by the two
           flow buttons — the scrolling screen reaches them, this snapshot
           shows their top edge under the floating tab bar -->
      <g id="below-the-fold" transform="translate(0,120)">
      <text x="20" y="680" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">SOURCE CLIP</text>
      <g id="source-clips-card">
        <rect x="16" y="689" width="361" height="62" rx="16" fill="#FFF" filter="url(#soft)"/>
        <rect x="30" y="699" width="58" height="42" rx="7" fill="#33415A"/>
        <path d="M50 714 l12 7 -12 7 z" fill="#FFF" opacity="0.8"/>
        <text x="100" y="717" font-size="14.5" class="sb" fill="#000">Clip 1</text>
        <text x="100" y="734" font-size="11.5" fill="#6D6D72">ProRes · 2.9 GB</text>
        <text x="363" y="724" font-size="12.5" class="sb" fill="#C36A00" text-anchor="end">Manage</text>
      </g>

      <!-- management card: below the fold at rest; the scroll ends with 96pt clearance so the Delete row clears the tab bar -->
      <g id="management-card">
        <rect x="16" y="767" width="361" height="140" rx="16" fill="#FFF" filter="url(#soft)"/>
        <text x="32" y="795" font-size="16" fill="#000">Rename</text>
        <path d="M363 783 l6 7 -6 7" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round" data-symbol="chevron.right"/>
        <line x1="32" y1="811" x2="377" y2="811" stroke="#000" stroke-opacity="0.08"/>
        <text x="32" y="836" font-size="16" fill="#000">Storage</text>
        <text x="32" y="851" font-size="11.5" fill="#6D6D72">original + blended clips</text>
        <text x="361" y="840" font-size="14" fill="#6D6D72" text-anchor="end">4.6 GB</text>
      </g>
      </g>
      </g>

      </g>

      <!-- floating tab bar (Projects selected) over content -->
      <g id="tab-bar" opacity="0.98">
        <rect x="6.5" y="755" width="380" height="57" rx="28.5" fill="#FBFBFD" opacity="0.96" filter="url(#soft)"/>
        <rect x="6.5" y="755" width="380" height="57" rx="28.5" fill="none" stroke="#000" stroke-opacity="0.08"/>
        <g id="tab-create" fill="none" stroke="#8E8E93">
