        <path d="M128 628 v-14 M121 621 h14" stroke="#FFF" stroke-width="2.4" stroke-linecap="round" data-symbol="plus"/>
        <text x="142" y="634" font-size="16" class="b" fill="#FFF">New blended clip</text>
      </g>

      <!-- guided clip (experimental) — the guided builder's entry point;
