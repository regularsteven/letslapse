<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Auto rename &amp; tag · portrait</title>
  <desc>Mirrors App/AI/AutoNameSheet.swift, the review sheet a finished scene analysis puts up — reached from a project's managementCard row "Auto rename &amp; tag" (App/ProjectDetailView.swift), never from Settings, and identical for Photo, Interval and Video projects because all three are one CaptureProject with one sceneTags field. Nothing is written until Apply: the sheet edits a local copy of AutoNameController.Proposal, so Cancel is genuinely free rather than a rollback. NAME is an editable TextField seeded with the model's title; under it the non-editable "Saw …" line lists SceneAnalysisResult.elements, the free-form nouns Projects search matches most specifically. SUBJECT TAGS is the shared tag editor — components/tag-field.applied.wide.svg — and this is the 2026-09-08 change: the section used to be a row of tick chips that could only be UNticked, so a proposal with no tags rendered no section at all and a tag the model never thought of could not be added by hand. Now every applied tag carries an xmark that drops it, and a dashed "+ Add tag" chip raises the picker (project-tags.portrait.svg) that both filters the taxonomy and creates a custom tag. "Rooftops" is drawn as a tag the user typed IN THIS SHEET, alongside the four the model proposed — the point being that once applied there is no visible difference between them. FROM THIS CAPTURE stays exactly as shipped: place and light are the capture's own facts, handed TO the model rather than produced by it, so their chips are inert. TOOLBAR: drawn as iOS 26 renders it — Cancel / title / Apply as three floating capsules over the content rather than a flat bar; Apply is disabled while the name is empty. STATES NOT DRAWN HERE: the no-tags proposal (auto-name.no-tags.portrait.svg) and the picker itself (project-tags.portrait.svg). NOT YET IN CODE — design-first, 2026-09-08.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="sheet"><rect x="0" y="62" width="393" height="790" rx="22"/></clipPath>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.05"/></filter>
    <filter id="pill" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.13"/></filter>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E4C63"/><stop offset="0.5" stop-color="#C9793F"/><stop offset="1" stop-color="#F2C98A"/>
    </linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- the project detail the sheet came from, dimmed behind it -->
      <g id="behind">
        <rect x="16" y="50" width="361" height="140" rx="18" fill="url(#dusk)"/>
        <circle cx="196.5" cy="120" r="24" fill="#000" fill-opacity="0.35"/>
        <path d="M189 108 l19 12 -19 12 z" fill="#FFF" fill-opacity="0.9" data-symbol="play.fill"/>
        <text x="16" y="220" font-size="22" class="b" fill="#000">River Sunset to Dusk</text>
      </g>
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g id="signal"><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path id="wifi" d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g id="battery"><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>
      <rect x="0" y="0" width="393" height="852" fill="#000" opacity="0.22"/>

      <!-- ================= THE SHEET ================= -->
      <g id="auto-name-sheet" clip-path="url(#sheet)">
        <rect x="0" y="62" width="393" height="790" fill="#F2F2F7"/>

        <!-- iOS 26 floating toolbar: three capsules, not a bar -->
        <g id="toolbar">
          <rect x="16" y="76" width="84" height="44" rx="22" fill="#FFF" filter="url(#pill)"/>
          <text x="58" y="104" font-size="17" fill="#C36A00" text-anchor="middle">Cancel</text>
          <rect x="107.5" y="76" width="178" height="44" rx="22" fill="#FFF" filter="url(#pill)"/>
          <text x="196.5" y="104" font-size="17" class="sb" fill="#000" text-anchor="middle">Auto rename &amp; tag</text>
          <rect x="301" y="76" width="76" height="44" rx="22" fill="#FFF" filter="url(#pill)"/>
          <text x="339" y="104" font-size="17" fill="#C36A00" text-anchor="middle">Apply</text>
        </g>

        <!-- NAME -->
        <text x="20" y="148" font-size="13" class="sb sec" letter-spacing="0.5">NAME</text>
        <rect x="16" y="160" width="361" height="49" rx="16" fill="#FFF" filter="url(#card)"/>
        <text x="32" y="191" font-size="17" fill="#000">Dusk in Prague with river</text>
        <rect x="209" y="174" width="2" height="22" fill="#C36A00"/>

        <!-- SceneAnalysisResult.elements, not editable -->
        <text x="20" y="226" font-size="12" class="sec">Saw river, bridge, quay, sky</text>

        <!-- SUBJECT TAGS — the shared tag editor -->
        <text x="20" y="260" font-size="13" class="sb sec" letter-spacing="0.5">SUBJECT TAGS</text>
        <rect x="16" y="272" width="361" height="125" rx="16" fill="#FFF" filter="url(#card)"/>
        <!-- components/tag-field.applied.wide.svg — 329pt content box (card 361 less 16pt
             padding each side), placed at the card's own top-left + (16,13). Edit that file,
             not this markup. -->
        <image href="../components/tag-field.applied.wide.svg" x="32" y="285" width="329" height="74"/>
        <text x="32" y="379" font-size="11.5" class="sec">Tap a tag to drop it, or add one of your own.</text>

        <!-- FROM THIS CAPTURE — inert: these are facts, not guesses -->
        <text x="20" y="425" font-size="13" class="sb sec" letter-spacing="0.5">FROM THIS CAPTURE</text>
        <rect x="16" y="437" width="361" height="97" rx="16" fill="#FFF" filter="url(#card)"/>
        <g id="capture-chips">
          <rect x="32" y="450" width="97" height="33" rx="16.5" fill="#000" fill-opacity="0.07"/>
          <g stroke="#000" stroke-opacity="0.75" stroke-width="1.5" fill="none" data-symbol="mappin.and.ellipse">
            <circle cx="47" cy="464" r="3.6"/><path d="M47 468.5 v4" stroke-linecap="round"/><ellipse cx="47" cy="474" rx="6.5" ry="2.4"/>
          </g>
          <text x="58" y="471.5" font-size="14" fill="#000" fill-opacity="0.75">Prague 2</text>

          <rect x="137" y="450" width="76" height="33" rx="16.5" fill="#000" fill-opacity="0.07"/>
          <g stroke="#000" stroke-opacity="0.75" stroke-width="1.5" fill="none" stroke-linecap="round" data-symbol="sun.horizon">
            <path d="M148 471 h14"/><path d="M152 466 a3.5 3.5 0 0 1 7 0"/><path d="M155.5 459.5 v2.5 M149.5 462 l1.5 1.8 M161.5 462 l-1.5 1.8"/>
          </g>
          <text x="167" y="471.5" font-size="14" fill="#000" fill-opacity="0.75">Dusk</text>
        </g>
        <text x="32" y="503" font-size="11.5" class="sec">Read from the capture's location and time, not from</text>
        <text x="32" y="517" font-size="11.5" class="sec">the image.</text>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.6"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Auto rename &amp; tag · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/AI/AutoNameSheet.swift — editable name · elements line · shared tag editor · inert place/light chips</text>
</svg>
