      <g id="framing-preview">
        <rect x="16" y="115" width="361" height="203" rx="12" fill="url(#clipA)"/>
        <!-- travel: corner ties + haloed arrow toward the end -->
        <g id="travel">
          <path d="M17 116 L228 180 M376 116 L348 180 M17 317 L228 248 M376 317 L348 248" stroke="#FFF" stroke-opacity="0.22"/>
          <path d="M196.5 216.5 L281 214.4 M288 214 L279.5 210.4 M288 214 L279.7 217.9" stroke="#000" stroke-opacity="0.4" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M196.5 216.5 L281 214.4 M288 214 L279.5 210.4 M288 214 L279.7 217.9" stroke="#FFB340" stroke-opacity="0.9" stroke-width="1.5" stroke-linecap="round"/>
        </g>
