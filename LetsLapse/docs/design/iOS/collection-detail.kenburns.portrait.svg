          <path d="M136.3 116 v201 M256.7 116 v201 M17 182.7 h359 M17 250.3 h359" stroke="#FFF" stroke-opacity="0.35"/>
          <rect x="21" y="297" width="58" height="16" rx="8" fill="#000" opacity="0.55"/>
          <circle cx="30" cy="305" r="3" fill="#FFF"/>
          <text x="36" y="308.5" font-size="8.5" class="b" fill="#FFF" letter-spacing="0.5">START</text>
        </g>
        <rect x="26" y="125" width="128" height="19" rx="9.5" fill="#000" opacity="0.5"/>
        <text x="90" y="138" font-size="10.5" class="sb" fill="#FFF" text-anchor="middle">Harbour dawn · 100×</text>
        <g id="canvas-menu">
