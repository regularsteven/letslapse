          <g stroke="#C36A00" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M316 560 h-2 v14 h2 M328 560 h2 v14 h-2"/><path d="M319 567 h6"/></g>
          <path d="M352 561 h16 M352 567 h16 M352 573 h16" stroke="#B9B9BE" stroke-width="1.8" stroke-linecap="round"/>
