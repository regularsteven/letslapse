        <circle cx="31" cy="338" r="3.5" fill="#FFF"/>
        <circle cx="31" cy="338" r="3.5" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="0.5"/>
        <text x="60" y="342" font-size="10.5" class="b" fill="#FFF" text-anchor="middle" letter-spacing="0.5">START</text>
        <rect x="100" y="326" width="62" height="24" rx="12" fill="#C36A00" opacity="0.09"/>
        <circle cx="113" cy="338" r="3.5" fill="#FFB340"/>
        <text x="137" y="342" font-size="10.5" class="b" fill="#C36A00" text-anchor="middle" letter-spacing="0.5">END</text>
        <text x="174" y="342" font-size="11.5" class="sb" fill="#6D6D72">1.00×</text>
        <text x="375" y="342" font-size="11.5" class="sb" fill="#C36A00" text-anchor="end">Reset move</text>
      </g>

      <!-- header row: TIMELINE left, Ken Burns tri-state right (Auto) -->
