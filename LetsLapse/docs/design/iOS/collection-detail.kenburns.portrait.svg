<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Collection detail · Ken Burns framing · portrait</title>
  <desc>Mirrors App/CollectionDetailView.swift (kenBurnsFrameOverlay, kenBurnsFramingBar, kenBurnsSection, kenBurnsPinch): the timeline builder with Ken Burns ON. The preview becomes the start/end framing editor: the WHITE 2pt frame with rule-of-thirds is the framing being edited (drag to place it, pinch anywhere on the clip to zoom it — spreading fingers tightens the window, photo-style; outside the active frame dims black 60%, nothing here since the start framing is full-frame 1.00×); the AMBER dashed frame is the other end of the move, its END/START tag riding its top-right corner (the clip badge owns the top-left), drawn only while it differs from the active frame by &gt;6pt. Under the preview the framing bar: START / END pills switch which end the surface edits (active pill accent-filled), the active framing's zoom "1.00×" in monospaced digits, and "Reset move" in amber once a hand has been in the move (entry.kenBurns.isCustom). Edits commit on release via setKenBurnsFraming. The caption row: "Ken Burns start framing — drag the white frame to place it, pinch to zoom. The dashed frame is the end." left, canvas menu chip right. Rows carry KB-aware subtitles — consistent durations: "100× · plays 6.0s from the start" (windowed clips add "from Ns"; auto-speed adds "· sped ×N"); the trim button's role becomes "Set the clip's start point" (fixed window). The Ken Burns card below the timeline grows its choices downward while on (top edge drawn here; the grown card, summary and export path are drawn in full in collection-detail.kenburns-options.portrait.svg): Consistent durations toggle ("Every clip plays the same length" / "Clips keep their own lengths, as shot"); when on, a Clip duration stepper ("The shortest clip caps it at 6s" — value accentDeep, monospaced) and Auto adjust clip speed toggle ("Longer clips speed up to fit — only when required" / "Each clip plays a 6s window — set its start point from the timeline"); always Fade transition ("Clips crossfade for 0.5s" / "Straight cuts between clips"). Turning Ken Burns on answers everything with best-effort defaults, so Export straight away already cuts well. Off-state and the rest of the screen: collection-detail.portrait.svg.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.05"/></filter>
    <linearGradient id="clipA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33415A"/><stop offset="1" stop-color="#1B2330"/></linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- inline nav -->
      <g id="nav">
        <circle cx="38" cy="84" r="17" fill="#FFF" filter="url(#card)"/>
        <path d="M42 76 l-8 8 8 8" stroke="#1C1C1E" stroke-width="2.6" fill="none" stroke-linecap="round" data-symbol="chevron.left"/>
        <text x="196.5" y="90" font-size="17" class="sb" fill="#000" text-anchor="middle">Harbour reel</text>
        <circle cx="355" cy="84" r="17" fill="#FFF" filter="url(#card)"/>
        <g stroke="#C36A00" fill="#C36A00" data-symbol="ellipsis.circle"><circle cx="355" cy="84" r="10" fill="none" stroke-width="1.8"/><circle cx="350" cy="84" r="1.4" stroke="none"/><circle cx="355" cy="84" r="1.4" stroke="none"/><circle cx="360" cy="84" r="1.4" stroke="none"/></g>
      </g>

      <!-- preview: the framing editor. Active START framing = full frame (1.00×), dashed ghost = the dealt END move -->
      <g id="framing-preview">
        <rect x="16" y="115" width="361" height="203" rx="12" fill="url(#clipA)"/>
        <!-- active framing: white frame + thirds (full frame at 1.00× — nothing to dim) -->
        <g id="active-frame">
          <rect x="17" y="116" width="359" height="201" fill="none" stroke="#FFF" stroke-width="2"/>
          <path d="M136.3 116 v201 M256.7 116 v201 M17 182.7 h359 M17 250.3 h359" stroke="#FFF" stroke-opacity="0.35"/>
        </g>
        <!-- ghost: the END framing, amber dashed, tag on its top-right -->
        <g id="ghost-frame">
          <rect x="118" y="262" width="92" height="52" fill="none" stroke="#FFB340" stroke-opacity="0.75" stroke-width="1.5" stroke-dasharray="5 4"/>
          <rect x="177" y="265" width="30" height="13" rx="6.5" fill="#000" opacity="0.55"/>
          <text x="192" y="274.5" font-size="8.5" class="b" fill="#FFB340" text-anchor="middle" letter-spacing="0.5">END</text>
        </g>
        <rect x="26" y="125" width="128" height="19" rx="9.5" fill="#000" opacity="0.5"/>
        <text x="90" y="138" font-size="10.5" class="sb" fill="#FFF" text-anchor="middle">Harbour dawn · 100×</text>
      </g>

      <!-- framing bar: START/END pills · zoom · Reset move -->
      <g id="framing-bar">
        <rect x="18" y="326" width="58" height="22" rx="11" fill="#C36A00"/>
        <text x="47" y="341" font-size="10.5" class="b" fill="#FFF" text-anchor="middle" letter-spacing="0.5">START</text>
        <rect x="84" y="326" width="50" height="22" rx="11" fill="#C36A00" opacity="0.09"/>
        <text x="109" y="341" font-size="10.5" class="b" fill="#C36A00" text-anchor="middle" letter-spacing="0.5">END</text>
        <text x="146" y="341" font-size="11.5" class="sb" fill="#6D6D72">1.00×</text>
        <text x="375" y="341" font-size="11.5" class="sb" fill="#FFB340" text-anchor="end">Reset move</text>
      </g>

      <!-- caption (left) + canvas menu chip (right) -->
      <g id="caption-row">
        <text x="18" y="368" font-size="11.5" class="sec">Ken Burns start framing — drag the white frame</text>
        <text x="18" y="383" font-size="11.5" class="sec">to place it, pinch to zoom. The dashed frame is</text>
        <text x="18" y="398" font-size="11.5" class="sec">the end.</text>
        <g id="canvas-menu">
          <rect x="309" y="356" width="66" height="34" rx="17" fill="#FFF" filter="url(#card)"/>
          <text x="336" y="378" font-size="13.5" class="sb" fill="#C36A00" text-anchor="middle">16:9</text>
          <path d="M352 370.5 l4.5 4.5 4.5 -4.5" stroke="#C36A00" stroke-width="2" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
        </g>
      </g>

      <!-- TIMELINE: KB-aware subtitles ("plays 6.0s …") -->
      <g id="timeline">
        <text x="20" y="431" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">TIMELINE · 3 CLIPS</text>
        <rect x="16" y="443" width="361" height="198" rx="16" fill="#FFF" filter="url(#card)"/>

        <!-- row 1 (selected · trimmed → windowed start point) -->
        <g id="row-1">
          <rect x="16" y="443" width="361" height="66" rx="12" fill="#C36A00" opacity="0.07"/>
          <rect x="28" y="455" width="58" height="42" rx="7" fill="url(#clipA)"/>
          <path d="M53 470 l9 6 -9 6 z" fill="#FFF" opacity="0.8" data-symbol="play.fill"/>
          <text x="96" y="471" font-size="14.5" class="sb" fill="#000">Harbour dawn</text>
          <text x="96" y="490" font-size="11.5" class="sec">100× · plays 6.0s fro…</text>
          <rect x="222" y="479" width="58" height="14" rx="7" fill="#FFB340" opacity="0.28"/>
          <text x="251" y="489" font-size="9.5" class="b" fill="#8A4A00" text-anchor="middle">TRIMMED</text>
          <circle cx="322" cy="476" r="17" fill="#C36A00" opacity="0.1"/>
          <g stroke="#C36A00" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="timeline.selection"><path d="M316 469 h-2 v14 h2 M328 469 h2 v14 h-2"/><path d="M319 476 h6"/></g>
          <path d="M352 470 h16 M352 476 h16 M352 482 h16" stroke="#B9B9BE" stroke-width="1.8" stroke-linecap="round" data-symbol="line.3.horizontal"/>
        </g>
        <line x1="96" y1="509" x2="377" y2="509" stroke="#000" stroke-opacity="0.06"/>

        <!-- row 2: crop badge still truncates the sub -->
        <g id="row-2">
          <rect x="28" y="521" width="58" height="42" rx="7" fill="url(#clipA)"/>
          <path d="M53 536 l9 6 -9 6 z" fill="#FFF" opacity="0.8"/>
          <text x="96" y="537" font-size="14.5" class="sb" fill="#000">City tram</text>
          <text x="96" y="556" font-size="11.5" class="sec">100× · plays 6.0s fr…</text>
          <rect x="218" y="545" width="66" height="14" rx="7" fill="#C36A00" opacity="0.06"/>
          <rect x="218" y="545" width="66" height="14" rx="7" fill="none" stroke="#C36A00" stroke-opacity="0.55" stroke-width="1.2"/>
          <text x="251" y="555" font-size="9.5" class="b" fill="#C36A00" text-anchor="middle">CROP 16:9</text>
          <circle cx="322" cy="542" r="17" fill="#C36A00" opacity="0.1"/>
          <g stroke="#C36A00" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M316 535 h-2 v14 h2 M328 535 h2 v14 h-2"/><path d="M319 542 h6"/></g>
          <path d="M352 536 h16 M352 542 h16 M352 548 h16" stroke="#B9B9BE" stroke-width="1.8" stroke-linecap="round"/>
        </g>
        <line x1="96" y1="575" x2="377" y2="575" stroke="#000" stroke-opacity="0.06"/>

        <!-- row 3 -->
        <g id="row-3">
          <rect x="28" y="587" width="58" height="42" rx="7" fill="url(#clipA)"/>
          <path d="M53 602 l9 6 -9 6 z" fill="#FFF" opacity="0.8"/>
          <text x="96" y="603" font-size="14.5" class="sb" fill="#000">Ridge sunset</text>
          <text x="96" y="622" font-size="11.5" class="sec">100× · plays 6.0s from the start</text>
          <circle cx="322" cy="608" r="17" fill="#C36A00" opacity="0.1"/>
          <g stroke="#C36A00" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M316 601 h-2 v14 h2 M328 601 h2 v14 h-2"/><path d="M319 608 h6"/></g>
          <path d="M352 602 h16 M352 608 h16 M352 614 h16" stroke="#B9B9BE" stroke-width="1.8" stroke-linecap="round"/>
        </g>
      </g>

      <!-- add clips (dashed) -->
      <g id="add-clips">
        <rect x="16" y="653" width="361" height="52" rx="14" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="5 4"/>
        <path d="M158 684 v-10 M153 679 h10" stroke="#C36A00" stroke-width="2.2" stroke-linecap="round" data-symbol="plus"/>
        <text x="172" y="689" font-size="15" class="sb" fill="#C36A00">Add clips</text>
      </g>

      <!-- Ken Burns card, ON — grows its options downward (full copy in desc); top edge at the fold -->
      <g id="ken-burns-on">
        <rect x="16" y="717" width="361" height="96" rx="16" fill="#FFF" filter="url(#card)"/>
        <text x="30" y="741" font-size="14.5" class="sb" fill="#000">Ken Burns</text>
        <rect x="312" y="722" width="51" height="31" rx="15.5" fill="#C36A00"/>
        <circle cx="347.5" cy="737.5" r="13.5" fill="#FFF" filter="url(#card)"/>
      </g>

      <!-- floating tab bar -->
      <g id="tab-bar">
        <rect x="17.5" y="755" width="358" height="57" rx="28.5" fill="#FBFBFD" opacity="0.96" filter="url(#soft)"/>
        <rect x="17.5" y="755" width="358" height="57" rx="28.5" fill="none" stroke="#000" stroke-opacity="0.08"/>
        <g id="tab-create" fill="none" stroke="#8E8E93">
          <g transform="translate(56.5 776) scale(0.7727) translate(-11 -11)"><circle cx="11" cy="11" r="8" stroke-width="2.2" data-symbol="record.circle"/><circle cx="11" cy="11" r="3.4" fill="#8E8E93" stroke="none"/></g>
          <text x="56.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Create</text>
        </g>
        <g id="tab-gallery" fill="none" stroke="#8E8E93">
          <g transform="translate(126.5 776) scale(0.7727) translate(-11 -11)"><rect x="3" y="5.5" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(-6 10 10.5)" data-symbol="photo.on.rectangle.angled"/><rect x="6" y="8" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(4 13 13)"/></g>
          <text x="126.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Gallery</text>
        </g>
        <g id="tab-projects" fill="none" stroke="#8E8E93">
          <g transform="translate(196.5 776) scale(0.7727) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="square.stack"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="196.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Projects</text>
        </g>
        <g id="tab-collections" fill="none" stroke="#8E8E93">
          <g transform="translate(266.5 776) scale(0.7727) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="film.stack"/><path d="M7 4.5 v8 M15 4.5 v8" stroke-width="1.38" opacity="0.7"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="266.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Collections</text>
        </g>
        <g id="tab-settings" fill="none" stroke="#8E8E93">
          <g transform="translate(336.5 776) scale(0.7727) translate(-11 -11)"><path d="M3.5 6.5 h15 M3.5 11 h15 M3.5 15.5 h15" stroke-width="2.48" stroke-linecap="round" data-symbol="line.3.horizontal"/></g>
          <text x="336.5" y="800" font-size="10.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Settings</text>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Collection detail · Ken Burns framing · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/CollectionDetailView.swift — active/ghost framing frames · START/END bar · KB-aware rows · options: kenburns-options file</text>
</svg>
