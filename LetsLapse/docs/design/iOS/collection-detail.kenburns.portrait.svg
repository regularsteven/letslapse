<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Collection detail · Ken Burns framing · portrait</title>
  <desc>Mirrors App/CollectionDetailView.swift (kenBurnsFrameOverlay, kenBurnsIdentityFrame, kenBurnsEndTag, KenBurnsTravel, kenBurnsFramingBar, kenBurnsPinch, timelineHeaderRow, kenBurnsModeControl): the timeline builder with Ken Burns ON (Auto). The preview is the framing editor, and COLOUR IS IDENTITY, never selection: the START framing is always WHITE, the END framing always AMBER. The one under edit is solid 2pt with rule-of-thirds in its own colour (drag to place it, pinch anywhere on the clip to resize it — spreading fingers GROWS the frame; outside the active frame dims black 60%); the other end is dashed 1.5pt in its own colour, and tapping it selects it. Both frames carry an identity tag on a fixed corner — a colour dot + name on the on-media black 55% capsule: START rides its frame's BOTTOM-LEFT, END its TOP-RIGHT (the clip badge owns the preview's top-left, the canvas chip its bottom-right — four corners, four jobs). Whenever the two framings differ, thin white 22% TIES join corresponding corners and an amber arrow (over a black 40% halo, so bright footage never swallows it) points from the start's centre toward the end's; a pure zoom (centres within 12pt) drops the arrow and lets the converging ties read as the push. Drawn here: start full-frame at 1.00× (its white frame hugs the preview edge), end dealt tighter and low-centre-right. Under the preview the framing bar: START / END pills wearing the same identity dots (white with a hairline dark ring / amber) — active pill accent-filled — the active framing's zoom "1.00×" in monospaced digits, and "Reset move" in ACCENT (not amber — amber means "the end" now) once a hand has been in the move (entry.kenBurns.isCustom). Edits commit on release via setKenBurnsFraming. macOS additionally draws 7pt corner grips on the active frame (mouse resize) and resizes by scroll wheel over the preview — interaction only, no separate spec. The header row shows Auto selected; rows carry KB-aware subtitles — consistent durations: "100× · plays 6.0s from the start" (windowed clips add "from Ns"; auto-speed adds "· sped ×N"); the trim button's role becomes "Set the clip's start point" (fixed window). No Ken Burns card follows the timeline any more — Custom's options live in the drawer (collection-detail.kenburns-options.portrait.svg) — so the dark summary card follows Add clips directly, its footer reading "Ken Burns moves on every clip, crossfades between them." (straight-cut variant swaps the ending). Off-state and the rest of the screen: collection-detail.portrait.svg.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.05"/></filter>
    <linearGradient id="clipA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33415A"/><stop offset="1" stop-color="#1B2330"/></linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- inline nav -->
      <g id="nav">
        <circle cx="38" cy="84" r="17" fill="#FFF" filter="url(#card)"/>
        <path d="M42 76 l-8 8 8 8" stroke="#1C1C1E" stroke-width="2.6" fill="none" stroke-linecap="round" data-symbol="chevron.left"/>
        <text x="196.5" y="90" font-size="17" class="sb" fill="#000" text-anchor="middle">Harbour reel</text>
        <circle cx="355" cy="84" r="17" fill="#FFF" filter="url(#card)"/>
        <g stroke="#C36A00" fill="#C36A00" data-symbol="ellipsis.circle"><circle cx="355" cy="84" r="10" fill="none" stroke-width="1.8"/><circle cx="350" cy="84" r="1.4" stroke="none"/><circle cx="355" cy="84" r="1.4" stroke="none"/><circle cx="360" cy="84" r="1.4" stroke="none"/></g>
      </g>

