        <text x="20" y="384" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">TIMELINE · 3 CLIPS</text>
        <text x="234" y="383" font-size="10.5" class="sb" fill="#6D6D72" text-anchor="end">Ken Burns</text>
