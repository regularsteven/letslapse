<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Shape-mation · builder · mode · portrait</title>
  <desc>Mirrors App/Shapemation/ShapemationBuilderView.swift — ShapemationModeView, step 3 of the Shape-mation slideshow builder (2026-09-11, code first, mirrored from the running app). Pushed from the Circles projects step inside the Shape-mation sheet, which owns its NavigationStack the way Presets does; back reads "Circles", large title "Mode". The question "How should the photos stack?" then one card per ShapemationMode: "Stack, fit in frame" (selected — accent-filled 34-pt icon tile, rectangle.stack in white, checkmark.circle.fill trailing) and "Stack, crop to fill" (the same tile at accent 12%, crop glyph in accent, an empty ring trailing), each with its Kit summary wrapped as the app wraps it. Under the cards the plan summary in 12-pt secondary — the canvas the stack needs and the locked shape's size — which the app's Text wrapped after "519". The bottom safeAreaInset bar is regularMaterial with the "Next · output" borderedProminent button trailing (disabled when the plan is nil, which crop mode can be). Measured from an iPhone 16 Pro capture (402×874 pt) mapped to this 393×852 canvas: top-anchored content follows the 59-pt safe top (the capture's 62), the bar follows the 34-pt bottom, cards keep their 16-pt margins. The sheet's top sits at safe-top + 10 as measured (69 here); the Presets mirrors draw it at 56.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="sheet"><rect x="0" y="69" width="393" height="783" rx="10"/></clipPath>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#000"/>
    <g transform="translate(24,24)">

      <!-- status bar over the shrunken Create tab behind the sheet -->
      <g id="status-bar" fill="#FFF">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g id="signal"><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path id="wifi" d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#FFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g id="battery"><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#FFF" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#FFF" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>
      <!-- the parent's top edge, scaled back behind the sheet -->
      <rect x="16" y="59" width="361" height="30" rx="10" fill="#D5D5D9"/>

      <!-- the sheet -->
      <g id="shapemation-sheet" clip-path="url(#sheet)">
        <rect x="0" y="69" width="393" height="783" fill="#F2F2F7"/>

        <g id="nav-bar">
          <path d="M18.6 89 L10.7 97 L18.6 105" stroke="#C36A00" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.left"/>
          <text x="30" y="103" font-size="17" fill="#C36A00">Circles</text>
          <text x="16" y="161" font-size="34" class="b" fill="#000">Mode</text>
        </g>

        <text x="16" y="209" font-size="17" class="sb" fill="#000">How should the photos stack?</text>

        <g id="mode-stack" data-selected="true">
          <rect x="16" y="225.3" width="361" height="113.7" rx="16" fill="#FFF"/>
          <g id="tile-stack">
            <rect x="30" y="239.3" width="34" height="34" rx="9" fill="#C36A00"/>
            <g data-symbol="rectangle.stack" stroke="#FFF" stroke-width="1.7" fill="none" stroke-linecap="round">
              <rect x="38.7" y="252.4" width="16.6" height="13.4" rx="3"/>
              <path d="M41.3 249.6 q5.7 -2.4 11.4 0"/>
              <path d="M42.8 246.9 q4.2 -1.8 8.4 0"/>
            </g>
          </g>
          <text x="76" y="254.6" font-size="16" class="sb" fill="#000">Stack, fit in frame</text>
          <g font-size="13" class="sec">
            <text x="76" y="275">The canvas holds every photo. Each</text>
            <text x="76" y="290.5">lands on top of the last, the shape</text>
            <text x="76" y="306">locked in place; the black table shows</text>
            <text x="76" y="321.5">until it is covered.</text>
          </g>
          <g data-symbol="checkmark.circle.fill">
            <circle cx="350" cy="252.2" r="11" fill="#C36A00"/>
            <path d="M344.8 252.6 l3.6 3.6 l6.8 -7.2" stroke="#FFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </g>

        <g id="mode-crop">
          <rect x="16" y="351" width="361" height="98" rx="16" fill="#FFF"/>
          <g id="tile-crop">
            <rect x="30" y="365.3" width="34" height="34" rx="9" fill="#C36A00" opacity="0.12"/>
            <g data-symbol="crop" stroke="#C36A00" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M42.8 373.9 V386.8 H56"/>
              <path d="M38.9 378.2 H51.8 V391.1"/>
            </g>
          </g>
          <text x="76" y="380.6" font-size="16" class="sb" fill="#000">Stack, crop to fill</text>
          <g font-size="13" class="sec">
            <text x="76" y="400.6">The same stack, cropped to what</text>
            <text x="76" y="416.3">every photo covers. No black — but</text>
            <text x="76" y="432">one off-centre shape crops everyone.</text>
          </g>
          <circle cx="350" cy="377.7" r="10.25" fill="none" stroke="#C2C2C4" stroke-width="1.5" data-symbol="circle"/>
        </g>

        <g id="plan-summary" font-size="12" class="sec">
          <text x="16" y="472.3">Canvas 3949×4032 holds every photo; the shape is 519</text>
          <text x="16" y="486.6">px across.</text>
        </g>

        <!-- bottom safeAreaInset bar: regularMaterial, Next trailing -->
        <g id="bottom-bar">
          <rect x="0" y="734" width="393" height="118" fill="#FFF" opacity="0.2"/>
          <rect x="224" y="750" width="153" height="52" rx="11" fill="#C36A00"/>
          <text x="300.5" y="781.4" font-size="15" class="sb" fill="#FFF" text-anchor="middle">Next · output</text>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Shape-mation · builder · mode · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors ShapemationModeView — step 3, pushed from Circles inside the Shape-mation sheet · Stack, fit in frame selected · Next · output</text>
</svg>
