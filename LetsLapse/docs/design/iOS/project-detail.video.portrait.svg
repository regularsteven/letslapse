<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Project detail (video) · portrait</title>
  <desc>Mirrors App/ProjectDetailView.swift (GradingCard, versionRow, sourceClipsSection, managementCard): inline nav with ⋯ menu, then the grading card — a preview frame pulled out of the movie with AVAssetImageGenerator and rendered through the project's preset + PhotoAdjustments, carrying the play button, the "Edit" pill (slider.horizontal.3, bottom-left, which opens App/VideoEditorView.swift on the movie — the same one-word label the photo and interval heroes carry, because the hero underneath it already shows what is about to be edited) and the ORIGINAL/format badges — then the preset chip strip, a Customise row, the Blended clips rows (results lead; the whole section hides while the project has none — the button below is the empty state), New blended clip, then two secondary flow entries (2026-08-11/12): Guided clip (experimental) (wand.and.stars — opens GuidedBuilderView; Back from its first step returns HERE via finishFlow(openProject:true)) and Punch-in reframe (viewfinder — Adjust with the reframe lane open), then the Source Clips card (Manage for ProRes/multi-encoding clips), management card. A video project has no fullscreen grading viewer, so Customise lives in the card: collapsed here (the chevron points right), it expands the same slider panel the viewer shows inline below the row, and once the card is 500pt wide or more it presents that panel as a sheet instead. Tapping a chip re-grades the preview and persists the choice; the grade is baked in only where a new file is written — the blended clip the blend produces, and a clip saved to Photos. Playback: the WHOLE of a source clip row and of a blended-clip row is the tap target (everything left of Save/Manage and of Open), and each thumbnail carries the play glyph to say so; all three routes — the card's play button, a clip row, a blended-clip row — open FullscreenMediaSheet (see player.portrait.svg). Source clips and the original play through the project's live grade; a blended clip plays ungraded, because the grade that made it is already in the file. Only Open still changes flow state. A blended-clip row also swipes left to reveal a 72pt red trash action (SwipeToDelete.swift) that raises the same delete-confirm alert as its context menu. With two blended clips listed the management card sits below the fold, which is what the real (scrolling) screen shows; the scroll content ends with 96pt bottom clearance so the Delete row comes to rest fully above the floating tab bar. Floating tab bar stays over pushed screens.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#33415A"/><stop offset="1" stop-color="#1B2330"/></linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- inline nav bar -->
      <g id="nav-bar">
        <path d="M22 76 l-9 10 9 10" stroke="#C36A00" stroke-width="2.6" fill="none" stroke-linecap="round" data-symbol="chevron.backward"/>
        <text x="30" y="91" font-size="17" fill="#C36A00">Projects</text>
        <text x="196.5" y="91" font-size="17" class="sb" fill="#000" text-anchor="middle">Sunset over harbour</text>
        <g data-symbol="ellipsis.circle">
          <circle cx="367" cy="86" r="11" fill="none" stroke="#C36A00" stroke-width="1.8"/>
          <circle cx="361.5" cy="86" r="1.6" fill="#C36A00"/><circle cx="367" cy="86" r="1.6" fill="#C36A00"/><circle cx="372.5" cy="86" r="1.6" fill="#C36A00"/>
        </g>
      </g>

      <!-- grading card: one frame of the movie, graded -->
      <g id="grading-card">
        <rect x="16" y="112" width="361" height="210" rx="18" fill="url(#hero)"/>
        <circle cx="120" cy="180" r="22" fill="#FFB340" opacity="0.85"/>
        <polygon points="16,268 90,224 170,262 250,222 330,258 377,238 377,322 16,322" fill="#1A222E"/>
        <polygon points="16,296 120,266 240,300 340,276 377,292 377,322 16,322" fill="#10151D"/>
        <circle cx="196.5" cy="217" r="26" fill="#000" opacity="0.45"/>
        <path d="M190 206 l19 11 -19 11 z" fill="#FFF" data-symbol="play.fill"/>
        <rect x="28" y="124" width="118" height="22" rx="11" fill="#000" opacity="0.5"/>
        <text x="87" y="139" font-size="11.5" class="sb" fill="#FFF" text-anchor="middle">ORIGINAL · 0:36</text>
        <!-- the edit affordance every hero carries, one label for every mode;
             here it opens App/VideoEditorView.swift on the movie -->
        <g id="edit-pill">
          <rect x="28" y="284" width="68" height="26" rx="13" fill="#000" opacity="0.45"/>
          <g data-symbol="slider.horizontal.3" stroke="#FFF" stroke-width="1.7" stroke-linecap="round">
            <path d="M40 292 h14 M40 297 h14 M40 302 h14"/>
            <circle cx="50" cy="292" r="2.1" fill="#FFF" stroke="none"/>
            <circle cx="45" cy="297" r="2.1" fill="#FFF" stroke="none"/>
            <circle cx="52" cy="302" r="2.1" fill="#FFF" stroke="none"/>
          </g>
          <text x="61" y="301" font-size="12.5" class="sb" fill="#FFF">Edit</text>
        </g>
        <rect x="243" y="288" width="122" height="22" rx="11" fill="#000" opacity="0.5"/>
        <text x="304" y="303" font-size="11.5" class="sb" fill="#FFF" text-anchor="middle">1920×1080 · 30 fps</text>
      </g>

      <!-- preset strip: same chips, same geometry, as the photo card -->
      <g id="preset-strip">
        <rect x="16" y="334" width="74" height="33" rx="16.5" fill="#C36A00"/>
        <text x="53" y="355" font-size="13.5" class="sb" fill="#FFF" text-anchor="middle">Natural</text>
        <rect x="98" y="334" width="72" height="33" rx="16.5" fill="#FFF" filter="url(#soft)"/>
        <text x="134" y="355" font-size="13.5" class="sb" fill="#000" text-anchor="middle">Cinema</text>
        <rect x="178" y="334" width="64" height="33" rx="16.5" fill="#FFF" filter="url(#soft)"/>
        <text x="210" y="355" font-size="13.5" class="sb" fill="#000" text-anchor="middle">Matte</text>
        <rect x="250" y="334" width="60" height="33" rx="16.5" fill="#FFF" filter="url(#soft)"/>
        <text x="280" y="355" font-size="13.5" class="sb" fill="#000" text-anchor="middle">Vivid</text>
        <rect x="318" y="334" width="76" height="33" rx="16.5" fill="#FFF" filter="url(#soft)"/>
        <text x="356" y="355" font-size="13.5" class="sb" fill="#000" text-anchor="middle">Original</text>
      </g>

      <!-- Customise disclosure, collapsed (chevron.down rotated -90°) -->
      <g id="customise">
        <rect x="16" y="379" width="361" height="50" rx="12" fill="#FFF" filter="url(#soft)"/>
        <text x="30" y="409.5" font-size="15" class="sb" fill="#000">Customise</text>
        <path d="M352 398 l7 6 -7 6" stroke="#6D6D72" stroke-width="2.2" fill="none"
              stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.down"/>
      </g>

      <!-- blended clips (results lead; section hidden entirely while empty) -->
      <text x="20" y="456" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">BLENDED CLIPS · 2</text>
      <g id="versions-card">
        <rect x="16" y="465" width="361" height="124" rx="16" fill="#FFF" filter="url(#soft)"/>
        <g id="version-row-1">
          <rect x="30" y="475" width="58" height="42" rx="7" fill="#31404E"/>
          <path d="M53 489 l12 7 -12 7 z" fill="#FFF" opacity="0.8" data-symbol="play.fill"/>
          <text x="100" y="493" font-size="14.5" class="sb" fill="#000">Blended clip 2 · 100× · 1.2 s</text>
          <text x="100" y="510" font-size="11.5" fill="#6D6D72">30 fps · from ProRes · yesterday</text>
          <text x="363" y="500" font-size="12.5" class="sb" fill="#C36A00" text-anchor="end">Open</text>
        </g>
        <line x1="100" y1="527" x2="377" y2="527" stroke="#000" stroke-opacity="0.08"/>
        <g id="version-row-2">
          <rect x="30" y="537" width="58" height="42" rx="7" fill="#3B4653"/>
          <path d="M53 551 l12 7 -12 7 z" fill="#FFF" opacity="0.8" data-symbol="play.fill"/>
          <text x="100" y="555" font-size="14.5" class="sb" fill="#000">Blended clip 1 · 50× · 2.4 s</text>
          <text x="100" y="572" font-size="11.5" fill="#6D6D72">30 fps · true-light · 2 days ago</text>
          <text x="363" y="562" font-size="12.5" class="sb" fill="#C36A00" text-anchor="end">Open</text>
        </g>
      </g>

      <!-- new blended clip button -->
      <g id="new-version">
        <rect x="16" y="603" width="361" height="50" rx="14" fill="#C36A00"/>
        <path d="M128 628 v-14 M121 621 h14" stroke="#FFF" stroke-width="2.4" stroke-linecap="round" data-symbol="plus"/>
        <text x="142" y="634" font-size="16" class="b" fill="#FFF">New blended clip</text>
      </g>

      <!-- guided clip (experimental) — the guided builder's entry point;
           back from its first step returns here -->
      <g id="guided-clip-button">
        <rect x="16" y="663" width="361" height="50" rx="14" fill="#FFF" filter="url(#soft)"/>
        <g stroke="#C36A00" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" data-symbol="wand.and.stars">
          <path d="M92 695 l8 -8 M102 685 l2 2"/>
          <path d="M104 680 l1.2 -2.6 1.2 2.6 2.6 1.2 -2.6 1.2 -1.2 2.6 -1.2 -2.6 -2.6 -1.2 Z"/>
          <path d="M96 677 l0.9 -2 0.9 2 2 0.9 -2 0.9 -0.9 2 -0.9 -2 -2 -0.9 Z"/>
        </g>
        <text x="118" y="694" font-size="15.5" class="sb" fill="#C36A00">Guided clip (experimental)</text>
      </g>

      <!-- punch-in reframe — the Adjust flow with the reframe lane open -->
      <g id="punch-in-button">
        <rect x="16" y="723" width="361" height="50" rx="14" fill="#FFF" filter="url(#soft)"/>
        <path d="M128 743 v-3 h3 M141 740 h3 v3 M144 753 v3 h-3 M131 756 h-3 v-3" stroke="#C36A00" fill="none" stroke-width="1.6" stroke-linecap="round" data-symbol="viewfinder"/>
        <text x="152" y="754" font-size="15.5" class="sb" fill="#C36A00">Punch-in reframe</text>
      </g>

      <!-- source clips + management card: pushed under the fold by the two
           flow buttons — the scrolling screen reaches them, this snapshot
           shows their top edge under the floating tab bar -->
      <g id="below-the-fold" transform="translate(0,120)">
      <text x="20" y="680" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">SOURCE CLIP</text>
      <g id="source-clips-card">
        <rect x="16" y="689" width="361" height="62" rx="16" fill="#FFF" filter="url(#soft)"/>
        <rect x="30" y="699" width="58" height="42" rx="7" fill="#33415A"/>
        <path d="M50 714 l12 7 -12 7 z" fill="#FFF" opacity="0.8"/>
        <text x="100" y="717" font-size="14.5" class="sb" fill="#000">Clip 1</text>
        <text x="100" y="734" font-size="11.5" fill="#6D6D72">ProRes · 2.9 GB</text>
        <text x="363" y="724" font-size="12.5" class="sb" fill="#C36A00" text-anchor="end">Manage</text>
      </g>

      <!-- management card: below the fold at rest; the scroll ends with 96pt clearance so the Delete row clears the tab bar -->
      <g id="management-card">
        <rect x="16" y="767" width="361" height="140" rx="16" fill="#FFF" filter="url(#soft)"/>
        <text x="32" y="795" font-size="16" fill="#000">Rename</text>
        <path d="M363 783 l6 7 -6 7" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round" data-symbol="chevron.right"/>
        <line x1="32" y1="811" x2="377" y2="811" stroke="#000" stroke-opacity="0.08"/>
        <text x="32" y="836" font-size="16" fill="#000">Storage</text>
        <text x="32" y="851" font-size="11.5" fill="#6D6D72">original + blended clips</text>
        <text x="361" y="840" font-size="14" fill="#6D6D72" text-anchor="end">4.6 GB</text>
      </g>
      </g>

      <!-- floating tab bar (Projects selected) over content -->
      <g id="tab-bar" opacity="0.98">
        <rect x="6.5" y="755" width="380" height="57" rx="28.5" fill="#FBFBFD" opacity="0.96" filter="url(#soft)"/>
        <rect x="6.5" y="755" width="380" height="57" rx="28.5" fill="none" stroke="#000" stroke-opacity="0.08"/>
        <g id="tab-create" fill="none" stroke="#8E8E93">
          <g transform="translate(41.5 776) scale(0.7273) translate(-11 -11)"><circle cx="11" cy="11" r="8" stroke-width="2.2" data-symbol="record.circle"/><circle cx="11" cy="11" r="3.4" fill="#8E8E93" stroke="none"/></g>
          <text x="41.5" y="800" font-size="9.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Create</text>
        </g>
        <g id="tab-gallery" fill="none" stroke="#8E8E93">
          <g transform="translate(103.5 776) scale(0.7273) translate(-11 -11)"><rect x="3" y="5.5" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(-6 10 10.5)" data-symbol="photo.on.rectangle.angled"/><rect x="6" y="8" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(4 13 13)"/></g>
          <text x="103.5" y="800" font-size="9.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Gallery</text>
        </g>
        <g id="tab-scans" fill="none" stroke="#8E8E93">
          <g transform="translate(165.5 776) scale(0.7273) translate(-11 -11)"><path d="M4 7 V4 h3 M15 4 h3 v3 M18 15 v3 h-3 M7 18 H4 v-3" stroke-width="2.34" stroke-linecap="round" data-symbol="doc.viewfinder"/><rect x="6.5" y="6.5" width="9" height="9" rx="1.6" stroke-width="2.34"/></g>
          <text x="165.5" y="800" font-size="9.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Scans</text>
        </g>
        <rect x="198.5" y="761" width="58" height="45" rx="22.5" fill="#C36A00" opacity="0.12"/>
        <g id="tab-projects" fill="none" stroke="#C36A00">
          <g transform="translate(227.5 776) scale(0.7273) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="square.stack"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="227.5" y="800" font-size="9.5" class="sb" fill="#C36A00" stroke="none" text-anchor="middle">Projects</text>
        </g>
        <g id="tab-collections" fill="none" stroke="#8E8E93">
          <g transform="translate(289.5 776) scale(0.7273) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="film.stack"/><path d="M7 4.5 v8 M15 4.5 v8" stroke-width="1.38" opacity="0.7"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="289.5" y="800" font-size="9.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Collections</text>
        </g>
        <g id="tab-settings" fill="none" stroke="#8E8E93">
          <g transform="translate(351.5 776) scale(0.7273) translate(-11 -11)"><path d="M3.5 6.5 h15 M3.5 11 h15 M3.5 15.5 h15" stroke-width="2.48" stroke-linecap="round" data-symbol="line.3.horizontal"/></g>
          <text x="351.5" y="800" font-size="9.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Settings</text>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Project detail (video) · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/ProjectDetailView.swift — GradingCard (graded frame · presetStrip · customiseControls) · versionRow · sourceClipsSection · managementCard</text>
</svg>
