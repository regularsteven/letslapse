<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Capture — Photo (Grid + Level, JPEG) · portrait</title>
  <desc>Mirrors App/CaptureView.swift (photoControlsRow · gridToggleCircle · RuleOfThirdsGrid · LevelIndicatorOverlay). Net-new mirror, 2026-09-07, built on capture-photo.portrait.svg (M stays off here — Grid+Level and manual exposure are independent, and showing both live in one screenshot would muddy which feature is which). Cluster slot 1 (grid) cycles Off → Grid → Grid+Level on iOS/iPadOS (`GridOverlayState`); this file draws the third state, `.level`, which layers BOTH the rule-of-thirds lines and the horizon-level bar over the fitted 16:9 viewfinder frame (x 0–393, y 89–788, centre 196.5, 438.5) — the same fitted frame `RuleOfThirdsGrid` and `LevelIndicatorOverlay` both measure against. The grid BUTTON's own 44pt glyph stays plain binary amber-when-on (`gridToggleCircle`'s own doc comment) — only the in-viewfinder bar carries the graduated colour, which is why the cluster reference below is the new `photo-grid` state (grid glyph amber, M still off) rather than a third glyph treatment.

Horizon bar staged at roll = +2.5°, deliberately off level rather than at rest, so the graduated ramp actually shows a non-green colour in this static file: `LevelIndicatorOverlay.tint(forDegreesOffLevel:)` bands at &lt;1° `LL.levelGood` #34C759, &lt;4° `LL.levelNear` #FFB340 (`= LL.amber`), &lt;8° `LL.levelOff` #FF9500, else `LL.levelFar` #FF3B30 — 2.5° falls in the second band, so the two fixed reference ticks, the rotating bar and the "+2.5°" readout are all drawn in `LL.levelNear`. The bar is a `Capsule` 88×2pt centred on the viewfinder's own centre, rotated `-roll` degrees (rotated -2.5° here) so it reads level once it lines up with the two fixed ticks (38×2pt capsules, ±73pt either side of centre, same tint); the degree label sits 20pt below centre, monospaced, sign always shown (`rollLabel`). A compact on-canvas legend (bottom-right corner of the top area, clear of every other control) restates the four thresholds since a single staged angle can only show one band directly — full explanation here in the desc as well, per the design-sync contract. `LL_GRID=level LL_LEVEL=2.5` stages exactly this. iOS/iPadOS only: `GridOverlayState.levelAvailable` is false on macOS (no CoreMotion there at all), so the Mac's own cycle never reaches this state — see macOS/INDEX.md.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="tile"><rect x="16" y="728" width="60" height="60" rx="12"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232B3B"/><stop offset="0.62" stop-color="#3A3628"/><stop offset="1" stop-color="#4A3A22"/>
    </linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#000"/>
    <g transform="translate(24,24)">

      <!-- viewfinder 16:9 -->
      <g id="viewfinder">
        <rect x="0" y="89" width="393" height="699" fill="url(#sky)"/>
        <circle cx="132" cy="360" r="30" fill="#FFB340" opacity="0.9"/>
        <circle cx="132" cy="360" r="52" fill="#FFB340" opacity="0.15"/>
        <polygon points="0,552 70,500 150,544 235,472 310,534 393,490 393,788 0,788" fill="#141A24"/>
        <polygon points="0,638 85,594 185,646 268,608 393,640 393,788 0,788" fill="#0B0E14"/>
        <rect x="0" y="700" width="393" height="88" fill="#080A0E"/>
      </g>

      <!-- Rule-of-thirds grid: RuleOfThirdsGrid, over the fitted 16:9 frame (0,89)-(393,788) -->
      <g id="thirds-grid" stroke="#FFF" stroke-opacity="0.9" stroke-width="1">
        <line x1="131" y1="89" x2="131" y2="788"/>
        <line x1="262" y1="89" x2="262" y2="788"/>
        <line x1="0" y1="322" x2="393" y2="322"/>
        <line x1="0" y1="555" x2="393" y2="555"/>
      </g>

      <!-- Horizon level: LevelIndicatorOverlay, centred on the same fitted frame (196.5, 438.5).
           Staged at roll = +2.5° (LL_LEVEL=2.5), the "near" band — LL.levelNear / #FFB340. -->
      <g id="level-indicator" fill="#FFB340">
        <rect x="104.5" y="437.5" width="38" height="2" rx="1"/>
        <rect x="250.5" y="437.5" width="38" height="2" rx="1"/>
        <rect x="152.5" y="437.5" width="88" height="2" rx="1" transform="rotate(-2.5 196.5 438.5)"/>
        <text x="196.5" y="458.5" text-anchor="middle" font-size="10" font-weight="600" class="m" fill="#FFB340">+2.5°</text>
      </g>

      <!-- Legend: not part of the app UI, restates the four LevelIndicatorOverlay bands for this static file -->
      <g id="level-legend">
        <rect x="240" y="112" width="137" height="96" rx="12" fill="#000" opacity="0.5"/>
        <text x="252" y="128" font-size="10" class="b" fill="#FFF" opacity="0.6" letter-spacing="0.8">LEVEL</text>
        <circle cx="252" cy="142" r="4" fill="#34C759"/>
        <text x="264" y="146" font-size="11" fill="#FFF" opacity="0.85">&lt; 1°</text>
        <circle cx="252" cy="160" r="4" fill="#FFB340"/>
        <text x="264" y="164" font-size="11" fill="#FFF" opacity="0.85">1–4°</text>
        <circle cx="252" cy="178" r="4" fill="#FF9500"/>
        <text x="264" y="182" font-size="11" fill="#FFF" opacity="0.85">4–8°</text>
        <circle cx="252" cy="196" r="4" fill="#FF3B30"/>
        <text x="264" y="200" font-size="11" fill="#FFF" opacity="0.85">≥ 8°</text>
      </g>

      <!-- top bar -->
      <g id="top-bar">
        <g id="close" data-symbol="xmark">
          <circle cx="35" cy="88" r="19" fill="#2B2B2E" opacity="0.9"/>
          <path d="M29.5 82.5 L40.5 93.5 M40.5 82.5 L29.5 93.5" stroke="#FFF" stroke-width="2.2" stroke-linecap="round"/>
        </g>
        <g id="format-pill">
          <rect x="217" y="70" width="160" height="35" rx="17.5" fill="#2B2B2E" opacity="0.9"/>
          <text x="231" y="92" font-size="13" class="sb" fill="#FFF">1920×1080</text>
          <text x="306" y="92" font-size="13" class="sb" fill="#FFF">· JPEG</text>
          <path d="M356 85 l4.5 5 l4.5 -5" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
        </g>
        <g id="headroom-chip">
          <rect x="62" y="72" width="147" height="31" rx="15.5" fill="#2B2B2E" opacity="0.9"/>
          <g data-symbol="internaldrive" stroke="#FFF" stroke-width="1.2" fill="none">
            <rect x="73" y="82.5" width="12" height="10" rx="2.5"/>
            <path d="M75.5 89.5 h7 M75.5 91.5 h7" stroke-linecap="round"/>
          </g>
          <text x="90" y="92.0" font-size="12.5" class="sb" fill="#FFF">≈62.5k</text>
          <text x="140" y="92.0" font-size="12.5" fill="#FFF" opacity="0.45">· 32.4 GB</text>
        </g>
      </g>

      <!-- photo controls: single BLEND dial -->
      <g id="photo-controls">
          <text x="147" y="657" font-size="10" class="b" fill="#FFF" opacity="0.45" letter-spacing="0.8">BLEND</text>
          <rect x="193" y="639" width="53" height="27" rx="13.5" fill="#2B2B2E" opacity="0.9"/>
          <text x="205" y="657" font-size="12.5" class="sb" fill="#FFF">10</text>
          <path d="M226 650 l4 4.5 l4 -4.5" stroke="#FFF" stroke-opacity="0.4" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
      </g>

      <!-- mode row + zoom chips -->
      <g id="mode-row" font-size="13" class="sb">
        <text x="44" y="697" fill="#FFB340" letter-spacing="0.3">PHOTO</text>
        <text x="105" y="697" fill="#FFF" opacity="0.5" letter-spacing="0.3">INTERVAL</text>
        <text x="185" y="697" fill="#FFF" opacity="0.5" letter-spacing="0.3">VIDEO</text>
        <g id="zoom-chips" data-symbol="lens buttons">
          <circle cx="256" cy="692" r="15" fill="none" stroke="#FFF" stroke-opacity="0.25"/>
          <text x="256" y="696" font-size="12" class="sb" fill="#FFF" opacity="0.6" text-anchor="middle">.5×</text>
          <circle cx="294" cy="692" r="15" fill="none" stroke="#FFB340" stroke-opacity="0.8"/>
          <text x="294" y="696" font-size="12" class="sb" fill="#FFB340" text-anchor="middle">1×</text>
          <circle cx="332" cy="692" r="15" fill="none" stroke="#FFF" stroke-opacity="0.25"/>
          <text x="332" y="696" font-size="12" class="sb" fill="#FFF" opacity="0.6" text-anchor="middle">3×</text>
        </g>
      </g>

      <!-- shutter row -->
      <g id="shutter-row">
        <g id="recent-tile">
          <g clip-path="url(#tile)">
            <rect x="16" y="728" width="60" height="60" fill="#3A3123"/>
            <polygon points="16,772 40,750 62,768 76,758 76,788 16,788" fill="#241E15"/>
          </g>
          <rect x="16" y="728" width="60" height="60" rx="12" fill="none" stroke="#FFF" stroke-opacity="0.35"/>
        </g>
        <!-- Shutter cluster: shared component. Edit ../components/shutter-cluster.photo-grid.portrait.svg,
             not this file; placement = ring centre (196.5, 758) minus (90, 50). Contract: components/README.md.
             Photo mode, Grid+Level on: slot 1 amber, slot 3 still M off. -->
        <image id="shutter-cluster" href="../components/shutter-cluster.photo-grid.portrait.svg" x="106.5" y="708" width="180" height="100"/>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000" stroke="#2A2A2E" stroke-width="1"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#FFF" opacity="0.4"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Capture — Photo (Grid + Level) · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/CaptureView.swift — RuleOfThirdsGrid · LevelIndicatorOverlay · cluster slot 1 = grid on</text>
</svg>
