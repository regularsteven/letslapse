<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Capture — exposure locked (brightness + focus) · portrait</title>
  <desc>Mirrors App/CaptureView.swift (exposurePanel). Shown in Video mode for the frame, but the panel is mode-independent — it appears in Photo, Interval and Video alike, the moment the AE/AF lock circle is tapped. Brightness is an offset in stops around the exposure the lock froze at (CameraController.setExposureOffset), range -3…+3 EV, so its thumb rests at the CENTER of the track and can travel both ways; it is not the absolute ISO the slider used to bind to. The readout gains a "+1.5 EV" token only once the thumb leaves center. The panel sits between the mode row and the shutter row, pushing the rows above it up by its height; the shutter row stays put.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="tile"><rect x="16" y="728" width="60" height="60" rx="12"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232B3B"/><stop offset="0.62" stop-color="#3A3628"/><stop offset="1" stop-color="#4A3A22"/>
    </linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <!-- device frame -->
  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#000"/>
    <g transform="translate(24,24)">

      <!-- viewfinder: 1080p 16:9 in portrait = 393×699, top-anchored under the top bar -->
      <g id="viewfinder">
        <rect x="0" y="89" width="393" height="699" fill="url(#sky)"/>
        <circle cx="132" cy="360" r="30" fill="#FFB340" opacity="0.9"/>
        <circle cx="132" cy="360" r="52" fill="#FFB340" opacity="0.15"/>
        <polygon points="0,552 70,500 150,544 235,472 310,534 393,490 393,788 0,788" fill="#141A24"/>
        <polygon points="0,638 85,594 185,646 268,608 393,640 393,788 0,788" fill="#0B0E14"/>
        <rect x="0" y="700" width="393" height="88" fill="#080A0E"/>
        <rect x="30" y="716" width="140" height="2" fill="#FFB340" opacity="0.12"/>
        <rect x="200" y="726" width="120" height="2" fill="#FFB340" opacity="0.08"/>
      </g>

      <!-- top bar (below the 59pt safe-area inset) -->
      <g id="top-bar">
        <g id="close" data-symbol="xmark">
          <circle cx="35" cy="88" r="19" fill="#2B2B2E" opacity="0.9"/>
          <path d="M29.5 82.5 L40.5 93.5 M40.5 82.5 L29.5 93.5" stroke="#FFF" stroke-width="2.2" stroke-linecap="round"/>
        </g>
        <g id="format-pill">
          <rect x="227" y="70" width="150" height="35" rx="17.5" fill="#2B2B2E" opacity="0.9"/>
          <text x="241" y="92" font-size="13" class="sb" fill="#FFF">1080p · 30</text>
          <text x="309" y="92" font-size="13" class="sb" fill="#FFB340">· Stab</text>
          <path d="M356 85 l4.5 5 l4.5 -5" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
        </g>
      </g>

      <!-- speed row (Target… only) — pushed up by the panel's height -->
      <g id="speed-chips">
        <rect x="160.5" y="535" width="72" height="27" rx="13.5" fill="#2B2B2E" opacity="0.9"/>
        <text x="196.5" y="553" font-size="12.5" fill="#FFF" text-anchor="middle">Target…</text>
      </g>

      <!-- mode row + zoom chips — pushed up by the panel's height -->
      <g id="mode-row" font-size="13" class="sb">
        <text x="44" y="593" fill="#FFF" opacity="0.5" letter-spacing="0.3">PHOTO</text>
        <text x="105" y="593" fill="#FFF" opacity="0.5" letter-spacing="0.3">INTERVAL</text>
        <text x="185" y="593" fill="#FFB340" letter-spacing="0.3">VIDEO</text>
        <g id="zoom-chips" data-symbol="lens buttons">
          <circle cx="256" cy="588" r="15" fill="none" stroke="#FFF" stroke-opacity="0.25"/>
          <text x="256" y="592" font-size="12" class="sb" fill="#FFF" opacity="0.6" text-anchor="middle">.5×</text>
          <circle cx="294" cy="588" r="15" fill="none" stroke="#FFB340" stroke-opacity="0.8"/>
          <text x="294" y="592" font-size="12" class="sb" fill="#FFB340" text-anchor="middle">1×</text>
          <circle cx="332" cy="588" r="15" fill="none" stroke="#FFF" stroke-opacity="0.25"/>
          <text x="332" y="592" font-size="12" class="sb" fill="#FFF" opacity="0.6" text-anchor="middle">3×</text>
        </g>
      </g>

      <!-- exposure panel: readout + brightness (EV offset) + focus -->
      <g id="exposure-panel">
        <!-- locked readout; the "· +1.5 EV" token appears only off-center -->
        <text x="16" y="621" font-size="12" class="m" fill="#FFB340">ISO 800 · 1/60</text>

        <g id="brightness-slider" data-symbol="sun.max.fill">
          <circle cx="27" cy="648" r="5.5" fill="none" stroke="#FFF" stroke-opacity="0.6" stroke-width="1.4"/>
          <path d="M27 639 v3 M27 654 v3 M18 648 h3 M33 648 h3 M20.6 641.6 l2.1 2.1 M31.3 652.3 l2.1 2.1 M33.4 641.6 l-2.1 2.1 M22.7 652.3 l-2.1 2.1" stroke="#FFF" stroke-opacity="0.6" stroke-width="1.4" stroke-linecap="round"/>
          <!-- track: thumb rests at the CENTER of -3…+3 EV, room either way -->
          <rect x="48" y="646" width="329" height="4" rx="2" fill="#FFF" opacity="0.25"/>
          <rect x="48" y="646" width="164.5" height="4" rx="2" fill="#C36A00"/>
          <circle cx="212.5" cy="648" r="11" fill="#FFF"/>
        </g>

        <g id="focus-slider" data-symbol="camera.macro">
          <rect x="21" y="680" width="12" height="12" rx="3" fill="none" stroke="#FFF" stroke-opacity="0.6" stroke-width="1.4"/>
          <circle cx="27" cy="686" r="3" fill="none" stroke="#FFF" stroke-opacity="0.6" stroke-width="1.4"/>
          <rect x="48" y="684" width="329" height="4" rx="2" fill="#FFF" opacity="0.25"/>
          <rect x="48" y="684" width="204" height="4" rx="2" fill="#C36A00"/>
          <circle cx="252" cy="686" r="11" fill="#FFF"/>
        </g>
      </g>

      <!-- shutter row: recent tile · grid+lock column · shutter · timer+steady column -->
      <g id="shutter-row">
        <g id="recent-tile">
          <g clip-path="url(#tile)">
            <rect x="16" y="728" width="60" height="60" fill="#3A3123"/>
            <polygon points="16,772 40,750 62,768 76,758 76,788 16,788" fill="#241E15"/>
          </g>
          <rect x="16" y="728" width="60" height="60" rx="12" fill="none" stroke="#FFF" stroke-opacity="0.35"/>
        </g>
        <g id="grid-toggle" data-symbol="grid.circle">
          <circle cx="108" cy="732" r="22" fill="#2B2B2E" opacity="0.9"/>
          <circle cx="108" cy="732" r="10" fill="none" stroke="#FFF" stroke-width="1.6"/>
          <path d="M101.5 728.7 h13 M101.5 735.3 h13 M104.7 725.5 v13 M111.3 725.5 v13" stroke="#FFF" stroke-width="1.2"/>
        </g>
        <!-- locked: amber fill, lock.fill in ink -->
        <g id="exposure-lock" data-symbol="lock.fill">
          <circle cx="108" cy="784" r="22" fill="#FFB340"/>
          <rect x="102" y="783" width="12" height="9" rx="2" fill="#000"/>
          <path d="M104.5 783 v-3.5 a3.5 3.5 0 0 1 7 0 v3.5" fill="none" stroke="#000" stroke-width="1.8"/>
        </g>
        <g id="shutter" data-symbol="record button">
          <circle cx="196.5" cy="758" r="38" fill="none" stroke="#FFF" stroke-width="4"/>
          <circle cx="196.5" cy="758" r="30" fill="#FF3B30"/>
        </g>
        <g id="delay-toggle" data-symbol="timer">
          <circle cx="285" cy="732" r="22" fill="#2B2B2E" opacity="0.9"/>
          <circle cx="285" cy="733" r="9" fill="none" stroke="#FFF" stroke-width="1.7"/>
          <path d="M285 733 v-6 M282 723 h6" stroke="#FFF" stroke-width="1.7" stroke-linecap="round"/>
        </g>
        <g id="steady-toggle" data-symbol="hand.raised">
          <circle cx="285" cy="784" r="22" fill="#2B2B2E" opacity="0.9"/>
          <path d="M280 789 v-9 m3 9 v-11 m3 11 v-11 m3 11 v-9 m-9 9 a6 6 0 0 0 9 0 v-3" fill="none" stroke="#FFF" stroke-width="1.6" stroke-linecap="round"/>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000" stroke="#2A2A2E" stroke-width="1"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#FFF" opacity="0.4"/>
    </g>
  </g>

  <!-- caption -->
  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Capture — exposure locked · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/CaptureView.swift — exposurePanel · brightness is ±3 EV around the lock, thumb centered</text>
</svg>
