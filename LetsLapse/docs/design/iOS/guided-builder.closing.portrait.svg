<svg viewBox="0 0 441 940" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Guided clip (experimental) · closing step · portrait</title>
  <desc>Mirrors App/GuidedBuilderView.swift (stretchStep for the closing base run: transitionCard + closingDefaultCard). Question "How does it end?". The transition question is ALWAYS asked — the ramp back out of the last moment is part of the answer even when the closing state is the default — so HOW IT ARRIVES sits above the default card (Step "hard cut" active here; choosing an ease welds the punch-out framing move to the same ramp). The closingDefaultCard: arrow.uturn.backward glyph, 15pt semibold "Ends like it starts" (reads "Ends wide" instead when the opening carries a punch — the default closing state is always wide + the opening's speed), 12pt secondary "Wide · 50× smooth — tap Next to keep it." (speed via WarpTimeline.speedLabel + speedWord, synced from the opening on leaving step one — only when the LAST stretch is a base run; a shoot that ends on a recorded moment gets the moment question instead and keeps its seeded ¼×), and the accent "Change…" link which reveals the full speed + framing controls (closingOverride). The sync also never fires once the closing speed already differs from the opening (a deliberate override read back on re-entry). Next lands on Review. Captured from the iPhone 17 Pro sim, mapped onto the 393×852 canvas.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}</style>
  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <g transform="translate(24,24)">
      <rect width="393" height="852" fill="#F2F2F7"/>
      <g id="status-bar" fill="#000">
        <text x="47" y="28" font-size="15" class="sb">9:41</text>
        <rect x="138" y="10" width="117" height="34" rx="17" fill="#000"/>
        <g transform="translate(310,16)">
          <rect x="0" y="4" width="3" height="8" rx="1"/><rect x="5" y="2" width="3" height="10" rx="1"/><rect x="10" y="0" width="3" height="12" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.3"/>
          <path d="M28 4 q6 -5 12 0 M30.5 7 q3.5 -3 7 0 M33.5 10 q1 -1 2 0" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="wifi"/>
          <rect x="47" y="1" width="22" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="49" y="3" width="15" height="7" rx="1.5"/><rect x="70" y="4" width="1.5" height="5" rx="0.75" fill-opacity="0.4"/>
        </g>
      </g>
      <g id="flow-header">
        <circle cx="33" cy="77" r="17" fill="#FFFFFF" filter="url(#soft)"/>
        <path d="M37 70 l-8 7 8 7" stroke="#C36A00" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.left"/>
        <text x="196" y="82" font-size="16" class="sb" text-anchor="middle" fill="#000">Guided clip</text>
        <rect x="303" y="66" width="74" height="20" rx="10" fill="#C36A00" fill-opacity="0.12"/>
        <text x="340" y="80" font-size="9" class="b" text-anchor="middle" fill="#C36A00" letter-spacing="0.5">EXPERIMENTAL</text>
      </g>
      <g id="step-dots">
        <rect x="162" y="103" width="7" height="5" rx="2.5" fill="#C36A00"/>
        <rect x="174" y="103" width="7" height="5" rx="2.5" fill="#C36A00"/>
        <rect x="186" y="103" width="7" height="5" rx="2.5" fill="#C36A00"/>
        <rect x="198" y="103" width="18" height="5" rx="2.5" fill="#C36A00"/>
        <rect x="221" y="103" width="7" height="5" rx="2.5" fill="#8E8E93" fill-opacity="0.25"/>
      </g>
      <text id="question" x="16" y="147" font-size="22" class="b" fill="#000">How does it end?</text>
      <g id="transition-card">
        <text x="18" y="180" font-size="13" class="sb" fill="#6D6D72" letter-spacing="1">HOW IT ARRIVES</text>
        <g id="ramp-chips">
          <rect x="16" y="190" width="85" height="41" rx="12" fill="#1C1C1E"/>
          <text x="58" y="207" font-size="13" class="b" text-anchor="middle" fill="#FFB340">Step</text>
          <text x="58" y="222" font-size="9.5" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.6">hard cut</text>
          <rect x="108" y="190" width="85" height="41" rx="12" fill="#FFFFFF" filter="url(#soft)"/>
          <text x="150" y="207" font-size="13" class="b" text-anchor="middle" fill="#000">0.5s</text>
          <text x="150" y="222" font-size="9.5" text-anchor="middle" fill="#6D6D72">ease</text>
          <rect x="200" y="190" width="85" height="41" rx="12" fill="#FFFFFF" filter="url(#soft)"/>
          <text x="242" y="207" font-size="13" class="b" text-anchor="middle" fill="#000">1s</text>
          <text x="242" y="222" font-size="9.5" text-anchor="middle" fill="#6D6D72">ease</text>
          <rect x="292" y="190" width="85" height="41" rx="12" fill="#FFFFFF" filter="url(#soft)"/>
          <text x="334" y="207" font-size="13" class="b" text-anchor="middle" fill="#000">2s</text>
          <text x="334" y="222" font-size="9.5" text-anchor="middle" fill="#6D6D72">ease</text>
        </g>
        <text x="20" y="250" font-size="11.5" fill="#6D6D72">One ramp — the speed change and the framing move ride it</text>
        <text x="20" y="264" font-size="11.5" fill="#6D6D72">together, in seconds of the finished clip.</text>
      </g>
      <!-- ends-like-it-starts default card -->
      <g id="closing-default-card">
        <rect x="16" y="282" width="361" height="88" rx="16" fill="#FFFFFF" filter="url(#soft)"/>
        <path d="M40 306 l-6 6 6 6 M34 312 h12 a8 8 0 0 1 0 16 h-4" stroke="#C36A00" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="arrow.uturn.backward"/>
        <text x="60" y="313" font-size="15" class="sb" fill="#000">Ends like it starts</text>
        <text x="60" y="333" font-size="12" fill="#6D6D72">Wide · 50× smooth — tap Next to keep it.</text>
        <text x="32" y="359" font-size="13" class="sb" fill="#C36A00">Change…</text>
      </g>
      <g id="next-button">
        <rect x="16" y="775" width="361" height="50" rx="14" fill="#C36A00"/>
        <text x="196" y="806" font-size="16" class="b" text-anchor="middle" fill="#FFFFFF">Next</text>
      </g>
      <rect x="130" y="840" width="133" height="5" rx="2.5" fill="#000"/>
    </g>
  </g>
  <text x="220" y="906" font-size="13" class="sb" text-anchor="middle" fill="#000">iOS · Guided clip (experimental) · closing step · portrait · 393×852 pt</text>
  <text x="220" y="924" font-size="11" text-anchor="middle" fill="#6D6D72">mirrors App/GuidedBuilderView.swift — transitionCard (always asked) + closingDefaultCard with Change… override</text>
</svg>
