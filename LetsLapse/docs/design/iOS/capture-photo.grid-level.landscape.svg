<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Capture — Photo (Grid + Level, JPEG) · landscape</title>
  <desc>Mirrors App/CaptureView.swift (landscapeLayout · photoControlsRow · gridToggleCircle · RuleOfThirdsGrid · LevelIndicatorOverlay). Net-new mirror, 2026-09-07, built on capture-photo.landscape.svg (M stays off — Grid+Level and manual exposure are independent, and showing both live in one screenshot would muddy which feature is which). `LevelSensor.rollDegrees` is normalised against the nearest square hold rather than portrait specifically, so the same bar and colour logic apply unchanged in this orientation — `viewfinder(in:)` fits the grid/level frame the same way here, just centred rather than top-anchored (`isPortrait` picks the overlay's own alignment, not its geometry). Fitted 16:9 frame in this file: x 171–671, y 43–329, centre (421, 186) — the same rect capture-video.landscape.svg and capture-photo.landscape.svg already draw.

Horizon bar staged at roll = +2.5° (`LL_GRID=level LL_LEVEL=2.5`), the "near" band, so the graduated ramp shows a non-green colour in this static file: `LevelIndicatorOverlay.tint(forDegreesOffLevel:)` bands at &lt;1° `LL.levelGood` #34C759, &lt;4° `LL.levelNear` #FFB340 (`= LL.amber`), &lt;8° `LL.levelOff` #FF9500, else `LL.levelFar` #FF3B30 — all in `LL.levelNear` here: the two fixed reference ticks (38×2pt capsules, ±73pt either side of centre), the rotating 88×2pt bar (rotated -2.5°, reading level once it lines up with the ticks), and the "+2.5°" label 20pt below centre. A compact on-canvas legend restates the four thresholds in the viewfinder's clear top-trailing corner (full explanation in the desc too, per the design-sync contract). The grid BUTTON's own 44pt glyph stays plain binary amber-when-on — only the in-viewfinder bar is graduated — which is why the cluster reference is the `photo-grid` state (grid glyph amber, M off) rather than a third glyph treatment. iOS/iPadOS only: `GridOverlayState.levelAvailable` is false on macOS (no CoreMotion there at all) — see macOS/INDEX.md. Left rail, BLEND corner control, mode rail and cluster pin are otherwise identical to capture-photo.landscape.svg — see that file's own desc for how each was derived from `landscapeLayout`.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="852" height="393" rx="54"/></clipPath>
    <clipPath id="tile"><rect x="83" y="296" width="60" height="60" rx="12"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232B3B"/><stop offset="0.62" stop-color="#3A3628"/><stop offset="1" stop-color="#4A3A22"/>
    </linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="18" y="18" width="864" height="405" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="852" height="393" fill="#000"/>
    <g transform="translate(24,24)">

      <g id="viewfinder">
        <rect x="171" y="43" width="500" height="286" fill="url(#sky)"/>
        <circle cx="300" cy="150" r="26" fill="#FFB340" opacity="0.9"/>
        <circle cx="300" cy="150" r="46" fill="#FFB340" opacity="0.15"/>
        <polygon points="171,240 260,200 350,238 445,182 540,228 671,192 671,329 171,329" fill="#141A24"/>
        <polygon points="171,286 280,258 400,292 500,268 671,288 671,329 171,329" fill="#0B0E14"/>
      </g>

      <!-- Rule-of-thirds grid: RuleOfThirdsGrid, over the fitted 16:9 frame (171,43)-(671,329) -->
      <g id="thirds-grid" stroke="#FFF" stroke-opacity="0.9" stroke-width="1">
        <line x1="338" y1="43" x2="338" y2="329"/>
        <line x1="504" y1="43" x2="504" y2="329"/>
        <line x1="171" y1="138" x2="671" y2="138"/>
        <line x1="171" y1="234" x2="671" y2="234"/>
      </g>

      <!-- Horizon level: LevelIndicatorOverlay, centred on the same fitted frame (421, 186).
           Staged at roll = +2.5° (LL_LEVEL=2.5), the "near" band — LL.levelNear / #FFB340. -->
      <g id="level-indicator" fill="#FFB340">
        <rect x="329" y="185" width="38" height="2" rx="1"/>
        <rect x="475" y="185" width="38" height="2" rx="1"/>
        <rect x="377" y="185" width="88" height="2" rx="1" transform="rotate(-2.5 421 186)"/>
        <text x="421" y="206" text-anchor="middle" font-size="10" font-weight="600" class="m" fill="#FFB340">+2.5°</text>
      </g>

      <!-- Legend: not part of the app UI, restates the four LevelIndicatorOverlay bands for this static file -->
      <g id="level-legend">
        <rect x="520" y="50" width="130" height="92" rx="12" fill="#000" opacity="0.5"/>
        <text x="532" y="66" font-size="10" class="b" fill="#FFF" opacity="0.6" letter-spacing="0.8">LEVEL</text>
        <circle cx="532" cy="80" r="4" fill="#34C759"/>
        <text x="544" y="84" font-size="11" fill="#FFF" opacity="0.85">&lt; 1°</text>
        <circle cx="532" cy="98" r="4" fill="#FFB340"/>
        <text x="544" y="102" font-size="11" fill="#FFF" opacity="0.85">1–4°</text>
        <circle cx="532" cy="116" r="4" fill="#FF9500"/>
        <text x="544" y="120" font-size="11" fill="#FFF" opacity="0.85">4–8°</text>
        <circle cx="532" cy="134" r="4" fill="#FF3B30"/>
        <text x="544" y="138" font-size="11" fill="#FFF" opacity="0.85">≥ 8°</text>
      </g>

      <!-- left rail: identical to capture-photo.landscape.svg -->
      <g id="left-rail">
        <g id="close" data-symbol="xmark">
          <circle cx="113" cy="40" r="19" fill="#2B2B2E" opacity="0.9"/>
          <path d="M107.5 34.5 L118.5 45.5 M118.5 34.5 L107.5 45.5" stroke="#FFF" stroke-width="2.2" stroke-linecap="round"/>
        </g>
        <g id="format-pill" transform="translate(37,0)">
          <rect x="38" y="133" width="150" height="35" rx="17.5" fill="#2B2B2E" opacity="0.9"/>
          <text x="52" y="155" font-size="13" class="sb" fill="#FFF">1920×1080</text>
          <text x="124" y="155" font-size="13" class="sb" fill="#FFF">· JPEG</text>
          <path d="M167 148 l4.5 5 l4.5 -5" stroke="#FFF" stroke-opacity="0.4" stroke-width="2" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
        </g>
        <g id="headroom-chip" transform="translate(7,0)">
          <rect x="68" y="176" width="84" height="31" rx="15.5" fill="#2B2B2E" opacity="0.9"/>
          <g data-symbol="internaldrive" stroke="#FFF" stroke-width="1.2" fill="none">
            <rect x="79" y="186.5" width="12" height="10" rx="2.5"/>
            <path d="M81.5 193.5 h7 M81.5 195.5 h7" stroke-linecap="round"/>
          </g>
          <text x="96" y="196.0" font-size="12.5" class="sb" fill="#FFF">≈62.5k</text>
        </g>
        <g id="zoom-chips" data-symbol="lens buttons">
          <circle cx="75" cy="242" r="15" fill="none" stroke="#FFF" stroke-opacity="0.25"/>
          <text x="75" y="246" font-size="12" class="sb" fill="#FFF" opacity="0.6" text-anchor="middle">.5×</text>
          <circle cx="113" cy="242" r="15" fill="none" stroke="#FFB340" stroke-opacity="0.8"/>
          <text x="113" y="246" font-size="12" class="sb" fill="#FFB340" text-anchor="middle">1×</text>
          <circle cx="151" cy="242" r="15" fill="none" stroke="#FFF" stroke-opacity="0.25"/>
          <text x="151" y="246" font-size="12" class="sb" fill="#FFF" opacity="0.6" text-anchor="middle">3×</text>
        </g>
        <g id="remote-chip">
          <rect x="75" y="259" width="142" height="26" rx="13" fill="#2B2B2E" opacity="0.9"/>
          <circle cx="87" cy="272" r="3.5" fill="#FFB340"/>
          <text x="96" y="276.5" font-size="12.5" fill="#FFF" font-weight="500">Remote</text>
          <text x="149" y="276.5" font-size="12.5" class="b m" fill="#FFF" letter-spacing="1.5">931156</text>
        </g>
        <g id="recent-tile">
          <g clip-path="url(#tile)">
            <rect x="83" y="296" width="60" height="60" fill="#3A3123"/>
            <polygon points="83,340 107,318 129,336 143,326 143,356 83,356" fill="#241E15"/>
          </g>
          <rect x="83" y="296" width="60" height="60" rx="12" fill="none" stroke="#FFF" stroke-opacity="0.35"/>
        </g>
      </g>

      <!-- Photo's BLEND dial: identical to capture-photo.landscape.svg -->
      <g id="photo-controls">
        <text x="181" y="310" font-size="10" class="b" fill="#FFF" opacity="0.45" letter-spacing="0.8">BLEND</text>
        <rect x="227" y="292" width="53" height="27" rx="13.5" fill="#2B2B2E" opacity="0.9"/>
        <text x="239" y="310" font-size="12.5" class="sb" fill="#FFF">10</text>
        <path d="M260 303 l4 4.5 l4 -4.5" stroke="#FFF" stroke-opacity="0.4" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
      </g>

      <g id="right-rail">
        <g id="mode-stack" font-size="11" class="b" text-anchor="middle">
          <text x="734" y="34" fill="#FFB340" letter-spacing="0.6">PHOTO</text>
          <text x="734" y="54" fill="#FFF" opacity="0.5" letter-spacing="0.6">INTERVAL</text>
          <text x="734" y="74" fill="#FFF" opacity="0.5" letter-spacing="0.6">VIDEO</text>
        </g>
        <!-- Shutter cluster: shared component. Edit ../components/shutter-cluster.photo-grid.landscape.svg,
             not this file; placement unchanged (ring centre 758,196.5). Grid+Level on: slot 1 amber, slot 3 still M off. -->
        <image id="shutter-cluster" href="../components/shutter-cluster.photo-grid.landscape.svg" x="678" y="136.5" width="160" height="120"/>
      </g>

      <!-- hardware -->
      <rect x="11" y="134.5" width="36" height="124" rx="18" fill="#000" stroke="#2A2A2E" stroke-width="1"/>
      <rect x="359" y="380" width="134" height="5" rx="2.5" fill="#FFF" opacity="0.4"/>
    </g>
  </g>

  <text x="450" y="450" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Capture — Photo (Grid + Level) · landscape · 852×393 pt</text>
  <text x="450" y="468" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/CaptureView.swift — RuleOfThirdsGrid · LevelIndicatorOverlay · cluster slot 1 = grid on</text>
</svg>
