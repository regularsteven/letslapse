<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Capture — Interval (idle, Ladder armed, light panel open) · portrait</title>
  <desc>Mirrors App/CaptureDials.swift (IntervalDialsRow — modePicker + ladderChip; EVERY and BLEND are hidden because IntervalCaptureMode.ladder ownsInterval and ownsBlend) + App/CaptureView.swift (ladderViewfinderOverlays, intervalPickerRow) + App/LightLadderViews.swift (LadderLightPanel) over LetsLapseKit's LightLadder / LightLadderSelector. MODE = Ladder: the row is two dials, MODE then the unlabelled ladder chip (the one exception to DialCaption — it reads as MODE's object, swatch + name + chevron; a tap opens the ladder picker, capture-interval.ladder-picker.portrait.svg). With no EVERY/BLEND and an empty ±EV band the control stack collapses: the dial row sits at 653 and the PHOTO · INTERVAL · VIDEO row at 692, directly above the shutter row. The LIGHT PANEL is an overlay on the viewfinder (bottom-leading, 16 pt in), not part of the control stack: rung swatch + name, "scene EV 5.2" (the preview meter's smoothed EV), the rung's levers in a mono line, what it costs ("≈1 800 frames an hour · motion softened by 3-frame stacking"), and which rung is next, in amber. The ✕ collapses it to the rung pill (capture-interval.ladder-panel-closed.portrait.svg); it re-opens on a rung change while armed. Not drawn: the amber clamp note under the cost line ("blend 10 → 6 in RAW on this camera") that appears when the device ceiling cannot hold the rung's ask. Staged by LL_LADDER=armed with LL_CAPTURE=1 — the built-in ladder on its Dusk rung at scene EV 5.2 (the simulator has no camera to meter; there the overlays sit over a full-height black preview, on a device over the 4:3 frame drawn here). Top bar as capture-interval.holygrail.portrait.svg. iOS/iPadOS only — macOS has no MODE dial.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="tile"><rect x="16" y="728" width="60" height="60" rx="12"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232B3B"/><stop offset="0.62" stop-color="#3A3628"/><stop offset="1" stop-color="#4A3A22"/>
    </linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#000"/>
    <g transform="translate(24,24)">

      <!-- viewfinder: full 4:3 sensor = 393×524, top-anchored under the top bar -->
      <g id="viewfinder">
        <rect x="0" y="86" width="393" height="440" fill="url(#sky)"/>
        <circle cx="132" cy="252" r="28" fill="#FFB340" opacity="0.9"/>
        <circle cx="132" cy="252" r="48" fill="#FFB340" opacity="0.15"/>
        <polygon points="0,370 70,330 150,364 235,308 310,357 393,321 393,526 0,526" fill="#141A24"/>
        <polygon points="0,429 85,395 185,434 268,405 393,429 393,526 0,526" fill="#0B0E14"/>
        <rect x="0" y="473" width="393" height="53" fill="#080A0E"/>
      </g>

      <!-- top bar -->
      <g id="top-bar">
        <g id="close" data-symbol="xmark">
          <circle cx="35" cy="88" r="19" fill="#2B2B2E" opacity="0.9"/>
          <path d="M29.5 82.5 L40.5 93.5 M40.5 82.5 L29.5 93.5" stroke="#FFF" stroke-width="2.2" stroke-linecap="round"/>
        </g>
        <g id="schedule" data-symbol="clock">
          <circle cx="81" cy="88" r="19" fill="#2B2B2E" opacity="0.9"/>
          <circle cx="81" cy="88" r="8.5" fill="none" stroke="#FFF" stroke-width="1.8"/>
          <path d="M81 83 v5 h3.5" stroke="#FFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g id="format-pill">
          <rect x="198" y="70" width="179" height="35" rx="17.5" fill="#2B2B2E" opacity="0.9"/>
          <text x="212" y="92" font-size="13" class="sb" fill="#FFF">12MP 4:3</text>
          <text x="274" y="92" font-size="13" class="sb" fill="#FFF">· JPEG</text>
          <path d="M356 85 l4.5 5 l4.5 -5" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
        </g>
        <g id="headroom-chip">
          <rect x="106" y="72" width="84" height="31" rx="15.5" fill="#2B2B2E" opacity="0.9"/>
          <g data-symbol="internaldrive" stroke="#FFF" stroke-width="1.2" fill="none">
            <rect x="117" y="82.5" width="12" height="10" rx="2.5"/>
            <path d="M119.5 89.5 h7 M119.5 91.5 h7" stroke-linecap="round"/>
          </g>
          <text x="134" y="92.0" font-size="12.5" class="sb" fill="#FFF">≈10.6k</text>
        </g>
      </g>

      <!-- LIGHT PANEL — LadderLightPanel, bottom-leading of the viewfinder,
           16 pt in. Black @60% r12, padding 14/12, rows 7 pt apart -->
      <g id="ladder-light-panel">
        <rect x="16" y="410" width="361" height="100" rx="12" fill="#000" opacity="0.6"/>
        <rect x="30" y="424.5" width="9" height="9" rx="2" fill="#8A4A00"/>
        <text x="47" y="434" font-size="15" class="sb" fill="#FFF">Dusk</text>
        <text x="90" y="433" font-size="10.5" class="m" fill="#FFF" opacity="0.55">scene EV 5.2</text>
        <g id="panel-close" data-symbol="xmark">
          <circle cx="352" cy="429" r="11" fill="#FFF" opacity="0.12"/>
          <path d="M348.5 425.5 l7 7 M355.5 425.5 l-7 7" stroke="#FFF" stroke-opacity="0.8" stroke-width="1.8" stroke-linecap="round"/>
        </g>
        <text x="30" y="455" font-size="10.5" class="m" fill="#FFF" opacity="0.75">every 2 s · blend 3 · ISO auto · shutter auto ≤ 1 s</text>
        <text x="30" y="474" font-size="10.5" fill="#FFF" opacity="0.6">≈1 800 frames an hour · motion softened by 3-frame stacking</text>
        <text x="30" y="493" font-size="10.5" fill="#FFB340">Night is next, below EV 4 — shutter auto ≤ 1 s, no stacking</text>
      </g>

      <!-- interval dials: MODE + the ladder chip, centred as a pair. EVERY
           and BLEND are gone (the rung owns them) and the ±EV band is empty,
           so the stack sits lower than in the Dynamic/Basic specs -->
      <g id="interval-dials">
        <text x="63" y="657" font-size="10" class="b" fill="#FFF" opacity="0.45" letter-spacing="0.8">MODE</text>
        <rect x="105" y="639.5" width="81" height="27" rx="13.5" fill="#2B2B2E" opacity="0.9"/>
        <text x="117" y="657" font-size="12.5" class="sb" fill="#FFF">Ladder</text>
        <path d="M167 650 l4 4.5 l4 -4.5" stroke="#FFF" stroke-opacity="0.4" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
        <g id="ladder-chip">
          <rect x="194" y="639.5" width="136" height="27" rx="13.5" fill="#2B2B2E" opacity="0.9"/>
          <rect x="206" y="648.5" width="9" height="9" rx="2" fill="#8A4A00"/>
          <text x="222" y="657" font-size="12.5" class="sb" fill="#FFF">Bright &amp; Fast</text>
          <path d="M311 650 l4 4.5 l4 -4.5" stroke="#FFF" stroke-opacity="0.4" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
        </g>
      </g>

      <!-- mode row -->
      <g id="mode-row" font-size="13" class="sb">
        <text x="107" y="692" fill="#FFF" opacity="0.5" letter-spacing="0.3">PHOTO</text>
        <text x="168" y="692" fill="#FFB340" letter-spacing="0.3">INTERVAL</text>
        <text x="248" y="692" fill="#FFF" opacity="0.5" letter-spacing="0.3">VIDEO</text>
      </g>

      <!-- shutter row -->
      <g id="shutter-row">
        <g id="recent-tile">
          <g clip-path="url(#tile)">
            <rect x="16" y="728" width="60" height="60" fill="#3A3123"/>
            <polygon points="16,772 40,750 62,768 76,758 76,788 16,788" fill="#241E15"/>
          </g>
          <rect x="16" y="728" width="60" height="60" rx="12" fill="none" stroke="#FFF" stroke-opacity="0.35"/>
        </g>
        <!-- Shutter cluster: shared component (ring + four framing slots). Edit ../components/shutter-cluster.idle.portrait.svg,
             not this file; placement = ring centre (196.5, 758) minus (90, 50). Contract: components/README.md -->
        <image id="shutter-cluster" href="../components/shutter-cluster.idle.portrait.svg" x="106.5" y="708" width="180" height="100"/>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000" stroke="#2A2A2E" stroke-width="1"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#FFF" opacity="0.4"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Capture — Interval (idle, Ladder armed) · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors CaptureDials (MODE · ladder chip) · LightLadderViews (LadderLightPanel) · LL_LADDER=armed</text>
</svg>
