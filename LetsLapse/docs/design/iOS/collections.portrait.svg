<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Collections · portrait</title>
  <desc>Mirrors App/CollectionsView.swift (header, collectionCard): the Collections tab with collections present. Manual 34pt title with a 34pt "+" circle button (accent on 12% accent) right-aligned; one card per collection — name 16 bold with a trailing chevron, accent meta line "3 clips · 0:41 · 16:9" (clip count · total timecode · canvas ratio), secondary line "Exported today 14:02 · kept" or "Not exported yet", then up to three 96×54 r9 thumbnails with amber speed pills (the Projects-card thumbnail language, drawn as CollectionClipThumb). Tap a card to push the timeline builder (collection-detail.portrait.svg). Swipe a card left to reveal a 72pt red trash action (SwipeToDelete.swift, trailing corners r18 to match the card) — tapping it raises the same "Delete "name"?" confirm alert as the detail screen's ⋯ menu (clips stay in their projects; the collection and its kept export are deleted). Cards: x16 w361 r18, padding 14; thumbs gap 8. Empty state variant: collections.empty.portrait.svg. Tab bar from 755, Collections selected.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.05"/></filter>
    <linearGradient id="clipA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33415A"/><stop offset="1" stop-color="#1B2330"/></linearGradient>
    <linearGradient id="clipB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A5A43"/><stop offset="1" stop-color="#232E1D"/></linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- header: title + "+" (opens the name sheet) -->
      <g id="header">
        <text x="20" y="99" font-size="34" class="b" fill="#000">Collections</text>
        <circle cx="356" cy="88" r="17" fill="#C36A00" opacity="0.12"/>
        <path d="M356 82 v12 M350 88 h12" stroke="#C36A00" stroke-width="2.4" stroke-linecap="round" data-symbol="plus"/>
      </g>

      <!-- collection card 1 -->
      <g id="card-harbour-reel">
        <rect x="16" y="124" width="361" height="146" rx="18" fill="#FFF" filter="url(#card)"/>
        <text x="30" y="153" font-size="16" class="b" fill="#000">Harbour reel</text>
        <path d="M362 141 l6 6 -6 6" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round" data-symbol="chevron.right"/>
        <text x="30" y="172" font-size="12" class="sb" fill="#C36A00">3 clips · 0:41 · 16:9</text>
        <text x="30" y="189" font-size="12" class="sec">Not exported yet</text>
        <g id="thumb-strip-1">
          <rect x="30" y="199" width="96" height="54" rx="9" fill="url(#clipA)"/>
          <rect x="34" y="238" width="30" height="12" rx="6" fill="#000" opacity="0.5"/><text x="49" y="247" font-size="9" class="sb" fill="#FFB340" text-anchor="middle">50×</text>
          <rect x="134" y="199" width="96" height="54" rx="9" fill="url(#clipA)"/>
          <rect x="138" y="238" width="30" height="12" rx="6" fill="#000" opacity="0.5"/><text x="153" y="247" font-size="9" class="sb" fill="#FFB340" text-anchor="middle">50×</text>
          <rect x="238" y="199" width="96" height="54" rx="9" fill="url(#clipA)"/>
          <rect x="242" y="238" width="30" height="12" rx="6" fill="#000" opacity="0.5"/><text x="257" y="247" font-size="9" class="sb" fill="#FFB340" text-anchor="middle">50×</text>
        </g>
      </g>

      <!-- collection card 2 -->
      <g id="card-city-set">
        <rect x="16" y="284" width="361" height="146" rx="18" fill="#FFF" filter="url(#card)"/>
        <text x="30" y="313" font-size="16" class="b" fill="#000">City set</text>
        <path d="M362 301 l6 6 -6 6" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round" data-symbol="chevron.right"/>
        <text x="30" y="332" font-size="12" class="sb" fill="#C36A00">3 clips · 0:59 · 9:16</text>
        <text x="30" y="349" font-size="12" class="sec">Exported today 14:02 · kept</text>
        <g id="thumb-strip-2">
          <rect x="30" y="359" width="96" height="54" rx="9" fill="url(#clipB)"/>
          <rect x="34" y="398" width="30" height="12" rx="6" fill="#000" opacity="0.5"/><text x="49" y="407" font-size="9" class="sb" fill="#FFB340" text-anchor="middle">50×</text>
          <rect x="134" y="359" width="96" height="54" rx="9" fill="url(#clipA)"/>
          <rect x="138" y="398" width="30" height="12" rx="6" fill="#000" opacity="0.5"/><text x="153" y="407" font-size="9" class="sb" fill="#FFB340" text-anchor="middle">50×</text>
          <rect x="238" y="359" width="96" height="54" rx="9" fill="url(#clipA)"/>
          <rect x="242" y="398" width="30" height="12" rx="6" fill="#000" opacity="0.5"/><text x="257" y="407" font-size="9" class="sb" fill="#FFB340" text-anchor="middle">50×</text>
        </g>
      </g>

      <!-- floating tab bar (Collections selected) -->
      <g id="tab-bar">
        <rect x="6.5" y="755" width="380" height="57" rx="28.5" fill="#FBFBFD" opacity="0.96" filter="url(#soft)"/>
        <rect x="6.5" y="755" width="380" height="57" rx="28.5" fill="none" stroke="#000" stroke-opacity="0.08"/>
        <g id="tab-create" fill="none" stroke="#8E8E93">
          <g transform="translate(41.5 776) scale(0.7273) translate(-11 -11)"><circle cx="11" cy="11" r="8" stroke-width="2.2" data-symbol="record.circle"/><circle cx="11" cy="11" r="3.4" fill="#8E8E93" stroke="none"/></g>
          <text x="41.5" y="800" font-size="9.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Create</text>
        </g>
        <g id="tab-gallery" fill="none" stroke="#8E8E93">
          <g transform="translate(103.5 776) scale(0.7273) translate(-11 -11)"><rect x="3" y="5.5" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(-6 10 10.5)" data-symbol="photo.on.rectangle.angled"/><rect x="6" y="8" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(4 13 13)"/></g>
          <text x="103.5" y="800" font-size="9.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Gallery</text>
        </g>
        <g id="tab-scans" fill="none" stroke="#8E8E93">
          <g transform="translate(165.5 776) scale(0.7273) translate(-11 -11)"><path d="M4 7 V4 h3 M15 4 h3 v3 M18 15 v3 h-3 M7 18 H4 v-3" stroke-width="2.34" stroke-linecap="round" data-symbol="doc.viewfinder"/><rect x="6.5" y="6.5" width="9" height="9" rx="1.6" stroke-width="2.34"/></g>
          <text x="165.5" y="800" font-size="9.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Scans</text>
        </g>
        <g id="tab-projects" fill="none" stroke="#8E8E93">
          <g transform="translate(227.5 776) scale(0.7273) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="square.stack"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="227.5" y="800" font-size="9.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Projects</text>
        </g>
        <rect x="260.5" y="761" width="58" height="45" rx="22.5" fill="#C36A00" opacity="0.12"/>
        <g id="tab-collections" fill="none" stroke="#C36A00">
          <g transform="translate(289.5 776) scale(0.7273) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="film.stack"/><path d="M7 4.5 v8 M15 4.5 v8" stroke-width="1.38" opacity="0.7"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="289.5" y="800" font-size="9.5" class="sb" fill="#C36A00" stroke="none" text-anchor="middle">Collections</text>
        </g>
        <g id="tab-settings" fill="none" stroke="#8E8E93">
          <g transform="translate(351.5 776) scale(0.7273) translate(-11 -11)"><path d="M3.5 6.5 h15 M3.5 11 h15 M3.5 15.5 h15" stroke-width="2.48" stroke-linecap="round" data-symbol="line.3.horizontal"/></g>
          <text x="351.5" y="800" font-size="9.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Settings</text>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Collections · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/CollectionsView.swift — header (+) · collection cards (name · meta · export line · thumb strip)</text>
</svg>
