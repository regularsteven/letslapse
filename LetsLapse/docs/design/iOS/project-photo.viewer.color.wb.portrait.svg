<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Interval grading viewer · Color › WB · portrait</title>
  <desc>Mirrors App/PhotoAdjustmentsPanel.swift's Color group (`whiteBalanceRow`, `autoButton`, `whiteBalanceMenu`, `tempAxis`, `tintAxis`, `ownWhite(kelvin:tint:)`) inside App/PhotoViewerView.swift's `phoneEditorBody`, with App/EditorControls/XYPad.swift and the WB gradient of `PadBackground.whiteBalance`. New 2026-09-13 for the editor controls redesign (board 2a's Color panel, spec §2 and §8). The Color group merges the old White Balance, Color and Color Mixer sections: chips WB · Vib · Sat · Mixer. LAYOUT (2a / 6a, `phoneEditorBody`): the picture fills the safe area (59 top / 34 bottom on this canvas) and is fitted into it — a 3:4 portrait shoot spans the width and centres vertically, 176…700 — and everything else floats over it. `touchChrome`: the 36 pt back disc at (16, 71) and the `EditorTabPill` top-right (right 16, top 74: 12 pt of vertical padding under the safe area, the 30 pt pill centred on the 36 pt disc) — the boards draw both at top 60, the app sits them 11 pt lower. The pill is rgba(28,28,30,.85) over material, radius 18, 12 pt semibold, the selected tab amber with black text, the rest amber on ink; Frames appears only on a shoot with more than one frame. The foot (`phoneFoot`) is bottom-anchored on the safe area: the timeline card where `hasTimeline`, then EITHER the six main buttons (`EditorGroupBar(.phone)`) OR the open group's sheet (`PhotoAdjustmentsPanel(layout: .phone)`) — one or the other, the sheet needs the buttons' room. The sheet: 22 pt top corners, rgba(28,28,30,.86) over material running under the home indicator, padded 12 top / 16 sides / 0 bottom, 10 pt between rows, shadow up; header = title 15 pt semibold white · 6 pt dot (accent when the group holds a value or a travelling field, clear otherwise so the row never reflows) · spacer · ✕ 32 pt white 10 % (reverts to the snapshot `openPanel(for:)` took) · ✓ 32 pt amber (keeps and closes). Long-press the title for Reset &lt;group&gt; / Reset all adjustments. The 1:1 toggle (`zoomControls`, 32 pt black 45 %) sits bottom-trailing of the picture pane 12 pt in, lifted above the foot by its measured height; it exists only while `hasPixelsToReveal`, so a small source shows none. The readouts print the app's own formats (`%+.2f`, `%+.0f`, unsigned 0…100, Kelvin) with an ASCII hyphen-minus where the boards typeset U+2212. THIS CANVAS: WB selected, over the keyframed sunset scenario (the diamonds on WB and Vib · Sat: the owned white and vibrance travel). Under the chips the White Bal. row (22 pt): 'White Bal.' 13.5 pt #8E8E93, a spacer, then two white 10 % pills in 12 pt semibold amber, radius 13, padded 4 / 10 — AUTO (wand.and.stars + 'Auto', spec §8: the owner renders the frame under the playhead at ≤ 256 px and `AutoWhiteBalance` grey-worlds it, and the estimate is written through `ownWhite`, exactly like a menu pick, so it keyframes identically; the menu then reads 'Auto' until any other Temp/Tint write) and the ILLUMINANT MENU (label + chevron.down): As Shot · Match This Frame · Smooth Auto WB · — · Sunny 5500 · Cloudy 6500 · Fluorescent 4000 · Tungsten 3200, every entry writing the white ITSELF into the moment under the playhead; the closed label is the owned white by name or by Kelvin ('6715 K' here), 'As Shot' or 'Smoothed' while nothing owns it. The pad: blue #3F7BD9 90 % at the foot → clear → amber #F4B23A 90 % at the head over green #4CAF50 80 % at the left → clear → magenta #D64BC6 80 % at the right, on the sheet's own ground; words Warm / Cool / Green / Magenta. The Y axis travels in mired (equal distances look equal) over the converter's 40…600 and is presented NEGATED so warm is up — the crosshair sits at the frame's OWN white (6500 K here, 79.7 % up), which is also where the knob rests while nothing owns the white, and the first move owns it, carrying the frame's tint along; the knob at 6715 K is 1.5 pt above the crosshair. X is the converter's ±150 tint, green left. Readouts: 'Temp ◆ 6715 K' in the accent (it travels), 'Tint 0'. Not drawn: Vib · Sat (Saturated / Black &amp; white, Muted / Vivid; grey → clear over a spectrum) and Mixer (the eight 28 pt band rings above the pad, filled for the selected band with a black dot, the band's own hue ±35° behind the pad, Hue + / Hue − over Darker / Lighter, and a Saturation slider under the readouts — the mixer is not a field, so it never carries a diamond). Staged by LL_EDITOR=latest LL_VIEWER=1 LL_KEYFRAMES=sunset LL_SECTIONS=color:wb (`color:vibsat`, `color:mixer[:band]` for the others).</desc>
