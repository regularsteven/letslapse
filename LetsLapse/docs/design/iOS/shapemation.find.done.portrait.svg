<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Shape-mation · Find shapes · done · portrait</title>
  <desc>Mirrors App/Shapemation/FindShapesView.swift (summaryCard) over ShapeFinder.Summary — 2026-09-11, code first, mirrored from the running app (iPhone 16 Pro simulator, LL_SHAPEMATION=find, then Find shapes; the three candidates finish in under a second). The same pushed screen as shapemation.find.portrait.svg — back "Shape-mation", large title "Find shapes" — with the plan card replaced by the summary (llCard 18, 16-pt padding, 10-pt spacing): "3 projects analysed" (17 semibold; "Nothing new to analyse" when the run had no candidates), "3 with at least one shape" (14, primary), and one 13-pt medium capsule chip per shape family in family order — every family is drawn here, unlike the home card: a family with a count sits on LL.accent at 12 % with the count in primary (circle 1 · square 2 · rectangle 5), a family with none on secondary at 12 % (#F0F0F1) with glyph and count in tertiary (oval 0). Below the chips, only when any picture could not be read: "N pictures could not be read." at 12 secondary — not in this run. The card stays until the screen is left; the home's SHAPE REGISTER refreshes through onFinished. No Find shapes button: the run is over and every project now has a register.</desc>
  <defs>
