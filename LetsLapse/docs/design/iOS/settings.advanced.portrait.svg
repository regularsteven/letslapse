<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Settings · scrolled to Advanced · portrait</title>
  <desc>Mirrors App/SettingsView.swift scrolled to the end of the list: the tail of Location, the On-device AI card (AI Models), the Storage card (free space first, then the library breakdown) (library bar + legend, Review large originals, Clear cache) and the full Advanced card — Custom frame rate, Blend learning, Performance, Diagnostics and Incomplete Captures. The last row exists only while orphaned capture logs do: CaptureSessionLogger deletes a session's log when the capture screen closes normally, so a surviving log means the app died with the camera open, and the row's trailing number is CaptureSessionLogger.orphanedLogs.count. With no orphans the row is absent and Diagnostics is the card's last row (no divider under it). Tapping opens the Incomplete Captures sheet — settings.incomplete-captures.portrait.svg. The list's trailing 96pt spacer is what leaves the last row clear of the floating tab bar, which floats over the scroll.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="scroll"><rect x="0" y="58" width="393" height="794"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}.hdr{font-size:13px;font-weight:600;fill:#6D6D72;letter-spacing:0.5px}.ttl{font-size:16px;fill:#000}.sub{font-size:11.5px;fill:#6D6D72}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#000" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>

      <!-- scrolled content (the screen has no nav bar; content scrolls under the status bar) -->
      <g clip-path="url(#scroll)">

        <!-- location card, scrolled half out of view -->
        <g id="location-card">
          <rect x="16" y="2" width="361" height="62" rx="16" fill="#FFF" filter="url(#soft)"/>
          <text x="32" y="28" class="ttl">Geotag captures</text>
          <text x="32" y="43" class="sub">Save GPS in photo EXIF · GPX track sidecar next to video</text>
          <rect x="316" y="18" width="51" height="31" rx="15.5" fill="#34C759"/>
          <circle cx="351" cy="33.5" r="13.5" fill="#FFF" filter="url(#soft)"/>
        </g>

        <!-- on-device AI -->
        <text x="20" y="92" class="hdr">ON-DEVICE AI</text>
        <g id="ai-card">
          <rect x="16" y="100" width="361" height="62" rx="16" fill="#FFF" filter="url(#soft)"/>
          <text x="32" y="126" class="ttl">AI Models</text>
          <text x="32" y="141" class="sub">Apple Vision · automatic naming and tagging is on</text>
          <path d="M363 130 l6 7 -6 7" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round" data-symbol="chevron.right"/>
        </g>

        <!-- storage -->
        <text x="20" y="190" class="hdr">STORAGE</text>
        <g id="storage-card">
          <rect x="16" y="198" width="361" height="206" rx="16" fill="#FFF" filter="url(#soft)"/>
          <text x="32" y="225" class="ttl">Free on this device</text>
          <text x="361" y="225" font-size="15" class="sb" fill="#6D6D72" text-anchor="end">32.4 GB</text>
          <line x1="32" y1="239" x2="361" y2="239" stroke="#000" stroke-opacity="0.08"/>
          <text x="32" y="265" class="ttl">LetsLapse library</text>
          <text x="361" y="265" font-size="15" class="sec" text-anchor="end">12.6 GB</text>
          <g id="storage-bar">
            <rect x="32" y="276" width="329" height="8" rx="4" fill="#E4E4E9"/>
            <rect x="32" y="276" width="214" height="8" fill="#C36A00"/>
            <rect x="246" y="276" width="100" height="8" fill="#FFB340"/>
          </g>
          <g id="legend" font-size="11" fill="#6D6D72">
            <circle cx="36" cy="298" r="3.5" fill="#C36A00"/><text x="44" y="302">Originals 8.2 GB</text>
            <circle cx="140" cy="298" r="3.5" fill="#FFB340"/><text x="148" y="302">Blended clips 3.9 GB</text>
            <circle cx="266" cy="298" r="3.5" fill="#B9B9C0"/><text x="274" y="302">Cache 542 MB</text>
          </g>
          <line x1="32" y1="314" x2="377" y2="314" stroke="#000" stroke-opacity="0.08"/>
          <text x="32" y="341" class="ttl">Review large originals</text>
          <path d="M363 329 l6 7 -6 7" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round" data-symbol="chevron.right"/>
          <line x1="32" y1="357" x2="377" y2="357" stroke="#000" stroke-opacity="0.08"/>
          <text x="32" y="384" class="ttl" fill="#C36A00">Clear cache (542 MB)</text>
        </g>

        <!-- advanced -->
        <text x="20" y="432" class="hdr">ADVANCED</text>
        <g id="advanced-card">
          <rect x="16" y="440" width="361" height="316" rx="16" fill="#FFF" filter="url(#soft)"/>

          <!-- custom frame rate -->
          <text x="32" y="466" class="ttl">Custom frame rate</text>
          <text x="32" y="481" class="sub">Adds an extra rate to capture's frame-rate options whenever</text>
          <text x="32" y="494" class="sub">the camera supports it</text>
          <text x="335" y="466" font-size="15" fill="#C6C6CB" text-anchor="end">Off</text>
          <text x="361" y="466" font-size="15" class="sec" text-anchor="end">fps</text>
          <line x1="32" y1="508" x2="377" y2="508" stroke="#000" stroke-opacity="0.08"/>

          <!-- blend learning -->
          <text x="32" y="534" class="ttl">Blend learning</text>
          <text x="32" y="549" class="sub">What Psycho intervals have taught Safe mode on this device</text>
          <path d="M363 538 l6 7 -6 7" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round" data-symbol="chevron.right"/>
          <line x1="32" y1="570" x2="377" y2="570" stroke="#000" stroke-opacity="0.08"/>

          <!-- performance -->
          <text x="32" y="596" class="ttl">Performance</text>
          <text x="32" y="611" class="sub">CPU workers, GPU batches</text>
          <path d="M363 600 l6 7 -6 7" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round" data-symbol="chevron.right"/>
          <line x1="32" y1="632" x2="377" y2="632" stroke="#000" stroke-opacity="0.08"/>

          <!-- diagnostics -->
          <text x="32" y="658" class="ttl">Diagnostics</text>
          <text x="32" y="673" class="sub">Job folders, processing logs</text>
          <path d="M363 662 l6 7 -6 7" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round" data-symbol="chevron.right"/>
          <!-- this divider exists only while the Incomplete Captures row below does -->
          <line x1="32" y1="694" x2="377" y2="694" stroke="#000" stroke-opacity="0.08"/>

          <!-- incomplete captures — present only when orphaned logs exist -->
          <g id="incomplete-captures-row">
            <text x="32" y="720" class="ttl">Incomplete Captures</text>
            <text x="32" y="735" class="sub">Logs from shoots that ended in a crash or force-quit</text>
            <text x="355" y="720" font-size="15" class="sec" text-anchor="end">2</text>
            <path d="M363 724 l6 7 -6 7" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round" data-symbol="chevron.right"/>
          </g>
        </g>
      </g>

      <!-- floating tab bar (Settings selected) — floats over the scroll -->
      <g id="tab-bar">
        <rect x="6.5" y="755" width="380" height="57" rx="28.5" fill="#FBFBFD" opacity="0.96" filter="url(#soft)"/>
        <rect x="6.5" y="755" width="380" height="57" rx="28.5" fill="none" stroke="#000" stroke-opacity="0.08"/>
        <g id="tab-create" fill="none" stroke="#8E8E93">
          <g transform="translate(41.5 776) scale(0.7273) translate(-11 -11)"><circle cx="11" cy="11" r="8" stroke-width="2.2" data-symbol="record.circle"/><circle cx="11" cy="11" r="3.4" fill="#8E8E93" stroke="none"/></g>
          <text x="41.5" y="800" font-size="9.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Create</text>
        </g>
        <g id="tab-gallery" fill="none" stroke="#8E8E93">
          <g transform="translate(103.5 776) scale(0.7273) translate(-11 -11)"><rect x="3" y="5.5" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(-6 10 10.5)" data-symbol="photo.on.rectangle.angled"/><rect x="6" y="8" width="14" height="10" rx="2" stroke-width="2.2" transform="rotate(4 13 13)"/></g>
          <text x="103.5" y="800" font-size="9.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Gallery</text>
        </g>
        <g id="tab-scans" fill="none" stroke="#8E8E93">
          <g transform="translate(165.5 776) scale(0.7273) translate(-11 -11)"><path d="M4 7 V4 h3 M15 4 h3 v3 M18 15 v3 h-3 M7 18 H4 v-3" stroke-width="2.34" stroke-linecap="round" data-symbol="doc.viewfinder"/><rect x="6.5" y="6.5" width="9" height="9" rx="1.6" stroke-width="2.34"/></g>
          <text x="165.5" y="800" font-size="9.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Scans</text>
        </g>
        <g id="tab-projects" fill="none" stroke="#8E8E93">
          <g transform="translate(227.5 776) scale(0.7273) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="square.stack"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="227.5" y="800" font-size="9.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Projects</text>
        </g>
        <g id="tab-collections" fill="none" stroke="#8E8E93">
          <g transform="translate(289.5 776) scale(0.7273) translate(-11 -11)"><rect x="4" y="3.5" width="14" height="10" rx="2" stroke-width="2.2" data-symbol="film.stack"/><path d="M7 4.5 v8 M15 4.5 v8" stroke-width="1.38" opacity="0.7"/><path d="M5.5 16 h11 M7.5 19 h7" stroke-width="2.2" stroke-linecap="round"/></g>
          <text x="289.5" y="800" font-size="9.5" class="sb" fill="#8E8E93" stroke="none" text-anchor="middle">Collections</text>
        </g>
        <rect x="322.5" y="761" width="58" height="45" rx="22.5" fill="#C36A00" opacity="0.12"/>
        <g id="tab-settings" fill="none" stroke="#C36A00">
          <g transform="translate(351.5 776) scale(0.7273) translate(-11 -11)"><path d="M3.5 6.5 h15 M3.5 11 h15 M3.5 15.5 h15" stroke-width="2.48" stroke-linecap="round" data-symbol="line.3.horizontal"/></g>
          <text x="351.5" y="800" font-size="9.5" class="sb" fill="#C36A00" stroke="none" text-anchor="middle">Settings</text>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Settings (scrolled to Advanced) · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/SettingsView.swift — aiCard · storageCard · advancedCard (incl. the Incomplete Captures row)</text>
</svg>
