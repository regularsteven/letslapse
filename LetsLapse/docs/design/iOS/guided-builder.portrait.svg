<svg viewBox="0 0 441 940" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Guided clip (experimental) · moment step · portrait</title>
  <desc>Mirrors App/GuidedBuilderView.swift (stretchStep for a recorded moment) + App/GuidedFramingBox.swift — the guided builder's richest screen, one per stretch of the seeded warp timeline. Question "What happens at Moment 1?" (names via [BlendStretch].stretchName). THREE sections, top to bottom: (1) HOW IT ARRIVES — the seam transition chips [Step "hard cut" · 0.5s ease · 1s ease · 2s ease], writing Seam.Ramp at the arriving seam; ONE control welds the speed ramp and the framing move (the materialised ReframeTrack move span follows the COMPILED ease, rounded down to the chip). Caption: "One ramp — the speed change and the framing move ride it together, in seconds of the finished clip." When the compiled ease is clamped an accent note in the BurstRamp idiom appears below ("Capped to 0.4s — only that much of the 1s ease fits between these stretches." / "...it plays as a step.") — not drawn. (2) SPEED — the fps-gated chips via GuidedPlanner.gatedSpeedChips (burst variant here: ¼× ½× 1× 4× 15× ··· custom; active chip LL.ink with amber label), then the honest compiled share caption "Moment 1 becomes ~11s of the clip." (stretchFrames ÷ outputFPS — updates live as the ease eats into the burst). (3) FRAMING — mode chips [Wide · Punch in · Punch + pan]; when a pan is chosen, Start framing / End framing chips switch which of the two framings the box edits AND which exact frame shows (start = incoming file just inside the stretch, end = outgoing near its far edge). The GuidedFramingBox below: the EXACT decoded frame (ExactFrameLoader, zero tolerance — never the ≈-keyframe still), dimmed outside the aspect-locked crop box, amber 1.5pt box with 8 white/amber handles (corner/edge resize against the opposite anchor, interior drag repositions, pinch zooms about the centre; macOS scroll-wheel zooms); bottom-left badge "2.0× · 1080 px" (punch factor + kept pixels); a soft warning capsule appears top-centre past a 2× upscale ("Keeps 823 px of 2 160 — this deep a punch renders soft") — not drawn. Below the box (off-screen here, scrolled): the gesture hint and the pan curve chips [Drift thru · Eased] with "The pan drifts from the start framing to the end framing across the whole stretch." Next advances; materialisation to the real ReframeTrack happens on every step change. Captured from the iPhone 17 Pro sim, mapped onto the 393×852 canvas; the content scrolls — this file draws the top of the step with the box partially visible, as the viewport shows it.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="scene-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A5568"/><stop offset="0.45" stop-color="#7A8699"/><stop offset="0.46" stop-color="#A8B2C0"/><stop offset="1" stop-color="#3E3A36"/>
    </linearGradient>
    <linearGradient id="scene-sky-bright" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FB8E8"/><stop offset="0.4" stop-color="#C8D8E8"/><stop offset="0.45" stop-color="#B0876A"/><stop offset="1" stop-color="#6B5D50"/>
    </linearGradient>
    <clipPath id="picture"><rect x="109" y="497" width="175" height="278"/></clipPath>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}</style>
  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <g transform="translate(24,24)">
      <rect width="393" height="852" fill="#F2F2F7"/>
      <g id="status-bar" fill="#000">
        <text x="47" y="28" font-size="15" class="sb">9:41</text>
        <rect x="138" y="10" width="117" height="34" rx="17" fill="#000"/>
        <g transform="translate(310,16)">
          <rect x="0" y="4" width="3" height="8" rx="1"/><rect x="5" y="2" width="3" height="10" rx="1"/><rect x="10" y="0" width="3" height="12" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.3"/>
          <path d="M28 4 q6 -5 12 0 M30.5 7 q3.5 -3 7 0 M33.5 10 q1 -1 2 0" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="wifi"/>
          <rect x="47" y="1" width="22" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="49" y="3" width="15" height="7" rx="1.5"/><rect x="70" y="4" width="1.5" height="5" rx="0.75" fill-opacity="0.4"/>
        </g>
      </g>
      <g id="flow-header">
        <circle cx="33" cy="77" r="17" fill="#FFFFFF" filter="url(#soft)"/>
        <path d="M37 70 l-8 7 8 7" stroke="#C36A00" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.left"/>
        <text x="196" y="82" font-size="16" class="sb" text-anchor="middle" fill="#000">Guided clip</text>
        <rect x="303" y="66" width="74" height="20" rx="10" fill="#C36A00" fill-opacity="0.12"/>
        <text x="340" y="80" font-size="9" class="b" text-anchor="middle" fill="#C36A00" letter-spacing="0.5">EXPERIMENTAL</text>
      </g>
      <g id="step-dots">
        <rect x="162" y="103" width="7" height="5" rx="2.5" fill="#C36A00"/>
        <rect x="174" y="103" width="7" height="5" rx="2.5" fill="#C36A00"/>
        <rect x="186" y="103" width="18" height="5" rx="2.5" fill="#C36A00"/>
        <rect x="209" y="103" width="7" height="5" rx="2.5" fill="#8E8E93" fill-opacity="0.25"/>
        <rect x="221" y="103" width="7" height="5" rx="2.5" fill="#8E8E93" fill-opacity="0.25"/>
      </g>
      <text id="question" x="16" y="147" font-size="22" class="b" fill="#000">What happens at Moment 1?</text>
      <!-- transition: HOW IT ARRIVES (1s ease active) -->
      <g id="transition-card">
        <text x="18" y="180" font-size="13" class="sb" fill="#6D6D72" letter-spacing="1">HOW IT ARRIVES</text>
        <g id="ramp-chips">
          <rect x="16" y="190" width="85" height="41" rx="12" fill="#FFFFFF" filter="url(#soft)"/>
          <text x="58" y="207" font-size="13" class="b" text-anchor="middle" fill="#000">Step</text>
          <text x="58" y="222" font-size="9.5" text-anchor="middle" fill="#6D6D72">hard cut</text>
          <rect x="108" y="190" width="85" height="41" rx="12" fill="#FFFFFF" filter="url(#soft)"/>
          <text x="150" y="207" font-size="13" class="b" text-anchor="middle" fill="#000">0.5s</text>
          <text x="150" y="222" font-size="9.5" text-anchor="middle" fill="#6D6D72">ease</text>
          <rect x="200" y="190" width="85" height="41" rx="12" fill="#1C1C1E"/>
          <text x="242" y="207" font-size="13" class="b" text-anchor="middle" fill="#FFB340">1s</text>
          <text x="242" y="222" font-size="9.5" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.6">ease</text>
          <rect x="292" y="190" width="85" height="41" rx="12" fill="#FFFFFF" filter="url(#soft)"/>
          <text x="334" y="207" font-size="13" class="b" text-anchor="middle" fill="#000">2s</text>
          <text x="334" y="222" font-size="9.5" text-anchor="middle" fill="#6D6D72">ease</text>
        </g>
        <text x="20" y="250" font-size="11.5" fill="#6D6D72">One ramp — the speed change and the framing move ride it</text>
        <text x="20" y="264" font-size="11.5" fill="#6D6D72">together, in seconds of the finished clip.</text>
      </g>
      <!-- speed (fps-gated burst chips, ¼× active) -->
      <g id="speed-card">
        <text x="18" y="292" font-size="13" class="sb" fill="#6D6D72" letter-spacing="1">SPEED</text>
        <g id="speed-chips">
          <rect x="16" y="302" width="55" height="41" rx="12" fill="#1C1C1E"/>
          <text x="43.5" y="319" font-size="14" class="b" text-anchor="middle" fill="#FFB340">¼×</text>
          <text x="43.5" y="334" font-size="9.5" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.6">¼× slow</text>
          <rect x="77" y="302" width="55" height="41" rx="12" fill="#FFFFFF" filter="url(#soft)"/>
          <text x="104.5" y="319" font-size="14" class="b" text-anchor="middle" fill="#000">½×</text>
          <text x="104.5" y="334" font-size="9.5" text-anchor="middle" fill="#6D6D72">½× slow</text>
          <rect x="138" y="302" width="55" height="41" rx="12" fill="#FFFFFF" filter="url(#soft)"/>
          <text x="165.5" y="319" font-size="14" class="b" text-anchor="middle" fill="#000">1×</text>
          <text x="165.5" y="334" font-size="9.5" text-anchor="middle" fill="#6D6D72">real time</text>
          <rect x="199" y="302" width="55" height="41" rx="12" fill="#FFFFFF" filter="url(#soft)"/>
          <text x="226.5" y="319" font-size="14" class="b" text-anchor="middle" fill="#000">4×</text>
          <text x="226.5" y="334" font-size="9.5" text-anchor="middle" fill="#6D6D72">gentle</text>
          <rect x="260" y="302" width="55" height="41" rx="12" fill="#FFFFFF" filter="url(#soft)"/>
          <text x="287.5" y="319" font-size="14" class="b" text-anchor="middle" fill="#000">15×</text>
          <text x="287.5" y="334" font-size="9.5" text-anchor="middle" fill="#6D6D72">subtle</text>
          <rect x="321" y="302" width="56" height="41" rx="12" fill="#FFFFFF" filter="url(#soft)"/>
          <text x="349" y="319" font-size="14" class="b" text-anchor="middle" fill="#000">···</text>
          <text x="349" y="334" font-size="9.5" text-anchor="middle" fill="#6D6D72">custom</text>
        </g>
        <text x="20" y="366" font-size="11.5" fill="#6D6D72">Moment 1 becomes ~11s of the clip.</text>
      </g>
      <!-- framing mode + pan target chips -->
      <g id="framing-card">
        <text x="18" y="394" font-size="13" class="sb" fill="#6D6D72" letter-spacing="1">FRAMING</text>
        <g id="mode-chips">
          <rect x="16" y="404" width="57" height="33" rx="16.5" fill="#8E8E93" fill-opacity="0.14"/>
          <text x="44.5" y="425" font-size="13" text-anchor="middle" fill="#000">Wide</text>
          <rect x="81" y="404" width="80" height="33" rx="16.5" fill="#8E8E93" fill-opacity="0.14"/>
          <text x="121" y="425" font-size="13" text-anchor="middle" fill="#000">Punch in</text>
          <rect x="169" y="404" width="105" height="33" rx="16.5" fill="#C36A00"/>
          <text x="221.5" y="425" font-size="13" class="b" text-anchor="middle" fill="#000">Punch + pan</text>
        </g>
        <g id="pan-target-chips">
          <rect x="16" y="443" width="112" height="33" rx="16.5" fill="#C36A00"/>
          <text x="72" y="464" font-size="13" class="b" text-anchor="middle" fill="#000">Start framing</text>
          <rect x="136" y="443" width="100" height="33" rx="16.5" fill="#8E8E93" fill-opacity="0.14"/>
          <text x="186" y="464" font-size="13" text-anchor="middle" fill="#000">End framing</text>
        </g>
      </g>
      <!-- the framing box: exact frame, dim outside crop, amber box + 8 handles -->
      <g id="framing-box">
        <g clip-path="url(#picture)">
          <!-- one continuous scene: sky, station band, rail field -->
          <rect x="109" y="497" width="175" height="278" fill="url(#scene-sky-bright)"/>
          <g fill="#D8DEE6"><ellipse cx="140" cy="530" rx="26" ry="9"/><ellipse cx="205" cy="516" rx="34" ry="11"/><ellipse cx="258" cy="540" rx="22" ry="8"/></g>
          <!-- station: clock tower + two arched halls -->
          <rect x="109" y="600" width="175" height="14" fill="#8A7864"/>
          <rect x="163" y="578" width="15" height="34" rx="1.5" fill="#B04A38"/>
          <rect x="167" y="572" width="7" height="8" fill="#B04A38"/>
          <path d="M184 612 a14 14 0 0 1 28 0 Z M214 612 a14 14 0 0 1 28 0 Z" fill="#9BA6B2"/>
          <!-- trains at the platforms -->
          <rect x="120" y="616" width="46" height="8" rx="3" fill="#4A7AB0"/>
          <rect x="122" y="617.5" width="42" height="2.5" rx="1" fill="#E8EDF2"/>
          <rect x="236" y="618" width="26" height="7" rx="3" fill="#4A7AB0"/>
          <!-- rail field fanning to the bottom edge -->
          <rect x="109" y="624" width="175" height="151" fill="#6B5D50"/>
          <g stroke="#3A332C" stroke-width="1.6" opacity="0.8">
            <path d="M118 775 L170 626"/><path d="M137 775 L177 627"/><path d="M160 775 L186 628"/><path d="M196 775 L196 628"/><path d="M232 775 L207 628"/><path d="M256 775 L216 627"/><path d="M275 775 L226 626"/>
          </g>
          <g stroke="#8A8078" stroke-width="0.8" opacity="0.6">
            <path d="M126 775 L173 626"/><path d="M148 775 L181 627"/><path d="M214 775 L201 628"/><path d="M245 775 L211 627"/>
          </g>
          <!-- outside-dim: everything but the crop -->
          <path d="M109 497 h175 v278 h-175 Z M152 565 h89 v158 h-89 Z" fill="#000" fill-opacity="0.5" fill-rule="evenodd"/>
        </g>
        <!-- amber crop box + handles -->
        <rect x="152" y="565" width="89" height="158" fill="none" stroke="#FFB340" stroke-width="1.5"/>
        <g fill="#FFFFFF" stroke="#FFB340" stroke-width="1.5">
          <circle cx="152" cy="565" r="4.5"/><circle cx="196.5" cy="565" r="4.5"/><circle cx="241" cy="565" r="4.5"/>
          <circle cx="152" cy="644" r="4.5"/><circle cx="241" cy="644" r="4.5"/>
          <circle cx="152" cy="723" r="4.5"/><circle cx="196.5" cy="723" r="4.5"/><circle cx="241" cy="723" r="4.5"/>
        </g>
        <!-- badge -->
        <rect x="117" y="750" width="92" height="17" rx="8.5" fill="#000" fill-opacity="0.55"/>
        <text x="125" y="762" font-size="10" class="b" fill="#FFB340">2.0×</text>
        <text x="150" y="762" font-size="10" class="b" fill="#FFB340" fill-opacity="0.7">· 1 080 px</text>
      </g>
      <!-- Next CTA -->
      <g id="next-button">
        <rect x="16" y="775" width="361" height="50" rx="14" fill="#C36A00"/>
        <text x="196" y="806" font-size="16" class="b" text-anchor="middle" fill="#FFFFFF">Next</text>
      </g>
      <rect x="130" y="840" width="133" height="5" rx="2.5" fill="#000"/>
    </g>
  </g>
  <text x="220" y="906" font-size="13" class="sb" text-anchor="middle" fill="#000">iOS · Guided clip (experimental) · moment step · portrait · 393×852 pt</text>
  <text x="220" y="924" font-size="11" text-anchor="middle" fill="#6D6D72">mirrors App/GuidedBuilderView.swift (stretchStep: transitionCard · speedCard · punchCard) + App/GuidedFramingBox.swift</text>
</svg>
