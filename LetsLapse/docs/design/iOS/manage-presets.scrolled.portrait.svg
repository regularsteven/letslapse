<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 441 940" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Presets · scrolled · portrait</title>
  <desc>The same sheet as manage-presets.portrait.svg scrolled past the preview frame and the built-ins, so the large title has collapsed to an inline "Presets" with Done. YOUR PRESETS in full — the four saved presets the list hook seeds — then its footer "Saved from the Edit screen: adjust a photo, then Save as Preset. Open one to rename it, see what it changes, or delete it." (there is no New here on purpose: a preset is made where the sliders are). LUTS — imported .cube colour cubes, same row anatomy; the subtitle carries the cube size, who made it (the file's TITLE when it is a real one, else its generator), the default strength and the projects on it; footer "A colour cube from Lightroom, Resolve or a LUT pack, applied after the sliders. Each project sets its own strength." Last, a one-row section: "+ Import a preset…" in LL.accent, which asks which kind (manage-presets.import.portrait.svg); footer "A .cube LUT lands here under its file's name. A Lightroom preset (.xmp) lands under Your presets." Row order inside a section is import/save order; swipe to delete on user rows; the built-ins never move.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="sheet"><rect x="0" y="56" width="393" height="796" rx="10"/></clipPath>
    <clipPath id="thumb44"><rect width="44" height="44" rx="8"/></clipPath>
    <clipPath id="thumb56"><rect width="56" height="42" rx="7"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C4F86"/><stop offset="0.55" stop-color="#6D8FBF"/><stop offset="1" stop-color="#F0B27A"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A6F94"/><stop offset="1" stop-color="#1B2A44"/></linearGradient>
    <!-- the preview frame: a dusk over the river, the sample every preset is shown on -->
    <symbol id="scene" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice">
      <rect width="160" height="120" fill="url(#sky)"/>
      <rect y="64" width="160" height="56" fill="url(#water)"/>
      <ellipse cx="118" cy="63" rx="9" ry="6" fill="#FFD27A"/>
      <rect y="62" width="160" height="4" fill="#FFB05A" opacity="0.55"/>
      <path d="M0 66 L28 56 L58 61 L92 50 L128 58 L160 52 V70 H0 Z" fill="#2B2A33"/>
      <path d="M0 70 h160 v6 H0 Z" fill="#26364F" opacity="0.6"/>
      <path d="M0 92 h160 v8 H0 Z" fill="#FFB05A" opacity="0.12"/>
    </symbol>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}</style>

  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="393" height="852" fill="#000"/>
    <g transform="translate(24,24)">

      <!-- status bar over the shrunken Create tab behind the sheet -->
      <g id="status-bar" fill="#FFF">
        <text x="80" y="43" font-size="15" class="sb" text-anchor="middle">9:41</text>
        <g id="signal"><rect x="306" y="35" width="3" height="4" rx="1"/><rect x="311" y="33" width="3" height="6" rx="1"/><rect x="316" y="31" width="3" height="8" rx="1"/><rect x="321" y="29" width="3" height="10" rx="1"/></g>
        <path id="wifi" d="M334 34 a8 8 0 0 1 12 0 M337 37 a4.5 4.5 0 0 1 6 0 M339.5 39.5 l0.5 0.5 0.5 -0.5" stroke="#FFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g id="battery"><rect x="352" y="30" width="23" height="11" rx="3.5" fill="none" stroke="#FFF" stroke-opacity="0.4"/><rect x="376" y="33.5" width="2" height="4" rx="1" fill="#FFF" fill-opacity="0.4"/><rect x="354" y="32" width="15" height="7" rx="2"/></g>
      </g>
      <!-- the parent's top edge, scaled back behind the sheet -->
      <rect x="16" y="44" width="361" height="30" rx="10" fill="#C7C7CC"/>

      <!-- the sheet -->
      <g id="presets-sheet-scrolled" clip-path="url(#sheet)">
        <rect x="0" y="56" width="393" height="796" fill="#F2F2F7"/>
        <!-- collapsed navigation bar: inline title + Done, hairline under it -->
        <g id="nav-bar">
          <rect x="0" y="56" width="393" height="44" fill="#F2F2F7"/>
          <text x="196.5" y="86" font-size="17" class="sb" fill="#000" text-anchor="middle">Presets</text>
          <text x="373" y="86" font-size="17" class="sb" fill="#C36A00" text-anchor="end">Done</text>
          <line x1="0" y1="100" x2="393" y2="100" stroke="#000" stroke-opacity="0.15"/>
        </g>
        <g id="section-your-presets">
          <text x="36" y="130" font-size="13" class="sec" letter-spacing="0.3">YOUR PRESETS</text>
          <rect x="20" y="144" width="353" height="240" rx="10" fill="#FFF"/>
          <g id="row-punchy">
            <g transform="translate(36,152)" clip-path="url(#thumb44)"><use href="#scene" width="44" height="44"/><rect width="44" height="44" fill="#000000" opacity="0.16"/><rect width="44" height="44" fill="#FF9500" opacity="0.1"/></g>
            <text x="96" y="170" font-size="16" fill="#000">Punchy</text>
            <text x="96" y="187" font-size="11.5" class="sec">Original + 11 adjustments · on 4 projects</text>
            <path d="M345 167 l6 7 -6 7" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round" data-symbol="chevron.right"/>
          </g>
          <line x1="96" y1="204" x2="373" y2="204" stroke="#000" stroke-opacity="0.1"/>
          <g id="row-sunny">
            <g transform="translate(36,212)" clip-path="url(#thumb44)"><use href="#scene" width="44" height="44"/><rect width="44" height="44" fill="#FFC260" opacity="0.24"/></g>
            <text x="96" y="230" font-size="16" fill="#000">Sunny Nature</text>
            <text x="96" y="247" font-size="11.5" class="sec">Natural + 6 adjustments · on 2 projects</text>
            <path d="M345 227 l6 7 -6 7" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round" data-symbol="chevron.right"/>
          </g>
          <line x1="96" y1="264" x2="373" y2="264" stroke="#000" stroke-opacity="0.1"/>
          <g id="row-flatday">
            <g transform="translate(36,272)" clip-path="url(#thumb44)"><use href="#scene" width="44" height="44"/><rect width="44" height="44" fill="#FFFFFF" opacity="0.1"/><rect width="44" height="44" fill="#FFB340" opacity="0.1"/></g>
            <text x="96" y="290" font-size="16" fill="#000">Flat Day</text>
            <text x="96" y="307" font-size="11.5" class="sec">Original + 13 adjustments</text>
            <path d="M345 287 l6 7 -6 7" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round" data-symbol="chevron.right"/>
          </g>
          <line x1="96" y1="324" x2="373" y2="324" stroke="#000" stroke-opacity="0.1"/>
          <g id="row-daydng">
            <g transform="translate(36,332)" clip-path="url(#thumb44)"><use href="#scene" width="44" height="44"/><rect width="44" height="44" fill="#FFB340" opacity="0.08"/></g>
            <text x="96" y="350" font-size="16" fill="#000">Day DNG</text>
            <text x="96" y="367" font-size="11.5" class="sec">Original + 12 adjustments · on 1 project</text>
            <path d="M345 347 l6 7 -6 7" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round" data-symbol="chevron.right"/>
          </g>
          <text x="36" y="402" font-size="13" class="sec">Saved from the Edit screen: adjust a photo, then</text>
          <text x="36" y="418" font-size="13" class="sec">Save as Preset. Open one to rename it, see what it</text>
          <text x="36" y="434" font-size="13" class="sec">changes, or delete it.</text>
        </g>

        <g id="section-luts">
          <text x="36" y="474" font-size="13" class="sec" letter-spacing="0.3">LUTS</text>
          <rect x="20" y="488" width="353" height="120" rx="10" fill="#FFF"/>
          <g id="row-teal">
            <g transform="translate(36,496)" clip-path="url(#thumb44)"><use href="#scene" width="44" height="44"/><rect width="44" height="44" fill="#0E7C8C" opacity="0.34"/><rect width="44" height="44" fill="#FF7A00" opacity="0.1"/></g>
            <text x="96" y="514" font-size="16" fill="#000">Teal and Orange</text>
            <text x="96" y="531" font-size="11.5" class="sec">33³ · Resolve · 100 % · on 2 projects</text>
            <path d="M345 511 l6 7 -6 7" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round" data-symbol="chevron.right"/>
          </g>
          <line x1="96" y1="548" x2="373" y2="548" stroke="#000" stroke-opacity="0.1"/>
          <g id="row-terra">
            <g transform="translate(36,556)" clip-path="url(#thumb44)"><use href="#scene" width="44" height="44"/><rect width="44" height="44" fill="#1D6B6B" opacity="0.3"/></g>
            <text x="96" y="574" font-size="16" fill="#000">Terra 4.1</text>
            <text x="96" y="591" font-size="11.5" class="sec">33³ · Resolve · 80 %</text>
            <path d="M345 571 l6 7 -6 7" stroke="#C6C6CB" stroke-width="2.2" fill="none" stroke-linecap="round" data-symbol="chevron.right"/>
          </g>
          <text x="36" y="626" font-size="13" class="sec">A colour cube from Lightroom, Resolve or a LUT</text>
          <text x="36" y="642" font-size="13" class="sec">pack, applied after the sliders. Each project sets</text>
          <text x="36" y="658" font-size="13" class="sec">its own strength.</text>
        </g>

        <g id="section-import">
          <rect x="20" y="692" width="353" height="44" rx="10" fill="#FFF"/>
          <g id="row-import-preset">
            <path d="M49 707 v14 M42 714 h14" stroke="#C36A00" stroke-width="2" stroke-linecap="round" data-symbol="plus"/>
            <text x="80" y="720" font-size="17" fill="#C36A00">Import a preset…</text>
          </g>
          <text x="36" y="754" font-size="13" class="sec">A .cube LUT lands here under its file's name. A</text>
          <text x="36" y="770" font-size="13" class="sec">Lightroom preset (.xmp) lands under Your presets.</text>
        </g>
      </g>

      <!-- hardware -->
      <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
      <rect x="129.5" y="839" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Presets · scrolled · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors ManagePresetsView  — YOUR PRESETS · LUTS · Import a preset… · LL_PRESETS=list, scrolled</text>
</svg>
