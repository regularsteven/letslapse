  <desc>Mirrors App/Shapemation/ShapemationFiltersView.swift — the builder's first step, Apply filters, REDRAWN 2026-09-21 for round two (code first, Steven's notes): the tags are the tag editor's chips (components/tag-suggestions: 33 pt, rx 16.5, 8 pt gaps, black 7 % with a 14-pt label at 75 % and the count in 13-pt secondary) wrapped by ShapemationFlowLayout and sorted by volume, the biggest first; the applied ones sit under APPLIED in accent with their count and an xmark, beside Clear tags (13 semibold accent); then the ASPECT card (iOS segmented All · Landscape · Portrait · Square, 329×32, and the line '1 landscape · 83 portrait · 0 square — a mixed-orientation set pays cover-fit crop on every photo of the minority.'), the POSITION card ('where the shape's centre lies' wrapped to two lines at this width) — its column buttons and 3×3 cells are in the scrolled twin shapemation.builder.filters.position.portrait.svg with the count line and the contact sheet. Mirrored 2026-09-21 from the iPhone 16 Pro simulator over the tram clone in the container (-storage.activeLibrary &lt;id&gt;, LL_SHAPEMATION=build LL_CHIPS=tram), the copy and widths checked against the Mac Debug build's accessibility dump of the same screen. Re-anchored from the 402×874 capture to this 393×852 canvas as its siblings are (top y − 3, trailing x − 9, the bar − 22). Photos are flat stand-ins.</desc>
