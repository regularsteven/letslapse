<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Collection detail (timeline builder) · landscape</title>
  <desc>Mirrors App/CollectionDetailView.swift (wideLayout): past 560pt of width the builder splits — preview left, controls right. The left column (min(46% of width, 420pt)) vertically centres the crop surface at up to (column−20)×(height−120); a tall canvas (9:16 · 3:4) gets the room it needs, which is the point of rotating. The preview wears its own controls exactly as portrait does (2026-08-31 rework): clip badge top-left, canvas menu chip bottom-right ON the media (bare-ratio menu, widest→tallest, first clip's shape marked), the honest-pixels HUD at its top while a crop drag is live — the caption that used to sit under the preview is GONE. The right column stacks: the compact meta line "0:59 · exports 2160×3840" alone on the top row (it is the wide layout's summary card), then the scroll region opening with the header row — TIMELINE · 2 CLIPS left, the Ken Burns tri-state (Off | Auto | Custom) right, same control as portrait — then the rows card (same 66pt clipRow as portrait, CROP badges and all). No Ken Burns card follows the timeline any more: Auto deals silently, Custom opens the options drawer as a POPOVER anchored to the control here (iPad/Mac; see collection-detail.kenburns-options.portrait.svg). With Ken Burns on, the framing bar sits under the preview and the identity frames (white start / amber end, ties + haloed arrow) draw exactly as collection-detail.kenburns.portrait.svg; macOS additionally puts 7pt corner grips on the active frame and resizes it by scroll wheel over the preview. The bottom row is dashed "+ Add clips" + "Export collection" (44pt, side by side). Same layout serves iPad and macOS (the 760×680 default window is wide enough). Known gap, tracked in docs/TODO.md: on iPad the floating tab bar pill overlays the bottom row's Add button. Status text and nav are the system's; the floating tab bar continues to overlay (drawn omitted here for clarity of the split — geometry as portrait). Drawn with the 9:16 crop state selected, at rest (no drag, so no HUD).</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="852" height="393" rx="54"/></clipPath>
    <clipPath id="preview"><rect x="140" y="94" width="142" height="253" rx="12"/></clipPath>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.05"/></filter>
    <linearGradient id="clipA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33415A"/><stop offset="1" stop-color="#1B2330"/></linearGradient>
    <linearGradient id="clipB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A5A43"/><stop offset="1" stop-color="#232E1D"/></linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}</style>

  <rect x="18" y="18" width="864" height="405" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="852" height="393" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- inline nav -->
      <g id="nav">
        <circle cx="52" cy="36" r="15" fill="#FFF" filter="url(#card)"/>
        <path d="M55 29 l-7 7 7 7" stroke="#1C1C1E" stroke-width="2.4" fill="none" stroke-linecap="round" data-symbol="chevron.left"/>
        <text x="426" y="41" font-size="15" class="sb" fill="#000" text-anchor="middle">City set</text>
        <circle cx="800" cy="36" r="15" fill="#FFF" filter="url(#card)"/>
        <g stroke="#C36A00" fill="#C36A00" data-symbol="ellipsis.circle"><circle cx="800" cy="36" r="9" fill="none" stroke-width="1.6"/><circle cx="795.5" cy="36" r="1.3" stroke="none"/><circle cx="800" cy="36" r="1.3" stroke="none"/><circle cx="804.5" cy="36" r="1.3" stroke="none"/></g>
      </g>

      <!-- left column: crop surface (16:9 clip, 9:16 frame) vertically centred, wearing the canvas chip -->
      <g id="left-preview">
        <rect x="70" y="94" width="282" height="253" rx="12" fill="#000"/>
        <!-- clip drawn aspect-fit: 282×159 16:9 centred; crop frame 89×159 -->
        <g id="crop">
          <rect x="70" y="141" width="282" height="159" fill="url(#clipA)"/>
          <rect x="70" y="141" width="97" height="159" fill="#000" opacity="0.6"/>
          <rect x="256" y="141" width="96" height="159" fill="#000" opacity="0.6"/>
          <rect x="167" y="141" width="89" height="159" fill="none" stroke="#FFF" stroke-width="2"/>
          <path d="M196.7 141 v159 M226.3 141 v159 M167 194 h89 M167 247 h89" stroke="#FFF" stroke-opacity="0.35"/>
        </g>
        <rect x="80" y="104" width="112" height="18" rx="9" fill="#000" opacity="0.5"/>
        <text x="136" y="117" font-size="10" class="sb" fill="#FFF" text-anchor="middle">Tram Tester · 50×</text>
        <g id="canvas-menu">
          <rect x="282" y="315" width="60" height="22" rx="11" fill="#000" opacity="0.55"/>
          <text x="304" y="330" font-size="11.5" class="sb" fill="#FFF" text-anchor="middle">9:16</text>
          <path d="M322 326.5 l3.5 3.5 3.5 -3.5" stroke="#FFF" stroke-width="1.7" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
        </g>
      </g>

      <!-- right column -->
      <g id="right-column">
        <!-- meta line: the wide layout's summary card -->
        <text x="372" y="80" font-size="11.5" class="sec">0:59 · exports 2160×3840</text>

        <!-- header row: TIMELINE left, Ken Burns tri-state right -->
        <g id="timeline-header">
          <text x="372" y="112" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">TIMELINE · 2 CLIPS</text>
          <text x="685" y="111" font-size="10.5" class="sb" fill="#6D6D72" text-anchor="end">Ken Burns</text>
          <rect x="691" y="94" width="137" height="28" rx="14" fill="#FFF" filter="url(#card)"/>
          <rect x="693" y="96" width="33" height="24" rx="12" fill="#C36A00"/>
          <text x="709.5" y="112" font-size="11" class="sb" fill="#FFF" text-anchor="middle">Off</text>
          <text x="748" y="112" font-size="11" class="sb" fill="#C36A00" text-anchor="middle">Auto</text>
          <text x="798" y="112" font-size="11" class="sb" fill="#C36A00" text-anchor="middle">Custom</text>
        </g>

        <!-- rows card -->
        <g id="timeline">
          <rect x="372" y="132" width="456" height="132" rx="16" fill="#FFF" filter="url(#card)"/>

          <!-- row 1 (selected · crop) -->
          <g id="row-1">
            <rect x="372" y="132" width="456" height="66" rx="12" fill="#C36A00" opacity="0.07"/>
            <rect x="384" y="144" width="58" height="42" rx="7" fill="url(#clipA)"/>
            <path d="M409 159 l9 6 -9 6 z" fill="#FFF" opacity="0.8" data-symbol="play.fill"/>
            <text x="452" y="160" font-size="14.5" class="sb" fill="#000">Tram Tester</text>
            <text x="452" y="179" font-size="11.5" class="sec">50× · 15s</text>
            <rect x="524" y="168" width="66" height="14" rx="7" fill="#C36A00" opacity="0.06"/>
            <rect x="524" y="168" width="66" height="14" rx="7" fill="none" stroke="#C36A00" stroke-opacity="0.55" stroke-width="1.2"/>
            <text x="557" y="178" font-size="9.5" class="b" fill="#C36A00" text-anchor="middle">CROP 9:16</text>
            <circle cx="770" cy="165" r="17" fill="#C36A00" opacity="0.1"/>
            <g stroke="#C36A00" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="timeline.selection"><path d="M764 158 h-2 v14 h2 M776 158 h2 v14 h-2"/><path d="M767 165 h6"/></g>
            <path d="M800 159 h16 M800 165 h16 M800 171 h16" stroke="#B9B9BE" stroke-width="1.8" stroke-linecap="round" data-symbol="line.3.horizontal"/>
          </g>
          <line x1="452" y1="198" x2="828" y2="198" stroke="#000" stroke-opacity="0.06"/>

          <!-- row 2 (local override) -->
          <g id="row-2">
            <rect x="384" y="210" width="58" height="42" rx="7" fill="url(#clipB)"/>
            <path d="M409 225 l9 6 -9 6 z" fill="#FFF" opacity="0.8"/>
            <text x="452" y="226" font-size="14.5" class="sb" fill="#000">Ridge sunset</text>
            <text x="452" y="245" font-size="11.5" class="sec">100× · 15s</text>
            <rect x="536" y="234" width="118" height="14" rx="7" fill="#C36A00" opacity="0.06"/>
            <rect x="536" y="234" width="118" height="14" rx="7" fill="none" stroke="#C36A00" stroke-opacity="0.55" stroke-width="1.2"/>
            <text x="595" y="244" font-size="9.5" class="b" fill="#C36A00" text-anchor="middle">CROP 9:16 · CUSTOM</text>
            <circle cx="770" cy="231" r="17" fill="#C36A00" opacity="0.1"/>
            <g stroke="#C36A00" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M764 224 h-2 v14 h2 M776 224 h2 v14 h-2"/><path d="M767 231 h6"/></g>
            <path d="M800 225 h16 M800 231 h16 M800 237 h16" stroke="#B9B9BE" stroke-width="1.8" stroke-linecap="round"/>
          </g>
        </g>

        <!-- bottom row: Add clips + Export collection -->
        <g id="bottom-row">
          <rect x="372" y="339" width="200" height="44" rx="12" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="5 4"/>
          <path d="M430 366 v-10 M425 361 h10" stroke="#C36A00" stroke-width="2.2" stroke-linecap="round" data-symbol="plus"/>
          <text x="444" y="366" font-size="14" class="sb" fill="#C36A00">Add clips</text>
          <rect x="584" y="339" width="244" height="44" rx="12" fill="#C36A00"/>
          <text x="706" y="366" font-size="14" class="b" fill="#FFF" text-anchor="middle">Export collection</text>
        </g>
      </g>
    </g>
  </g>

  <text x="450" y="446" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Collection detail (timeline builder) · landscape · 852×393 pt (serves iPad and macOS)</text>
  <text x="450" y="464" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/CollectionDetailView.swift wideLayout — chip on the preview · meta line alone · TIMELINE + Ken Burns tri-state header · no Ken Burns card</text>
</svg>
