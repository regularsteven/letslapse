<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Collection detail (timeline builder) · landscape</title>
  <desc>Mirrors App/CollectionDetailView.swift (wideLayout): past 560pt of width the builder splits — preview left, controls right. The left column (min(46% of width, 420pt)) vertically centres the crop surface at up to (column−20)×(height−120) with the caption beneath; a tall canvas (9:16 · 3:4) gets the room it needs, which is the point of rotating. The right column stacks (2026-08-30 rework): ONE top row of the compact meta line "0:59 · exports 2160×3840" (left) and the canvas menu chip (right, h34 capsule, accent ratio + chevron.down — same menu as portrait: every ratio with its export size, checkmark on current, the first clip's shape marked; hidden while the collection is empty), the TIMELINE header, then the scroll region: the rows card (same 66pt clipRow as portrait) followed by the Ken Burns card AFTER the timeline — set once, not the loop; drawn peeking at the scroll edge here, its full card in collection-detail.kenburns.portrait.svg — and a bottom row of dashed "+ Add clips" + "Export collection" (44pt, side by side). Same layout serves iPad and macOS (the 760×680 default window is wide enough); verified on the iPad Pro 11-inch simulator 2026-08-30. Known gap, tracked in docs/TODO.md: on iPad the floating tab bar pill overlays the bottom row's Add button. Status text and nav are the system's; the floating tab bar continues to overlay (drawn omitted here for clarity of the split — geometry as portrait). Drawn with the 9:16 crop state selected.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="852" height="393" rx="54"/></clipPath>
    <clipPath id="preview"><rect x="140" y="94" width="142" height="253" rx="12"/></clipPath>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.05"/></filter>
    <linearGradient id="clipA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33415A"/><stop offset="1" stop-color="#1B2330"/></linearGradient>
    <linearGradient id="clipB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A5A43"/><stop offset="1" stop-color="#232E1D"/></linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.sec{fill:#6D6D72}</style>

  <rect x="18" y="18" width="864" height="405" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="852" height="393" fill="#F2F2F7"/>
    <g transform="translate(24,24)">

      <!-- inline nav -->
      <g id="nav">
        <circle cx="52" cy="36" r="15" fill="#FFF" filter="url(#card)"/>
        <path d="M55 29 l-7 7 7 7" stroke="#1C1C1E" stroke-width="2.4" fill="none" stroke-linecap="round" data-symbol="chevron.left"/>
        <text x="426" y="41" font-size="15" class="sb" fill="#000" text-anchor="middle">City set</text>
        <circle cx="800" cy="36" r="15" fill="#FFF" filter="url(#card)"/>
        <g stroke="#C36A00" fill="#C36A00" data-symbol="ellipsis.circle"><circle cx="800" cy="36" r="9" fill="none" stroke-width="1.6"/><circle cx="795.5" cy="36" r="1.3" stroke="none"/><circle cx="800" cy="36" r="1.3" stroke="none"/><circle cx="804.5" cy="36" r="1.3" stroke="none"/></g>
      </g>

      <!-- left column: crop surface (16:9 clip, 9:16 frame) vertically centred -->
      <g id="left-preview">
        <rect x="70" y="94" width="282" height="253" rx="12" fill="#000"/>
        <!-- clip drawn aspect-fit: 282×159 16:9 centred; crop frame 89×159 -->
        <g id="crop">
          <rect x="70" y="141" width="282" height="159" fill="url(#clipA)"/>
          <rect x="70" y="141" width="97" height="159" fill="#000" opacity="0.6"/>
          <rect x="256" y="141" width="96" height="159" fill="#000" opacity="0.6"/>
          <rect x="167" y="141" width="89" height="159" fill="none" stroke="#FFF" stroke-width="2"/>
          <path d="M196.7 141 v159 M226.3 141 v159 M167 194 h89 M167 247 h89" stroke="#FFF" stroke-opacity="0.35"/>
        </g>
        <rect x="80" y="104" width="112" height="18" rx="9" fill="#000" opacity="0.5"/>
        <text x="136" y="117" font-size="10" class="sb" fill="#FFF" text-anchor="middle">Tram Tester · 50×</text>
        <text x="211" y="368" font-size="11" class="sec" text-anchor="middle">Drag the white frame — it keeps 608×1080 of 1920×1080 for the 9:16 export.</text>
      </g>

      <!-- right column -->
      <g id="right-controls" transform="translate(392,0)">
        <!-- meta line (left) + canvas menu chip (right) — one row doing what the chips row and its caption did -->
        <g id="meta-row">
          <text x="2" y="83" font-size="11.5" class="sec">0:59 · exports 2160×3840</text>
          <g id="canvas-menu">
            <rect x="370" y="62" width="66" height="34" rx="17" fill="#FFF" filter="url(#card)"/>
            <text x="397" y="84" font-size="13.5" class="sb" fill="#C36A00" text-anchor="middle">9:16</text>
            <path d="M413 76.5 l4.5 4.5 4.5 -4.5" stroke="#C36A00" stroke-width="2" fill="none" stroke-linecap="round" data-symbol="chevron.down"/>
          </g>
        </g>

        <text x="0" y="120" font-size="12" class="sb" fill="#6D6D72" letter-spacing="0.5">TIMELINE · 3 CLIPS</text>

        <!-- rows card (scrollable) -->
        <g id="rows">
          <rect x="0" y="130" width="436" height="150" rx="14" fill="#FFF" filter="url(#card)"/>
          <g id="row-1">
            <rect x="0" y="130" width="436" height="66" rx="12" fill="#C36A00" opacity="0.07"/>
            <rect x="12" y="142" width="58" height="42" rx="7" fill="url(#clipB)"/>
            <path d="M37 157 l9 6 -9 6 z" fill="#FFF" opacity="0.8"/>
            <text x="80" y="158" font-size="14.5" class="sb" fill="#000">Capture 27. 7. at 11:14</text>
            <text x="80" y="177" font-size="11.5" class="sec">50× · 28s</text>
            <rect x="144" y="166" width="66" height="14" rx="7" fill="#C36A00" opacity="0.06"/>
            <rect x="144" y="166" width="66" height="14" rx="7" fill="none" stroke="#C36A00" stroke-opacity="0.55" stroke-width="1.2"/>
            <text x="177" y="176" font-size="9.5" class="b" fill="#C36A00" text-anchor="middle">CROP 9:16</text>
            <circle cx="384" cy="163" r="17" fill="#C36A00" opacity="0.1"/>
            <g stroke="#C36A00" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M378 156 h-2 v14 h2 M390 156 h2 v14 h-2"/><path d="M381 163 h6"/></g>
            <path d="M412 157 h16 M412 163 h16 M412 169 h16" stroke="#B9B9BE" stroke-width="1.8" stroke-linecap="round"/>
          </g>
          <line x1="80" y1="196" x2="436" y2="196" stroke="#000" stroke-opacity="0.06"/>
          <g id="row-2">
            <rect x="12" y="208" width="58" height="42" rx="7" fill="url(#clipA)"/>
            <path d="M37 223 l9 6 -9 6 z" fill="#FFF" opacity="0.8"/>
            <text x="80" y="224" font-size="14.5" class="sb" fill="#000">Tram Tester</text>
            <text x="80" y="243" font-size="11.5" class="sec">50× · 1…</text>
            <rect x="124" y="232" width="58" height="14" rx="7" fill="#FFB340" opacity="0.28"/>
            <text x="153" y="242" font-size="9.5" class="b" fill="#8A4A00" text-anchor="middle">TRIMMED</text>
            <rect x="188" y="232" width="66" height="14" rx="7" fill="none" stroke="#C36A00" stroke-opacity="0.55" stroke-width="1.2"/>
            <text x="221" y="242" font-size="9.5" class="b" fill="#C36A00" text-anchor="middle">CROP 9:16</text>
            <circle cx="384" cy="229" r="17" fill="#C36A00" opacity="0.1"/>
            <g stroke="#C36A00" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M378 222 h-2 v14 h2 M390 222 h2 v14 h-2"/><path d="M381 229 h6"/></g>
            <path d="M412 223 h16 M412 229 h16 M412 235 h16" stroke="#B9B9BE" stroke-width="1.8" stroke-linecap="round"/>
          </g>
          <!-- third row clipped by the scroll (indicated) -->
          <line x1="80" y1="262" x2="436" y2="262" stroke="#000" stroke-opacity="0.06"/>
          <rect x="12" y="268" width="58" height="12" rx="6" fill="url(#clipA)" opacity="0.5"/>
        </g>

        <!-- Ken Burns follows the timeline in the scroll — card top peeking at the scroll edge -->
        <g id="ken-burns-peek" opacity="0.85">
          <rect x="0" y="292" width="436" height="29" rx="14" fill="#FFF" filter="url(#card)"/>
          <text x="14" y="312" font-size="14.5" class="sb" fill="#000">Ken Burns</text>
        </g>

        <!-- bottom buttons -->
        <g id="bottom-buttons">
          <rect x="0" y="325" width="214" height="44" rx="12" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="5 4"/>
          <text x="107" y="352" font-size="14" class="sb" fill="#C36A00" text-anchor="middle">+ Add clips</text>
          <rect x="222" y="325" width="214" height="44" rx="12" fill="#C36A00"/>
          <text x="329" y="352" font-size="14" class="b" fill="#FFF" text-anchor="middle">Export collection</text>
        </g>
      </g>

      <!-- hardware: island left in landscape -->
      <rect x="11" y="134.5" width="36" height="124" rx="18" fill="#000"/>
      <rect x="359" y="380" width="134" height="5" rx="2.5" fill="#000" opacity="0.35"/>
    </g>
  </g>

  <text x="450" y="446" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Collection detail (timeline builder) · landscape · 852×393 pt</text>
  <text x="450" y="464" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors App/CollectionDetailView.swift (wideLayout, &gt;560pt) — preview left · meta + canvas menu · rows · Ken Burns after · also iPad/macOS</text>
</svg>
