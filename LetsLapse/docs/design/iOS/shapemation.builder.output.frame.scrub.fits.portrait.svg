  </g>

  <text x="220.5" y="906" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iOS · Shape-mation · builder · Output frame · scrub · fits · portrait · 393×852 pt</text>
  <text x="220.5" y="924" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors ShapemationOutputView (scrubCard) scrolled to the end — Photo 83 of 83 fits · 82 photos won't fill · Create Shape-mation</text>
</svg>
