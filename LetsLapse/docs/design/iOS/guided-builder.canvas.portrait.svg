<svg viewBox="0 0 441 940" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Guided clip (experimental) · canvas &amp; opening step · portrait</title>
  <desc>Mirrors App/GuidedBuilderView.swift (canvasStep + openingControls, columnLayout) — step 1 of 4 of the experimental guided builder, reached from the "Guided clip (experimental)" button on a video project's detail page (ProjectDetailView, sets AppModel.guidedBuilderFocused after openCapture) or LL_GUIDED=latest (LL_CANVAS pins the shape, LL_STEP a later step). The flow replaces AdjustView for this pass through stage == .configure; same warp + reframe data underneath, so everything round-trips into the full editor. Canvas and Opening are ONE step (2026-08-12 UX sign-off): the five-step survey became four, and every default is render-ready, so Next through to the end always yields a legal clip. Chrome shared by every step: FlowHeader "Guided clip" with back chevron (back pops one step; on this first step it exits via model.reset()) and an EXPERIMENTAL capsule (9pt bold, kerning 0.5, LL.accent on accent-12%) — the title is absolutely centred (FlowHeader centersTitle) so the capsule can't displace it; step dots under the header — one capsule per step, filled accent up to the current step, current one wider (18×5 vs 7×5) — with a labelled progress line under them ("Step 1 of 4 · Canvas &amp; opening"); primary Next button pinned at the bottom (LLPrimaryButtonStyle, .defaultAction). Content: 22pt bold question "What shape should the clip be?", the shared CanvasRatioChips row (16:9 · 9:16 · 1:1 · 4:3 · 3:4, selected solid accent — here 1:1, a real crop of the 2160×3840 portrait reference capture), then the consequence line in 11.5pt ink semibold, its numbers straight from VideoCanvasCropper.cropSize (even-rounded for the encoder: 16:9 reads 2160×1214, not 1215). Under it the frame pane is the OUTPUT ITSELF — GuidedCanvasFrame draws the exact decoded first frame cropped to the chosen shape (ExactFrameLoader, zero tolerance; never a scrub thumbnail), badge "Frame 1 — exact · 2160×2160", and dragging inside it slides the crop along the source's free axis into AppModel.blendCanvasOffset (0…1, persisted on the blend, honoured by VideoCanvasCropper and by the guided wide framing's centre). The drag caption only appears when the shape leaves a free axis; an as-shot 9:16 canvas shows the frame with no caption and no drag. OPENING then holds the shipped speed chips (gated by GuidedPlanner.gatedSpeedChips — a base-footage stretch offers 1×/4×/15×/50×/60×/100×/custom), the compiled share line, and the framing mode chips with their "usually wide" hint. iOS is always top-bottom; ≥700×500pt gets the steps rail instead (macOS/guided-builder.canvas.svg). Not drawn: the other ratio selections, the punched state (the framing box appears under FRAMING, see guided-builder.portrait.svg), the source strip (mac/iPad only). Same-day follow-up: the OUTPUT RATE row (white menu chip "25 fps" + caption) sits above OPENING — asked on step one because every duration is output seconds at this rate and it gates how deep slow motion can go; it stays on the Review card too. The FRAMING section now sits below the fold and scrolls. Back on step one returns to the PROJECT the flow was opened from (finishFlow(openProject:true)), not the Create home. Captured from the iPhone 17 Pro sim (402×874 pt) and mapped onto the 393×852 template canvas.</desc>
  <defs>
    <clipPath id="screen"><rect x="24" y="24" width="393" height="852" rx="54"/></clipPath>
    <clipPath id="canvasFrame"><rect x="101" y="253" width="190" height="190" rx="8"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FB6DA"/><stop offset="1" stop-color="#CBD8E2"/>
    </linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}</style>
  <rect x="18" y="18" width="405" height="864" rx="60" fill="none" stroke="#3A3A3F" stroke-width="3"/>
  <g clip-path="url(#screen)">
    <g transform="translate(24,24)">
      <rect width="393" height="852" fill="#F2F2F7"/>
      <!-- status bar -->
      <g id="status-bar" fill="#000">
        <text x="47" y="28" font-size="15" class="sb">9:41</text>
        <rect x="138" y="10" width="117" height="34" rx="17" fill="#000"/>
        <g transform="translate(310,16)">
          <rect x="0" y="4" width="3" height="8" rx="1"/><rect x="5" y="2" width="3" height="10" rx="1"/><rect x="10" y="0" width="3" height="12" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.3"/>
          <path d="M28 4 q6 -5 12 0 M30.5 7 q3.5 -3 7 0 M33.5 10 q1 -1 2 0" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round" data-symbol="wifi"/>
          <rect x="47" y="1" width="22" height="11" rx="3.5" fill="none" stroke="#000" stroke-opacity="0.4"/><rect x="49" y="3" width="15" height="7" rx="1.5"/><rect x="70" y="4" width="1.5" height="5" rx="0.75" fill-opacity="0.4"/>
        </g>
      </g>
      <!-- flow header — title absolutely centred (centersTitle) -->
      <g id="flow-header">
        <circle cx="33" cy="77" r="17" fill="#FFFFFF" filter="url(#soft)"/>
        <path d="M37 70 l-8 7 8 7" stroke="#C36A00" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.left"/>
        <text x="196" y="82" font-size="16" class="sb" text-anchor="middle" fill="#000">Guided clip</text>
        <rect x="303" y="66" width="74" height="20" rx="10" fill="#C36A00" fill-opacity="0.12"/>
        <text x="340" y="80" font-size="9" class="b" text-anchor="middle" fill="#C36A00" letter-spacing="0.5">EXPERIMENTAL</text>
      </g>
      <!-- step dots: canvas &amp; opening (current) + 2 stretches + review = 4 -->
      <g id="step-dots">
        <rect x="174" y="103" width="18" height="5" rx="2.5" fill="#C36A00"/>
        <rect x="197" y="103" width="7" height="5" rx="2.5" fill="#8E8E93" fill-opacity="0.25"/>
        <rect x="209" y="103" width="7" height="5" rx="2.5" fill="#8E8E93" fill-opacity="0.25"/>
        <rect x="221" y="103" width="7" height="5" rx="2.5" fill="#8E8E93" fill-opacity="0.25"/>
      </g>
      <!-- labelled progress -->
      <text id="progress-label" x="196" y="126" font-size="11" class="sb" text-anchor="middle" fill="#6D6D72">Step 1 of 4 · Canvas &amp; opening</text>
      <!-- question -->
      <text id="question" x="16" y="164" font-size="22" class="b" fill="#000">What shape should the clip be?</text>
      <!-- canvas ratio chips (shared CanvasRatioChips; 1:1 selected) -->
      <g id="canvas-chips">
        <rect x="16" y="183" width="54" height="33" rx="16.5" fill="#FFFFFF" filter="url(#soft)"/>
        <text x="43" y="204" font-size="14" class="sb" text-anchor="middle" fill="#000">16:9</text>
        <rect x="78" y="183" width="54" height="33" rx="16.5" fill="#FFFFFF" filter="url(#soft)"/>
        <text x="105" y="204" font-size="14" class="sb" text-anchor="middle" fill="#000">9:16</text>
        <rect x="140" y="183" width="44" height="33" rx="16.5" fill="#C36A00"/>
        <text x="162" y="204" font-size="14" class="b" text-anchor="middle" fill="#FFFFFF">1:1</text>
        <rect x="192" y="183" width="48" height="33" rx="16.5" fill="#FFFFFF" filter="url(#soft)"/>
        <text x="216" y="204" font-size="14" class="sb" text-anchor="middle" fill="#000">4:3</text>
        <rect x="248" y="183" width="48" height="33" rx="16.5" fill="#FFFFFF" filter="url(#soft)"/>
        <text x="272" y="204" font-size="14" class="sb" text-anchor="middle" fill="#000">3:4</text>
      </g>
      <!-- consequence line, from VideoCanvasCropper.cropSize -->
      <text id="consequence" x="20" y="239" font-size="11.5" class="sb" fill="#1C1C1E">1:1 — crops to 2160×2160</text>
      <!-- the output itself: exact frame 1 at the chosen shape, drag repositions the crop -->
      <g id="canvas-frame">
        <g clip-path="url(#canvasFrame)">
          <rect x="101" y="253" width="190" height="190" fill="#000"/>
          <!-- stand-in for the decoded frame: sky over a rail yard -->
          <rect x="101" y="253" width="190" height="86" fill="url(#sky)"/>
          <rect x="101" y="339" width="190" height="104" fill="#9A8C79"/>
          <path d="M101 330 h190 M101 318 h190" stroke="#B8C6D2" stroke-width="1" opacity="0.5"/>
          <path d="M150 443 L186 339 M196 443 L200 339 M244 443 L214 339" stroke="#6E6357" stroke-width="2" fill="none"/>
          <path d="M120 443 L170 339 M270 443 L230 339" stroke="#6E6357" stroke-width="1.4" fill="none"/>
          <rect x="168" y="316" width="26" height="23" fill="#B4674B"/>
          <rect x="196" y="322" width="60" height="17" fill="#8C8F95"/>
        </g>
        <rect x="101" y="253" width="190" height="190" rx="8" fill="none" stroke="#000" stroke-opacity="0.08"/>
        <rect x="109" y="411" width="174" height="24" rx="12" fill="#000" fill-opacity="0.55"/>
        <text x="196" y="427" font-size="10" class="b" text-anchor="middle" fill="#FFFFFF">Frame 1 — exact · 2160×2160</text>
      </g>
      <text id="drag-caption" x="196" y="461" font-size="11" text-anchor="middle" fill="#6D6D72">Drag the frame to reposition the crop.</text>
      <!-- OUTPUT RATE: asked on step one — every duration is output seconds
           at this rate, and it gates how deep slow motion can go -->
      <g id="output-rate">
        <text x="20" y="486" font-size="12" class="sb" fill="#6D6D72" letter-spacing="1">OUTPUT RATE</text>
        <rect x="16" y="496" width="76" height="30" rx="8" fill="#FFFFFF" filter="url(#soft)"/>
        <text x="28" y="516" font-size="13" class="sb" fill="#C36A00">25 fps</text>
        <path d="M76 504 l3 -3 3 3 M76 510 l3 3 3 -3" stroke="#C36A00" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.up.chevron.down"/>
        <text x="102" y="506" font-size="10.5" fill="#6D6D72">Every duration below counts in seconds at this</text>
        <text x="102" y="519" font-size="10.5" fill="#6D6D72">rate — and it sets how deep slow motion can go.</text>
      </g>
      <g id="below-output-rate" transform="translate(0,52)">
      <!-- OPENING: the merged-in opening stretch -->
      <text x="20" y="488" font-size="12" class="sb" fill="#6D6D72" letter-spacing="1">OPENING</text>
      <g id="opening-chips">
        <rect x="16" y="498" width="46" height="41" rx="12" fill="#FFFFFF" filter="url(#soft)"/>
        <text x="39" y="518" font-size="14" class="b" text-anchor="middle" fill="#000">1×</text>
        <text x="39" y="530" font-size="9.5" text-anchor="middle" fill="#6D6D72">real time</text>
        <rect x="68" y="498" width="46" height="41" rx="12" fill="#FFFFFF" filter="url(#soft)"/>
        <text x="91" y="518" font-size="14" class="b" text-anchor="middle" fill="#000">4×</text>
        <text x="91" y="530" font-size="9.5" text-anchor="middle" fill="#6D6D72">gentle</text>
        <rect x="120" y="498" width="46" height="41" rx="12" fill="#FFFFFF" filter="url(#soft)"/>
        <text x="143" y="518" font-size="14" class="b" text-anchor="middle" fill="#000">15×</text>
        <text x="143" y="530" font-size="9.5" text-anchor="middle" fill="#6D6D72">subtle</text>
        <rect x="172" y="498" width="46" height="41" rx="12" fill="#FFFFFF" filter="url(#soft)"/>
        <text x="195" y="518" font-size="14" class="b" text-anchor="middle" fill="#000">50×</text>
        <text x="195" y="530" font-size="9.5" text-anchor="middle" fill="#6D6D72">smooth</text>
        <rect x="224" y="498" width="46" height="41" rx="12" fill="#FFFFFF" filter="url(#soft)"/>
        <text x="247" y="518" font-size="14" class="b" text-anchor="middle" fill="#000">60×</text>
        <text x="247" y="530" font-size="9.5" text-anchor="middle" fill="#6D6D72">flowing</text>
        <rect x="276" y="498" width="46" height="41" rx="12" fill="#1C1C1E"/>
        <text x="299" y="518" font-size="14" class="b" text-anchor="middle" fill="#FFB340">100×</text>
        <text x="299" y="530" font-size="9.5" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.6">streaks</text>
        <rect x="328" y="498" width="46" height="41" rx="12" fill="#FFFFFF" filter="url(#soft)"/>
        <text x="351" y="518" font-size="14" class="b" text-anchor="middle" fill="#000">···</text>
        <text x="351" y="530" font-size="9.5" text-anchor="middle" fill="#6D6D72">custom</text>
      </g>
      <text x="20" y="557" font-size="11.5" fill="#6D6D72">Stretch 1 becomes ~2.1s of the clip.</text>
      <!-- FRAMING: the opening's own framing, usually left wide -->
      <text x="20" y="582" font-size="12" class="sb" fill="#6D6D72" letter-spacing="1">FRAMING</text>
      <g id="framing-chips">
        <rect x="16" y="592" width="76" height="33" rx="16.5" fill="#C36A00"/>
        <text x="54" y="613" font-size="13" class="b" text-anchor="middle" fill="#FFFFFF">Wide</text>
        <rect x="100" y="592" width="94" height="33" rx="16.5" fill="#FFFFFF" filter="url(#soft)"/>
        <text x="147" y="613" font-size="13" text-anchor="middle" fill="#000">Punch in</text>
        <rect x="202" y="592" width="118" height="33" rx="16.5" fill="#FFFFFF" filter="url(#soft)"/>
        <text x="261" y="613" font-size="13" text-anchor="middle" fill="#000">Punch + pan</text>
      </g>
      <text x="20" y="645" font-size="11.5" fill="#6D6D72">Usually this stays wide — the punch belongs to the moment.</text>
      </g>
      <!-- Next CTA -->
      <g id="next-button">
        <rect x="16" y="775" width="361" height="50" rx="14" fill="#C36A00"/>
        <text x="196" y="806" font-size="16" class="b" text-anchor="middle" fill="#FFFFFF">Next</text>
      </g>
      <rect x="130" y="840" width="133" height="5" rx="2.5" fill="#000"/>
    </g>
  </g>
  <text x="220" y="906" font-size="13" class="sb" text-anchor="middle" fill="#000">iOS · Guided clip (experimental) · canvas &amp; opening step · portrait · 393×852 pt</text>
  <text x="220" y="924" font-size="11" text-anchor="middle" fill="#6D6D72">mirrors App/GuidedBuilderView.swift — canvasStep + openingControls, GuidedCanvasFrame, labelled progress, Next CTA</text>
</svg>
