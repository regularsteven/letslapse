<svg viewBox="0 0 393 852" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>iOS · Interval grading viewer · Text tab · portrait</title>
  <desc>Mirrors App/PhotoViewerView.swift (stackedBody, overlayLanes, overlayRunAccessory, isTypingCopy) hosting App/Overlay/OverlayEditingPanel.swift and App/Overlay/OverlayLanesView.swift — the Text tab of the iPhone editor, built 2026-09-03 from the Claude Design handoff &quot;Photo viewer text transitions&quot; (Text Workflow iOS). The dark full-screen cover, amber accent with #1C1C1E labels on amber, cards #1C1C1E, control fill #2C2C2E (tertiary grouped), secondary white 55%, tertiary white 45%, hairlines white 8%. STAGED by LL_EDITOR + LL_RAIL=text + LL_TEXT=story on a shoot with no text: the design's four-layer Prague story (see macOS/photo-viewer.text.svg for the layers), playhead at 13%, row 1 selected and mid-bounce. Top to bottom inside the safe area (59 / 34): 1 IMAGE PANE 393×295 (4:3), the floating back chevron (36pt disc black 40%) at (16, 12); layers composite live and drag as on the Mac; the selected layer's outline and badge are amber. 2 The STRIP (timelineStrip compact: false — 30pt #1C1C1E discs with amber glyphs, padding 12/16/0), the end labels (13pt row, 10pt white 55%), then the LANES: 62pt tall for four layers, 15pt per lane, 12pt bands with 22×24 trim hit areas (finger-sized), a 36pt gutter for the names (9pt white 45%), amber bands (42% when not selected; the selected one rings #1C1C1E 1.5 inside amber 1), the darker reveal heads, the ⤷ discs (#1C1C1E, amber glyph) on linked bands, the dotted amber connector for a non-zero offset, and the 1pt white-60% playhead line. Same gestures as the Mac: drag a body to move a layer in time (breaks its link, its children follow), the left edge trims the reveal start, the right edge the exit end. 3 MediaResizeHandle: the 28pt row with the 36×5 grabber (white 35%). Dragging it up shrinks the media as before — the lanes stay with the strip, on the picture's side of the grabber. 4 RailTabBar (6/16/2 padding). 5 The scroll view, 16pt sides: &quot;Text Layers · 4 layers&quot;, then the cards — 44pt rows (grip · eye · title, ⤷ capsule when linked, wand, onion, chevron), drawn here as the list opens (every card shut; a chevron opens one with TEXT showing). The expanded card is the Mac card at touch sizes: segments 34pt (radius 17), chips 32pt (radius 16, 12.5pt), B/I/U 34pt squares (radius 8), Set buttons 48pt, swatches 22pt, the ID field and font field 34pt, Remove 44pt, Add Text 50pt; the font and parent pickers are popovers (presentationCompactAdaptation). THE COPY FIELD AND THE KEYBOARD: focusing the field switches the stack to its TYPING LAYOUT — the media collapses to its floor, the lanes and the grabber step aside, the card being edited scrolls to the top of what is left — and the run toolbar appears as the KEYBOARD ACCESSORY BAR pinned above the keyboard: B (30pt, amber when on) · U · six 20pt swatches · Done, on #2C2C2E with a white-8% hairline. It acts on the word under the caret (or a selection) and, with none, on the whole layer — &quot;Tap a word in the field to style just that word.&quot; It is drawn by the editor over the whole cover (not a .toolbar(placement: .keyboard), which never appeared inside this cover); the cover's safe area already rises with the keyboard, so nothing measures the keyboard. Done resigns the field, drops the bar and restores the layout. Footnote ends &quot;Tap a word in the field to style just that word.&quot; iPad (≥500pt) uses the Mac layout with railWidth = min(340, 0.42·width) and these touch sizes. Verified in the iPhone 16 Pro simulator 2026-09-03 (the stacked lanes, the expanded card, the typing layout and the accessory bar); not yet on a device.</desc>
