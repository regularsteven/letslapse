<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 302 62" width="302" height="62" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>Component · Blended clip row · true-light · narrow</title>
  <desc>Mirrors App/ProjectDetailView.swift versionRow — see blended-clip-row.default.wide.svg for the full mirror note. Narrow is the macOS Gallery preview panel's 302pt content column. 2026-11-06 (docs/approved-assets.md): every row ends in the approve seal — ApproveToggle (App/ApprovedAssetViews.swift), a 28 pt hit area in the row's HStack(spacing: 12) between the text column and the trailing button: checkmark.seal 17 pt medium in secondary 70 % until the output is approved, checkmark.seal.fill in LL.accent after (the approved and edited.approved states); a press toggles. Here it is centred 72.5 pt in from the row's right edge, 12 pt before Open. The text column ends 12 pt before it (119.5 pt from x 84), so the same real strings clip sooner.</desc>
<!-- LetsLapse design component · blended clip row · true-light · narrow (302pt). Same contract as default.narrow — see components/README.md. -->
  <defs><clipPath id="text-col"><rect x="84" y="14" width="119.5" height="38"/></clipPath></defs>
  
<!-- 2026-09-13 (later): narrow is 302 pt now — the Gallery pane went 300 → 330 with the item view, so its
     content column is 302; there is no 272 pt column left anywhere (the iPad pane takes the same code). -->
  <style>text{font-family:inherit}.sb{font-weight:600}</style>
  <g id="blended-clip-row" data-state="true-light" data-width="narrow">
    <rect x="14" y="10" width="58" height="42" rx="7" fill="#3B4653"/>
    <path d="M37 24 l12 7 -12 7 z" fill="#FFF" opacity="0.8" data-symbol="play.fill"/>
    <g clip-path="url(#text-col)">
      <text x="84" y="28" font-size="14.5" class="sb" fill="#000">Blended clip 1 · 50× · 2.4 s</text>
      <text x="84" y="45" font-size="11.5" fill="#6D6D72">30 fps · true-light · 2 days ago</text>
    </g>
    <!-- ApproveToggle (rest): 28 × 28 centred on (229.5, 31), the glyph 19 pt across -->
    <g data-view="ApproveToggle" data-state="rest"><g transform="translate(218.64,20.14) scale(0.9048)" data-symbol="checkmark.seal" fill="none" stroke="#6D6D72" stroke-opacity="0.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.00 2.25 L12.63 2.40 L13.21 2.80 L13.72 3.37 L14.15 3.96 L14.56 4.45 L15.00 4.75 L15.53 4.85 L16.16 4.79 L16.89 4.68 L17.65 4.64 L18.34 4.77 L18.89 5.11 L19.23 5.66 L19.36 6.35 L19.32 7.11 L19.21 7.84 L19.15 8.47 L19.25 9.00 L19.55 9.44 L20.04 9.85 L20.63 10.28 L21.20 10.79 L21.60 11.37 L21.75 12.00 L21.60 12.63 L21.20 13.21 L20.63 13.72 L20.04 14.15 L19.55 14.56 L19.25 15.00 L19.15 15.53 L19.21 16.16 L19.32 16.89 L19.36 17.65 L19.23 18.34 L18.89 18.89 L18.34 19.23 L17.65 19.36 L16.89 19.32 L16.16 19.21 L15.53 19.15 L15.00 19.25 L14.56 19.55 L14.15 20.04 L13.72 20.63 L13.21 21.20 L12.63 21.60 L12.00 21.75 L11.37 21.60 L10.79 21.20 L10.28 20.63 L9.85 20.04 L9.44 19.55 L9.00 19.25 L8.47 19.15 L7.84 19.21 L7.11 19.32 L6.35 19.36 L5.66 19.23 L5.11 18.89 L4.77 18.34 L4.64 17.65 L4.68 16.89 L4.79 16.16 L4.85 15.53 L4.75 15.00 L4.45 14.56 L3.96 14.15 L3.37 13.72 L2.80 13.21 L2.40 12.63 L2.25 12.00 L2.40 11.37 L2.80 10.79 L3.37 10.28 L3.96 9.85 L4.45 9.44 L4.75 9.00 L4.85 8.47 L4.79 7.84 L4.68 7.11 L4.64 6.35 L4.77 5.66 L5.11 5.11 L5.66 4.77 L6.35 4.64 L7.11 4.68 L7.84 4.79 L8.47 4.85 L9.00 4.75 L9.44 4.45 L9.85 3.96 L10.28 3.37 L10.79 2.80 L11.37 2.40Z" stroke-width="1.7"/><path d="M8.3 12.4L10.9 15L15.8 9.7" stroke-width="1.8"/></g></g>
