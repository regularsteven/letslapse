<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 302 62" width="302" height="62" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>Component · Blended clip row · on-picplace · narrow</title>
  <desc>Mirrors App/BlendedClipRow.swift — see blended-clip-row.on-picplace.wide.svg for the full mirror note (2026-09-26, plan §11 + §15 + §16): a clip not on this device that PicPlace holds — the blend's still, components/holdings-pill.blend.there.safe.svg at 0.8 bottom-right 2 pt in, "On PicPlace · " before the subtitle (BlendWhereLine), and BlendDownloadButton's Download where Open was. Narrow is the macOS (and iPad) Gallery panel's 302pt column: the same copy, clipped 8 pt before Download's left edge the way the default narrow row clips before Open.</desc>
<!-- LetsLapse design component · blended clip row · on-picplace · narrow (302pt). Same contract as default.narrow — Download text-anchored at
     x = width − 14 = 288, 60.5pt wide, so the column is clipped at 219.5 (135.5 wide). The pill: holdings-pill.blend.there.safe (W 44.3) at
     34.56, 35.6, 35.44 × 14.4; the pill is INLINED (nested references are not followed), so it travels with the row. See components/README.md. -->
  <defs><clipPath id="text-col"><rect x="84" y="14" width="135.5" height="38"/></clipPath></defs>
  <style>text{font-family:inherit}.sb{font-weight:600}</style>
  <g id="blended-clip-row" data-state="on-picplace" data-width="narrow">
    <!-- the blend's still (posters/<blend id>.jpg), not the clip -->
    <rect x="14" y="10" width="58" height="42" rx="7" fill="#463522"/>
    <g data-component="holdings-pill.blend.there.safe.svg" transform="translate(34.56,35.6) scale(0.8)"><rect x="0" y="0" width="44.3" height="18" rx="9" fill="#000" fill-opacity="0.5"/><g transform="translate(2.95,1.55) scale(0.6420)" data-symbol="square.3.layers.3d.top.filled"><path d="M12 3.2L20.8 8L12 12.8L3.2 8Z" fill="#FFFFFF" fill-opacity="0.45"/><g fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M3.2 11.6L12 16.4L20.8 11.6"/><path d="M3.2 15.2L12 20L20.8 15.2"/></g></g><rect x="20.30" y="4" width="0.5" height="10" fill="#FFFFFF" fill-opacity="0.35"/><g transform="translate(23.91,1.03) scale(0.6872)" data-symbol="checkmark.icloud.fill"><mask id="br-on-picplace-narrow-knock-cloud" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#FFFFFF"/><path d="M8.4 14L11 16.5L15.8 11.7" fill="none" stroke="#000000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></mask><path d="M6.5 19.5H17.8A4.6 4.6 0 0 0 18.6 10.4A6.8 6.8 0 0 0 5.8 9.3A5.2 5.2 0 0 0 6.5 19.5Z" fill="#FFFFFF" fill-opacity="0.9" mask="url(#br-on-picplace-narrow-knock-cloud)"/></g></g>
    <g clip-path="url(#text-col)">
      <text x="84" y="28" font-size="14.5" class="sb" fill="#000">Blended clip 1 · 18 frames · 6.1 s</text>
      <text x="84" y="45" font-size="11.5" fill="#6D6D72">On PicPlace · 24 fps · yesterday</text>
    </g>
    <text x="288" y="35" font-size="12.5" class="sb" fill="#C36A00" text-anchor="end">Download</text>
  </g>
</svg>
