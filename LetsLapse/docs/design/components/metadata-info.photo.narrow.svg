<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 250" width="272" height="250" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>Component · Metadata info · photo · narrow</title>
  <desc>Mirrors MetadataInfoSection in App/MetadataPanelSections.swift — the read-only group under the Gallery preview panel's action buttons: what the camera and the file said (the imported layer only), never editable here. Rows appear only when the resolved record has them; a project whose frames disagree shows nothing of the whole and the copy 'Varies by frame — choose This frame.'; before the reader has landed, 'Reading the files…'; a file with nothing, 'Nothing in the file.'. Demo content is the _WEX3518 Lightroom export set the panel was verified with (photo) and an iPhone interval JPEG shoot (interval). The GPS row carries an Open in Maps link (SF Symbol map, LL.accent).</desc>
<!-- LetsLapse design component · metadata info. Header LLSectionHeader (13pt semibold secondary, kerning 0.5,
     4pt in) with 4pt under it; rows are a 72pt label column (12pt semibold secondary) + 10pt gap + the value
     (12pt primary, wrapping), 5pt padding above and below — 25pt per single-line row, 14.5pt per extra line.
     narrow = 272pt (macOS Gallery panel), phone = 365pt (the iPhone preview sheet). See components/README.md. -->
  <style>text{font-family:inherit}.sb{font-weight:600}.m{font-weight:500}</style>
  <g id="metadata-info" data-state="photo" data-width="narrow">
    <text x="4" y="12.5" font-size="13" class="sb" fill="#6D6D72" letter-spacing="0.5">INFO</text>
    <g data-row="camera">
      <text x="0" y="36.5" font-size="12" class="sb" fill="#6D6D72">Camera</text>
      <text x="82" y="36.5" font-size="12" fill="#000">SONY ILCE-7M4</text>
    </g>
    <g data-row="lens">
      <text x="0" y="61.0" font-size="12" class="sb" fill="#6D6D72">Lens</text>
      <text x="82" y="61.0" font-size="12" fill="#000">Viltrox 28mm F4.5 FE</text>
    </g>
    <g data-row="exposure">
      <text x="0" y="85.5" font-size="12" class="sb" fill="#6D6D72">Exposure</text>
      <text x="82" y="85.5" font-size="12" fill="#000">3.2 s · f/4.5 · ISO 100 · 28 mm</text>
      <text x="82" y="100.0" font-size="12" fill="#000">(42 mm eq.)</text>
    </g>
    <g data-row="captured">
      <text x="0" y="124.5" font-size="12" class="sb" fill="#6D6D72">Captured</text>
      <text x="82" y="124.5" font-size="12" fill="#000">31 Aug 2026, 20:29:30</text>
      <text x="82" y="139.0" font-size="12" fill="#000">(UTC+01:00)</text>
    </g>
    <g data-row="gps">
      <text x="0" y="163.5" font-size="12" class="sb" fill="#6D6D72">GPS</text>
      <text x="82" y="163.5" font-size="12" fill="#000">50.0897° N 14.4116° E · 2</text>
      <text x="82" y="178.0" font-size="12" fill="#000">m</text>
      <g data-symbol="map" transform="translate(232.6,160.5)" fill="none" stroke="#C36A00" stroke-width="1.3" stroke-linejoin="round">
        <path d="M0.5 2.5 l3.5-1.5 4 1.5 3.5-1.5 v9 l-3.5 1.5 -4-1.5 -3.5 1.5 z M4 1 v9 M8 2.5 v9"/>
      </g>
    </g>
    <g data-row="size">
      <text x="0" y="202.5" font-size="12" class="sb" fill="#6D6D72">Size</text>
      <text x="82" y="202.5" font-size="12" fill="#000">4608 × 3072 · ARW</text>
    </g>
    <g data-row="software">
      <text x="0" y="227.0" font-size="12" class="sb" fill="#6D6D72">Software</text>
      <text x="82" y="227.0" font-size="12" fill="#000">Adobe Photoshop Lightroom</text>
      <text x="82" y="241.5" font-size="12" fill="#000">15.5.1 Classic (Macintosh)</text>
    </g>
  </g>
</svg>
