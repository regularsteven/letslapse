<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -60 160 120" width="160" height="120" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>Component · Shutter cluster · shoot running on the Mac · landscape</title>
  <desc>The Mac's running cluster: INFO in slot 2 only — the screen dimmer is iOS-only (ShootScreenDimmer floors UIScreen brightness), so slot 1 stays empty there. Landscape set only: the Mac's capture window is the landscape tree.</desc>
<!-- LetsLapse design component · shutter cluster · landscape.
     Coordinate contract: origin (0,0) is the CENTRE of the shutter ring; viewBox -80 -60 160 120, 1 unit = 1 pt.
     Place from a screen mirror with
       <image href="../components/shutter-cluster.<state>.landscape.svg" x="cx-80" y="cy-60" width="160" height="120"/>
     where (cx,cy) is the ring centre on that screen. Slots (landscape offsets, ≈4.6 pt clear of the ring):
     1 grid (-56,-36) · 2 delay (+56,-36) · 3 lock (-56,+36) · 4 steady (+56,+36).
     The two orientations differ ONLY in these offsets. See components/README.md for the whole contract. -->
  <style>text{font-family:inherit}.b{font-weight:700}</style>
  <g id="shutter-cluster" data-state="running.mac" data-orientation="landscape">
    <g id="shutter" data-symbol="stop button"><circle r="38" fill="none" stroke="#FFF" stroke-width="4"/><rect x="-16" y="-16" width="32" height="32" rx="8" fill="#FF3B30"/></g><g id="info-toggle" data-symbol="info.circle" transform="translate(56,-36)"><circle cx="0" cy="0" r="22" fill="#2B2B2E" opacity="0.9"/><circle r="9.5" fill="none" stroke="#FFF" stroke-width="1.6"/><circle cy="-4" r="1.3" fill="#FFF"/><path d="M0 -0.5 v6" stroke="#FFF" stroke-width="2.2" stroke-linecap="round"/></g>
  </g>
</svg>
