<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -60 160 120" width="160" height="120" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>Component · Shutter cluster · shoot running, Info on · landscape</title>
  <desc>The running cluster with INFO on: the info.circle glyph goes amber and the diagnostics panel (frames · out · blend/health) shows above the readout. Dim still engaged.</desc>
<!-- LetsLapse design component · shutter cluster · landscape.
     Coordinate contract: origin (0,0) is the CENTRE of the shutter ring; viewBox -80 -60 160 120, 1 unit = 1 pt.
     Place from a screen mirror with
       <image href="../components/shutter-cluster.<state>.landscape.svg" x="cx-80" y="cy-60" width="160" height="120"/>
     where (cx,cy) is the ring centre on that screen. Slots (landscape offsets, ≈4.6 pt clear of the ring):
     1 grid (-56,-36) · 2 delay (+56,-36) · 3 lock (-56,+36) · 4 steady (+56,+36).
     The two orientations differ ONLY in these offsets. See components/README.md for the whole contract. -->
  <style>text{font-family:inherit}.b{font-weight:700}</style>
  <g id="shutter-cluster" data-state="running.info" data-orientation="landscape">
    <g id="shutter" data-symbol="stop button"><circle r="38" fill="none" stroke="#FFF" stroke-width="4"/><rect x="-16" y="-16" width="32" height="32" rx="8" fill="#FF3B30"/></g><g id="dim-toggle" data-symbol="moon.fill" transform="translate(-56,-36)"><circle cx="0" cy="0" r="22" fill="#2B2B2E" opacity="0.9"/><path d="M2.5 -9 A9 9 0 1 0 2.5 9 A12 12 0 0 1 2.5 -9 Z" fill="#FFB340"/></g><g id="info-toggle" data-symbol="info.circle.fill" transform="translate(56,-36)"><circle cx="0" cy="0" r="22" fill="#2B2B2E" opacity="0.9"/><circle r="9.5" fill="none" stroke="#FFB340" stroke-width="1.6"/><circle cy="-4" r="1.3" fill="#FFB340"/><path d="M0 -0.5 v6" stroke="#FFB340" stroke-width="2.2" stroke-linecap="round"/></g>
  </g>
</svg>
