      <polygon data-symbol="star" points="64.5,324.5 62.6,329.4 57.4,329.7 61.5,333.0 60.1,338.1 64.5,335.2 68.9,338.1 67.5,333.0 71.6,329.7 66.4,329.4" fill="none" stroke="#000" stroke-width="1" stroke-opacity="0.45" stroke-linejoin="round"/>
