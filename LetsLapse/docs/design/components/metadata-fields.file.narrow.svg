      <polygon data-symbol="star.fill" points="64.5,266.0 62.6,270.9 57.4,271.2 61.5,274.5 60.1,279.6 64.5,276.7 68.9,279.6 67.5,274.5 71.6,271.2 66.4,270.9" fill="#FFB340" stroke="#FFB340" stroke-width="1" stroke-linejoin="round"/>
      <polygon data-symbol="star.fill" points="83.5,266.0 81.6,270.9 76.4,271.2 80.5,274.5 79.1,279.6 83.5,276.7 87.9,279.6 86.5,274.5 90.6,271.2 85.4,270.9" fill="#FFB340" stroke="#FFB340" stroke-width="1" stroke-linejoin="round"/>
