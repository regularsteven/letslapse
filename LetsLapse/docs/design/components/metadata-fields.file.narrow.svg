      <polygon data-symbol="star.fill" points="7.5,266.0 5.6,270.9 0.4,271.2 4.5,274.5 3.1,279.6 7.5,276.7 11.9,279.6 10.5,274.5 14.6,271.2 9.4,270.9" fill="#FFB340" stroke="#FFB340" stroke-width="1" stroke-linejoin="round"/>
