<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 74" width="272" height="74" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>Component · Blend list filter · all · narrow</title>
  <desc>Mirrors blend-list-filter.all.wide.svg — see there for the full mirror note. Narrow is the macOS Gallery preview panel's 272pt content column: the four chips don't fit one row at this width, so they wrap to two — Blends/Slices, then Image/Video — which conveniently makes the facet grouping the wide set signals with an extra 16pt gap fully explicit here instead, for free.</desc>
<!-- LetsLapse design component · blend list filter · all · narrow (272pt, the macOS gallery preview-panel column).
     Two 33pt rows, 8pt apart (row 2 at y=41), each an ordinary 8pt-gap chip pair — no extra mid-row gap needed,
     the row break already separates Blends/Slices from Image/Video. See components/README.md. -->
  <defs><filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.14"/></filter></defs>
  <style>text{font-family:inherit}.sb{font-weight:600}</style>
  <g id="blend-list-filter" data-state="all" data-width="narrow">
    <g data-chip="blends" data-ticked="true">
      <rect x="0" y="0" width="84" height="33" rx="16.5" fill="#C36A00"/>
      <path d="M14 20 l2.5 2.8 l5 -5.5" stroke="#FFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="27" y="21" font-size="13.5" class="sb" fill="#FFF">Blends</text>
    </g>
    <g data-chip="slices" data-ticked="true" transform="translate(92,0)">
      <rect x="0" y="0" width="78" height="33" rx="16.5" fill="#C36A00"/>
      <path d="M14 20 l2.5 2.8 l5 -5.5" stroke="#FFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="27" y="21" font-size="13.5" class="sb" fill="#FFF">Slices</text>
    </g>
    <g data-chip="image" data-ticked="true" transform="translate(0,41)">
      <rect x="0" y="0" width="76" height="33" rx="16.5" fill="#C36A00"/>
      <path d="M14 20 l2.5 2.8 l5 -5.5" stroke="#FFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="27" y="21" font-size="13.5" class="sb" fill="#FFF">Image</text>
    </g>
    <g data-chip="video" data-ticked="true" transform="translate(84,41)">
      <rect x="0" y="0" width="76" height="33" rx="16.5" fill="#C36A00"/>
      <path d="M14 20 l2.5 2.8 l5 -5.5" stroke="#FFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="27" y="21" font-size="13.5" class="sb" fill="#FFF">Video</text>
    </g>
  </g>
</svg>
