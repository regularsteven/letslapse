<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 -50 180 100" width="180" height="100" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>Component · Shutter cluster · AE/AF locked · portrait</title>
  <desc>Idle cluster with the exposure lock held (camera.isExposureLocked): slot 3 is a black padlock on an amber disc; the other three toggles off. Used by capture-exposure-locked.</desc>
<!-- LetsLapse design component · shutter cluster · portrait.
     Coordinate contract: origin (0,0) is the CENTRE of the shutter ring; viewBox -90 -50 180 100, 1 unit = 1 pt.
     Place from a screen mirror with
       <image href="../components/shutter-cluster.<state>.portrait.svg" x="cx-90" y="cy-50" width="180" height="100"/>
     where (cx,cy) is the ring centre on that screen. Slots (portrait offsets, ≈9 pt clear of the ring):
     1 grid (-66,-26) · 2 delay (+66,-26) · 3 lock (-66,+26) · 4 steady (+66,+26).
     The two orientations differ ONLY in these offsets. See components/README.md for the whole contract. -->
  <style>text{font-family:inherit}.b{font-weight:700}</style>
  <g id="shutter-cluster" data-state="locked" data-orientation="portrait">
    <g id="shutter" data-symbol="record button"><circle r="38" fill="none" stroke="#FFF" stroke-width="4"/><circle r="30" fill="#FF3B30"/></g><g id="grid-toggle" data-symbol="grid.circle" transform="translate(-66,-26)"><circle cx="0" cy="0" r="22" fill="#2B2B2E" opacity="0.9"/><circle r="10" fill="none" stroke="#FFF" stroke-width="1.6"/><path d="M-6.5 -3.3 h13 M-6.5 3.3 h13 M-3.3 -6.5 v13 M3.3 -6.5 v13" stroke="#FFF" stroke-width="1.2"/></g><g id="delay-toggle" data-symbol="timer" transform="translate(66,-26)"><circle cx="0" cy="0" r="22" fill="#2B2B2E" opacity="0.9"/><circle cy="1" r="9" fill="none" stroke="#FFF" stroke-width="1.7"/><path d="M0 1 v-6 M-3 -9 h6" stroke="#FFF" stroke-width="1.7" stroke-linecap="round"/></g><g id="exposure-lock" data-symbol="lock.fill" transform="translate(-66,26)"><circle cx="0" cy="0" r="22" fill="#FFB340"/><rect x="-7" y="-1" width="14" height="11" rx="2.5" fill="#000"/><path d="M-4 -1 v-4 a4 4 0 0 1 8 0 v4" fill="none" stroke="#000" stroke-width="1.8"/></g><g id="steady-toggle" data-symbol="hand.raised" transform="translate(66,26)"><circle cx="0" cy="0" r="22" fill="#2B2B2E" opacity="0.9"/><path d="M-5 5 v-9 m3 9 v-11 m3 11 v-11 m3 11 v-9 m-9 9 a6 6 0 0 0 9 0 v-3" fill="none" stroke="#FFF" stroke-width="1.6" stroke-linecap="round"/></g>
  </g>
</svg>
