<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 -50 180 100" width="180" height="100" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>Component · Shutter cluster · shoot running, Info on · portrait</title>
  <desc>The running cluster with INFO on: the info.circle glyph goes amber and the diagnostics panel (frames · out · blend/health) shows above the readout. Dim still engaged.</desc>
<!-- LetsLapse design component · shutter cluster · portrait.
     Coordinate contract: origin (0,0) is the CENTRE of the shutter ring; viewBox -90 -50 180 100, 1 unit = 1 pt.
     Place from a screen mirror with
       <image href="../components/shutter-cluster.<state>.portrait.svg" x="cx-90" y="cy-50" width="180" height="100"/>
     where (cx,cy) is the ring centre on that screen. Slots (portrait offsets, ≈9 pt clear of the ring):
     1 grid (-66,-26) · 2 delay (+66,-26) · 3 lock (-66,+26) · 4 steady (+66,+26).
     The two orientations differ ONLY in these offsets. See components/README.md for the whole contract. -->
  <style>text{font-family:inherit}.b{font-weight:700}</style>
  <g id="shutter-cluster" data-state="running.info" data-orientation="portrait">
    <g id="shutter" data-symbol="stop button"><circle r="38" fill="none" stroke="#FFF" stroke-width="4"/><rect x="-16" y="-16" width="32" height="32" rx="8" fill="#FF3B30"/></g><g id="dim-toggle" data-symbol="moon.fill" transform="translate(-66,-26)"><circle cx="0" cy="0" r="22" fill="#2B2B2E" opacity="0.9"/><path d="M2.5 -9 A9 9 0 1 0 2.5 9 A12 12 0 0 1 2.5 -9 Z" fill="#FFB340"/></g><g id="info-toggle" data-symbol="info.circle.fill" transform="translate(66,-26)"><circle cx="0" cy="0" r="22" fill="#2B2B2E" opacity="0.9"/><circle r="9.5" fill="none" stroke="#FFB340" stroke-width="1.6"/><circle cy="-4" r="1.3" fill="#FFB340"/><path d="M0 -0.5 v6" stroke="#FFB340" stroke-width="2.2" stroke-linecap="round"/></g>
  </g>
</svg>
