<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1310 92" width="1310" height="92" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>Component · Gallery filmstrip · interval</title>
  <desc>Mirrors GalleryFilmstrip in App/GalleryItemView.swift (macOS, 2026-09-13) — the grid folded into one row under the Gallery's item view: every project the sidebar, the search and the sort leave in the grid, in the grid's order, as 80×60 ProjectThumbnailView tiles (4:3, cornerRadius 6) 8 pt apart in a LazyHStack padded 16 at the sides and 12 above and below, inside a horizontal ScrollView with no indicators; the focused project carries the grid's own 2.5 pt LL.accent ring and is kept centred (ScrollViewReader, anchor .center, 0.25 s easeInOut on a change); a click on any other tile asks the host to move there (GalleryView.move(to:)), ← → step through the same order, and the header trailing reads "n of N". Full window width, on LL.cardBackground — under the inspector and the rail alike, the Lightroom / Photos convention, and the one place a strip can go without either editor knowing about it. Drawn here as measured on the Debug build at 1310×800 (2026-09-13): the strip is 92 pt from its divider to the tab bar's safe-area clearance — tiles at y 12–72 — although its frame is 84; the white background then continues under the 58 pt clearance to the window edge (a SwiftUI .background ignores the safe-area inset), which the screen files draw. This file's fourteen tiles are the gallery mirrors' own tile art in the grid's order (gallery.svg t1…t12 and two more), so the strip reads as the same library the grid shows. One file per focused position — see components/README.md.</desc>
