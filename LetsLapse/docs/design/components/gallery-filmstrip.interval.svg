    <linearGradient id="fs-dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7E9AB8"/><stop offset="0.6" stop-color="#E4C39A"/><stop offset="1" stop-color="#F7E6C8"/></linearGradient>
    <linearGradient id="fs-roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9BB0C4"/><stop offset="1" stop-color="#D8C6AE"/></linearGradient>
    <linearGradient id="fs-fog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C7CFD6"/><stop offset="1" stop-color="#8E9AA4"/></linearGradient>
    <linearGradient id="fs-night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131A2A"/><stop offset="1" stop-color="#2E3348"/></linearGradient>
