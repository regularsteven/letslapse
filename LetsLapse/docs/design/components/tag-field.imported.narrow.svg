<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 302 115" width="302" height="115" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>Component · Tag field · imported · narrow</title>
  <desc>The tag editor (see tag-field.applied.*) as the Gallery preview panel's Keywords row shows it for a project whose keywords came from its files: the seven dc:subject keywords of the _WEX3518 Lightroom export set (its .xmp sidecar), read at import into the record's imported layer. A keyword from a file is drawn exactly like a typed one — once applied there is no difference worth showing — and the row's 'from file' marker is what says where they came from; the first edit moves the set into the edited layer and the marker to 'edited here'. narrow is the macOS Gallery panel's 302pt column; phone the iPhone preview sheet's 365pt.</desc>
<!-- LetsLapse design component · tag field, imported state. Same chip metrics as tag-field.applied.*:
     33pt chips, rx 16.5, 8pt gaps, width = text + 41; the dashed + Add tag chip last. See components/README.md. -->
  
<!-- 2026-09-13 (later): narrow is 302 pt now — the Gallery pane went 300 → 330 with the item view, so its
     content column is 302; there is no 272 pt column left anywhere (the iPad pane takes the same code).
     Reflowed: Bridge · Czech Republic / Dusk · Historic · Prague / River · Vltava · + Add tag — three rows now,
     115 tall (was four, 156). -->
  <style>text{font-family:inherit}.sb{font-weight:600}.m{font-weight:500}</style>
  <g id="tag-field" data-state="imported" data-width="narrow">
    <g data-tag="Bridge" data-source="file" transform="translate(0,0)">
      <rect x="0" y="0" width="85" height="33" rx="16.5" fill="#C36A00"/>
      <text x="12" y="21.5" font-size="14" class="sb" fill="#FFF">Bridge</text>
      <g stroke="#FFF" stroke-opacity="0.8" stroke-width="1.7" stroke-linecap="round" data-symbol="xmark">
        <path d="M64.5 12.5 l8 8 M72.5 12.5 l-8 8"/>
      </g>
    </g>
    <g data-tag="Czech Republic" data-source="file" transform="translate(93,0)">
      <rect x="0" y="0" width="145" height="33" rx="16.5" fill="#C36A00"/>
      <text x="12" y="21.5" font-size="14" class="sb" fill="#FFF">Czech Republic</text>
      <g stroke="#FFF" stroke-opacity="0.8" stroke-width="1.7" stroke-linecap="round" data-symbol="xmark">
        <path d="M124.5 12.5 l8 8 M132.5 12.5 l-8 8"/>
      </g>
    </g>
    <g data-tag="Dusk" data-source="file" transform="translate(0,41)">
      <rect x="0" y="0" width="75" height="33" rx="16.5" fill="#C36A00"/>
      <text x="12" y="21.5" font-size="14" class="sb" fill="#FFF">Dusk</text>
      <g stroke="#FFF" stroke-opacity="0.8" stroke-width="1.7" stroke-linecap="round" data-symbol="xmark">
        <path d="M54.5 12.5 l8 8 M62.5 12.5 l-8 8"/>
      </g>
    </g>
    <g data-tag="Historic" data-source="file" transform="translate(83,41)">
      <rect x="0" y="0" width="94" height="33" rx="16.5" fill="#C36A00"/>
      <text x="12" y="21.5" font-size="14" class="sb" fill="#FFF">Historic</text>
      <g stroke="#FFF" stroke-opacity="0.8" stroke-width="1.7" stroke-linecap="round" data-symbol="xmark">
        <path d="M73.5 12.5 l8 8 M81.5 12.5 l-8 8"/>
      </g>
    </g>
    <g data-tag="Prague" data-source="file" transform="translate(185,41)">
      <rect x="0" y="0" width="89" height="33" rx="16.5" fill="#C36A00"/>
      <text x="12" y="21.5" font-size="14" class="sb" fill="#FFF">Prague</text>
      <g stroke="#FFF" stroke-opacity="0.8" stroke-width="1.7" stroke-linecap="round" data-symbol="xmark">
        <path d="M68.5 12.5 l8 8 M76.5 12.5 l-8 8"/>
      </g>
    </g>
    <g data-tag="River" data-source="file" transform="translate(0,82)">
      <rect x="0" y="0" width="75" height="33" rx="16.5" fill="#C36A00"/>
      <text x="12" y="21.5" font-size="14" class="sb" fill="#FFF">River</text>
      <g stroke="#FFF" stroke-opacity="0.8" stroke-width="1.7" stroke-linecap="round" data-symbol="xmark">
        <path d="M54.5 12.5 l8 8 M62.5 12.5 l-8 8"/>
      </g>
    </g>
    <g data-tag="Vltava" data-source="file" transform="translate(83,82)">
      <rect x="0" y="0" width="83" height="33" rx="16.5" fill="#C36A00"/>
      <text x="12" y="21.5" font-size="14" class="sb" fill="#FFF">Vltava</text>
      <g stroke="#FFF" stroke-opacity="0.8" stroke-width="1.7" stroke-linecap="round" data-symbol="xmark">
        <path d="M62.5 12.5 l8 8 M70.5 12.5 l-8 8"/>
      </g>
    </g>
    <g data-chip="add" transform="translate(166,82)">
      <rect x="0.6" y="0.6" width="90.8" height="31.8" rx="15.9" fill="#FFF" stroke="#C36A00" stroke-width="1.2" stroke-dasharray="4 3"/>
      <g stroke="#C36A00" stroke-width="1.8" stroke-linecap="round" data-symbol="plus">
        <path d="M13 16.5 h10 M18 11.5 v10"/>
      </g>
      <text x="29" y="21.5" font-size="14" class="m" fill="#C36A00">Add tag</text>
    </g>
  </g>
</svg>
