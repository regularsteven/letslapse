      <rect x="0.5" y="657.5" width="364" height="32" rx="5" fill="#FFF" stroke="#C6C6CB"/>
    </g>
    <g data-field="contactState">
      <text x="0" y="715.5" font-size="12" class="sb" fill="#6D6D72">State</text>
      <rect x="0.5" y="723.0" width="364" height="32" rx="5" fill="#FFF" stroke="#C6C6CB"/>
    </g>
    <g data-field="contactPostcode">
      <text x="0" y="781.0" font-size="12" class="sb" fill="#6D6D72">Postcode</text>
      <rect x="0.5" y="788.5" width="364" height="32" rx="5" fill="#FFF" stroke="#C6C6CB"/>
    </g>
    <g data-field="contactCountry">
      <text x="0" y="846.5" font-size="12" class="sb" fill="#6D6D72">Country</text>
      <rect x="0.5" y="854.0" width="364" height="32" rx="5" fill="#FFF" stroke="#C6C6CB"/>
    </g>
    <g data-field="contactPhone">
      <text x="0" y="912.0" font-size="12" class="sb" fill="#6D6D72">Phone</text>
      <rect x="0.5" y="919.5" width="364" height="32" rx="5" fill="#FFF" stroke="#C6C6CB"/>
    </g>
    <g data-field="contactEmail">
      <text x="0" y="977.5" font-size="12" class="sb" fill="#6D6D72">Email</text>
      <rect x="0.5" y="985.0" width="364" height="32" rx="5" fill="#FFF" stroke="#C6C6CB"/>
    </g>
    <g data-field="contactWebsite">
      <text x="0" y="1043.0" font-size="12" class="sb" fill="#6D6D72">Website</text>
      <rect x="0.5" y="1050.5" width="364" height="32" rx="5" fill="#FFF" stroke="#C6C6CB"/>
    </g>
    <text x="0" y="1112.5" font-size="12" class="sb" fill="#6D6D72">Location</text>
    <g data-field="locationSublocation">
      <text x="0" y="1139.0" font-size="12" class="sb" fill="#6D6D72">Sublocation</text>
      <text x="365" y="1139.0" font-size="10" class="m" text-anchor="end" fill="#000" fill-opacity="0.3">from file</text>
      <rect x="0.5" y="1146.5" width="364" height="32" rx="5" fill="#FFF" stroke="#C6C6CB"/>
      <text x="8" y="1167.0" font-size="12" fill="#000">Mala Strana</text>
    </g>
    <g data-field="locationCity">
      <text x="0" y="1204.5" font-size="12" class="sb" fill="#6D6D72">City</text>
      <rect x="0.5" y="1212.0" width="364" height="32" rx="5" fill="#FFF" stroke="#C6C6CB"/>
    </g>
    <g data-field="locationState">
      <text x="0" y="1270.0" font-size="12" class="sb" fill="#6D6D72">State</text>
      <text x="365" y="1270.0" font-size="10" class="m" text-anchor="end" fill="#000" fill-opacity="0.3">from file</text>
      <rect x="0.5" y="1277.5" width="364" height="32" rx="5" fill="#FFF" stroke="#C6C6CB"/>
      <text x="8" y="1298.0" font-size="12" fill="#000">Prague</text>
    </g>
    <g data-field="locationCountry">
      <text x="0" y="1335.5" font-size="12" class="sb" fill="#6D6D72">Country</text>
      <text x="365" y="1335.5" font-size="10" class="m" text-anchor="end" fill="#000" fill-opacity="0.3">from file</text>
      <rect x="0.5" y="1343.0" width="364" height="32" rx="5" fill="#FFF" stroke="#C6C6CB"/>
