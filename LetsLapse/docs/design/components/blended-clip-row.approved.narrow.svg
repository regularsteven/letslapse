<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 302 62" width="302" height="62" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>Component · Blended clip row · approved · narrow</title>
  <desc>Mirrors App/BlendedClipRow.swift — see blended-clip-row.default.wide.svg for the full mirror note. Narrow is the macOS Gallery preview panel's 302pt content column: same real copy as the wide row, clipped to the column the way SwiftUI's own .lineLimit(1) would truncate it on a narrower width. 2026-09-26 (plan §12 + §16): the thumbnail wears the clip's holdings pill, components/holdings-pill.blend.here.safe.svg at 0.8, 2 pt in from its bottom-right corner (BlendedClipRow: BlendHoldingsPill, .scaleEffect(0.8, anchor: .bottomTrailing).padding(2)) — its markup INLINED from the generated file (mask ids prefixed): a nested &lt;image&gt; is not followed once a screen places this row, so the pill travels with the row; re-copy it if holdings-pill.make.py changes the pill. The play.fill glyph the older mirrors drew over the thumbnail (the README's known gap — the code draws none) is gone: the pill holds that corner. 2026-11-06 (docs/approved-assets.md): every row ends in the approve seal — ApproveToggle (App/ApprovedAssetViews.swift), a 28 pt hit area in the row's HStack(spacing: 12) between the text column and the trailing button: checkmark.seal 17 pt medium in secondary 70 % until the output is approved, checkmark.seal.fill in LL.accent after (the approved and edited.approved states); a press toggles. Here it is centred 72.5 pt in from the row's right edge, 12 pt before Open. The text column ends 12 pt before it (119.5 pt from x 84), so the same real strings clip sooner. THIS STATE: the default row once its output is approved for use — blends[].approvedAt is set; the seal is filled in LL.accent, nothing else moves.</desc>
<!-- LetsLapse design component · blended clip row · approved · narrow (302pt, the macOS gallery preview-panel column).
     Same coordinate contract as the wide set (62pt tall, thumbnail at x=14, title/subtitle column at x=84),
     just narrower — Open sits at x = width-14 = 288. See components/README.md. -->
  <defs><clipPath id="text-col"><rect x="84" y="14" width="119.5" height="38"/></clipPath></defs>

<!-- 2026-09-13 (later): narrow is 302 pt now — the Gallery pane went 300 → 330 with the item view, so its
     content column is 302; there is no 272 pt column left anywhere (the iPad pane takes the same code). -->
  <style>text{font-family:inherit}.sb{font-weight:600}</style>
  <g id="blended-clip-row" data-state="approved" data-width="narrow">
    <rect x="14" y="10" width="58" height="42" rx="7" fill="#463522"/>
    <!-- the clip's holdings pill (components/holdings-pill.blend.here.safe.svg, W 44.3): 0.8 scale, bottom-right 2 pt in —
         x = 72 − 2 − 35.44 = 34.56, y = 52 − 16.4 = 35.6. Screens repeat it at the same offset (nested references are not followed). -->
    <g data-component="holdings-pill.blend.here.safe.svg" transform="translate(34.56,35.6) scale(0.8)"><rect x="0" y="0" width="44.3" height="18" rx="9" fill="#000" fill-opacity="0.5"/><g transform="translate(2.95,1.55) scale(0.6420)" data-symbol="square.3.layers.3d.top.filled"><path d="M12 3.2L20.8 8L12 12.8L3.2 8Z" fill="#30D158"/><g fill="none" stroke="#30D158" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M3.2 11.6L12 16.4L20.8 11.6"/><path d="M3.2 15.2L12 20L20.8 15.2"/></g></g><rect x="20.30" y="4" width="0.5" height="10" fill="#FFFFFF" fill-opacity="0.35"/><g transform="translate(23.91,1.03) scale(0.6872)" data-symbol="checkmark.icloud.fill"><mask id="br-approved-narrow-knock-cloud" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#FFFFFF"/><path d="M8.4 14L11 16.5L15.8 11.7" fill="none" stroke="#000000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></mask><path d="M6.5 19.5H17.8A4.6 4.6 0 0 0 18.6 10.4A6.8 6.8 0 0 0 5.8 9.3A5.2 5.2 0 0 0 6.5 19.5Z" fill="#FFFFFF" fill-opacity="0.9" mask="url(#br-approved-narrow-knock-cloud)"/></g></g>
    <g clip-path="url(#text-col)">
      <text x="84" y="28" font-size="14.5" class="sb" fill="#000">Blended clip 1 · 18 frames · 6.1 s</text>
      <text x="84" y="45" font-size="11.5" fill="#6D6D72">24 fps · yesterday</text>
    </g>
    <!-- ApproveToggle (approved): 28 × 28 centred on (229.5, 31), the glyph 19 pt across -->
    <g data-view="ApproveToggle" data-state="approved"><g transform="translate(218.64,20.14) scale(0.9048)" data-symbol="checkmark.seal.fill"><path d="M12.00 1.50 L12.68 1.65 L13.31 2.06 L13.86 2.63 L14.35 3.23 L14.81 3.74 L15.29 4.05 L15.86 4.17 L16.54 4.14 L17.31 4.06 L18.10 4.05 L18.84 4.20 L19.42 4.58 L19.80 5.16 L19.95 5.90 L19.94 6.69 L19.86 7.46 L19.83 8.14 L19.95 8.71 L20.26 9.19 L20.77 9.65 L21.37 10.14 L21.94 10.69 L22.35 11.32 L22.50 12.00 L22.35 12.68 L21.94 13.31 L21.37 13.86 L20.77 14.35 L20.26 14.81 L19.95 15.29 L19.83 15.86 L19.86 16.54 L19.94 17.31 L19.95 18.10 L19.80 18.84 L19.42 19.42 L18.84 19.80 L18.10 19.95 L17.31 19.94 L16.54 19.86 L15.86 19.83 L15.29 19.95 L14.81 20.26 L14.35 20.77 L13.86 21.37 L13.31 21.94 L12.68 22.35 L12.00 22.50 L11.32 22.35 L10.69 21.94 L10.14 21.37 L9.65 20.77 L9.19 20.26 L8.71 19.95 L8.14 19.83 L7.46 19.86 L6.69 19.94 L5.90 19.95 L5.16 19.80 L4.58 19.42 L4.20 18.84 L4.05 18.10 L4.06 17.31 L4.14 16.54 L4.17 15.86 L4.05 15.29 L3.74 14.81 L3.23 14.35 L2.63 13.86 L2.06 13.31 L1.65 12.68 L1.50 12.00 L1.65 11.32 L2.06 10.69 L2.63 10.14 L3.23 9.65 L3.74 9.19 L4.05 8.71 L4.17 8.14 L4.14 7.46 L4.06 6.69 L4.05 5.90 L4.20 5.16 L4.58 4.58 L5.16 4.20 L5.90 4.05 L6.69 4.06 L7.46 4.14 L8.14 4.17 L8.71 4.05 L9.19 3.74 L9.65 3.23 L10.14 2.63 L10.69 2.06 L11.32 1.65Z" fill="#C36A00"/><path d="M8.3 12.4L10.9 15L15.8 9.7" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></g></g>
    <text x="288" y="35" font-size="12.5" class="sb" fill="#C36A00" text-anchor="end">Open</text>
  </g>
</svg>
