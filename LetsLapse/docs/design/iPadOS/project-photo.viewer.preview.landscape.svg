<circle cx="1129.0" cy="771.0" r="2" fill="none"/>
</g>
      </g>
      <rect x="485" y="806" width="210" height="5" rx="2.5" fill="#FFFFFF" opacity="0.35"/>
    </g>
  </g>

  <text x="614" y="874" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">iPadOS · Editor preview page · interval, originals on PicPlace · landscape · 1180×820 pt</text>
  <text x="614" y="892" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors EditorPreviewPage floatingBody — the status card in the timeline capsule's seat, EditorGroupBar(.padPill, locked) beside it</text>
</svg>
