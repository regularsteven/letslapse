<svg viewBox="0 0 800 790" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>macOS · Shape-mation · builder · Timing step (sheet) · 760×680</title>
  <desc>Mirrors App/Shapemation/ShapemationBuilderView.swift — ShapemationTimingView (the builder's Timing step: the question, one card of label-above pickers, the estimate line, the pinned Next · output bar) in the Mac's 560-wide Shape-mation sheet over the Create tab. Drawn 2026-09-20, mirrored from the Debug build on the tram clone (LL_SHAPEMATION=build LL_CHIPS=tram; Rectangle · Any · 83 projects; capture builder.timing.png + AX dump). Window, title bar, sheet, nav bar and bottom bar as in shapemation.builder.mode.svg (the sheet overhangs the 680 pt window by 31.5). CONTENT: 'How fast should it play?' 17/600 (baseline 132); the card (llCard radius 18, 527×251.5 at y 147.5, 16 pt padding, 16 pt between groups): 'Frame rate' 14 pt over a segmented Picker 24 · 25 · 30 · 50 · 60 (macOS .segmented: a 23.5 pt #E8E8E8 track, five 40.4 pt seats, the chosen seat filled accent with a white 13/500 label — 25 chosen); 'Ramp' 14 pt over Off · On (two 43.25 pt seats, Off chosen); then the hold row — 'Each photo' 15 pt at the left and an NSPopUpButton at the trailing edge (101×23.5, near-white with a hairline, '1 s', chevron.up.chevron.down) — whose menu lists ShapemationTiming.Hold.options (seconds and frames); the footer 12 secondary in two lines: 'Every photo holds 1 s — 25 frames at 25 fps. Choose in seconds or in frames; seconds round to whole frames at the frame rate.' Under the card the estimate 12 secondary: '83 photos · 83.0 s of playback · 2075 frames'. RAMP ON (desc-only, not captured on the Mac; ../iOS/shapemation.builder.timing.ramp.portrait.svg draws it): the card gains the ramp's own rows under the Ramp picker. BOTTOM BAR: 'Next · output' 15/600 white, 152×44 accent, radius 8, trailing 16. Same screen on iOS: ../iOS/shapemation.builder.timing.portrait.svg.</desc>
  <defs>
    <clipPath id="win"><rect x="20" y="20" width="760" height="680" rx="11"/></clipPath>
    <clipPath id="sheet"><rect x="120" y="52" width="560" height="679.5" rx="10"/></clipPath>
    <clipPath id="content"><rect x="120" y="100" width="560" height="553"/></clipPath>
    <filter id="sheetshadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/></filter>
    <filter id="knob" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.25"/></filter>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.m{font-weight:500}.mono{font-variant-numeric:tabular-nums;font-family:'SF Mono', Menlo, monospace}</style>

  <!-- The Create tab behind the sheet, dimmed 17 % (NSWindow sheet dimming): title, the two
       preset cards and the door rows show at the sheet's sides, as captured. -->
  <g clip-path="url(#win)">
    <rect x="20" y="20" width="760" height="680" fill="#F2F2F7"/>
    <g id="titlebar">
      <rect x="20" y="20" width="760" height="32" fill="#F6F6F8"/>
      <circle cx="36.5" cy="36" r="6" fill="#FF736A"/><circle cx="59" cy="36" r="6" fill="#FEBC2E"/><circle cx="81.5" cy="36" r="6" fill="#19C332"/>
      <text x="104" y="40.5" font-size="13" class="sb" fill="#000" fill-opacity="0.85">Create</text>
    </g>
    <g id="create-page">
      <text x="39" y="89.5" font-size="28" class="b" fill="#000">Create</text>
      <text x="39" y="114" font-size="13" fill="#6D6D72">What do you want to make?</text>
      <rect x="36.5" y="132" width="349" height="170" rx="14" fill="#FFFFFF"/>
      <rect x="49" y="146" width="324" height="84.5" rx="8" fill="#8794A5"/>
      <rect x="49" y="190" width="324" height="8" fill="#FFFFFF" fill-opacity="0.25"/>
      <text x="49" y="256" font-size="15" class="sb" fill="#000">Smooth timelapse</text>
      <text x="49" y="273" font-size="12" fill="#6D6D72">Hours become seconds, motion melts into streaks</text>
      <rect x="397.5" y="132" width="349" height="170" rx="14" fill="#FFFFFF"/>
      <rect x="410" y="146" width="324" height="84.5" rx="8" fill="#7E8899"/>
      <text x="410" y="256" font-size="15" class="sb" fill="#000">Long exposure</text>
      <text x="410" y="273" font-size="12" fill="#6D6D72">Interval photos into a timelapse, or one long exposure</text>
      <rect x="36.5" y="319.5" width="349" height="167.5" rx="14" fill="#FFFFFF"/>
      <rect x="49" y="333" width="324" height="84.5" rx="8" fill="#9A8D82"/>
      <text x="49" y="439" font-size="15" class="sb" fill="#000">Speed ramp</text>
      <text x="49" y="457" font-size="12" fill="#6D6D72">Speed rises or falls across the clip</text>
      <rect x="397.5" y="319.5" width="349" height="167.5" rx="14" fill="#FFFFFF"/>
      <rect x="410" y="333" width="324" height="84.5" rx="8" fill="#C7C2B3"/>
      <text x="410" y="439" font-size="15" class="sb" fill="#000">Custom blend</text>
      <text x="410" y="457" font-size="12" fill="#6D6D72">Every dial, no presets</text>
      <rect x="36.5" y="504.5" width="710" height="240" rx="14" fill="#FFFFFF"/>
      <g id="doors" font-size="15" fill="#000">
        <rect x="51.5" y="517" width="31" height="31" rx="8" fill="#D7A46A"/><circle cx="67" cy="532.5" r="7" fill="none" stroke="#FFFFFF" stroke-width="2"/><circle cx="67" cy="532.5" r="2.5" fill="#FFFFFF"/>
        <text x="94" y="537.5">Record now</text>
        <line x1="94" y1="560.5" x2="746.5" y2="560.5" stroke="#000" stroke-opacity="0.08"/>
        <rect x="51.5" y="574" width="31" height="31" rx="8" fill="#9FB0C8"/><rect x="58" y="583.5" width="18" height="12" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
        <text x="94" y="594.5">Import a video…</text>
        <line x1="94" y1="617.5" x2="746.5" y2="617.5" stroke="#000" stroke-opacity="0.08"/>
        <rect x="51.5" y="631" width="31" height="31" rx="8" fill="#ABA3C8"/><rect x="58" y="640.5" width="18" height="12" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
        <text x="94" y="651.5">Import photos…</text>
        <line x1="94" y1="674.5" x2="746.5" y2="674.5" stroke="#000" stroke-opacity="0.08"/>
        <rect x="51.5" y="682" width="31" height="31" rx="8" fill="#B5AB94"/>
        <text x="94" y="702.5">Import a LetsLapse project…</text>
        <g fill="none" stroke="#000" stroke-opacity="0.3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.right">
          <path d="M723 527.5 l5 5 -5 5"/><path d="M723 584.5 l5 5 -5 5"/><path d="M723 641.5 l5 5 -5 5"/><path d="M723 692.5 l5 5 -5 5"/>
        </g>
      </g>
      <rect x="766" y="57" width="8" height="370" rx="4" fill="#8E8E93" fill-opacity="0.6"/>
    </g>
    <rect x="20" y="20" width="760" height="680" fill="#000" fill-opacity="0.17"/>
  </g>

  <!-- The sheet: 560 pt wide, its top under the title bar, 679.5 tall — taller than the
       680 pt window, so its foot overhangs the window's bottom edge by 31.5 pt as captured. -->
  <g id="sheet">
    <rect x="120" y="52" width="560" height="679.5" rx="10" fill="#F2F2F7" filter="url(#sheetshadow)"/>
    <g clip-path="url(#sheet)">
      <g id="navbar">
        <rect x="120" y="52" width="560" height="47.5" fill="#FFFFFF"/>
        <line x1="120" y1="99.75" x2="680" y2="99.75" stroke="#000" stroke-opacity="0.14" stroke-width="0.5"/>
        <circle cx="144" cy="76" r="14.5" fill="#C36A00"/>
        <path d="M146.5 70.5 l-5.5 5.5 5.5 5.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.left"/>
        <text x="168.5" y="80.5" font-size="13" class="b" fill="#000">Timing</text>
      </g>
      <g id="content" clip-path="url(#content)">
        <text x="136.5" y="132" font-size="17" class="sb" fill="#000">How fast should it play?</text>
        <!-- the timing card (llCard radius 18, 16 pt padding): two label-above segmented pickers, the Each photo pop-up row, the footer -->
        <rect x="136.5" y="147.5" width="527" height="251.5" rx="18" fill="#FFFFFF"/>
        <text x="152.5" y="178" font-size="14" fill="#000">Frame rate</text>
        <rect x="152.5" y="188.5" width="202.0" height="23.5" rx="6" fill="#E8E8E8"/>
<text x="172.7" y="204.75" font-size="13" text-anchor="middle" fill="#000">24</text>
<rect x="192.9" y="188.5" width="40.4" height="23.5" rx="6" fill="#C36A00"/>
<text x="213.1" y="204.75" font-size="13" class="m" text-anchor="middle" fill="#FFFFFF">25</text>
<text x="253.5" y="204.75" font-size="13" text-anchor="middle" fill="#000">30</text>
<text x="293.9" y="204.75" font-size="13" text-anchor="middle" fill="#000">50</text>
<line x1="273.7" y1="194.5" x2="273.7" y2="206.0" stroke="#000" stroke-opacity="0.12"/>
<text x="334.3" y="204.75" font-size="13" text-anchor="middle" fill="#000">60</text>
<line x1="314.1" y1="194.5" x2="314.1" y2="206.0" stroke="#000" stroke-opacity="0.12"/>
        <text x="152.5" y="243" font-size="14" fill="#000">Ramp</text>
        <rect x="152.5" y="253.5" width="86.5" height="23.5" rx="6" fill="#E8E8E8"/>
<rect x="152.5" y="253.5" width="43.25" height="23.5" rx="6" fill="#C36A00"/>
<text x="174.125" y="269.75" font-size="13" class="m" text-anchor="middle" fill="#FFFFFF">Off</text>
<text x="217.375" y="269.75" font-size="13" text-anchor="middle" fill="#000">On</text>
        <text x="152.5" y="321" font-size="15" fill="#000">Each photo</text>
        <rect x="546.5" y="304.0" width="101" height="23.5" rx="5" fill="#000" fill-opacity="0.05"/><rect x="546.5" y="303.5" width="101" height="23.5" rx="5" fill="#F7F7F7" stroke="#000" stroke-opacity="0.10" stroke-width="0.75"/><text x="558.0" y="319.75" font-size="13" fill="#000">1 s</text><g fill="none" stroke="#6D6D72" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.up.chevron.down"><path d="M631.0 313.25 l3 -3 3 3"/><path d="M631.0 317.25 l3 3 3 -3"/></g>
        <text x="152.5" y="365.5" font-size="12" fill="#6D6D72">Every photo holds 1 s — 25 frames at 25 fps. Choose in seconds or in frames; seconds</text>
        <text x="152.5" y="380.5" font-size="12" fill="#6D6D72">round to whole frames at the frame rate.</text>
        <text x="136.5" y="424" font-size="12" fill="#6D6D72">83 photos · 83.0 s of playback · 2075 frames</text>
      </g>
      <g id="bottombar">
        <rect x="120" y="653" width="560" height="78.5" fill="#C36A00" fill-opacity="0.06"/>
        <rect x="511.5" y="670.5" width="152" height="44" rx="8" fill="#C36A00"/>
        <text x="587.5" y="697.5" font-size="15" class="sb" text-anchor="middle" fill="#FFFFFF">Next · output</text>
      </g>

    </g>
  </g>

  <rect x="20" y="20" width="760" height="680" rx="11" fill="none" stroke="#000" stroke-opacity="0.16"/>
  <text x="400" y="758" font-size="13" class="sb" text-anchor="middle" fill="#000">macOS · Shape-mation sheet · builder · Timing — 25 fps, Ramp off, 1 s each · 760×680 pt window, 560 pt sheet</text>
  <text x="400" y="776" font-size="11" text-anchor="middle" fill="#6D6D72">mirrors App/Shapemation/ShapemationBuilderView.swift (ShapemationTimingView) — LL_SHAPEMATION=build LL_CHIPS=tram on the tram clone, 2026-09-20</text>
</svg>
