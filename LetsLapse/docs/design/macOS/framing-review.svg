    </g>
    <text x="34" y="332" font-size="11" class="sb" fill="#6D6D72" letter-spacing="0.5">KNOCKS · 3</text>
    <g id="knocks-card">
      <rect x="34" y="340" width="512" height="112" rx="8" fill="#FFF" stroke="#000" stroke-opacity="0.08"/>
