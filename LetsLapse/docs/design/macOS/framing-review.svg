<svg viewBox="0 0 600 730" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>macOS · Framing review · report · 560×640</title>
  <desc>Mirrors App/FramingReviewView.swift hosted in its own macOS window (`WindowGroup(for: FramingReviewWindowRequest.self)`, the pattern the photo and video editors use — a sheet on the Mac is never user-resizable) in its REPORT state, over LetsLapseKit.FramingReview from the project's source/framing.json. Same four blocks as the iOS sheet (../iOS/framing-review.portrait.svg) at desktop density: header (amber warning glyph + headline, or green check + "Framing steady"), the summary in full, the path card (every photo's vertical offset on a ±10 px scale, knocks shaded amber), the knocks list (largest first, peak bar on a 10 px scale) and the ink plan card. Footer: Done closes; Stabilise photos commits the plan as metadata (`applyingPlan()`), after which the header line gains "Stabilised" in green and the primary reads "Undo". 560×640 pt, fixed.</desc>
  <defs>
    <clipPath id="win"><rect x="20" y="20" width="560" height="640" rx="11"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.10"/></filter>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.mono{font-variant-numeric:tabular-nums}</style>
  <g clip-path="url(#win)">
    <rect x="20" y="20" width="560" height="640" fill="#F2F2F7"/>
    <g id="titlebar">
      <rect x="20" y="20" width="560" height="28" fill="#E9E9EC"/>
      <circle cx="34" cy="34" r="6" fill="#FF5F57"/><circle cx="54" cy="34" r="6" fill="#FEBC2E"/><circle cx="74" cy="34" r="6" fill="#28C840"/>
      <text x="300.0" y="38" font-size="13" class="sb" text-anchor="middle" fill="#000" fill-opacity="0.85">Framing review — Interval — harbour dusk</text>
    </g>
    <g id="header">
      <g data-symbol="exclamationmark.triangle.fill"><path d="M46 64 L55.5 81.5 L36.5 81.5 Z" fill="#FFB340" stroke-linejoin="round"/><rect x="44.7" y="70.5" width="2.6" height="6.0" rx="1.3" fill="#1C1C1E"/><circle cx="46" cy="79.0" r="1.6" fill="#1C1C1E"/></g>
      <text x="62" y="72" font-size="14" class="b" fill="#000">Stabilisation recommended</text>
      <text x="62" y="87" font-size="10.5" fill="#6D6D72">184 photos · 4032×3024 · reviewed today at 18:42</text>
      <line x1="20" y1="100" x2="580" y2="100" stroke="#000" stroke-opacity="0.10"/>
    </g>
    <g id="summary">
      <text x="34" y="122" font-size="12" fill="#000">3 knocks across 184 photos over 3 minutes, the largest 5.6 px at</text>
      <text x="34" y="138" font-size="12" fill="#000">photos 121–129. Locking the framing crops 0.4% from each edge (4016×3012 of 4032×3024).</text>
    </g>
    <text x="34" y="168" font-size="11" class="sb" fill="#6D6D72" letter-spacing="0.5">FRAMING OVER THE SHOOT</text>
