      <text x="48" y="510" font-size="11.5" fill="#FFF" fill-opacity="0.78">Shift each photo by up to ±1.2 px across and ±6.0 px down, and crop</text>
      <text x="48" y="526" font-size="11.5" fill="#FFF" fill-opacity="0.78">0.4% from each edge. The originals stay untouched — the correction is</text>
      <text x="48" y="542" font-size="11.5" fill="#FFF" fill-opacity="0.78">applied when a clip is blended or a photo is viewed.</text>
