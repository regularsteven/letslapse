<svg viewBox="0 0 1040 790" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>macOS · Photo viewer / grading editor · Masks tab · 1000×700</title>
  <desc>Mirrors App/PhotoViewerView.swift (masksTab) hosting App/Overlay/OverlayMasksPanel.swift — the Masks page of the editor rail, added 2026-08-31 from the Claude Design &quot;Text Features&quot; spec. Window, media column and timeline strip are photo-viewer.svg's. WHY IT IS A TAB AND NOT A CARD INSIDE TEXT: what it authors belongs to the PROJECT, not to a layer — every text layer can pick any of these regions — so the place to author them cannot live inside one layer's disclosure. INTELLIGENT PLACEMENT — the project's regions as pills: Sky and Land (the segmentation model's one analysis read two ways, never two detectors), then each custom mask's name and, where it has one, its inverted name. Picking a pill SELECTS it for inspection; it is not a placement, and clicking it again deselects — nothing is analysed until one is chosen. Sky and Land render disabled without the model installed, with the footnote &quot;Sky and Land need the segmentation model — download it in Settings ▸ AI Models. Text placement works without it, and a custom mask needs nothing.&quot; (desc-only). Once a region is chosen: &quot;Show semantic mask&quot; (ON here — tints the post-processed region magenta over the live composite, edge bias excluded so the debug view shows what segmentation produced, not what the restorer eroded); Analysis Sequence · This frame (Sequence = the 9-frame vote mask, flicker-proof for a locked-off shoot; This frame is the drift-inspection mode and never what exports use); the three live dials Threshold / Feather / Edge bias (post-processing only — masks are cached raw, so the dials cost zero re-inference; edge bias erodes whichever region RESTORES, so bias always means less occlusion); and a status line that is region-aware — the model's provenance for Sky/Land, the FILE's for a custom mask, and &quot;mask file missing — this region will not occlude&quot; when the file has gone. CUSTOM MASKS — hand-supplied black &amp; white PNG/JPEG, added by drop or file picker, COPIED into the project's masks/ folder (never referenced in place: a sandbox-scoped drop is gone by the next launch, and the mask has to survive an archive round trip; masks/ is in ProjectArchive.transferableSubfolders, so it travels in .lapse archives and device transfers). White is the region the name refers to; the optional inverted name gives the complement its own pill. &quot;Replace Sky &amp; Land&quot; — at most one mask per project may claim it, and while claimed the Sky and Land pills drop out and that mask's two names become the project's whole vocabulary. Deleting a mask, or a mask claiming the replacement, drops any layer pointing at a region that no longer exists back to None — rendering unoccluded in silence would read as a segmentation bug rather than a missing mask. A custom mask is a FILE, so it needs no model and costs no inference; it loads through CustomMaskLoader into the same SceneMask grid the model produces, which is what lets one code path serve both. STAGED HERE: Sky selected and tinted, one custom mask &quot;Rooftops&quot; / &quot;Below the roofline&quot;. Hooks: LL_EDITOR=&lt;uuid|latest&gt;, LL_RAIL=masks, LL_SEG_MODEL=&lt;path&gt;. Verified against the running Mac app 2026-08-31.</desc>
  <defs>
    <clipPath id="win"><rect x="20" y="20" width="1000" height="700" rx="11"/></clipPath>
    <clipPath id="photo"><rect x="20" y="110" width="660" height="495"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA3B8"/>
      <stop offset="0.45" stop-color="#E8B98C"/>
      <stop offset="1" stop-color="#F6DFB2"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9A45E"/>
      <stop offset="1" stop-color="#5C666E"/>
    </linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.mono{font-variant-numeric:tabular-nums}</style>

  <g clip-path="url(#win)">
    <rect x="20" y="20" width="1000" height="700" fill="#F2F2F7"/>

    <g id="titlebar">
      <rect x="20" y="20" width="1000" height="28" fill="#F6F6F8"/>
      <circle cx="34" cy="34" r="6" fill="#FF736A"/><circle cx="54" cy="34" r="6" fill="#FEBC2E"/><circle cx="74" cy="34" r="6" fill="#19C332"/>
      <text x="520" y="38" font-size="13" class="sb" text-anchor="middle" fill="#000" fill-opacity="0.85">River Sunset to Dusk</text>
    </g>

    <!-- Media column: black pane, 4:3 picture fitted and centred, zoom
         control bottom-trailing. The picture is a flat approximation of the
         staged frame: sunset sky, the overlay text, then skyline / bridge /
         river / quay — the skyline is drawn AFTER the text on purpose, so
         the drawing occludes the descenders the way the composite does. -->
    <g id="media">
      <rect x="20" y="48" width="660" height="618" fill="#000000"/>
      <g clip-path="url(#photo)">
        <rect x="20" y="110" width="660" height="495" fill="url(#sky)"/>
        <ellipse cx="200" cy="180" rx="160" ry="24" fill="#7E93A9" opacity="0.35"/>
        <ellipse cx="480" cy="150" rx="190" ry="22" fill="#8A9DB1" opacity="0.3"/>
        <ellipse cx="360" cy="240" rx="230" ry="22" fill="#EACBA0" opacity="0.45"/>
        <ellipse cx="150" cy="300" rx="170" ry="16" fill="#F2D9AE" opacity="0.5"/>
        <!-- Layer 1 at its resting layout. Its reveal has not started at
             this playhead, so the composite draws nothing — the chrome below
             is all that marks where it will land. (Drawn faint here so the
             spec shows the placement the badge refers to.) -->
        <text x="345" y="360" font-size="96" class="b" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.16">LetsLapse</text>
        <!-- Skyline band drawn AFTER the text — only the baseline bottoms and
             descenders sink behind the rooftops, the way the composite cuts. -->
        <path d="M20 380 L20 356 L60 356 L60 350 L118 350 L118 358 L175 358 L175 352 L240 352 L240 360 L300 360 L300 350 L332 344 L385 340 L448 344 L470 352 L520 349 L520 356 L575 356 L575 347 L620 347 L620 355 L680 355 L680 380 Z" fill="#5D5346"/>
        <!-- Bridge deck with piers at the river head. -->
        <rect x="20" y="380" width="660" height="8" fill="#8C7B5F"/>
        <rect x="20" y="388" width="660" height="6" fill="#6E6152"/>
        <g fill="#524A40">
          <rect x="252" y="394" width="10" height="12"/><rect x="316" y="394" width="10" height="12"/>
          <rect x="380" y="394" width="10" height="12"/><rect x="444" y="394" width="10" height="12"/>
        </g>
        <!-- River with the sunset's reflection. -->
        <rect x="20" y="394" width="660" height="146" fill="url(#river)"/>
        <rect x="120" y="410" width="260" height="6" rx="3" fill="#EBC27E" opacity="0.5"/>
        <rect x="90" y="430" width="330" height="6" rx="3" fill="#E0B26B" opacity="0.4"/>
        <rect x="140" y="452" width="240" height="6" rx="3" fill="#D2A45F" opacity="0.3"/>
        <!-- Quay diagonal, crowd, railing — the right embankment. -->
        <path d="M330 540 L680 436 L680 605 L240 605 Z" fill="#8A7A55"/>
        <path d="M500 605 L680 470 L680 605 Z" fill="#3F4438"/>
        <g fill="#221F1C">
          <circle cx="380" cy="560" r="4"/><circle cx="416" cy="550" r="4"/><circle cx="452" cy="540" r="4"/>
          <circle cx="492" cy="528" r="4"/><circle cx="352" cy="576" r="4"/><circle cx="530" cy="516" r="4"/>
        </g>
      </g>
      <g clip-path="url(#photo)">
        <!-- Layer 2: BOX mode, Georgia italic, auto-sized to its box, onion
             skin ON — so it draws at full strength even though its slide
             reveal has not run at this playhead. Placed in Land, so the sky
             would occlude it; nothing here is sky. -->
        <text x="98" y="512" font-size="34" font-family="Georgia, serif" font-style="italic" fill="#FFFFFF">River Sunset</text>
        <text x="98" y="548" font-size="34" font-family="Georgia, serif" font-style="italic" fill="#FFFFFF">to Dusk</text>
        <!-- Layer 4: Courier, wide tracking, centred. Layer 3 is hidden and
             is deliberately absent. -->
        <text x="350" y="588" font-size="17" font-family="'Courier New', monospace" letter-spacing="3.2" text-anchor="middle" fill="#FFFFFF">12 Aug 2026 · 55 min</text>
      </g>

      <!-- The magenta tint: "Show semantic mask" over the live composite,
           showing what the analysis calls the INSPECTED region (Sky here).
           The tint skips the edge-bias erosion on purpose — that dial biases
           whichever region RESTORES, and baking it in would show a different
           boundary than the segmentation actually produced. -->
      <g clip-path="url(#photo)" id="mask-tint">
        <path d="M20 110 H680 V355 L620 355 L620 347 L575 347 L575 356 L520 356 L520 349 L470 352 L448 344 L385 340 L332 344 L300 350 L300 360 L240 360 L240 352 L175 352 L175 358 L118 358 L118 350 L60 350 L60 356 L20 356 Z" fill="#D900D9" fill-opacity="0.55"/>
      </g>

      <text x="653" y="652" font-size="14" fill="#FFFFFF" data-symbol="arrow.up.left.and.arrow.down.right">⤢</text>
    </g>

    <!-- Timeline strip: play · track with playhead + keyframes · frame steps. -->
    <g id="strip">
      <circle cx="51.5" cy="688" r="13" fill="#FFFFFF"/>
      <path d="M48 682 L58 688 L48 694 Z" fill="#C36A00" data-symbol="play.fill"/>
      <rect x="76" y="686.5" width="522" height="3" rx="1.5" fill="#000000" fill-opacity="0.18"/>
      <rect x="74.5" y="678" width="3" height="20" rx="1.5" fill="#1C1C1E"/>
      <circle cx="222.7" cy="688" r="5.5" fill="#C36A00" stroke="#C36A00" stroke-width="2"/>
      <circle cx="458.6" cy="688" r="5.5" fill="#C36A00" stroke="#C36A00" stroke-width="2"/>
      <circle cx="596.9" cy="688" r="5.5" fill="#C36A00" stroke="#C36A00" stroke-width="2"/>
      <rect x="90" y="666" width="45" height="15" rx="7.5" fill="#2B2B2E" fill-opacity="0.9"/>
      <text x="112.5" y="677" font-size="10" class="sb mono" text-anchor="middle" fill="#FFFFFF">0:00</text>
      <text x="76" y="712" font-size="10" class="mono" fill="#6D6D72">0:00</text>
      <text x="598" y="712" font-size="10" class="mono" text-anchor="end" fill="#6D6D72">55:13</text>
      <circle cx="617" cy="688" r="13" fill="#FFFFFF"/>
      <text x="617" y="692.5" font-size="12.5" class="sb" text-anchor="middle" fill="#B5B5BA" data-symbol="chevron.left">‹</text>
      <circle cx="649" cy="688" r="13" fill="#FFFFFF"/>
      <text x="649" y="692.5" font-size="12.5" class="sb" text-anchor="middle" fill="#C36A00" data-symbol="chevron.right">›</text>
      <!-- The SELECTED layer's reveal span, read-only. Selecting another
           layer moves the band; authoring it is Set Start / Set End. -->
      <rect x="107" y="700" width="68" height="4" rx="2" fill="#C36A00"/>
    </g>

    <line x1="680" y1="48" x2="680" y2="720" stroke="#000" stroke-opacity="0.1"/>

    <!-- Control rail · Masks tab (OverlayMasksPanel). -->
    <g id="rail">
      <g id="railtabs">
        <rect x="696" y="60" width="308" height="36" rx="18" fill="#FFFFFF"/>
        <rect x="927" y="63" width="74" height="30" rx="15" fill="#C36A00"/>
        <text x="736" y="83" font-size="13" class="sb" text-anchor="middle" fill="#C36A00">Editor</text>
        <text x="812" y="83" font-size="13" class="sb" text-anchor="middle" fill="#C36A00">Text</text>
        <text x="888" y="83" font-size="13" class="sb" text-anchor="middle" fill="#C36A00">Frames</text>
        <text x="964" y="83" font-size="13" class="sb" text-anchor="middle" fill="#FFFFFF">Masks</text>
      </g>

      <!-- Intelligent Placement: the PROJECT's regions. Picking one
           selects it for inspection and tuning — it is not a placement,
           and clicking it again deselects. -->
      <g id="card-placement">
        <rect x="696" y="110" width="308" height="330" rx="12" fill="#FFFFFF"/>
        <text x="710" y="132" font-size="13" class="sb" fill="#6D6D72">Intelligent Placement</text>
        <rect x="710" y="142" width="280" height="52" rx="14" fill="#F2F2F7"/>
        <rect x="713" y="145" width="44" height="22" rx="11" fill="#C36A00"/>
        <text x="735" y="160" font-size="11.5" class="sb" text-anchor="middle" fill="#FFFFFF">Sky</text>
        <text x="784" y="160" font-size="11.5" class="sb" text-anchor="middle" fill="#C36A00">Land</text>
        <text x="848" y="160" font-size="11.5" class="sb" text-anchor="middle" fill="#C36A00">Rooftops</text>
        <text x="777" y="184" font-size="11.5" class="sb" text-anchor="middle" fill="#C36A00">Below the roofline</text>
        <text x="710" y="212" font-size="11.5" fill="#6D6D72">Post-processing only. Masks are cached raw, so</text>
        <text x="710" y="226" font-size="11.5" fill="#6D6D72">these dials cost no re-inference.</text>
        <!-- The tint and the dials only exist once a region is chosen. -->
        <rect x="710.5" y="240.5" width="15" height="15" rx="4" fill="#C36A00"/>
        <path d="M714 248 L717 251 L722 245" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" data-symbol="checkmark"/>
        <text x="734" y="253" font-size="13.5" class="sb" fill="#000000">Show semantic mask</text>
        <text x="710" y="279" font-size="12.5" class="sb" fill="#6D6D72">Analysis</text>
        <rect x="840" y="266" width="150" height="26" rx="13" fill="#F2F2F7"/>
        <rect x="842" y="268" width="76" height="22" rx="11" fill="#C36A00"/>
        <text x="880" y="283" font-size="11.5" class="sb" text-anchor="middle" fill="#FFFFFF">Sequence</text>
        <text x="954" y="283" font-size="11.5" class="sb" text-anchor="middle" fill="#C36A00">This frame</text>
        <text x="708" y="314" font-size="12.5" class="sb" fill="#6D6D72">Threshold</text>
        <rect x="782" y="310" width="148" height="4" rx="2" fill="#C36A00" fill-opacity="0.35"/>
        <rect x="782" y="310" width="74" height="4" rx="2" fill="#C36A00"/>
        <circle cx="856" cy="312" r="9" fill="#FFFFFF" stroke="#000" stroke-opacity="0.12"/>
        <text x="1002" y="316" font-size="11.5" class="sb mono" text-anchor="end" fill="#6D6D72">0.50</text>
        <text x="708" y="345" font-size="12.5" class="sb" fill="#6D6D72">Feather</text>
        <rect x="782" y="341" width="148" height="4" rx="2" fill="#C36A00" fill-opacity="0.35"/>
        <rect x="782" y="341" width="46" height="4" rx="2" fill="#C36A00"/>
        <circle cx="828" cy="343" r="9" fill="#FFFFFF" stroke="#000" stroke-opacity="0.12"/>
        <text x="1002" y="347" font-size="11.5" class="sb mono" text-anchor="end" fill="#6D6D72">2.5</text>
        <text x="708" y="376" font-size="12.5" class="sb" fill="#6D6D72">Edge bias</text>
        <rect x="782" y="372" width="148" height="4" rx="2" fill="#C36A00" fill-opacity="0.35"/>
        <rect x="782" y="372" width="56" height="4" rx="2" fill="#C36A00"/>
        <circle cx="838" cy="374" r="9" fill="#FFFFFF" stroke="#000" stroke-opacity="0.12"/>
        <text x="1002" y="378" font-size="11.5" class="sb mono" text-anchor="end" fill="#6D6D72">1.5</text>
        <text x="710" y="410" font-size="11" fill="#6D6D72">sequence vote · 9 frames · disk cache</text>
      </g>

      <!-- Custom masks: hand-supplied black &amp; white files that belong to
           the PROJECT. White is the region the name refers to; the
           optional inverted name gives its complement a pill too. -->
      <g id="card-custom">
        <rect x="696" y="452" width="308" height="246" rx="12" fill="#FFFFFF"/>
        <text x="710" y="474" font-size="13" class="sb" fill="#6D6D72">Custom Masks</text>
        <text x="990" y="474" font-size="11" class="mono" text-anchor="end" fill="#6D6D72">1 mask</text>
        <rect x="710.5" y="486.5" width="279" height="86" rx="10" fill="none" stroke="#000" stroke-opacity="0.09"/>
        <rect x="720" y="496" width="52" height="40" rx="5" fill="#FFFFFF"/>
        <path d="M720 496 H772 V513 L758 510 L744 516 L730 511 L720 517 Z" fill="#1C1C1E"/>
        <rect x="782.5" y="496.5" width="180" height="24" rx="5" fill="#FFFFFF" stroke="#000" stroke-opacity="0.18"/>
        <text x="790" y="513" font-size="12.5" class="sb" fill="#000000">Rooftops</text>
        <rect x="782.5" y="525.5" width="180" height="24" rx="5" fill="#FFFFFF" stroke="#000" stroke-opacity="0.18"/>
        <text x="790" y="542" font-size="12" fill="#3A3A3C">Below the roofline</text>
        <path d="M969 501 H980 M971.5 501 V499 H977.5 V501 M970.4 501 L971.1 511.5 H978 L978.7 501" stroke="#C7C7CC" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round" data-symbol="trash"/>
        <line x1="711" y1="549" x2="989" y2="549" stroke="#000" stroke-opacity="0.07"/>
        <rect x="720.5" y="554.5" width="14" height="14" rx="4" fill="#FFFFFF" stroke="#000" stroke-opacity="0.28"/>
        <text x="742" y="566" font-size="11.5" fill="#3A3A3C">Replace Sky &amp; Land (once per project)</text>
        <rect x="710.75" y="584.75" width="278.5" height="64" rx="10" fill="#C36A00" fill-opacity="0.04" stroke="#C36A00" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 3"/>
        <text x="850" y="612" font-size="13" class="sb" text-anchor="middle" fill="#C36A00">＋ Add Custom Mask</text>
        <text x="850" y="628" font-size="10.5" text-anchor="middle" fill="#8A8A8E">Drop a black &amp; white PNG or JPEG</text>
        <text x="710" y="668" font-size="11.5" fill="#6D6D72">Masks belong to the project, not the layer — every</text>
        <text x="710" y="682" font-size="11.5" fill="#6D6D72">text layer can pick any of them.</text>
      </g>
    </g>
  </g>

  <rect x="20" y="20" width="1000" height="700" rx="11" fill="none" stroke="#000" stroke-opacity="0.16"/>
  <text x="520" y="742" font-size="13" class="sb" text-anchor="middle" fill="#000">macOS · Photo viewer / grading editor · Masks tab · 1000×700 pt window</text>
  <text x="520" y="760" font-size="11" text-anchor="middle" fill="#6D6D72">mirrors App/PhotoViewerView.swift (masksTab) + App/Overlay/OverlayMasksPanel.swift — Editor, Text and Frames rail pages in photo-viewer.svg / photo-viewer.text.svg / photo-viewer.frames.svg</text>
</svg>
