<svg viewBox="0 0 800 750" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>macOS · Settings · Libraries · Disconnect this library from PicPlace? (confirm with the numbers) · 760×680</title>
  <desc>Mirrors the Libraries row's Disconnect… confirmationDialog (App/SettingsView.swift, confirmingDisconnect) over PicPlaceController.disconnectMessage — libraries plan L14 and step 0's L23 (2026-09-17; verified against the Mac bench, plan §17.7 T1). Over the card: 'Disconnect this library from PicPlace?' and the numbers — 'The library stops syncing and forgets its account and what it has synced. 2 previews pulled from PicPlace stay on this Mac but cannot download until you connect it again. 1 project with originals here stays as it is. Nothing changes on PicPlace. Switching libraries never needs this.' — Cancel · Disconnect (red). The binding and the sync records go, nothing else: the previews stay, and a later link to the same library finds them in step.</desc>
  <defs>
    <clipPath id="win"><rect x="20" y="20" width="760" height="680" rx="11"/></clipPath>
    <filter id="sheetshadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.20"/></filter>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.mono{font-variant-numeric:tabular-nums}</style>
  <g clip-path="url(#win)">
    <rect x="20" y="20" width="760" height="680" fill="#F2F2F7"/>
    <g id="titlebar">
      <rect x="20" y="20" width="760" height="40" fill="#F6F6F8"/>
      <line x1="20" y1="60" x2="780" y2="60" stroke="#000" stroke-opacity="0.08"/>
      <circle cx="40" cy="40" r="6" fill="#FF736A"/><circle cx="60" cy="40" r="6" fill="#FEBC2E"/><circle cx="80" cy="40" r="6" fill="#19C332"/>
      <text x="400" y="45" font-size="13" class="sb" text-anchor="middle" fill="#000" fill-opacity="0.85">Settings</text>
    </g>
    <text x="36" y="76" font-size="12" fill="#6D6D72" font-weight="600">LIBRARIES</text>
    <rect id="libraries-card" x="36" y="86" width="728" height="386" rx="12" fill="#FFF"/>
    <text x="52" y="110" font-size="16" fill="#000">Prague LetsLapse Shots</text>
    <text x="52" y="126" font-size="11.5" fill="#6D6D72">/Volumes/letslapse/picplace.test/regularsteven · 401 projects · @regularsteven on picplace.test</text>
    <text x="586" y="110" font-size="13" fill="#6D6D72" text-anchor="middle">✎</text>
    <text x="686" y="110" font-size="13" fill="#FF3B30" text-anchor="end">Disconnect…</text>
    <text x="748" y="110" font-size="13" fill="#6D6D72" text-anchor="end">Current</text>
    <line x1="52" y1="136" x2="748" y2="136" stroke="#000" stroke-opacity="0.08"/>
    <text x="52" y="160" font-size="16" fill="#000">Holidays</text>
    <text x="52" y="176" font-size="11.5" fill="#6D6D72">~/Library/Application Support/LetsLapse/picplace.test/regularsteven · 877 projects · @r…</text>
    <text x="676" y="160" font-size="13" fill="#6D6D72" text-anchor="middle">✎</text>
    <rect x="692" y="148" width="56" height="24" rx="6" fill="#000" fill-opacity="0.06"/>
    <text x="720.0" y="164.5" font-size="13" fill="#000" text-anchor="middle">Switch…</text>
    <line x1="52" y1="186" x2="748" y2="186" stroke="#000" stroke-opacity="0.08"/>
    <text x="52" y="210" font-size="16" fill="#6D6D72">LetsLapse</text>
    <text x="52" y="226" font-size="11.5" fill="#6D6D72">~/Library/Application Support/LetsLapse · 0 projects</text>
    <text x="676" y="210" font-size="13" fill="#C36A00" text-anchor="middle">✎</text>
    <rect x="692" y="198" width="56" height="24" rx="6" fill="#000" fill-opacity="0.06"/>
    <text x="720.0" y="214.5" font-size="13" fill="#000" text-anchor="middle">Switch…</text>
    <line x1="52" y1="236" x2="748" y2="236" stroke="#000" stroke-opacity="0.08"/>
    <text x="52" y="260" font-size="16" fill="#C36A00">Create New Library…</text>
    <text x="52" y="276" font-size="11.5" fill="#6D6D72">An empty library in a folder of your choosing. Nothing is copied.</text>
    <line x1="52" y1="294" x2="748" y2="294" stroke="#000" stroke-opacity="0.08"/>
    <text x="52" y="318" font-size="16" fill="#C36A00">Open Other Library…</text>
    <text x="52" y="334" font-size="11.5" fill="#6D6D72">A LetsLapse library on any drive — switches to it on relaunch.</text>
    <line x1="52" y1="352" x2="748" y2="352" stroke="#000" stroke-opacity="0.08"/>
    <text x="52" y="376" font-size="16" fill="#C36A00">Add Library from PicPlace…</text>
    <text x="52" y="392" font-size="11.5" fill="#6D6D72">1 of your libraries is on picplace.test and not on this Mac: “Client X”.</text>
    <line x1="52" y1="410" x2="748" y2="410" stroke="#000" stroke-opacity="0.08"/>
    <text x="52" y="434" font-size="16" fill="#C36A00">Move This Library…</text>
    <text x="52" y="450" font-size="11.5" fill="#6D6D72">Copies “Prague LetsLapse Shots” — about 12,4 GB — to another folder. Nothing is deleted.</text>
    <rect x="20" y="60" width="760" height="640" fill="#000" fill-opacity="0.18"/>
    <rect x="290" y="240" width="220" height="250" rx="14" fill="#F2F2F7" filter="url(#sheetshadow)"/>
    <rect x="384" y="256" width="32" height="32" rx="7" fill="#C36A00"/>
    <text x="400" y="314" font-size="13" fill="#000" font-weight="700" text-anchor="middle">Disconnect this library</text>
    <text x="400" y="330" font-size="13" fill="#000" font-weight="700" text-anchor="middle">from PicPlace?</text>
    <text x="400" y="350.0" font-size="10" fill="#000" text-anchor="middle">The library stops syncing and forgets</text>
    <text x="400" y="362.5" font-size="10" fill="#000" text-anchor="middle">its account and what it has synced. 2</text>
    <text x="400" y="375.0" font-size="10" fill="#000" text-anchor="middle">previews pulled from PicPlace stay on</text>
    <text x="400" y="387.5" font-size="10" fill="#000" text-anchor="middle">this Mac but cannot download until you</text>
    <text x="400" y="400.0" font-size="10" fill="#000" text-anchor="middle">connect it again. 1 project with</text>
    <text x="400" y="412.5" font-size="10" fill="#000" text-anchor="middle">originals here stays as it is. Nothing</text>
    <text x="400" y="425.0" font-size="10" fill="#000" text-anchor="middle">changes on PicPlace. Switching libraries</text>
    <text x="400" y="437.5" font-size="10" fill="#000" text-anchor="middle">never needs this.</text>
    <rect x="302" y="456" width="94" height="24" rx="6" fill="#000" fill-opacity="0.06"/>
    <text x="349.0" y="472.5" font-size="13" fill="#000" text-anchor="middle">Cancel</text>
    <rect x="404" y="456" width="94" height="24" rx="6" fill="#000" fill-opacity="0.06"/>
    <text x="451.0" y="472.5" font-size="13" fill="#FF3B30" text-anchor="middle">Disconnect</text>
  </g>
</svg>
