<svg viewBox="0 0 800 790" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>macOS · Shape-mation · builder · Match (rectangle) · 760×680</title>
  <desc>Mirrors App/Shapemation/ShapemationBuilderView.swift, the Match step for the Rectangle family (&#x27;How strict about the rectangle?&#x27;) over the per-family strictness model (Shape-mation Match/Sort/Timing, 2026-09-11: aspect classes + orientation). Mirrored from the Debug build on the tram clone 2026-09-20 after choosing Rectangle; capture scratchpad/mirrors/mac/builder.match.rectangle.png (2×, key window), copy from its AX dump. One card: &#x27;Aspect&#x27; over eight 28 pt capsule chips in two rows — Any (lit, accent) · 4:3 · 3:2 · 16:9 · Page / 5:4 · 2:1 · Custom (controlFill #E9E9EB, 15 pt); &#x27;Orientation&#x27; over a 24 pt segmented Any|Landscape|Portrait (Any); then the strictness sentence &#x27;Every rectangle. Measured on the true rectangle and corrected for the camera angle where the lens is known — 2 of 84 here; the others matched as they appear on screen.&#x27; Under the card the live tally &#x27;83 projects · 84 rectangles match&#x27;. Pinned bottom bar with &#x27;Next · projects&#x27; (165×47). The Circle / Oval / Square variants (roundness, aspect) are the iOS files shapemation.builder.match.{circle,oval,square}.portrait.svg; the Mac renders the same step. GEOMETRY: sheet 680 pt from y=32; heading at x=120 (this step&#x27;s cards are inset 118–643, two points wider than the others&#x27; 116–644 — the app&#x27;s own layout); chips y 169 and 207.</desc>
