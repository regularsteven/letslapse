  <rect x="20" y="20" width="760" height="680" rx="11" fill="none" stroke="#000" stroke-opacity="0.16"/>
  <text x="400" y="758" font-size="13" class="sb" text-anchor="middle" fill="#000">macOS · Shape-mation · Find shapes · plan · 760×680 pt window, 560×680 pt sheet</text>
  <text x="400" y="776" font-size="11" text-anchor="middle" fill="#6D6D72">mirrors App/Shapemation/FindShapesView.swift — LL_SHAPEMATION=find LL_SHAPES_SCOPE=all on the tram clone · Use all / high / all / all · 114 of 114</text>
</svg>
