<svg viewBox="0 0 800 790" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>macOS · Shape-mation · builder · Output step, frame mode — defaults (sheet) · 760×680</title>
  <desc>Mirrors App/Shapemation/ShapemationBuilderView.swift — ShapemationOutputView in FRAME mode (docs/shapemation/output-frame.md §6, code first 2026-09-19): frameCard (Aspect · Size · Face size · Face place · Ease), scrubCard (the evaluator's preview, verdictBadge, the scrub Slider, feasibilitySummary), the estimate and Create Shape-mation, with ShapemationFacePlacePicker for the two 3×3 grids — in the Mac's 560-wide Shape-mation sheet over the Create tab. Drawn 2026-09-20, mirrored from the Debug build on the tram clone (LL_SHAPEMATION=build LL_CHIPS=tram, then Mode → Output frame → Next · timing → Next · output by hand over the 83 rectangle projects — LL_SHAPEMATION=frame was not used: that seed takes the first family with shapes, Circle, 1 project; captures builder.output.frame.png (top) and builder.output.frame.wontfill.png (scrolled, axslider scrub 40) + AX dumps). THIS FILE is the step UNSCROLLED at its defaults: 16:9 lit, 1 920 long edge (1 920×1 080), Face size Start 25 % of the height / End 25 % · Same, Face place centre → centre (End · Same), Ease Linear; the scrub card's black preview just enters at the sheet's foot. GEOMETRY: window, title bar, sheet and nav bar as in shapemation.builder.mode.svg; this step scrolls inside the sheet with an always-on 15 pt scroller gutter at the sheet's right edge (thumb drawn as captured), so the cards are 511 wide, not 527. 'Output frame' 17/600, then 13 secondary 'Every photo is scaled and placed to put its rectangle here. One that cannot reach the frame's edges, or would be blown up to, is flagged and kept.' FRAME CARD (llCard radius 18, 511×450.5 at y 191.5, 16 pt padding, 16 between groups; group titles 14 pt): ASPECT — FlowChips 1:1 · 4:5 · 3:2 · 16:9 · 2:3 · 9:16 as 25.5 pt capsules (#E9E9EB, 13 pt; the chosen one accent with a white 13/500 label; the sixth wraps to a second row 8 below); SIZE — 'Size' 15 pt, the pixel size 13 secondary and an NSPopUpButton of ShapemationFraming.sizePresets (80.5×23.5, '1 920'; its AX description 'Size: 1 920 long edge'); FACE SIZE — two 14 pt Steppers 'Start 25 % of the height' and 'End 25 % · Same' (the End follows the Start until it is touched — endSizeFollowsStart), each with the macOS 19.5×24.5 stepper (#EBEBEB, chevron.up.chevron.down); FACE PLACE — two ShapemationFacePlacePicker grids 24 apart (95.5×53.5, radius 8, #E9E9EB; nine dots 4.5 pt #C9C9CA, the chosen place a 6.5 pt accent dot; AX 'Face start: centre middle' etc.), captioned 'Start' and 'End · Same' 12 secondary (endPlaceFollowsStart); EASE — Linear · Ease in and out segmented (two 116.75 pt seats, Linear chosen). SCRUB CARD (llCard radius 18, 511×393.5, 12 under the frame card): the FramePreview image — the photo at ≤ 2048 px placed and cropped to the frame at ≤ 960 px on the long edge, over black — in a 461.5×259.5 (16:9) black table with radius 10; here the 3:4 tram still stands 168.5×223.5 in the middle of it with its rectangle face at 25 % of the height (drawn as a flat tram stand-in, never a PNG), which is exactly why it cannot fill a 16:9 frame; the title 14/600 with the verdict badge at the trailing edge; the Slider; the counter; the flagged line. 9:16 (builder.output.frame.916*.png, desc-only): Size reads 1 080×1 920 and 66 photos won't fill the frame; the 4-project Tatra T3 selection at 9:16 reads '3 photos won't fill the frame' / '4 photos · 25 fps · 1 s each' / '4.0 s of playback · 100 frames · largest first' (builder.output.frame.small.png) — the state the done card was rendered from. Then the ESTIMATE 12 secondary ('83 photos · 25 fps · 1 s each' / '83.0 s of playback · 2075 frames · largest first') and CREATE SHAPE-MATION (511×50.5, radius 10, 16/600 white), which renders at the framing's size (builder.framing.outputSize) and lands on shapemation.builder.done.svg. Same screen on iOS: ../iOS/shapemation.builder.output.frame.portrait.svg (planned; captured 2026-09-20 on the iPhone 16 Pro simulator, not yet drawn).</desc>
