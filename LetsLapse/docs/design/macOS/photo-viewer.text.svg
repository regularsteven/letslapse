<svg viewBox="0 0 1040 790" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>macOS · Photo viewer / grading editor · Text tab · 1000×700</title>
  <desc>Mirrors App/PhotoViewerView.swift (textTab) hosting App/Overlay/OverlayEditingPanel.swift — the Text page of the editor rail added by the 2026-08-31 text-overlay spike. Window, media column and timeline strip are photo-viewer.svg's (same staged project, same moment); only the rail differs, which is the point of the tab refactor. THE PAGE edits the project's ONE text overlay (the model is [SceneOverlay] — many; the UI deliberately exposes the first) stored in the per-project overlays.json sidecar (OverlayDocument: overlays + mask dials; persisted on finished gestures — drag release, Return, segment taps — plus a 2s safety net, exit and window close; a second window on the same project can never bulldoze the sidecar because persists no-op when unchanged). Empty state (not drawn): a single "+ Add Text" card with the one-line footnote "Drag the text on the preview to place it. Where it rests is where every animation ends." CARDS, top to bottom: TEXT — "Text" caption, the string field (Return commits; typing re-renders live through the 100ms debounce), and Size (0.03…0.2 of the frame's LONG edge — resolves identically at every render size; drawn near max, the staged overlay being hero-sized). INTELLIGENT PLACEMENT — None · Sky · Land capsule segments (Sky selected; Land is the same analysis inverted, never a second detector), footnote "The scene occludes the text — its position never moves." (the product's core promise: the AI composites, the user places); "Show semantic mask" checkbox (OFF here — ON tints the post-processed sky region magenta over the live composite, edge-bias excluded from the tint so the debug view shows what segmentation produced, not what the restorer eroded); Analysis Sequence · This frame (Sequence selected — the 9-frame vote mask, flicker-proof for a locked-off shoot; This frame is the drift-inspection mode and never what exports use); the three live dials Threshold / Feather / Edge bias (post-processing only — masks are cached raw, so the dials cost zero re-inference; edge bias erodes whichever region RESTORES, so bias always means less occlusion); and the mask status line ("disk cache" here — otherwise model id · revision · inference ms, "sequence vote · 9 frames", "Analyzing scene…", or an error). With NO segmentation model installed the segments render disabled with the footnote "Intelligent placement needs the segmentation model — download it in Settings ▸ AI Models. Text placement works without it." (desc-only). ANIMATION — None · Fade · Slide segments (None selected in the staged state; choosing Fade/Slide reveals, desc-only: a From direction row for Slide (Top/Bottom/Left/Right), Set Start / Set End buttons that pin the band to the playhead — the playhead is the precision instrument, so there are no draggable band handles — showing their positions in the strip's own clock, the footnote "The reveal runs across this span of the shoot and always finishes exactly where the text rests.", and a passive 4pt accent range band under the strip aligned via GradeTimelineView.leadInset; reveals are per-character with overlap 0.6, eased by the house cubic, and the settled raster is byte-identical to no animation — the resting layout IS the end state). REMOVE TEXT — red, the only way the sidecar file is ever deleted. ON THE PREVIEW (this tab only): the overlay is draggable — baked at rest, a SwiftUI proxy takes over during the drag (frozen committed centre + translation ÷ drawn size, unit-clamped, committed and persisted on release; a cancelled drag heals back). Exports bake exactly this page's state — same compositing core, sequence mask, dials from the sidecar. Hooks: LL_EDITOR=&lt;uuid&gt;, LL_SEG_MODEL=&lt;path&gt;; model install via Settings ▸ AI Models (DETR Segmentation row). Verified against the running Mac app 2026-08-31 (Retina capture measured to the point; staged overlay "LetsLapse", Sky, no animation).</desc>
  <defs>
    <clipPath id="win"><rect x="20" y="20" width="1000" height="700" rx="11"/></clipPath>
    <clipPath id="photo"><rect x="20" y="110" width="660" height="495"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA3B8"/>
      <stop offset="0.45" stop-color="#E8B98C"/>
      <stop offset="1" stop-color="#F6DFB2"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9A45E"/>
      <stop offset="1" stop-color="#5C666E"/>
    </linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.mono{font-variant-numeric:tabular-nums}</style>

  <g clip-path="url(#win)">
    <rect x="20" y="20" width="1000" height="700" fill="#F2F2F7"/>

    <g id="titlebar">
      <rect x="20" y="20" width="1000" height="28" fill="#F6F6F8"/>
      <circle cx="34" cy="34" r="6" fill="#FF736A"/><circle cx="54" cy="34" r="6" fill="#FEBC2E"/><circle cx="74" cy="34" r="6" fill="#19C332"/>
      <text x="520" y="38" font-size="13" class="sb" text-anchor="middle" fill="#000" fill-opacity="0.85">River Sunset to Dusk</text>
    </g>

    <!-- Media column: black pane, 4:3 picture fitted and centred, zoom
         control bottom-trailing. The picture is a flat approximation of the
         staged frame: sunset sky, the overlay text, then skyline / bridge /
         river / quay — the skyline is drawn AFTER the text on purpose, so
         the drawing occludes the descenders the way the composite does. -->
    <g id="media">
      <rect x="20" y="48" width="660" height="618" fill="#000000"/>
      <g clip-path="url(#photo)">
        <rect x="20" y="110" width="660" height="495" fill="url(#sky)"/>
        <ellipse cx="200" cy="180" rx="160" ry="24" fill="#7E93A9" opacity="0.35"/>
        <ellipse cx="480" cy="150" rx="190" ry="22" fill="#8A9DB1" opacity="0.3"/>
        <ellipse cx="360" cy="240" rx="230" ry="22" fill="#EACBA0" opacity="0.45"/>
        <ellipse cx="150" cy="300" rx="170" ry="16" fill="#F2D9AE" opacity="0.5"/>
        <!-- The project's text overlay at its resting layout (Text tab owns
             editing it; it is baked into the preview on every tab). -->
        <text x="345" y="360" font-size="96" class="b" text-anchor="middle" fill="#FFFFFF">LetsLapse</text>
        <!-- Skyline band drawn AFTER the text — only the baseline bottoms and
             descenders sink behind the rooftops, the way the composite cuts. -->
        <path d="M20 380 L20 356 L60 356 L60 350 L118 350 L118 358 L175 358 L175 352 L240 352 L240 360 L300 360 L300 350 L332 344 L385 340 L448 344 L470 352 L520 349 L520 356 L575 356 L575 347 L620 347 L620 355 L680 355 L680 380 Z" fill="#5D5346"/>
        <!-- Bridge deck with piers at the river head. -->
        <rect x="20" y="380" width="660" height="8" fill="#8C7B5F"/>
        <rect x="20" y="388" width="660" height="6" fill="#6E6152"/>
        <g fill="#524A40">
          <rect x="252" y="394" width="10" height="12"/><rect x="316" y="394" width="10" height="12"/>
          <rect x="380" y="394" width="10" height="12"/><rect x="444" y="394" width="10" height="12"/>
        </g>
        <!-- River with the sunset's reflection. -->
        <rect x="20" y="394" width="660" height="146" fill="url(#river)"/>
        <rect x="120" y="410" width="260" height="6" rx="3" fill="#EBC27E" opacity="0.5"/>
        <rect x="90" y="430" width="330" height="6" rx="3" fill="#E0B26B" opacity="0.4"/>
        <rect x="140" y="452" width="240" height="6" rx="3" fill="#D2A45F" opacity="0.3"/>
        <!-- Quay diagonal, crowd, railing — the right embankment. -->
        <path d="M330 540 L680 436 L680 605 L240 605 Z" fill="#8A7A55"/>
        <path d="M500 605 L680 470 L680 605 Z" fill="#3F4438"/>
        <g fill="#221F1C">
          <circle cx="380" cy="560" r="4"/><circle cx="416" cy="550" r="4"/><circle cx="452" cy="540" r="4"/>
          <circle cx="492" cy="528" r="4"/><circle cx="352" cy="576" r="4"/><circle cx="530" cy="516" r="4"/>
        </g>
      </g>
      <text x="653" y="652" font-size="14" fill="#FFFFFF" data-symbol="arrow.up.left.and.arrow.down.right">⤢</text>
    </g>

    <!-- Timeline strip: play · track with playhead + keyframes · frame steps. -->
    <g id="strip">
      <circle cx="51.5" cy="688" r="13" fill="#FFFFFF"/>
      <path d="M48 682 L58 688 L48 694 Z" fill="#C36A00" data-symbol="play.fill"/>
      <rect x="76" y="686.5" width="522" height="3" rx="1.5" fill="#000000" fill-opacity="0.18"/>
      <rect x="74.5" y="678" width="3" height="20" rx="1.5" fill="#1C1C1E"/>
      <circle cx="222.7" cy="688" r="5.5" fill="#C36A00" stroke="#C36A00" stroke-width="2"/>
      <circle cx="458.6" cy="688" r="5.5" fill="#C36A00" stroke="#C36A00" stroke-width="2"/>
      <circle cx="596.9" cy="688" r="5.5" fill="#C36A00" stroke="#C36A00" stroke-width="2"/>
      <rect x="90" y="666" width="45" height="15" rx="7.5" fill="#2B2B2E" fill-opacity="0.9"/>
      <text x="112.5" y="677" font-size="10" class="sb mono" text-anchor="middle" fill="#FFFFFF">0:00</text>
      <text x="76" y="712" font-size="10" class="mono" fill="#6D6D72">0:00</text>
      <text x="598" y="712" font-size="10" class="mono" text-anchor="end" fill="#6D6D72">55:13</text>
      <circle cx="617" cy="688" r="13" fill="#FFFFFF"/>
      <text x="617" y="692.5" font-size="12.5" class="sb" text-anchor="middle" fill="#B5B5BA" data-symbol="chevron.left">‹</text>
      <circle cx="649" cy="688" r="13" fill="#FFFFFF"/>
      <text x="649" y="692.5" font-size="12.5" class="sb" text-anchor="middle" fill="#C36A00" data-symbol="chevron.right">›</text>
    </g>

    <line x1="680" y1="48" x2="680" y2="720" stroke="#000" stroke-opacity="0.1"/>

    <!-- Control rail · Text tab (OverlayEditingPanel). -->
    <g id="rail">
      <g id="railtabs">
        <rect x="696" y="60" width="308" height="36" rx="18" fill="#FFFFFF"/>
        <rect x="801" y="63" width="99" height="30" rx="15" fill="#C36A00"/>
        <text x="748" y="83" font-size="13" class="sb" text-anchor="middle" fill="#C36A00">Editor</text>
        <text x="850" y="83" font-size="13" class="sb" text-anchor="middle" fill="#FFFFFF">Text</text>
        <text x="951" y="83" font-size="13" class="sb" text-anchor="middle" fill="#C36A00">Frames</text>
      </g>

      <g id="card-text">
        <rect x="696" y="108" width="308" height="108" rx="12" fill="#FFFFFF"/>
        <text x="712" y="134" font-size="13" class="sb" fill="#6D6D72">Text</text>
        <rect x="712" y="146" width="276" height="30" rx="6" fill="#FFFFFF" stroke="#000" stroke-opacity="0.22"/>
        <text x="722" y="166" font-size="14" fill="#000">LetsLapse</text>
        <text x="712" y="200" font-size="12.5" class="sb" fill="#6D6D72">Size</text>
        <rect x="750" y="194" width="238" height="4" rx="2" fill="#C36A00" fill-opacity="0.35"/>
        <rect x="750" y="194" width="212" height="4" rx="2" fill="#C36A00"/>
        <circle cx="962" cy="196" r="9" fill="#FFFFFF" stroke="#000" stroke-opacity="0.12"/>
      </g>

      <g id="card-placement">
        <rect x="696" y="236" width="308" height="292" rx="12" fill="#FFFFFF"/>
        <text x="712" y="262" font-size="13" class="sb" fill="#6D6D72">Intelligent Placement</text>
        <rect x="710" y="276" width="148" height="30" rx="15" fill="#F2F2F7"/>
        <text x="738" y="296" font-size="11.5" class="sb" text-anchor="middle" fill="#C36A00">None</text>
        <rect x="762" y="279" width="46" height="24" rx="12" fill="#C36A00"/>
        <text x="785" y="296" font-size="11.5" class="sb" text-anchor="middle" fill="#FFFFFF">Sky</text>
        <text x="832" y="296" font-size="11.5" class="sb" text-anchor="middle" fill="#C36A00">Land</text>
        <text x="712" y="324" font-size="11.5" fill="#6D6D72">The scene occludes the text — its position</text>
        <text x="712" y="339" font-size="11.5" fill="#6D6D72">never moves.</text>
        <rect x="712" y="352" width="14" height="14" rx="4" fill="#FFFFFF" stroke="#000" stroke-opacity="0.3"/>
        <text x="734" y="364" font-size="13.5" class="sb" fill="#000">Show semantic mask</text>
        <text x="712" y="394" font-size="12.5" class="sb" fill="#6D6D72">Analysis</text>
        <rect x="772" y="376" width="164" height="30" rx="15" fill="#F2F2F7"/>
        <rect x="776" y="379" width="78" height="24" rx="12" fill="#C36A00"/>
        <text x="815" y="396" font-size="11.5" class="sb" text-anchor="middle" fill="#FFFFFF">Sequence</text>
        <text x="895" y="396" font-size="11.5" class="sb" text-anchor="middle" fill="#C36A00">This frame</text>
        <g id="dial-threshold">
          <text x="712" y="428" font-size="12.5" class="sb" fill="#6D6D72">Threshold</text>
          <rect x="788" y="422" width="200" height="4" rx="2" fill="#C36A00" fill-opacity="0.35"/>
          <rect x="788" y="422" width="100" height="4" rx="2" fill="#C36A00"/>
          <circle cx="888" cy="424" r="9" fill="#FFFFFF" stroke="#000" stroke-opacity="0.12"/>
        </g>
        <g id="dial-feather">
          <text x="712" y="458" font-size="12.5" class="sb" fill="#6D6D72">Feather</text>
          <rect x="788" y="452" width="200" height="4" rx="2" fill="#C36A00" fill-opacity="0.35"/>
          <rect x="788" y="452" width="63" height="4" rx="2" fill="#C36A00"/>
          <circle cx="851" cy="454" r="9" fill="#FFFFFF" stroke="#000" stroke-opacity="0.12"/>
        </g>
        <g id="dial-edgebias">
          <text x="712" y="488" font-size="12.5" class="sb" fill="#6D6D72">Edge bias</text>
          <rect x="788" y="482" width="200" height="4" rx="2" fill="#C36A00" fill-opacity="0.35"/>
          <rect x="788" y="482" width="75" height="4" rx="2" fill="#C36A00"/>
          <circle cx="863" cy="484" r="9" fill="#FFFFFF" stroke="#000" stroke-opacity="0.12"/>
        </g>
        <text x="712" y="514" font-size="11" fill="#6D6D72">disk cache</text>
      </g>

      <g id="card-animation">
        <rect x="696" y="548" width="308" height="88" rx="12" fill="#FFFFFF"/>
        <text x="712" y="574" font-size="13" class="sb" fill="#6D6D72">Animation</text>
        <rect x="710" y="588" width="152" height="30" rx="15" fill="#F2F2F7"/>
        <rect x="714" y="591" width="50" height="24" rx="12" fill="#C36A00"/>
        <text x="739" y="608" font-size="11.5" class="sb" text-anchor="middle" fill="#FFFFFF">None</text>
        <text x="789" y="608" font-size="11.5" class="sb" text-anchor="middle" fill="#C36A00">Fade</text>
        <text x="837" y="608" font-size="11.5" class="sb" text-anchor="middle" fill="#C36A00">Slide</text>
      </g>

      <g id="card-remove">
        <rect x="696" y="650" width="308" height="52" rx="12" fill="#FFFFFF"/>
        <text x="812" y="682" font-size="14" class="sb" fill="#FF3B30" data-symbol="trash">🗑</text>
        <text x="836" y="682" font-size="14" class="sb" fill="#FF3B30">Remove Text</text>
      </g>
    </g>
  </g>

  <rect x="20" y="20" width="1000" height="700" rx="11" fill="none" stroke="#000" stroke-opacity="0.16"/>
  <text x="520" y="742" font-size="13" class="sb" text-anchor="middle" fill="#000">macOS · Photo viewer / grading editor · Text tab · 1000×700 pt window</text>
  <text x="520" y="760" font-size="11" text-anchor="middle" fill="#6D6D72">mirrors App/PhotoViewerView.swift (textTab) + App/Overlay/OverlayEditingPanel.swift — Editor and Frames rail pages in photo-viewer.svg / photo-viewer.frames.svg</text>
</svg>
