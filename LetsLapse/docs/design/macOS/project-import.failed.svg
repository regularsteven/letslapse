<svg viewBox="0 0 800 750" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>macOS · Project import · failed · 760×680</title>
  <desc>Mirrors App/ProjectImport.swift (ProjectImportSheet, phase .failed) over AppModel.importProject's catch. The failure is HELD ON THE SHEET rather than dropped into AppModel.errorMessage, which is the Create screen's banner: a double-click import can happen with no LetsLapse window in front of the human at all, so a banner on a screen they are not looking at would simply go unread. The reason shown is the thrown error's own localizedDescription — drawn here with AppModel.ImportError.insufficientStorage, the one check made before any bytes are written (the archive's own compressed size against the volume's available capacity for important usage; lzfse barely shrinks video and stills, so that is a fair floor for what it will unpack to, and refusing up front beats filling the disk and failing somewhere in the middle). The other reasons that land here: ProjectArchiveError.notAProjectArchive (unpacked, but no project.json at the root — what a renamed or truncated file gets), ProjectArchiveError.unsupportedVersion (a manifest from a newer LetsLapse), and any I/O failure out of AppleArchive. NOT drawn here because it is not a failure: cancelling. DirectoryArchiveError.cancelled is caught separately and says nothing at all — the sheet just closes, the half-extracted tree is deleted, and nothing joins the library. Close (⏎) is the only exit; it clears the sheet and starts whatever was opened behind it in the queue. Nothing reached the library, so there is nothing to undo.</desc>
  <defs>
    <clipPath id="win"><rect x="20" y="20" width="760" height="680" rx="11"/></clipPath>
    <filter id="sheetshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}</style>

  <g clip-path="url(#win)">
    <rect x="20" y="20" width="760" height="680" fill="#F2F2F7"/>

    <g id="titlebar">
      <rect x="20" y="20" width="760" height="40" fill="#F6F6F8"/>
      <line x1="20" y1="60" x2="780" y2="60" stroke="#000" stroke-opacity="0.08"/>
      <circle cx="40" cy="40" r="6" fill="#FF736A"/><circle cx="60" cy="40" r="6" fill="#FEBC2E"/><circle cx="80" cy="40" r="6" fill="#19C332"/>
      <text x="400" y="45" font-size="13" class="sb" text-anchor="middle" fill="#000" fill-opacity="0.85">Projects</text>
    </g>

    <g id="behind">
      <text x="44" y="100" font-size="28" class="b" fill="#000">Projects</text>
      <rect x="40" y="116" width="720" height="26" rx="7" fill="#000" fill-opacity="0.05"/>
      <text x="58" y="133" font-size="12" fill="#8A8A8E">Search projects</text>
      <rect x="40" y="152" width="720" height="22" rx="6" fill="#000" fill-opacity="0.05"/>
      <text x="130" y="167" font-size="11" fill="#3C3C43">All</text>
      <text x="310" y="167" font-size="11" fill="#8A8A8E">Photos</text>
      <text x="480" y="167" font-size="11" fill="#8A8A8E">Interval</text>
      <text x="650" y="167" font-size="11" fill="#8A8A8E">Video</text>

      <g id="row-1">
        <rect x="40" y="186" width="720" height="96" rx="12" fill="#FFFFFF"/>
        <rect x="54" y="200" width="68" height="46" rx="6" fill="#8A8A8E" fill-opacity="0.45"/>
        <text x="134" y="212" font-size="13" class="b" fill="#000">Tram morning</text>
        <text x="134" y="228" font-size="10" fill="#6D6D72">Video · 4K · 25 fps · yesterday</text>
        <text x="134" y="242" font-size="10" fill="#6D6D72">3 source clips · 1 burst at 100 fps</text>
        <text x="134" y="256" font-size="10" class="sb" fill="#C36A00">4 blended clips · 2,05 GB</text>
      </g>
      <g id="row-2">
        <rect x="40" y="294" width="720" height="96" rx="12" fill="#FFFFFF"/>
        <rect x="54" y="308" width="68" height="46" rx="6" fill="#8A8A8E" fill-opacity="0.45"/>
        <text x="134" y="320" font-size="13" class="b" fill="#000">Afternoon trains</text>
        <text x="134" y="336" font-size="10" fill="#6D6D72">Video · 4K · 25 fps · 2 days ago</text>
        <text x="134" y="350" font-size="10" fill="#6D6D72">3 source clips · 1 burst at 100 fps</text>
        <text x="134" y="364" font-size="10" class="sb" fill="#C36A00">4 blended clips · 1,37 GB</text>
      </g>
      <g id="row-3">
        <rect x="40" y="402" width="720" height="96" rx="12" fill="#FFFFFF"/>
        <rect x="54" y="416" width="68" height="46" rx="6" fill="#8A8A8E" fill-opacity="0.45"/>
        <text x="134" y="428" font-size="13" class="b" fill="#000">Test card</text>
        <text x="134" y="444" font-size="10" fill="#6D6D72">Video · 4K · 25 fps · 2 days ago</text>
        <text x="134" y="458" font-size="10" fill="#6D6D72">3 source clips · 1 burst at 100 fps</text>
        <text x="134" y="472" font-size="10" fill="#6D6D72">529 MB</text>
      </g>

      <g id="tabbar">
        <rect x="280" y="638" width="240" height="46" rx="23" fill="#FFFFFF"/>
        <text x="316" y="672" font-size="8.5" text-anchor="middle" fill="#6D6D72">Create</text>
        <text x="362" y="672" font-size="8.5" text-anchor="middle" fill="#6D6D72">Gallery</text>
        <rect x="388" y="646" width="46" height="30" rx="15" fill="#C36A00" fill-opacity="0.12"/>
        <text x="411" y="672" font-size="8.5" class="sb" text-anchor="middle" fill="#C36A00">Projects</text>
        <text x="459" y="672" font-size="8.5" text-anchor="middle" fill="#6D6D72">Collections</text>
        <text x="502" y="672" font-size="8.5" text-anchor="middle" fill="#6D6D72">Settings</text>
      </g>
    </g>

    <rect x="20" y="20" width="760" height="680" fill="#F2F2F7" fill-opacity="0.62"/>

    <g id="sheet">
      <rect x="210" y="215" width="380" height="330" rx="12" fill="#F2F2F7" filter="url(#sheetshadow)"/>

      <!-- exclamationmark.triangle.fill, 30pt, system red -->
      <g id="icon" transform="translate(400 260)">
        <path d="M0 -15 L16 13 L-16 13 Z" fill="#FF3B30" stroke="#FF3B30" stroke-width="4" stroke-linejoin="round"/>
        <rect x="-1.6" y="-7" width="3.2" height="12" rx="1.6" fill="#FFFFFF"/>
        <circle cx="0" cy="9" r="1.9" fill="#FFFFFF"/>
      </g>

      <text x="400" y="304" font-size="19" class="sb" text-anchor="middle" fill="#000">Couldn't import</text>
      <text x="400" y="326" font-size="14" text-anchor="middle" fill="#6D6D72">Morning tram 4k</text>

      <g id="prose" font-size="13" fill="#6D6D72" text-anchor="middle">
        <text x="400" y="359">Not enough storage to import this project. It</text>
        <text x="400" y="376">unpacks to at least 2,37 GB but only 1,1 GB is</text>
        <text x="400" y="393">available. Free up space and try again.</text>
      </g>

      <rect x="234" y="447" width="332" height="50" rx="12" fill="#C36A00"/>
      <text x="400" y="478" font-size="16" class="b" text-anchor="middle" fill="#FFFFFF">Close</text>
    </g>
  </g>

  <rect x="20" y="20" width="760" height="680" rx="11" fill="none" stroke="#000" stroke-opacity="0.16"/>
  <text x="400" y="722" font-size="13" class="sb" text-anchor="middle" fill="#000">macOS · Project import · failed · 760×680 pt window</text>
  <text x="400" y="740" font-size="11" text-anchor="middle" fill="#6D6D72">mirrors App/ProjectImport.swift (ProjectImportSheet, .failed) — held on the sheet, not in the Create banner; cancelling is not a failure</text>
</svg>
