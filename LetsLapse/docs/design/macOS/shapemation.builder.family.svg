<svg viewBox="0 0 800 790" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>macOS · Shape-mation · builder · shape · 760×680</title>
  <desc>Mirrors App/Shapemation/ShapemationBuilderView.swift, the shape step (&#x27;Shape slideshow&#x27; — which family holds still) over ShapeSummaryIndex. Mirrored from the Debug build on the tram clone 2026-09-20 with LL_SHAPEMATION=build LL_CHIPS=tram after Next · shape; capture scratchpad/mirrors/mac/builder.family.png (2×, key window), copy from its AX dump. Heading &#x27;Which shape holds still?&#x27; (17 pt bold) with the filter trail &#x27;Tram · 164 photos&#x27; under it (the Apply filters step&#x27;s tag and count); one card with a 57 pt row per family that has shapes in the filtered registers — Circle &#x27;1 project · 1&#x27;, Square &#x27;1 project · 1&#x27;, Rectangle &#x27;83 projects · 84&#x27; (accent family glyph, 17 pt name, 13 pt grey count, chevron). Families with nothing to offer (Oval here) are not listed. The step has no bottom bar: a row IS the choice and pushes the Match step. GEOMETRY: sheet 680 pt from y=32; card 116–644 × 151–322; glyph centred at x=147, name at 174, count right-aligned at 605, chevron at 620.</desc>
