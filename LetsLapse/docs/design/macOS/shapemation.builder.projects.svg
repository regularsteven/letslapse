<svg viewBox="0 0 800 790" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>macOS · Shape-mation · builder · projects (Rectangles) · 760×680</title>
  <desc>Mirrors App/Shapemation/ShapemationBuilderView.swift, the projects step (&#x27;Rectangles&#x27; — which photos go in) with its Sort menu and the per-project rows. Mirrored from the Debug build on the tram clone 2026-09-20 after Pick all; capture scratchpad/mirrors/mac/builder.projects.png (2×, key window), copy from its AX dump. Header: back circle · &#x27;Rectangles&#x27; (the AX dump lists a Clear button beside the title; it is the bottom bar&#x27;s — the bar&#x27;s leading button reads Pick all until everything is picked, then Clear). Under it &#x27;83 of 83 picked&#x27; with the &#x27;Sort&#x27; menu button trailing (chevron.down · Sort · chevron — the label is secondary grey, measured (122,122,124) on the capture, the two chevrons accent; the menu is Largest first / Smallest first / Newest / Oldest — &#x27;Sort Largest first&#x27; on iOS). One 120 pt card per project, 10 pt apart: the project&#x27;s thumbnail (72×96, the found rectangle traced over it — AMBER when picked, white when not), 15 pt bold title &#x27;Photo 13. 9. at 12:57&#x27;, &#x27;1 rectangle · Photo&#x27;, &#x27;2 860 px · 95 % of the frame&#x27; (the shape&#x27;s size and share of the frame), and the accent check circle top-trailing (r 11). Rows are plain tap gestures (not AX-pressable). The list scrolls inside the sheet (AXScrollBar at x=648, thumb short: 83 rows) above the pinned 80 pt bar: tinted &#x27;Clear&#x27; leading, &#x27;Next · mode&#x27; (146×47) trailing; the fourth card is cut by the bar. Rows drawn: 12:57 / 2 860 px · 95 %, 12:49 / 2 783 px · 92 %, 12:47 / 2 569 px · 85 %, 12:49 / 2 311 px · 76 % — largest first, as the AX dump lists them. The thumbnails are placeholders in the tile style (ink tile + tram-face glyph), not the captured pictures. GEOMETRY: sheet 680 pt from y=32; cards x 116–626 (the scroller takes the rest), y 124 + 130·i.</desc>
