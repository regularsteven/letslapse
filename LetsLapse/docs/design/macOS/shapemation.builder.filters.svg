  <text x="400" y="758" font-size="13" class="sb" text-anchor="middle" fill="#000">macOS · Shape-mation · builder · Apply filters · 760×680 pt window, 560×680 pt sheet</text>
  <text x="400" y="776" font-size="11" text-anchor="middle" fill="#6D6D72">mirrors App/Shapemation/ShapemationBuilderView.swift — LL_SHAPEMATION=build LL_CHIPS=tram on the tram clone · Tram lit · 164 photo projects</text>
