    <text x="169" y="272.5" font-size="15" fill="#1C1C1E">Urban</text>
    <text x="631" y="272.5" font-size="15" text-anchor="end" fill="#6D6D72">3</text>
    <circle cx="156" cy="298.5" r="3.5" fill="#C7C7CC"/>
    <text x="169" y="303.5" font-size="15" fill="#1C1C1E">Vehicles</text>
    <text x="631" y="303.5" font-size="15" text-anchor="end" fill="#6D6D72">3</text>
    <circle cx="156" cy="329.5" r="3.5" fill="#C7C7CC"/>
    <text x="169" y="334.5" font-size="15" fill="#1C1C1E">Road</text>
    <text x="631" y="334.5" font-size="15" text-anchor="end" fill="#6D6D72">3</text>
    <circle cx="156" cy="360.5" r="3.5" fill="#C7C7CC"/>
    <text x="169" y="365.5" font-size="15" fill="#1C1C1E">Shape testing</text>
    <text x="631" y="365.5" font-size="15" text-anchor="end" fill="#6D6D72">1</text>
    <circle cx="156" cy="391.5" r="3.5" fill="#C7C7CC"/>
    <text x="169" y="396.5" font-size="15" fill="#1C1C1E">Škoda 15T</text>
    <text x="631" y="396.5" font-size="15" text-anchor="end" fill="#6D6D72">3</text>
    <circle cx="156" cy="422.5" r="3.5" fill="#C7C7CC"/>
    <text x="169" y="427.5" font-size="15" fill="#1C1C1E">Tatra KT8D5</text>
    <text x="631" y="427.5" font-size="15" text-anchor="end" fill="#6D6D72">4</text>
    <circle cx="156" cy="453.5" r="3.5" fill="#C7C7CC"/>
    <text x="169" y="458.5" font-size="15" fill="#1C1C1E">Tatra T3</text>
    <text x="631" y="458.5" font-size="15" text-anchor="end" fill="#6D6D72">6</text>
    <circle cx="156" cy="484.5" r="3.5" fill="#C36A00"/>
    <text x="169" y="489.5" font-size="15" fill="#C36A00">Tram</text>
