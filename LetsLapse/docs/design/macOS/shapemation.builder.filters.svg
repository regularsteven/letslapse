<svg viewBox="0 0 800 790" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>macOS · Shape-mation · builder · Apply filters · 760×680</title>
  <desc>Mirrors App/Shapemation/ShapemationBuilderView.swift, the builder&#x27;s first step &#x27;Apply filters&#x27; (2026-09-20: the Gallery sidebar&#x27;s Tags rows with counts over a search field and a live &#x27;N photo projects&#x27; line; every later step reads the filtered registers). Mirrored from the Debug build on the tram clone 2026-09-20 with LL_SHAPEMATION=build LL_CHIPS=tram; capture scratchpad/mirrors/mac/builder.filters.png (2×, key window), copy from its AX dump. Header: back circle, &#x27;Apply filters&#x27;; the intro &#x27;Narrow the photos before choosing the shape — the way the Gallery&#x27;s Tags rows do.&#x27;; a 33 pt search field &#x27;Search titles and tags&#x27;; the TAGS card with one row per tag — dot · name · count — Urban 3 · Vehicles 3 · Road 3 · Shape testing 1 · Škoda 15T 3 · Tatra KT8D5 4 · Tatra T3 6 · Tram 164, Tram LIT (accent dot, accent name and count: LL_CHIPS=tram), then &#x27;Clear tags&#x27;; under the card &#x27;164 photo projects&#x27;. Chips intersect (AND), so lighting a second tag narrows the count. The step scrolls inside the sheet (its own AXScrollBar at x=648 — the card stops at 627 to leave it room) above the pinned 80 pt bottom bar with &#x27;Next · shape&#x27; (149×47, rx 10). GEOMETRY: sheet 680 pt from y=32; rows 31 pt apart, 15 pt names, counts right-aligned at 611.</desc>
  <defs>
    <clipPath id="win"><rect x="20" y="20" width="760" height="680" rx="11"/></clipPath>
    <filter id="sheetshadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/></filter>
    <linearGradient id="hdrfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0.10"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.mono{font-variant-numeric:tabular-nums}</style>
  <!-- The Create tab behind the sheet, dimmed 17 % (NSWindow sheet dimming): title, the two
       preset cards and the door rows show at the sheet's sides, as captured. -->
  <g clip-path="url(#win)">
    <rect x="20" y="20" width="760" height="680" fill="#F2F2F7"/>
    <g id="titlebar">
