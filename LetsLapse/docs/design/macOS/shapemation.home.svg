    <path d="M640 190.5 l5 5 -5 5" fill="none" stroke="#A0A0A5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="194" y1="224.5" x2="664" y2="224.5" stroke="#000" stroke-opacity="0.10"/>
    <g data-symbol="cube.transparent"><rect x="152" y="239.0" width="30" height="30" rx="7" fill="#6B5BC1"/>
      <path d="M167 246.0 l7 4 v8 l-7 4 -7 -4 v-8 z M167 254.0 l7 -4 M167 254.0 l-7 -4 M167 254.0 v8" fill="none" stroke="#FFF" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <text x="194" y="251.0" font-size="17" fill="#1C1C1E">Create shape slideshow</text>
    <text x="194" y="268.5" font-size="13" fill="#6D6D72">Filter by tag, pick the shape, the projects, and a mode</text>
    <path d="M640 249.0 l5 5 -5 5" fill="none" stroke="#A0A0A5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="194" y1="283.0" x2="664" y2="283.0" stroke="#000" stroke-opacity="0.10"/>
    <g data-symbol="list.and.film"><rect x="152" y="297.5" width="30" height="30" rx="7" fill="#8A4A00"/>
      <path d="M159 306.5 h6 M159 312.5 h6 M159 318.5 h6" stroke="#FFF" stroke-width="1.6" stroke-linecap="round"/><rect x="168" y="305.5" width="8" height="14" rx="1.5" fill="none" stroke="#FFF" stroke-width="1.4"/>
    </g>
    <text x="194" y="309.5" font-size="17" fill="#1C1C1E">List Shape-mations</text>
    <text x="194" y="327.0" font-size="13" fill="#6D6D72">None yet</text>
    <path d="M640 307.5 l5 5 -5 5" fill="none" stroke="#A0A0A5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="136" y="357.5" width="528" height="105" rx="12" fill="#FFFFFF"/>
    <text x="152" y="384" font-size="12" class="sb" fill="#6D6D72">SHAPE REGISTER</text>
    <text x="152" y="408.5" font-size="15" fill="#1C1C1E">1 project analysed · 84 with shapes</text>
    <g data-symbol="circle"><rect x="158" y="421.5" width="38" height="22" rx="6" fill="#FBF2E8"/>
      <circle cx="170" cy="432.5" r="5" fill="none" stroke="#1C1C1E" stroke-width="1.4"/>
      <text x="188" y="437" font-size="13" text-anchor="end" fill="#1C1C1E">1</text></g>
    <g data-symbol="square"><rect x="216" y="421.5" width="37" height="22" rx="6" fill="#FBF2E8"/>
      <rect x="223" y="427.5" width="10" height="10" rx="1.5" fill="none" stroke="#1C1C1E" stroke-width="1.4"/>
      <text x="245" y="437" font-size="13" text-anchor="end" fill="#1C1C1E">1</text></g>
    <g data-symbol="rectangle"><rect x="274" y="421.5" width="51" height="22" rx="6" fill="#FBF2E8"/>
      <rect x="280" y="428.5" width="13" height="8" rx="1.5" fill="none" stroke="#1C1C1E" stroke-width="1.4"/>
      <text x="317" y="437" font-size="13" text-anchor="end" fill="#1C1C1E">84</text></g>
    <rect x="120" y="732" width="560" height="65" fill="#FFFFFF"/><line x1="120" y1="732" x2="680" y2="732" stroke="#000" stroke-opacity="0.10"/>
    <rect x="596" y="754" width="64" height="23" rx="6" fill="#C36A00"/>
    <text x="628" y="770" font-size="13" class="sb" text-anchor="middle" fill="#FFF">Done</text>
  </g>
  <rect x="20" y="20" width="760" height="680" rx="11" fill="none" stroke="#000" stroke-opacity="0.16"/>
  <text x="400" y="823" font-size="13" class="sb" text-anchor="middle" fill="#000">macOS · Shape-mation · home · 760×680 pt window, 560×745 pt sheet</text>
  <text x="400" y="841" font-size="11" text-anchor="middle" fill="#6D6D72">mirrors App/Shapemation/ShapemationView.swift — LL_SHAPEMATION=home on the tram clone · &#x27;None yet&#x27; state; the sheet overhangs the window by 97 pt</text>
</svg>
