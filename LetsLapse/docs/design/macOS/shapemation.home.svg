      <rect x="120" y="100" width="560" height="14" fill="url(#hdrfade)"/>
      <text x="168" y="81.5" font-size="13" class="b" fill="#1C1C1E">Shape-mation</text>
    </g>
    <text x="136" y="129.5" font-size="13" fill="#6D6D72">Find a shape that repeats across your photos — a clock face, a sign, a window —</text>
    <text x="136" y="146.5" font-size="13" fill="#6D6D72">and stack the photos so the shape holds still while the world changes behind it.</text>
    <rect x="136" y="166" width="528" height="175" rx="12" fill="#FFFFFF"/>
    <g data-symbol="viewfinder.circle"><rect x="152" y="180.5" width="30" height="30" rx="7" fill="#C36A00"/>
      <circle cx="167" cy="195.5" r="6" fill="none" stroke="#FFF" stroke-width="1.6"/><circle cx="167" cy="195.5" r="2.2" fill="#FFF"/>
    </g>
    <text x="194" y="192.5" font-size="17" fill="#1C1C1E">Find shapes</text>
