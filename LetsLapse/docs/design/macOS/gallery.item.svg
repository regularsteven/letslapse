<svg viewBox="0 0 1350 880" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>macOS · Gallery · item view · photo · 1310×800</title>
  <desc>Mirrors the Gallery's ITEM VIEW on the Mac (2026-09-13, code first — Steven: build it to feel it — mirrored after his sign-off the same evening): App/GalleryView.swift (wideLayout, itemHeader, the item-view actions), App/GalleryItemView.swift (GalleryFocus, GalleryItemEditor, GalleryFilmstrip), App/GalleryPreviewPanel.swift (.inspector style, outputSection), App/EditorLaunch.swift (EditorExitRequest) and the editor's own exitRequest / onExit. THE MODE: the editor is no longer a window the Gallery opens. Open, ⏎, a double-click, Edit, Text, Shapes and the tile menu's Edit all put the project in GalleryFocus (owned by ContentView beside galleryPath, so a tab round-trip lands back on it) and the SAME HStack changes mode — nothing is pushed: the left column swaps the Library for the project's INSPECTOR (GalleryPreviewPanel in its .inspector dress, 330 pt; the Library's 200 animates to it over 0.25 s), the grid and its pane swap for the EDITOR — the media beside its own fixed 330 pt rail (railWidth, macOS), so the right-hand divider stays exactly where the grid's pane put it — and a FILMSTRIP of the grid's current result set (sidebar filter, search, sort, order) runs under everything at full width (components/gallery-filmstrip.*). Drawn at the gallery mirrors' 1310×800; every measurement here is read off the Debug build over the scratch library (LL_TAB=gallery LL_ITEM=…). HEADER (52 pt, where the grid's header was — same height, so the divider under it does not move on the way in): the ▤ library button keeps its seat 16 in (accent while the column shows; it now collapses the inspector, the same gallery.showSidebar), then ‹ Gallery 10 after it (a 26 pt capsule on primary 6 %, chevron.left + 13 pt medium accent), the project's name 16 pt bold centred between two spacers, and "n of N" — the focused project's place in the filmstrip's order — 12 pt secondary trailing. The window title carries the name too (.navigationTitle). Back and ⎋ leave through the editor's own exit (EditorExitRequest offersPresetSave: true → requestExit → the Back button's preset offer where there is one → finishExit → onExit → focus = nil); a filmstrip click or ← → sends offersPresetSave: false and the next project's editor takes the old one's place (.id(captureID)), the page carrying over where the next editor has it (Masks → Editor for a video). INSPECTOR (x 20–350, LL.cardBackground, its own ScrollView): the panel's phases one and three — management above, what comes next below — with no thumbnail (the picture is on screen), no action grid and no PRESETS (the editor is right there): title 16 pt bold 18 under the top, the 12 pt date · size line, a full-bleed divider 16 under; then the pane's own stack 12 under it (TAGS with its origin marker, the scope switch on an interval or video project, INFO, METADATA — the shared components at 302), the In frame / Storage / Field notes rows, a divider, the footer as Rename · Finder · Delete… (Share moved down), a divider, and OUTPUT: components/output-actions.*.narrow (New clip · Share project, or Share project alone on a Photo capture) with the BLENDED CLIPS header, tick-chip filter and list under it when the project has any. EDITOR: PhotoViewerView for a still, VideoEditorView for a movie — exactly the views the Mac's editor windows host (those scenes remain for the Projects tab's hero Edit pill), on the window's light surface; the rail is drawn idle here (no group open) since the item view is where a project is looked at as much as tuned — the six photo-viewer.* files draw the open groups. THIS FILE: a Photo capture — gallery.metadata.svg's imported `_WEX3518` (an ARW with its Lightroom sidecar) opened on the Editor page, 5th of 14 in the grid's order. No timeline, so the media pane takes the whole 648×568 column (the picture fitted to the width, 648×486, centred; no badge) and the tab pill has three segments — Editor · Text · Masks. Inspector: TAGS from file (the sidecar's seven keywords, tag-field.imported at 302 — three rows now), INFO from the file (metadata-info.photo, 221 tall at this width) and METADATA with its origins (metadata-fields.file), which runs under the window edge; the Storage row, Rename · Finder · Delete… and OUTPUT (Share project alone — one photo has nothing to blend) are below the fold, reached by scrolling — gallery.item.interval.svg draws that foot. The rail's Masks card is empty ("Masks · + Add") and Reset adjustments dimmed to 40 %: nothing graded yet. STATES NOT DRAWN (desc-only): the inspector scrolled (the interval file); a group open on the rail (photo-viewer.*); a Text / Masks page (photo-viewer.text.svg, photo-viewer.masks.svg — the same rail, in this column); the preset-save offer Back raises on an Edited grade; the ⌘-key states. Hooks: LL_TAB=gallery LL_ITEM=latest|&lt;uuid&gt;[:editor|text|frames|masks]; -gallery.showSidebar NO collapses the inspector.</desc>
  <defs>
    <clipPath id="win"><rect x="20" y="20" width="1310" height="800" rx="11"/></clipPath>
    <clipPath id="inspector"><rect x="20" y="48" width="330" height="621"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FA3B8"/><stop offset="0.45" stop-color="#E8B98C"/><stop offset="1" stop-color="#F6DFB2"/></linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9A45E"/><stop offset="1" stop-color="#5C666E"/></linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="8" stdDeviation="7.5" flood-color="#000" flood-opacity="0.14"/></filter>
    <!-- The picture: photo-viewer.svg's flat Prague sunset in its own 660×495 drawing space (20,110)–(680,605). -->
    <symbol id="picture" viewBox="20 110 660 495" preserveAspectRatio="xMidYMid slice">
        <rect x="20" y="110" width="660" height="495" fill="url(#sky)"/>
        <ellipse cx="200" cy="180" rx="160" ry="24" fill="#7E93A9" opacity="0.35"/>
        <ellipse cx="480" cy="150" rx="190" ry="22" fill="#8A9DB1" opacity="0.3"/>
        <ellipse cx="360" cy="240" rx="230" ry="22" fill="#EACBA0" opacity="0.45"/>
        <ellipse cx="150" cy="300" rx="170" ry="16" fill="#F2D9AE" opacity="0.5"/>
        <!-- Skyline band. -->
        <path d="M20 380 L20 356 L60 356 L60 350 L118 350 L118 358 L175 358 L175 352 L240 352 L240 360 L300 360 L300 350 L332 344 L385 340 L448 344 L470 352 L520 349 L520 356 L575 356 L575 347 L620 347 L620 355 L680 355 L680 380 Z" fill="#5D5346"/>
        <!-- Bridge deck with piers at the river head. -->
        <rect x="20" y="380" width="660" height="8" fill="#8C7B5F"/>
        <rect x="20" y="388" width="660" height="6" fill="#6E6152"/>
        <g fill="#524A40">
          <rect x="252" y="394" width="10" height="12"/><rect x="316" y="394" width="10" height="12"/>
          <rect x="380" y="394" width="10" height="12"/><rect x="444" y="394" width="10" height="12"/>
        </g>
        <!-- River with the sunset's reflection. -->
        <rect x="20" y="394" width="660" height="146" fill="url(#river)"/>
        <rect x="120" y="410" width="260" height="6" rx="3" fill="#EBC27E" opacity="0.5"/>
        <rect x="90" y="430" width="330" height="6" rx="3" fill="#E0B26B" opacity="0.4"/>
        <rect x="140" y="452" width="240" height="6" rx="3" fill="#D2A45F" opacity="0.3"/>
        <!-- Quay diagonal, crowd, railing — the right embankment. -->
        <path d="M330 540 L680 436 L680 605 L240 605 Z" fill="#8A7A55"/>
        <path d="M500 605 L680 470 L680 605 Z" fill="#3F4438"/>
        <g fill="#221F1C">
          <circle cx="380" cy="560" r="4"/><circle cx="416" cy="550" r="4"/><circle cx="452" cy="540" r="4"/>
          <circle cx="492" cy="528" r="4"/><circle cx="352" cy="576" r="4"/><circle cx="530" cy="516" r="4"/>
        </g>
      
    </symbol>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.m{font-weight:500}.mono{font-variant-numeric:tabular-nums}</style>

