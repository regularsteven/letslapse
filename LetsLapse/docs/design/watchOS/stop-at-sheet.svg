<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 352" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>watchOS · Stop at… (sheet)</title>
  <desc>Mirrors Remote/WatchControlView.swift StopAtSheet: Minutes/Frames unit chips, giant crown-or-swipe-dialled amount, live "stops in" countdown caption, Cancel/Set. Values are total-anchored to this run's START: Minutes stops when the run's elapsed time reaches the amount; Frames stops at N total captured photos/blends this run (Interval) — the Frames chip is hidden for Video runs. The dial floors at elapsed+1 minutes (or captured+1 frames) so an already-passed mark can't be dialled, and opens at max(default, floor). Caption ticks at 1 Hz. Mock numbers tie to recording-stop.svg: elapsed 12:26, dial 16 → stops in 3m 34s.</desc>
  <defs>
    <clipPath id="wscreen"><rect x="46" y="24" width="208" height="248" rx="52"/></clipPath>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="38" y="16" width="224" height="264" rx="60" fill="none" stroke="#3A3A3F" stroke-width="4"/>
  <rect x="264" y="86" width="10" height="36" rx="5" fill="#3A3A3F"/>
  <rect x="264" y="150" width="7" height="44" rx="3.5" fill="#3A3A3F"/>

  <g clip-path="url(#wscreen)">
    <rect x="46" y="24" width="208" height="248" fill="#000"/>
    <g transform="translate(46,24)">
      <text x="104" y="30" font-size="13" class="sb" fill="#FFF" text-anchor="middle">Stop at</text>

      <!-- unit chips -->
      <g id="unit-chips">
        <rect x="12" y="40" width="91" height="24" rx="8" fill="#40C8E0"/>
        <text x="57.5" y="56" font-size="11" class="sb" fill="#000" text-anchor="middle">Minutes</text>
        <rect x="107" y="40" width="91" height="24" rx="8" fill="#FFF" opacity="0.12"/>
        <text x="152.5" y="56" font-size="11" class="sb" fill="#FFF" text-anchor="middle">Frames</text>
      </g>

      <!-- dialled amount (crown or vertical swipe; floors at elapsed+1) -->
      <text x="104" y="140" font-size="42" class="b m" fill="#40C8E0" text-anchor="middle">16</text>
      <text x="104" y="162" font-size="11" fill="#98989E" text-anchor="middle">minutes</text>
      <!-- live countdown caption (1 Hz; 16 min total − 12:26 elapsed) -->
      <text x="104" y="180" font-size="11" fill="#98989E" text-anchor="middle">stops in 3m 34s</text>

      <!-- confirm row -->
      <g id="confirm-row">
        <rect x="12" y="196" width="91" height="30" rx="10" fill="#FFF" opacity="0.12"/>
        <text x="57.5" y="215" font-size="12" class="sb" fill="#FFF" text-anchor="middle">Cancel</text>
        <rect x="107" y="196" width="91" height="30" rx="10" fill="#40C8E0"/>
        <text x="152.5" y="215" font-size="12" class="b" fill="#000" text-anchor="middle">Set</text>
      </g>
    </g>
  </g>

  <text x="150" y="316" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">watchOS · Stop at… (sheet) · 208×248 pt</text>
  <text x="150" y="334" text-anchor="middle" font-size="9" fill="#8A8A90">mirrors WatchControlView.swift — StopAtSheet · crown dial</text>
</svg>
