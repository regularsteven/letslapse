<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 352" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>watchOS · Phone state · confirm cancel</title>
  <desc>The one place on this remote where a confirmation earns its keep: destructive, slow to undo, and never time-critical. Everything else commits by sliding instead — friction where the cost is a lost shoot, words where the cost is a lost hour of rendering.</desc>
  <defs>
    <clipPath id="wscreen"><rect x="46" y="24" width="208" height="248" rx="52"/></clipPath>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.h{font-weight:800}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="38" y="16" width="224" height="264" rx="60" fill="none" stroke="#3A3A3F" stroke-width="4"/>
  <rect x="264" y="86" width="10" height="36" rx="5" fill="#3A3A3F"/>
  <rect x="264" y="150" width="7" height="44" rx="3.5" fill="#3A3A3F"/>

  <g clip-path="url(#wscreen)">
    <rect x="46" y="24" width="208" height="248" fill="#000"/>
    <g transform="translate(46,24)">
      <text x="197" y="30" font-size="15" class="b" fill="#6D6D72" text-anchor="end">10:09</text>
      <text x="11" y="62" font-size="17" class="b" fill="#FFF">Cancel the export?</text>
      <text x="11" y="82" font-size="12" fill="#FFF" opacity="0.6">Your clip settings are kept.</text>
      <text x="11" y="97" font-size="12" fill="#FFF" opacity="0.6">You'll go back to the blend</text>
      <text x="11" y="112" font-size="12" fill="#FFF" opacity="0.6">setup, then the camera can arm.</text>
      <rect x="11" y="128" width="186" height="40" rx="13" fill="#FF453A"/>
      <text x="104" y="153" font-size="14" class="h" fill="#FFF" text-anchor="middle">Cancel export</text>
      <rect x="11" y="174" width="186" height="36" rx="11" fill="#1C1C1E"/>
      <text x="104" y="197" font-size="13" class="sb" fill="#FFF" opacity="0.8" text-anchor="middle">Let it finish</text>
    </g>
  </g>

  <text x="150" y="316" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">watchOS · Cancel export? · 208×248 pt</text>
  <text x="150" y="334" text-anchor="middle" font-size="9" fill="#8A8A90">mirrors WatchControlView.swift — CancelExportConfirmation</text>
</svg>
