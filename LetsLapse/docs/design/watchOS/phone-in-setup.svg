<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 352" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>watchOS · Phone state · in setup</title>
  <desc>Settings in progress are never discarded silently — the remote says what arming will cost before it takes over. It costs nothing, in fact: the capture screen is a full-screen cover presented above the root, so it opens OVER the flow and leaves it standing. That is what lets the copy promise the steps stay saved.</desc>
  <defs>
    <clipPath id="wscreen"><rect x="46" y="24" width="208" height="248" rx="52"/></clipPath>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.h{font-weight:800}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="38" y="16" width="224" height="264" rx="60" fill="none" stroke="#3A3A3F" stroke-width="4"/>
  <rect x="264" y="86" width="10" height="36" rx="5" fill="#3A3A3F"/>
  <rect x="264" y="150" width="7" height="44" rx="3.5" fill="#3A3A3F"/>

  <g clip-path="url(#wscreen)">
    <rect x="46" y="24" width="208" height="248" fill="#000"/>
    <g transform="translate(46,24)">
      <text x="197" y="30" font-size="15" class="b" fill="#6D6D72" text-anchor="end">10:09</text>
      <circle cx="14" cy="48" r="3.25" fill="#40C8E0"/>
      <text x="21" y="52" font-size="11" class="b" fill="#FFF" opacity="0.8" letter-spacing="0.7">IN SETUP</text>
      <rect x="11" y="60" width="186" height="1" fill="#FFF" opacity="0.15"/>
      <text x="11" y="90" font-size="16" class="b" fill="#FFF">Guided Clip</text>
      <text x="11" y="132" font-size="11" fill="#FFF" opacity="0.55">Step 3 of 5</text>
      <rect x="132" y="128" width="11" height="3.5" rx="1.75" fill="#40C8E0" opacity="1"/>
      <rect x="145.5" y="128" width="11" height="3.5" rx="1.75" fill="#40C8E0" opacity="1"/>
      <rect x="159" y="128" width="11" height="3.5" rx="1.75" fill="#40C8E0" opacity="1"/>
      <rect x="172.5" y="128" width="11" height="3.5" rx="1.75" fill="#FFF" opacity="0.2"/>
      <rect x="186" y="128" width="11" height="3.5" rx="1.75" fill="#FFF" opacity="0.2"/>
      <text x="11" y="156" font-size="11" fill="#FFF" opacity="0.6">Arming the camera leaves setup</text>
      <text x="11" y="170" font-size="11" fill="#FFF" opacity="0.6">on screen. Your steps stay saved.</text>
      <rect x="11" y="182" width="186" height="40" rx="13" fill="#30D158"/>
      <text x="104" y="207" font-size="14" class="h" fill="#000" text-anchor="middle">Arm camera anyway</text>
    </g>
  </g>

  <text x="150" y="316" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">watchOS · In setup · 208×248 pt</text>
  <text x="150" y="334" text-anchor="middle" font-size="9" fill="#8A8A90">mirrors WatchControlView.swift — inSetupScreen</text>
</svg>
