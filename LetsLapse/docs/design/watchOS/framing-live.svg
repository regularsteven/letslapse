<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 352" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>watchOS · Framing preview · live</title>
  <desc>A look through the phone's lens, pulled at 1 Hz while this screen is open and never otherwise. The frame is letterboxed to the camera's real aspect. Thirds plus a horizon bar that turns GREEN inside ±1° of level — the angle comes from the PHONE (the watch's own attitude describes an arm, which says nothing about the horizon in the frame). Age is always shown, measured from when the frame landed on this device. Back is a left-edge swipe: going back is navigation, and navigation is horizontal.</desc>
  <defs>
    <clipPath id="wscreen"><rect x="46" y="24" width="208" height="248" rx="52"/></clipPath>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.h{font-weight:800}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="38" y="16" width="224" height="264" rx="60" fill="none" stroke="#3A3A3F" stroke-width="4"/>
  <rect x="264" y="86" width="10" height="36" rx="5" fill="#3A3A3F"/>
  <rect x="264" y="150" width="7" height="44" rx="3.5" fill="#3A3A3F"/>

  <g clip-path="url(#wscreen)">
    <rect x="46" y="24" width="208" height="248" fill="#000"/>
    <g transform="translate(46,24)">
      <rect x="0" y="66" width="208" height="58.5" fill="#3A4A56"/>
      <rect x="0" y="124.5" width="208" height="58.5" fill="#26301C"/>
      <line x1="0" y1="105" x2="208" y2="105" stroke="#FFF" stroke-opacity="0.28"/>
      <line x1="69.3333" y1="66" x2="69.3333" y2="183" stroke="#FFF" stroke-opacity="0.28"/>
      <line x1="0" y1="144" x2="208" y2="144" stroke="#FFF" stroke-opacity="0.28"/>
      <line x1="138.667" y1="66" x2="138.667" y2="183" stroke="#FFF" stroke-opacity="0.28"/>
      <g transform="rotate(-0.4 104 124.5)"><rect x="35.36" y="123.25" width="137.28" height="2.5" rx="1.25" fill="#30D158"/><rect x="89.44" y="122.5" width="29.12" height="4" fill="#000" opacity="0.35"/></g>
      <circle cx="26" cy="40" r="13" fill="#FFF" opacity="0.14"/>
      <path d="M29 35 l-5 5 l5 5" fill="none" stroke="#FFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.backward"/>
      <rect x="11" y="62" width="70" height="15" rx="7.5" fill="#000" opacity="0.6"/>
      <circle cx="20" cy="69.5" r="2.5" fill="#30D158"/>
      <text x="27" y="73" font-size="9" class="b" fill="#FFF">LIVE 0.4s</text>
      <rect x="165" y="62" width="32" height="15" rx="7.5" fill="#000" opacity="0.6"/>
      <text x="181" y="73" font-size="9" class="b" fill="#FFF" text-anchor="middle">FULL</text>
      <rect x="11" y="196" width="36" height="36" rx="11" fill="#FFF"/>
      <path d="M24 204 v20 M34 204 v20 M19 209 h20 M19 219 h20" stroke="#000" stroke-width="1.6" data-symbol="grid"/>
      <rect x="53" y="196" width="144" height="36" rx="11" fill="#FF453A"/>
      <text x="125" y="219" font-size="15" class="h" fill="#FFF" text-anchor="middle" letter-spacing="1">START</text>
    </g>
  </g>

  <text x="150" y="316" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">watchOS · Framing · live · 208×248 pt</text>
  <text x="150" y="334" text-anchor="middle" font-size="9" fill="#8A8A90">mirrors FramingPreviewView.swift — framePicture</text>
</svg>
