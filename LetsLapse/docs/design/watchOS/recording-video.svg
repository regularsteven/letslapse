<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 352" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>watchOS · Recording (Video, ramp)</title>
  <desc>Mirrors Watch/WatchControlView.swift recordingScreen for Video in ramp mode: REC + elapsed, live estimate line, exposure-lock button + base/burst toggle, timed-burst row (phone owns the revert timer), slide-to-stop, Stop at…, interval dots + sequence caption. Crown adjusts ISO while exposure is locked.</desc>
  <defs>
    <clipPath id="wscreen"><rect x="46" y="24" width="208" height="248" rx="52"/></clipPath>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="38" y="16" width="224" height="264" rx="60" fill="none" stroke="#3A3A3F" stroke-width="4"/>
  <rect x="264" y="86" width="10" height="36" rx="5" fill="#3A3A3F"/>
  <rect x="264" y="150" width="7" height="44" rx="3.5" fill="#3A3A3F"/>

  <g clip-path="url(#wscreen)">
    <rect x="46" y="24" width="208" height="248" fill="#000"/>
    <g transform="translate(46,24)">
      <!-- REC + elapsed -->
      <g id="rec-row">
        <circle cx="16" cy="30" r="3.5" fill="#FF3B30"/>
        <text x="24" y="34" font-size="12" class="b" fill="#FFF">REC</text>
        <text x="196" y="35" font-size="15" class="b m" fill="#FFF" text-anchor="end">12:26</text>
      </g>

      <!-- estimate line -->
      <text x="12" y="52" font-size="11" class="m" fill="#FFB340">@25× → 14s</text>

      <!-- lock + burst toggle -->
      <g id="lock-button" data-symbol="lock.open">
        <rect x="12" y="60" width="48" height="34" rx="10" fill="#FFF" opacity="0.12"/>
        <rect x="30" y="76" width="12" height="9" rx="2" fill="none" stroke="#FFF" stroke-width="1.8"/>
        <path d="M33 76 v-4 a3.5 3.5 0 0 1 7 -1" fill="none" stroke="#FFF" stroke-width="1.8"/>
      </g>
      <g id="burst-toggle">
        <rect x="66" y="60" width="63" height="34" rx="10" fill="#FFB340"/>
        <text x="97.5" y="82" font-size="13" class="b" fill="#000" text-anchor="middle">30</text>
        <rect x="135" y="60" width="63" height="34" rx="10" fill="#FFF" opacity="0.12"/>
        <text x="166.5" y="82" font-size="13" class="b" fill="#FFF" text-anchor="middle">⚡ burst</text>
      </g>

      <!-- timed burst row -->
      <g id="timed-burst-row">
        <rect x="12" y="100" width="58" height="30" rx="10" fill="#FFF" opacity="0.12"/>
        <text x="41" y="120" font-size="13" class="b" fill="#FFF" text-anchor="middle">⚡1s</text>
        <rect x="76" y="100" width="58" height="30" rx="10" fill="#FFF" opacity="0.12"/>
        <text x="105" y="120" font-size="13" class="b" fill="#FFF" text-anchor="middle">⚡2s</text>
        <rect x="140" y="100" width="58" height="30" rx="10" fill="#FFF" opacity="0.12"/>
        <text x="169" y="120" font-size="13" class="b" fill="#FFF" text-anchor="middle">⚡4s</text>
      </g>

      <!-- slide to stop -->
      <g id="slide-to-stop">
        <rect x="12" y="136" width="186" height="34" rx="17" fill="#FF3B30" opacity="0.25"/>
        <rect x="12" y="136" width="186" height="34" rx="17" fill="none" stroke="#FF3B30" stroke-opacity="0.6"/>
        <text x="112" y="157" font-size="12" class="sb" fill="#FF6961" text-anchor="middle">Slide to stop ››</text>
        <circle cx="29" cy="153" r="15" fill="#FF3B30"/>
        <rect x="24.5" y="148.5" width="9" height="9" rx="1.5" fill="#FFF" data-symbol="stop.fill"/>
      </g>

      <!-- stop at -->
      <text x="104" y="188" font-size="11" class="sb" fill="#98989E" text-anchor="middle">Stop at…</text>

      <!-- interval dots + caption -->
      <g id="interval-dots">
        <circle cx="92" cy="202" r="3" fill="#FFB340" opacity="0.55"/>
        <circle cx="102" cy="202" r="3" fill="#FFB340" opacity="0.55"/>
        <circle cx="112" cy="202" r="3" fill="#FFB340"/>
      </g>
      <text x="104" y="220" font-size="10" fill="#98989E" text-anchor="middle">base rate · 3 intervals</text>
    </g>
  </g>

  <text x="150" y="316" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">watchOS · Recording (Video, ramp) · 208×248 pt</text>
  <text x="150" y="334" text-anchor="middle" font-size="11" fill="#8A8A90">mirrors Watch/WatchControlView.swift — recordingControls · burstToggle · timedBurstRow · SlideToStop</text>
</svg>
