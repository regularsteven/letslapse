      <rect x="104" y="79" width="89" height="22" rx="8" fill="#FFF"/>
      <text x="149.5" y="94.5" font-size="12.5" class="b" fill="#000" opacity="1" text-anchor="middle">Video</text>
      <rect x="11" y="108" width="186" height="30" rx="11" fill="#1C1C1E"/>
      <text x="21" y="127.5" font-size="13.5" class="sb" fill="#FFF">AE/AF Lock</text>
      <rect x="150" y="112.5" width="37" height="21" rx="10.5" fill="#39393D"/>
      <circle cx="160.5" cy="123" r="8.5" fill="#FFF"/>
