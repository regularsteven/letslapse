<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 352" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>watchOS · Phone state · camera closed</title>
  <desc>The remote's home when there is nothing to control. The old screen said "Open the camera on iPhone", which is advice rather than a control — and useless advice if the phone is clamped to a tripod across a field. One button gets the camera back. Only ever shown when the phone app is actually on screen: a backgrounded app can be woken by a message but cannot start a capture session, so that case falls through to the unreachable screen instead.</desc>
  <defs>
    <clipPath id="wscreen"><rect x="46" y="24" width="208" height="248" rx="52"/></clipPath>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.h{font-weight:800}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="38" y="16" width="224" height="264" rx="60" fill="none" stroke="#3A3A3F" stroke-width="4"/>
  <rect x="264" y="86" width="10" height="36" rx="5" fill="#3A3A3F"/>
  <rect x="264" y="150" width="7" height="44" rx="3.5" fill="#3A3A3F"/>

  <g clip-path="url(#wscreen)">
    <rect x="46" y="24" width="208" height="248" fill="#000"/>
    <g transform="translate(46,24)">
      <text x="197" y="30" font-size="15" class="b" fill="#6D6D72" text-anchor="end">10:09</text>
      <circle cx="14" cy="48" r="3.25" fill="#40C8E0"/>
      <text x="21" y="52" font-size="11" class="b" fill="#FFF" opacity="0.8" letter-spacing="0.7">LINKED</text>
      <rect x="11" y="60" width="186" height="1" fill="#FFF" opacity="0.15"/>
      <rect x="11" y="78" width="20" height="14" rx="3" fill="none" stroke="#FF9F0A" stroke-width="2" data-symbol="video.slash.fill"/>
      <line x1="10" y1="76" x2="33" y2="94" stroke="#FF9F0A" stroke-width="2.4" stroke-linecap="round"/>
      <text x="11" y="118" font-size="16" class="b" fill="#FFF">Camera closed</text>
      <text x="11" y="134" font-size="11" fill="#FFF" opacity="0.55">LetsLapse is on the Library screen</text>
      <rect x="11" y="146" width="186" height="40" rx="13" fill="#30D158"/>
      <text x="104" y="171" font-size="14" class="h" fill="#000" text-anchor="middle">Arm camera</text>
      <rect x="11" y="191" width="186" height="28" rx="11" fill="#1C1C1E"/>
      <text x="21" y="209.5" font-size="13.5" class="sb" fill="#FFF">Last shoot · 2m ago</text>
    </g>
  </g>

  <text x="150" y="316" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">watchOS · Camera closed · 208×248 pt</text>
  <text x="150" y="334" text-anchor="middle" font-size="9" fill="#8A8A90">mirrors WatchControlView.swift — cameraClosedScreen</text>
</svg>
