  <desc>Desaturated, blurred, hatched AND captioned — four independent signals, because any one can be missed at a glance in bright sun, and a stale frame read as live is how you shoot forty minutes of the wrong thing. START stays enabled: the framing may already be right, and refusing would make a link hiccup cost the shot.</desc>
