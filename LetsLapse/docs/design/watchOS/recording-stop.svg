<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 352" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>watchOS · Recording · Stop tab</title>
  <desc>Tab 3. Stop slides DOWN where burst slides UP: opposite axes, opposite colours, and two tabs apart — three independent reasons a fumble cannot end a shoot. The commit fires only on release past 85% of the travel and re-arms after 0.8 s, so a failed stop can be retried without leaving the screen.</desc>
  <defs>
    <clipPath id="wscreen"><rect x="46" y="24" width="208" height="248" rx="52"/></clipPath>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.h{font-weight:800}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="38" y="16" width="224" height="264" rx="60" fill="none" stroke="#3A3A3F" stroke-width="4"/>
  <rect x="264" y="86" width="10" height="36" rx="5" fill="#3A3A3F"/>
  <rect x="264" y="150" width="7" height="44" rx="3.5" fill="#3A3A3F"/>

  <g clip-path="url(#wscreen)">
    <rect x="46" y="24" width="208" height="248" fill="#000"/>
    <g transform="translate(46,24)">
      <text x="197" y="30" font-size="15" class="b" fill="#6D6D72" text-anchor="end">10:09</text>
      <circle cx="14" cy="48" r="3.25" fill="#FF453A"/>
      <text x="21" y="52" font-size="12" class="b" fill="#FFF" letter-spacing="0.6">REC</text>
      <text x="56" y="53" font-size="15" class="sb m" fill="#FFF">04:12</text>
      <text x="11" y="66" font-size="11" class="m" fill="#FFF" opacity="0.56">@100× → 12.4s</text>
      <circle cx="193" cy="62" r="2.5" fill="#FFD60A" opacity="0.55"/>
      <circle cx="185" cy="62" r="2.5" fill="#FFD60A" opacity="1"/>
      <rect x="11" y="72" width="186" height="1" fill="#FFF" opacity="0.15"/>
      <rect x="11" y="77" width="186" height="88" rx="14" fill="#FF453A" opacity="0.10"/>
      <rect x="11" y="77" width="186" height="88" rx="14" fill="none" stroke="#FF453A" stroke-opacity="0.42"/>
      <path d="M98 160 l6 5 l6 -5" fill="none" stroke="#FF453A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.down"/>
      <text x="104" y="153" font-size="12.5" class="sb" fill="#FF453A" text-anchor="middle">Slide down to stop</text>
      <rect x="15" y="81" width="178" height="26" rx="11" fill="#FF453A"/>
      <text x="104" y="98.5" font-size="13" class="b" fill="#FFF" text-anchor="middle" letter-spacing="0.5">STOP</text>
      <rect x="11" y="170" width="186" height="30" rx="11" fill="#1C1C1E"/>
      <text x="21" y="189.5" font-size="13.5" class="sb" fill="#FFF">Stop at…</text>
      <path d="M183 181 l4 4 l-4 4" fill="none" stroke="#FFF" stroke-opacity="0.35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="94" cy="232" r="2.5" fill="#FFF" opacity="0.26"/>
      <circle cx="104" cy="232" r="2.5" fill="#FFF" opacity="0.26"/>
      <circle cx="114" cy="232" r="2.5" fill="#FFF" opacity="1"/>
    </g>
  </g>

  <text x="150" y="316" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">watchOS · Recording · Stop · 208×248 pt</text>
  <text x="150" y="334" text-anchor="middle" font-size="9" fill="#8A8A90">mirrors WatchControlView.swift — stopTab · SlideToCommit</text>
</svg>
