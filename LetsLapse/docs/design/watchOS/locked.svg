<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 352" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>watchOS · Controls locked</title>
  <desc>After 90 s of no interaction during a shoot the controls go away, and the pads with them — slide-to-commit makes a brush harmless, but it cannot make a deliberate-looking drag from a sleeve or a bag strap harmless, and a gesture cannot reach a control that is not on screen. What replaces them is what you want from across a room: still recording, for how long, until when. Monochrome, inset-bordered and hatched so it reads at a glance as "locked, and fine". Only ever locks mid-shoot, never behind a failure banner or an open sheet.</desc>
  <defs>
    <clipPath id="wscreen"><rect x="46" y="24" width="208" height="248" rx="52"/></clipPath>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.h{font-weight:800}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="38" y="16" width="224" height="264" rx="60" fill="none" stroke="#3A3A3F" stroke-width="4"/>
  <rect x="264" y="86" width="10" height="36" rx="5" fill="#3A3A3F"/>
  <rect x="264" y="150" width="7" height="44" rx="3.5" fill="#3A3A3F"/>

  <g clip-path="url(#wscreen)">
    <rect x="46" y="24" width="208" height="248" fill="#000"/>
    <g transform="translate(46,24)">
      <text x="197" y="30" font-size="15" class="b" fill="#6D6D72" text-anchor="end">10:09</text>
      <rect x="4" y="4" width="200" height="240" rx="48" fill="none" stroke="#FFF" stroke-opacity="0.22" stroke-width="3"/>
      <rect x="53" y="72" width="12" height="9" rx="2" fill="none" stroke="#FFF" stroke-opacity="0.85" stroke-width="2"/>
      <path d="M56 72 v-4 a3.5 3.5 0 0 1 7 0 v4" fill="none" stroke="#FFF" stroke-opacity="0.85" stroke-width="2" data-symbol="lock.fill"/>
      <text x="104" y="102" font-size="11" class="b" fill="#FFF" opacity="0.75" text-anchor="middle" letter-spacing="0.8">CONTROLS LOCKED</text>
      <circle cx="72" cy="126" r="3.5" fill="#FF453A"/>
      <text x="82" y="134" font-size="25" class="b m" fill="#FFF">12:04</text>
      <text x="104" y="152" font-size="11" class="m" fill="#FFF" opacity="0.6" text-anchor="middle">@100× → 12.4s</text>
      <text x="104" y="170" font-size="10" fill="#FFF" opacity="0.5" text-anchor="middle">Stops in 22:00 · ⌚︎ 62%</text>
      <text x="104" y="192" font-size="11" class="sb" fill="#FFF" text-anchor="middle">Turn the crown to unlock</text>
    </g>
  </g>

  <text x="150" y="316" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">watchOS · Controls locked · 208×248 pt</text>
  <text x="150" y="334" text-anchor="middle" font-size="9" fill="#8A8A90">mirrors ControlsLockedView.swift · updateIdleLock(at:)</text>
</svg>
