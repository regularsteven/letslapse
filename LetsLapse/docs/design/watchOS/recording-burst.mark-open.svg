<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 352" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>watchOS · Recording · mark held open</title>
  <desc>A mark's IN is placed and its OUT is not. The control fills solid and flips its word, so "am I inside a mark" is answerable at a glance from across a room. Wholly independent of the burst above it: a mark can be opened before a burst and closed after it, or the other way round, because marks and bursts keep separate lists and separate open flags in the sidecar.</desc>
