<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 352" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>watchOS · Framing preview · square lens</title>
  <desc>The aspect lens, cycled by the chip or the crown. A VIEWING lens only — nothing is sent to the phone and no capture or canvas setting changes; it answers "what would a 1:1 crop of this contain", which is the question you are actually asking while you nudge a tripod. Square and the crop lenses fill their box from the middle of the frame; FULL fits the camera's own aspect.</desc>
  <defs>
    <clipPath id="wscreen"><rect x="46" y="24" width="208" height="248" rx="52"/></clipPath>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.h{font-weight:800}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="38" y="16" width="224" height="264" rx="60" fill="none" stroke="#3A3A3F" stroke-width="4"/>
  <rect x="264" y="86" width="10" height="36" rx="5" fill="#3A3A3F"/>
  <rect x="264" y="150" width="7" height="44" rx="3.5" fill="#3A3A3F"/>

  <g clip-path="url(#wscreen)">
    <rect x="46" y="24" width="208" height="248" fill="#000"/>
    <g transform="translate(46,24)">
      <rect x="0" y="40" width="208" height="104" fill="#3A4A56"/>
      <rect x="0" y="144" width="208" height="104" fill="#26301C"/>
      <line x1="0" y1="109.333" x2="208" y2="109.333" stroke="#FFF" stroke-opacity="0.28"/>
      <line x1="69.3333" y1="40" x2="69.3333" y2="248" stroke="#FFF" stroke-opacity="0.28"/>
      <line x1="0" y1="178.667" x2="208" y2="178.667" stroke="#FFF" stroke-opacity="0.28"/>
      <line x1="138.667" y1="40" x2="138.667" y2="248" stroke="#FFF" stroke-opacity="0.28"/>
      <g transform="rotate(3.0 104 144)"><rect x="35.36" y="142.75" width="137.28" height="2.5" rx="1.25" fill="#FFD60A"/><rect x="89.44" y="142" width="29.12" height="4" fill="#000" opacity="0.35"/></g>
      <circle cx="26" cy="40" r="13" fill="#FFF" opacity="0.14"/>
      <path d="M29 35 l-5 5 l5 5" fill="none" stroke="#FFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" data-symbol="chevron.backward"/>
      <rect x="11" y="62" width="70" height="15" rx="7.5" fill="#000" opacity="0.6"/>
      <circle cx="20" cy="69.5" r="2.5" fill="#30D158"/>
