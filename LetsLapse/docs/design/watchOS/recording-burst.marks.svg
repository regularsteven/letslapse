<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 352" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>watchOS · Recording · Burst tab (Video, marks only)</title>
  <desc>A mark is an annotation with a start and an end, made at whatever rate the capture is already running — nothing about the footage changes, it just says this moment is worth coming back to. So the pad names the edge it is about to place: MARK IN, then MARK OUT. The duration chips arm an auto-OUT on the phone’s own timer, so the mark closes even if the wrist sleeps; sliding up again closes it early.</desc>
  <defs>
    <clipPath id="wscreen"><rect x="46" y="24" width="208" height="248" rx="52"/></clipPath>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.h{font-weight:800}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="38" y="16" width="224" height="264" rx="60" fill="none" stroke="#3A3A3F" stroke-width="4"/>
  <rect x="264" y="86" width="10" height="36" rx="5" fill="#3A3A3F"/>
  <rect x="264" y="150" width="7" height="44" rx="3.5" fill="#3A3A3F"/>

  <g clip-path="url(#wscreen)">
    <rect x="46" y="24" width="208" height="248" fill="#000"/>
    <g transform="translate(46,24)">
      <text x="197" y="30" font-size="15" class="b" fill="#6D6D72" text-anchor="end">10:09</text>
      <circle cx="14" cy="48" r="3.25" fill="#FF453A"/>
      <text x="21" y="52" font-size="12" class="b" fill="#FFF" letter-spacing="0.6">REC</text>
      <text x="56" y="53" font-size="15" class="sb m" fill="#FFF">04:12</text>
      <text x="11" y="66" font-size="11" class="m" fill="#FFF" opacity="0.56">@100× → 12.4s</text>
      <circle cx="193" cy="62" r="2.5" fill="#FFD60A" opacity="0.55"/>
      <circle cx="185" cy="62" r="2.5" fill="#FFD60A" opacity="1"/>
      <rect x="11" y="72" width="186" height="1" fill="#FFF" opacity="0.15"/>
      <rect x="11" y="77" width="186" height="64" rx="11" fill="#40C8E0" opacity="0.14"/>
      <rect x="11" y="77" width="186" height="64" rx="11" fill="none" stroke="#40C8E0" stroke-opacity="0.5"/>
      <text x="104" y="111" font-size="16" class="b" fill="#40C8E0" text-anchor="middle" letter-spacing="0.5">MARK IN</text>
      <text x="104" y="124" font-size="9" fill="#40C8E0" opacity="0.7" text-anchor="middle">annotate 1s · no rate change</text>
      <rect x="11" y="146" width="58.6667" height="24" rx="9" fill="#FFD60A" opacity="0.16"/>
      <rect x="11" y="146" width="58.6667" height="24" rx="9" fill="none" stroke="#FFD60A" stroke-width="1.5"/>
      <text x="40.3333" y="162.5" font-size="13.5" class="sb" fill="#FFD60A" text-anchor="middle">1s</text>
      <rect x="74.6667" y="146" width="58.6667" height="24" rx="9" fill="#2C2C2E"/>
      <text x="104" y="162.5" font-size="13.5" class="sb" fill="#FFF" opacity="0.72" text-anchor="middle">4s</text>
      <rect x="138.333" y="146" width="58.6667" height="24" rx="9" fill="#2C2C2E"/>
      <text x="167.667" y="162.5" font-size="13.5" class="sb" fill="#FFF" opacity="0.72" text-anchor="middle">8s</text>
      <circle cx="94" cy="232" r="2.5" fill="#FFF" opacity="1"/>
      <circle cx="104" cy="232" r="2.5" fill="#FFF" opacity="0.26"/>
      <circle cx="114" cy="232" r="2.5" fill="#FFF" opacity="0.26"/>
    </g>
  </g>

  <text x="150" y="316" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">watchOS · Recording · Mark IN · 208×248 pt</text>
  <text x="150" y="334" text-anchor="middle" font-size="9" fill="#8A8A90">mirrors WatchControlView.swift — markPad · timedBurstRow</text>
</svg>
