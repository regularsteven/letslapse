<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 352" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>watchOS · Recording · Controls tab (Video, ramp)</title>
  <desc>Tab 2 — the considered controls, and the only screen the Digital Crown owns. The rate ladder draws one rung per entry in availableBurstFPS, so it can only ever offer rates this camera can actually reach; a camera with nothing faster than its base rate gets a sentence saying so instead. Never scrolls, because a ScrollView would take the crown first.</desc>
  <defs>
    <clipPath id="wscreen"><rect x="46" y="24" width="208" height="248" rx="52"/></clipPath>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.h{font-weight:800}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="38" y="16" width="224" height="264" rx="60" fill="none" stroke="#3A3A3F" stroke-width="4"/>
  <rect x="264" y="86" width="10" height="36" rx="5" fill="#3A3A3F"/>
  <rect x="264" y="150" width="7" height="44" rx="3.5" fill="#3A3A3F"/>

  <g clip-path="url(#wscreen)">
    <rect x="46" y="24" width="208" height="248" fill="#000"/>
    <g transform="translate(46,24)">
      <text x="197" y="30" font-size="15" class="b" fill="#6D6D72" text-anchor="end">10:09</text>
      <circle cx="14" cy="48" r="3.25" fill="#FF453A"/>
      <text x="21" y="52" font-size="12" class="b" fill="#FFF" letter-spacing="0.6">REC</text>
      <text x="56" y="53" font-size="15" class="sb m" fill="#FFF">04:12</text>
      <text x="11" y="66" font-size="11" class="m" fill="#FFF" opacity="0.56">@100× → 12.4s</text>
      <circle cx="193" cy="62" r="2.5" fill="#FFD60A" opacity="0.55"/>
      <circle cx="185" cy="62" r="2.5" fill="#FFD60A" opacity="1"/>
      <rect x="11" y="72" width="186" height="1" fill="#FFF" opacity="0.15"/>
      <text x="11" y="103" font-size="37" class="b" fill="#FFD60A">100</text>
      <text x="77" y="103" font-size="10" fill="#FFF" opacity="0.5">fps</text>
      <text x="197" y="93" font-size="12" class="b" fill="#FFF" text-anchor="end">4.2× slower</text>
      <text x="197" y="105" font-size="9" fill="#FFF" opacity="0.48" text-anchor="end">base 24 fps</text>
      <rect x="11" y="115" width="44.25" height="6" rx="3" fill="#FFD60A"/>
      <text x="33.125" y="133" font-size="9" class="sb" fill="#FFF" opacity="0.45" text-anchor="middle">30</text>
      <rect x="58.25" y="115" width="44.25" height="6" rx="3" fill="#FFD60A"/>
      <text x="80.375" y="133" font-size="9" class="sb" fill="#FFF" opacity="0.45" text-anchor="middle">60</text>
      <rect x="105.5" y="111" width="44.25" height="10" rx="5" fill="#FFD60A"/>
      <text x="127.625" y="133" font-size="9" class="b" fill="#FFD60A" opacity="1" text-anchor="middle">100</text>
      <rect x="152.75" y="115" width="44.25" height="6" rx="3" fill="#FFD60A"/>
      <text x="174.875" y="133" font-size="9" class="sb" fill="#FFF" opacity="0.45" text-anchor="middle">120</text>
      <text x="11" y="149" font-size="10" fill="#FFF" opacity="0.42">Turn the crown to change</text>
      <rect x="11" y="159" width="186" height="30" rx="11" fill="#1C1C1E"/>
      <text x="21" y="178.5" font-size="13.5" class="sb" fill="#FFF">AE/AF Lock</text>
      <rect x="150" y="163.5" width="37" height="21" rx="10.5" fill="#39393D"/>
      <circle cx="160.5" cy="174" r="8.5" fill="#FFF"/>
      <circle cx="94" cy="232" r="2.5" fill="#FFF" opacity="0.26"/>
      <circle cx="104" cy="232" r="2.5" fill="#FFF" opacity="1"/>
      <circle cx="114" cy="232" r="2.5" fill="#FFF" opacity="0.26"/>
    </g>
  </g>

  <text x="150" y="316" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">watchOS · Recording · Controls · 208×248 pt</text>
  <text x="150" y="334" text-anchor="middle" font-size="9" fill="#8A8A90">mirrors WatchControlView.swift — burstRateLadder</text>
</svg>
