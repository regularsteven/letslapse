<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 352" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>watchOS · Controls locked · unlocking</title>
  <desc>Crown rotation, the platform's own convention and the one input a sleeve cannot produce. Absolute travel, so it unlocks whichever way you turn — a rule about direction is one more thing to remember at the exact moment you want the controls back.</desc>
  <defs>
    <clipPath id="wscreen"><rect x="46" y="24" width="208" height="248" rx="52"/></clipPath>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.h{font-weight:800}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="38" y="16" width="224" height="264" rx="60" fill="none" stroke="#3A3A3F" stroke-width="4"/>
  <rect x="264" y="86" width="10" height="36" rx="5" fill="#3A3A3F"/>
  <rect x="264" y="150" width="7" height="44" rx="3.5" fill="#3A3A3F"/>

  <g clip-path="url(#wscreen)">
    <rect x="46" y="24" width="208" height="248" fill="#000"/>
    <g transform="translate(46,24)">
      <text x="197" y="30" font-size="15" class="b" fill="#6D6D72" text-anchor="end">10:09</text>
      <circle cx="104" cy="104" r="38.5" fill="none" stroke="#FFF" stroke-opacity="0.14" stroke-width="7"/>
      <circle cx="104" cy="104" r="38.5" fill="none" stroke="#40C8E0" stroke-width="7" stroke-linecap="round" stroke-dasharray="145 242" transform="rotate(-90 104 104)"/>
      <rect x="97" y="104" width="14" height="11" rx="2.5" fill="none" stroke="#40C8E0" stroke-width="2"/>
      <path d="M100 104 v-5 a4 4 0 0 1 8 -1" fill="none" stroke="#40C8E0" stroke-width="2" data-symbol="lock.open.fill"/>
      <text x="104" y="172" font-size="14" class="b" fill="#FFF" text-anchor="middle">Keep turning</text>
      <text x="104" y="188" font-size="10" fill="#FFF" opacity="0.55" text-anchor="middle">Controls return at full turn</text>
    </g>
  </g>

  <text x="150" y="316" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">watchOS · Unlocking · 208×248 pt</text>
  <text x="150" y="334" text-anchor="middle" font-size="9" fill="#8A8A90">mirrors ControlsLockedView.swift — unlockRing</text>
</svg>
