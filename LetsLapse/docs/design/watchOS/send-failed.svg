<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 352" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>watchOS · Reliability · didn't reach the phone</title>
  <desc>Says what did NOT happen, in words. The state never lied — the toggle did not move, the burst did not start — so there is nothing to un-learn and no reason to press anything twice, which is the habit this screen exists to prevent. Only user-initiated commands raise it; state polls fail routinely out of range and self-heal. The card covers the pager but not the header, so the run's identity stays readable.</desc>
  <defs>
    <clipPath id="wscreen"><rect x="46" y="24" width="208" height="248" rx="52"/></clipPath>
  </defs>
  <style>text{font-family:inherit}.sb{font-weight:600}.b{font-weight:700}.h{font-weight:800}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace}</style>

  <rect x="38" y="16" width="224" height="264" rx="60" fill="none" stroke="#3A3A3F" stroke-width="4"/>
  <rect x="264" y="86" width="10" height="36" rx="5" fill="#3A3A3F"/>
  <rect x="264" y="150" width="7" height="44" rx="3.5" fill="#3A3A3F"/>

  <g clip-path="url(#wscreen)">
    <rect x="46" y="24" width="208" height="248" fill="#000"/>
    <g transform="translate(46,24)">
      <text x="197" y="30" font-size="15" class="b" fill="#6D6D72" text-anchor="end">10:09</text>
      <circle cx="14" cy="48" r="3.25" fill="#FF453A"/>
      <text x="21" y="52" font-size="12" class="b" fill="#FFF" letter-spacing="0.6">REC</text>
      <text x="56" y="53" font-size="15" class="sb m" fill="#FFF">04:12</text>
      <text x="11" y="66" font-size="11" class="m" fill="#FFF" opacity="0.56">@100× → 12.4s</text>
      <rect x="11" y="72" width="186" height="1" fill="#FFF" opacity="0.15"/>
      <rect x="11" y="77" width="186" height="106" rx="14" fill="#000"/>
      <rect x="11" y="77" width="186" height="106" rx="14" fill="#FF9F0A" opacity="0.14"/>
      <rect x="11" y="77" width="186" height="106" rx="14" fill="none" stroke="#FF9F0A" stroke-opacity="0.6"/>
      <text x="21" y="97" font-size="13" class="b" fill="#FF9F0A">Didn't reach the phone</text>
      <text x="21" y="113" font-size="11" fill="#FFF" opacity="0.62">AE/AF Lock is still OFF.</text>
      <rect x="21" y="121" width="80" height="30" rx="9" fill="#2C2C2E"/>
      <text x="61" y="140" font-size="12" class="sb" fill="#FFF" text-anchor="middle">Dismiss</text>
      <rect x="107" y="121" width="80" height="30" rx="9" fill="#FF9F0A"/>
      <text x="147" y="140" font-size="12" class="b" fill="#000" text-anchor="middle">Try again</text>
      <text x="21" y="167" font-size="9" fill="#FFF" opacity="0.45">Capture is unaffected. The phone</text>
      <text x="21" y="177" font-size="9" fill="#FFF" opacity="0.45">keeps recording.</text>
      <circle cx="94" cy="232" r="2.5" fill="#FFF" opacity="1"/>
      <circle cx="104" cy="232" r="2.5" fill="#FFF" opacity="0.26"/>
      <circle cx="114" cy="232" r="2.5" fill="#FFF" opacity="0.26"/>
    </g>
  </g>

  <text x="150" y="316" text-anchor="middle" font-size="13" class="sb" fill="#3A3A3F">watchOS · Send failed · 208×248 pt</text>
  <text x="150" y="334" text-anchor="middle" font-size="9" fill="#8A8A90">mirrors WatchControlView.swift — failureCard</text>
</svg>
